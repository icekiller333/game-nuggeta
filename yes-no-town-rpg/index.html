<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Yes/No Town — Millbrook</title>
<style>
:root{
  --ink:#14100c; --paper:#fff6e3; --card:#fffdf6;
  --sun:#ffd23f; --coral:#ff6b4a; --teal:#2ec4b6; --sky:#7bd3f7;
  --pink:#ff9fb2; --grape:#9b5de5; --leaf:#7ac74f; --red:#e63946;
  --bg:#ffe9c9; --bg2:#ffd9a0;
  --shadow:6px 6px 0 var(--ink);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#241a2e; --bg2:#171021; --paper:#2e2140; --card:#352a4d; --ink:#fdf3d8; --shadow:6px 6px 0 #000; }
}
/* ---------- chapter light: the day darkens as it turns ---------- */
body[data-ch="MIDDAY"]{ --bg:#ffe0a1; --bg2:#ffb877; }
body[data-ch="DUSK"]{ --bg:#dd8a5c; --bg2:#7c4a6d; }
body[data-ch="THE NIGHT"]{ --bg:#2a1e3e; --bg2:#120b20; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,210,63,.35) 0 60px, transparent 61px),
    radial-gradient(circle at 85% 80%, rgba(46,196,182,.30) 0 80px, transparent 81px),
    linear-gradient(160deg, var(--bg), var(--bg2));
  color:var(--ink); min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}
/* ---------- top HUD ---------- */
/* ---------- slim top strip: chapter + journal only ---------- */
#topstrip{ width:min(480px,100%); padding:10px 12px 2px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
#chapname{ font-weight:900; font-size:14px; letter-spacing:1px; background:var(--ink); color:var(--paper); padding:5px 12px; }
#journalBtn{ font-weight:900; font-size:14px; letter-spacing:.5px; background:var(--sun); color:#14100c;
  border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); padding:5px 12px; }
#journalBtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
/* ---------- journal ---------- */
.jrow{ display:flex; align-items:center; gap:8px; padding:6px 0; font-weight:700; font-size:15px;
  border-bottom:2px dashed color-mix(in srgb, currentColor 30%, transparent); }
.jrow .jname{ flex:1; }
.jrow .jst{ font-size:11px; font-weight:900; border:2px solid currentColor; padding:1px 6px; white-space:nowrap; }
.jrow.done .jst{ background:var(--sun); color:#14100c; }
.jrow.gone{ opacity:.5; }
#jfinale{ background:var(--ink); color:var(--sun); font-weight:900; padding:9px 11px; font-size:14px; line-height:1.35; margin:10px 0 4px; }
.jpock{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.jlabel{ font-weight:900; font-size:13px; letter-spacing:.5px; margin-top:14px; }
.slot{ width:38px; height:38px; border:3px solid var(--ink); background:var(--paper);
  display:flex; align-items:center; justify-content:center; box-shadow:3px 3px 0 var(--ink); position:relative;}
.slot.empty{ opacity:.28; box-shadow:none; }
.slot.seen{ filter:grayscale(1); opacity:.5; }
.slot.unknown{ font-size:22px; font-weight:900; }
.slot svg{ width:26px; height:26px; }
.slot .tip{ position:absolute; top:42px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
  font-size:10px; font-weight:800; padding:2px 6px; white-space:nowrap; display:none; z-index:5;}
.slot:hover .tip,.slot:active .tip{ display:block; }
/* ---------- stage ---------- */
#stage{ width:min(480px,100%); flex:1; display:flex; flex-direction:column; align-items:center;
  padding:8px 14px 0; position:relative; }
#cardwrap{ width:100%; max-width:400px; perspective:900px; touch-action:pan-y; }
#card{
  background:var(--card); border:4px solid var(--ink); box-shadow:8px 8px 0 var(--ink);
  padding:0; user-select:none; -webkit-user-select:none; position:relative;
  will-change:transform; touch-action:none;
}
#card.noanim{ transition:none !important; }
#card.settle{ transition:transform .18s ease-out; }
#artbox{ border-bottom:4px solid var(--ink); height:238px; overflow:hidden; position:relative; }
#artbox svg{ width:100%; height:100%; display:block; }
#speaker{ position:absolute; left:10px; bottom:8px; background:var(--sun); border:3px solid var(--ink);
  font-weight:900; font-size:14px; padding:3px 10px; box-shadow:3px 3px 0 var(--ink); }
#questtag{ position:absolute; right:10px; top:8px; background:var(--coral); color:#fff; border:3px solid var(--ink);
  font-weight:900; font-size:11px; padding:3px 8px; box-shadow:3px 3px 0 var(--ink); max-width:60%; text-align:center;}
.peek{ position:absolute; top:12px; font-weight:900; font-size:30px; padding:2px 14px;
  border:4px solid var(--ink); opacity:0; pointer-events:none; z-index:4; letter-spacing:1px;}
#peekYes{ left:12px; background:var(--teal); color:var(--ink); transform:rotate(-8deg); }
#peekNo{ right:12px; background:var(--coral); color:#fff; transform:rotate(8deg); }
#peekCont{ left:50%; transform:translateX(-50%) rotate(-3deg); background:var(--sun); color:#14100c; font-size:20px; }
#cardtext{ padding:16px 18px 18px; font-size:19px; line-height:1.38; font-weight:600; min-height:104px; }
#cardtext .small{ font-size:15px; }
#stamp{ position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) rotate(-10deg);
  font-weight:900; font-size:24px; border:5px solid var(--red); color:var(--red);
  padding:4px 14px; background:rgba(255,253,246,.92); display:none; z-index:6; text-align:center;}
/* ---------- controls ---------- */
#controls{ width:min(480px,100%); padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  display:flex; gap:14px; justify-content:center; align-items:stretch;}
.ynbtn{ flex:1; max-width:190px; border:4px solid var(--ink); font-weight:900; font-size:24px;
  padding:14px 0; box-shadow:5px 5px 0 var(--ink); letter-spacing:1px; }
.ynbtn:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink); }
#btnNo{ background:var(--coral); color:#fff; }
#btnYes{ background:var(--teal); color:var(--ink); }
#btnContinue{ background:var(--sun); color:#14100c; display:none; }
#swipehint{ flex:1; max-width:200px; display:none; align-items:center; justify-content:center; gap:8px;
  font-weight:900; font-size:13px; letter-spacing:.5px; padding:14px 0; opacity:.8; text-align:center; }
#swipehint .arr{ display:inline-block; font-size:22px; }
#swipehint .arrL{ animation:nudgeL 1.1s ease-in-out infinite; }
#swipehint .arrR{ animation:nudgeR 1.1s ease-in-out infinite; }
@keyframes nudgeL{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(-5px);} }
@keyframes nudgeR{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(5px);} }
/* ---------- overlays ---------- */
.overlay{ position:fixed; inset:0; background:rgba(10,6,16,.72); display:none;
  align-items:center; justify-content:center; z-index:50; padding:18px;}
.overlay.show{ display:flex; }
.sheet{ background:var(--paper); border:4px solid var(--ink); box-shadow:8px 8px 0 #000;
  max-width:420px; width:100%; padding:22px; color:var(--ink); max-height:88dvh; overflow:auto;}
.sheet h2{ margin:0 0 8px; font-size:26px; line-height:1.1; }
.sheet p{ font-size:17px; line-height:1.45; font-weight:600; margin:6px 0; }
.sheet .bigbtn{ width:100%; margin-top:14px; border:4px solid var(--ink); background:var(--sun);
  color:#14100c; font-weight:900; font-size:20px; padding:13px 0; box-shadow:5px 5px 0 var(--ink);}
.sheet .bigbtn:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink);}
.sheet .ghostbtn{ width:100%; margin-top:10px; border:3px solid var(--ink); background:var(--card);
  color:var(--ink); font-weight:900; font-size:16px; padding:10px 0; }
#endart{ height:180px; border:3px solid var(--ink); margin-bottom:12px; overflow:hidden;}
#endart svg{ width:100%; height:100%; display:block; }
.spot{ outline:5px solid var(--red) !important; outline-offset:3px; position:relative; z-index:60; }
#coach{ position:fixed; left:50%; transform:translateX(-50%); bottom:110px; z-index:70;
  width:min(420px,92vw); background:var(--ink); color:var(--paper); border:3px solid var(--paper);
  padding:14px 16px; display:none; box-shadow:6px 6px 0 rgba(0,0,0,.5);}
#coach.show{ display:block; }
#coach p{ margin:0 0 10px; font-size:16px; font-weight:700; line-height:1.4;}
#coach button{ background:var(--sun); color:#14100c; border:3px solid var(--paper); font-weight:900;
  font-size:16px; padding:8px 22px; float:right;}
#toast{ position:fixed; top:14px; left:50%; transform:translate(-50%,-90px); z-index:80;
  background:var(--ink); color:var(--sun); border:3px solid var(--sun); font-weight:900;
  font-size:16px; padding:10px 18px; transition:transform .3s; max-width:92vw; text-align:center;}
#toast.show{ transform:translate(-50%,0); }
@media (max-width:380px){ #cardtext{ font-size:17px; } #artbox{ height:208px; } }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="topstrip">
  <span id="chapname">CHAPTER · PROLOGUE</span>
  <button id="journalBtn" aria-label="Open journal">JOURNAL ▤</button>
</div>

<div id="stage">
  <div id="cardwrap">
    <div id="card">
      <div id="artbox">
        <div id="art"></div>
        <div id="questtag" style="display:none"></div>
        <div id="speaker" style="display:none"></div>
        <div class="peek" id="peekYes">YES</div>
        <div class="peek" id="peekNo">NO</div>
        <div class="peek" id="peekCont">◂ CONTINUE ▸</div>
        <div id="stamp"></div>
      </div>
      <div id="cardtext"></div>
    </div>
  </div>
</div>

<div id="controls">
  <button class="ynbtn" id="btnNo" aria-label="No">✕ NO</button>
  <button class="ynbtn" id="btnContinue" aria-label="Continue">CONTINUE ▸</button>
  <div id="swipehint" aria-hidden="true"><span class="arr arrL">⟵</span><span id="swipehintText">OR SWIPE EITHER WAY</span><span class="arr arrR">⟶</span></div>
  <button class="ynbtn" id="btnYes" aria-label="Yes">YES ✓</button>
</div>

<div id="coach"><p id="coachtext"></p><button id="coachbtn">OK</button></div>
<div id="toast"></div>

<div class="overlay" id="journalOverlay">
  <div class="sheet">
    <h2>JOURNAL</h2>
    <div id="jfinale"></div>
    <div class="jlabel">THE TOWN'S QUESTS</div>
    <div id="jquests"></div>
    <div class="jlabel">YOUR POCKETS</div>
    <div class="jpock" id="jpockets"></div>
    <button class="bigbtn" id="btnJournalClose">BACK TO THE DAY</button>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="sheet">
    <h2>MILLBROOK</h2>
    <p>One town. One day. One bell that should not be able to ring.</p>
    <button class="bigbtn" id="btnStart">BEGIN · DAWN</button>
  </div>
</div>

<div class="overlay" id="endOverlay">
  <div class="sheet">
    <div id="endart"></div>
    <h2 id="endtitle"></h2>
    <p id="endtext"></p>
    <p id="endstats" style="font-size:14px;"></p>
    <button class="bigbtn" id="btnRestart">PLAY AGAIN</button>
  </div>
</div>

  text:function(){ return S.flags.wrenSecret ? "Wren pops out of a barrel. “You kept my secret, so secrets are safe with you. You're Garrick's spy now? Tell me what you saw — I won't tell.” Lie to her anyway?" : "Wren pops out of a barrel. “You're Garrick's spy now? What did you see? Tell me, tell me!” Lie to her?"; },

q4_c:{ sp:"garrick", art:"garrick", quest:"q4", text:"Garrick waits in the rain. “Report. And tell me straight — did the kid get anything out of you?” Lie to Garrick?",

  pell:"SISTER PELL · BELL-RINGER", wren:"WREN · STREET KID", odde:"MASTER ODDE · APOTHECARY",

  q6:"q6_offer", q7:"q7_offer", q8:"q8_offer", q9:"q9_offer", q10:"q10_offer" };
function nextUnfinished(){
  for(var i=0;i<QUEST_META.length;i++){
    var id = QUEST_META[i].id;
    if(S.quests[id] !== "done"){ delete S.quests[id]; renderHUD(); return OFFERS[id]; }
  }
  return "fin_1";
}
var currentId = null, animating = false, coachQueue = [], coachActive = false;
function $(id){ return document.getElementById(id); }

function renderHUD(){
  /* The play screen stays clean: quests + pockets render into the JOURNAL. */
  var list = "";
  QUEST_META.forEach(function(q){
    var st = S.quests[q.id];
    if(!st) return; /* quests not yet discovered stay hidden entirely */
    var cls = st==="done" ? "jrow done" : st==="active" ? "jrow" : "jrow gone";
    var label = st==="done" ? "✓ DONE" : st==="active" ? "● ACTIVE" : "✕ SLIPPED AWAY";
    list += '<div class="'+cls+'"><span>'+q.icon+'</span><span class="jname">'+q.name+'</span><span class="jst">'+label+'</span></div>';
  });
  $("jquests").innerHTML = list || '<div class="jrow"><span class="jname">No quests yet — the town will find you.</span></div>';
  $("jfinale").textContent = S.doneCount >= 4
    ? "★ THE FINALE IS OPEN. When night falls, go to the tower."
    : "THE FINALE — the night the bell rings itself — opens at 4 quests done. You have "+S.doneCount+".";
  var html = "";
  ITEM_ORDER.forEach(function(k){
    if(has(k)) html += '<div class="slot">'+ITEMS[k].svg+'<span class="tip">'+ITEMS[k].name+'</span></div>';
    else if(S.seen[k]) html += '<div class="slot seen">'+ITEMS[k].svg+'<span class="tip">'+ITEMS[k].name+' — not held</span></div>';
    else html += '<div class="slot unknown">?</div>';
  });
  $("jpockets").innerHTML = html;
}
$("journalBtn").addEventListener("click", function(){
  if(coachActive) return;
  renderHUD();
  $("journalOverlay").classList.add("show");
  if(!S.journalSeen){ S.journalSeen = true; toast("Finish any 4 quests to open the FINALE."); }
});
$("btnJournalClose").addEventListener("click", function(){ $("journalOverlay").classList.remove("show"); });
var toastTimer = null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}
/* ---------- coach / spotlight onboarding ---------- */
function queueCoach(target, text){ coachQueue.push({target:target, text:text}); if(!coachActive) nextCoach(); }
function nextCoach(){
  var step = coachQueue.shift();
  document.querySelectorAll(".spot").forEach(function(e){ e.classList.remove("spot"); });
  if(!step){ coachActive = false; $("coach").classList.remove("show"); return; }
  coachActive = true;
  var el = $(step.target); if(el) el.classList.add("spot");
  $("coachtext").textContent = step.text;
  $("coach").classList.add("show");
}
$("coachbtn").addEventListener("click", nextCoach);

/* ---------- chapters: one day, in order ---------- */
function chapterFor(id){
  if(id.indexOf("intro") === 0) return "PROLOGUE";
  if(id === "inter_midday" || id.indexOf("q3") === 0 || id === "e_gossip" || id === "e_gossip2" ||
     id.indexOf("q4") === 0 || id === "e_sighting" || id === "e_sighting2" ||
     id === "e_stone" || id === "e_stone2" || id.indexOf("q5") === 0 ||
     id === "e_polish" || id === "e_polish2") return "MIDDAY";
  if(id === "inter_dusk" || id.indexOf("q6") === 0 || id.indexOf("e_well") === 0 ||
     id.indexOf("q7") === 0 || id === "e_guest" || id === "e_guest2" ||
     id.indexOf("q8") === 0 || id === "e_trade" || id === "e_trade2") return "DUSK";
  if(id === "inter_night" || id === "e_riverwalk" || id === "e_riverwalk2" ||
     id.indexOf("q9") === 0 || id.indexOf("q10") === 0 || id.indexOf("fin") === 0 ||
     id === "finale_gate" || id === "loop_back" || id.indexOf("death") === 0) return "THE NIGHT";
  return "MORNING";
}

/* ---------- card display ---------- */
function cardArt(card){
  if(card.sp) return P(card.sp);
  return SC(card.art || "street");
}
function showCard(id){
  var card = CARDS[id];
  if(!card){ showEnding("end_you"); return; }
  currentId = id; S.cardsSeen++;
  var c = $("card");
  c.classList.add("noanim"); c.style.transform = "none";
  $("art").innerHTML = cardArt(card);
  var sp = $("speaker");
  if(card.sp){ sp.style.display = "block"; sp.textContent = NAMES[card.sp]; }
  else sp.style.display = "none";
  var qt = $("questtag");
  if(card.qtag){ qt.style.display = "block"; qt.textContent = card.qtag; }
  else if(card.quest){ var m = QUEST_META.filter(function(q){return q.id===card.quest;})[0]; qt.style.display="block"; qt.textContent = m ? m.name.toUpperCase() : ""; }
  else qt.style.display = "none";
  var txt = typeof card.text === "function" ? card.text() : card.text;
  $("cardtext").textContent = txt;
  var stamp = $("stamp");
  if(card.kind === "death"){ stamp.style.display = "block"; stamp.textContent = "✝ " + (card.title || "YOU DIED"); }
  else stamp.style.display = "none";
  var isAuto = card.kind === "auto" || card.kind === "death";
  $("btnYes").style.display = isAuto ? "none" : "block";
  $("btnNo").style.display = isAuto ? "none" : "block";
  $("btnContinue").style.display = isAuto ? "block" : "none";
  $("btnContinue").textContent = card.kind === "death" ? "BEGIN AGAIN ▸" : "CONTINUE ▸";
  $("swipehint").style.display = isAuto ? "flex" : "none";
  $("swipehintText").textContent = card.kind === "death" ? "OR SWIPE TO BEGIN AGAIN" : "OR SWIPE EITHER WAY";
  if(card.quest && !S.quests[card.quest]) S.quests[card.quest] = "active";
  var ch = chapterFor(id);
  if(ch !== S.chapter){ S.chapter = ch; }
  document.body.setAttribute("data-ch", ch);
  $("chapname").textContent = "CHAPTER · " + ch;
  if(id === "snack1" && !S.onboarded){
    S.onboarded = true;
    queueCoach("card", "This is your day. Read what is asked.");
    queueCoach("controls", "Swipe the card right for YES, left for NO — or tap. There are no other buttons.");
    queueCoach("journalBtn", "Your quests and pockets live here. Finish any 4 quests to open the finale.");
  }
  $("peekYes").style.opacity = 0; $("peekNo").style.opacity = 0; $("peekCont").style.opacity = 0;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ c.classList.remove("noanim"); }); });
}
function resolveChoice(card, choice){
  var c = (card.kind === "auto" || card.kind === "death") ? (card.yes || card.no) : card[choice];
  if(typeof c === "function") c = c();
  return c;
}
function goNext(raw){
  if(raw == null) return;
  var goto = raw, fx = null;
  if(typeof raw === "object"){ goto = raw.goto; fx = raw.fx; }
  if(fx) fx();
  if(ENDINGS[goto]){ showEnding(goto); return; }
  showCard(goto);
}
function answer(choice){
  if(animating || coachActive || !currentId) return;
  var card = CARDS[currentId];
  if(card.kind === "death"){ restartGame(); return; }
  animating = true;
  var c = $("card");
  var dir = choice === "yes" ? 1 : -1;
  c.classList.add("settle"); c.style.transform = "translateX("+(dir*130)+"%) rotate("+(dir*10)+"deg)";
  setTimeout(function(){
    animating = false;
    var raw = resolveChoice(card, choice);
    if(card.fx) card.fx();
    goNext(raw);
  }, 180);
}
$("btnYes").addEventListener("click", function(){ answer("yes"); });
$("btnNo").addEventListener("click", function(){ answer("no"); });
$("btnContinue").addEventListener("click", function(){ answer("yes"); });

/* ---------- swipe ---------- */
(function(){
  var card = $("card"), startX = 0, dx = 0, dragging = false;
  card.addEventListener("pointerdown", function(e){
    if(coachActive || animating) return;
    var cur = CARDS[currentId];
    if(!cur){ return; } /* every card swipes: choices by direction, the rest either way */
    dragging = true; startX = e.clientX; dx = 0;
    card.classList.add("noanim");
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
  });
  card.addEventListener("pointermove", function(e){
    if(!dragging) return;
    dx = e.clientX - startX;
    card.style.transform = "translateX("+dx+"px) rotate("+(dx/16)+"deg)";
    var cur2 = CARDS[currentId];
    if(cur2 && !cur2.kind){
      $("peekYes").style.opacity = dx > 8 ? Math.min(dx/70, 1) : 0;
      $("peekNo").style.opacity = dx < -8 ? Math.min(-dx/70, 1) : 0;
    } else {
      $("peekCont").style.opacity = Math.abs(dx) > 8 ? Math.min(Math.abs(dx)/70, 1) : 0;
    }
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove("noanim"); card.classList.add("settle");
    if(dx > 70){ answer("yes"); }
    else if(dx < -70){ answer("no"); }
    else { card.style.transform = "none"; $("peekYes").style.opacity = 0; $("peekNo").style.opacity = 0; $("peekCont").style.opacity = 0; }
    setTimeout(function(){ card.classList.remove("settle"); }, 200);
  }
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);
})();

/* ---------- endings & restart ---------- */
function showEnding(id){
  var e = ENDINGS[id]; if(!e) return;
  $("endart").innerHTML = SC(e.art);
  $("endtitle").textContent = e.title;
  $("endtext").textContent = e.text;
  $("endstats").textContent = "Quests completed: "+S.doneCount+" of 10 · Cards seen: "+S.cardsSeen+" · Lies told: "+S.lies;
  $("endOverlay").classList.add("show");
  currentId = null;
}
function restartGame(){
  S = newState();
  $("endOverlay").classList.remove("show");
  $("journalOverlay").classList.remove("show");
  renderHUD();
  showCard("intro1");
}
$("btnRestart").addEventListener("click", restartGame);
$("btnStart").addEventListener("click", function(){
  $("startOverlay").classList.remove("show");
  S.started = true;
  showCard("intro1");
});

/* ---------- boot ---------- */
S = newState();
renderHUD();
$("startOverlay").classList.add("show");
/* render a teaser card behind the start sheet */
(function(){ var keep = currentId; $("art").innerHTML = SC("bell"); $("cardtext").textContent = "Last night, at 3am, the bell rang itself. It has no clapper."; })();
</script>
</body>
</html>
