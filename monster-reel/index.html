<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Monster Reel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      :root{
        --ink:#101418;
        --panel:#fffdf4;
        --panel-ink:#101418;
        --page:#04121f;
        --gold:#ffc61a;
        --coral:#ff4d2e;
        --teal:#12b5a5;
        --sky:#7fd8f7;
        --red:#e52421;
        --lime:#4cff7a;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --panel:#15242e;
          --panel-ink:#f4f7f5;
          --page:#020b13;
        }
      }
      html,body{ height:100%; }
      body{
        margin:0;
        background:var(--page);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
        color:var(--panel-ink);
        overflow:hidden;
        -webkit-user-select:none; user-select:none;
        -webkit-tap-highlight-color:transparent;
      }
      #app{
        position:fixed; inset:0;
        display:flex; flex-direction:column;
        max-width:560px; margin:0 auto;
        background:var(--page);
      }
      /* ---------- HUD ---------- */
      #hud{
        flex:0 0 auto;
        padding:8px 10px 6px;
        display:flex; flex-direction:column; gap:6px;
        background:var(--page);
        z-index:5;
      }
      .hud-row{ display:flex; align-items:center; gap:8px; }
      .hud-label{
        font-weight:900; font-size:11px; letter-spacing:.06em;
        color:#fff; white-space:nowrap;
      }
      .pips{ display:flex; gap:4px; }
      .pip{
        width:20px; height:14px; border:2px solid #000; background:#2c3e46;
        box-shadow:2px 2px 0 #000;
      }
      .pip.catch.on{ background:var(--gold); }
      .iconbtn{
        width:36px; height:36px; flex:0 0 auto;
        background:var(--panel); border:3px solid #000; box-shadow:3px 3px 0 #000;
        display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
      }
      .iconbtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
      .iconbtn svg{ width:20px; height:20px; }
      .bar-wrap{ flex:1 1 auto; min-width:0; }
      .bar-track{
        position:relative;
        height:16px; border:3px solid #000; background:#2c3e46; box-shadow:3px 3px 0 #000;
        overflow:hidden;
      }
      .bar-fill{ height:100%; width:100%; transition:width .12s linear; }
      .bar-num{
        position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        font-size:10px; font-weight:900; color:#fff; text-shadow:1px 1px 0 #000; letter-spacing:.04em;
        pointer-events:none;
      }
      #monFill{ background:var(--coral); }
      #monFill.weak{ background:var(--gold); animation:pulse .45s infinite alternate; }
      #rodFill{ background:var(--teal); }
      #rodFill.low{ background:var(--gold); }
      #rodFill.crit{ background:var(--red); animation:pulse .3s infinite alternate; }
      @keyframes pulse{ from{ filter:brightness(1);} to{ filter:brightness(1.5);} }
      #monRow{ visibility:hidden; }
      #monRow.show{ visibility:visible; }
      /* ---------- Stage ---------- */
      #stage{ position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#04121f; }
      #gl{ position:absolute; inset:0; }
      #gl canvas{ width:100%; height:100%; display:block; touch-action:none; }
      #hint{
        position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
        max-width:92%; padding:7px 12px;
        background:var(--panel); color:var(--panel-ink);
        border:3px solid #000; box-shadow:4px 4px 0 #000;
        font-weight:900; font-size:14px; text-align:center; line-height:1.25;
        display:none; z-index:6; pointer-events:none;
      }
      #hint.show{ display:block; }
      #bigWord{
        position:absolute; left:50%; top:16%; transform:translate(-50%,-50%) rotate(-3deg);
        font-weight:900; font-size:clamp(28px,8.5vw,50px);
        color:var(--gold); -webkit-text-stroke:2px #000; paint-order:stroke fill;
        text-shadow:4px 4px 0 #000; display:none; z-index:6; pointer-events:none; white-space:nowrap;
      }
      #bigWord.show{ display:block; animation:pop .25s ease-out; }
      @keyframes pop{ from{ transform:translate(-50%,-50%) scale(.5) rotate(-3deg);} to{ transform:translate(-50%,-50%) scale(1) rotate(-3deg);} }
      #stateWord{
        position:absolute; left:50%; top:40px; transform:translateX(-50%);
        font-weight:900; font-size:17px; letter-spacing:.04em; white-space:nowrap;
        display:none; z-index:4; pointer-events:none;
        text-shadow:2px 2px 0 #000;
      }
      #stateWord.show{ display:block; }
      #stateWord.windup{ color:#ff5a4d; animation:pulse .25s infinite alternate; }
      #stateWord.good{ color:var(--gold); }
      #scoreBox{
        position:absolute; left:8px; top:6px; z-index:4; pointer-events:none;
        display:none; align-items:center; gap:8px;
        font-weight:900; color:#fff; text-shadow:2px 2px 0 #000;
      }
      #scoreBox.show{ display:flex; }
      #scoreBox .sv{ font-size:20px; letter-spacing:.02em; }
      #scoreBox .sl{ font-size:10px; letter-spacing:.08em; opacity:.85; }
      #combo{
        display:none; background:var(--gold); color:#101418; text-shadow:none;
        border:2px solid #000; box-shadow:2px 2px 0 #000; padding:1px 6px; font-size:13px;
      }
      #combo.show{ display:block; animation:pop2 .18s ease-out; }
      @keyframes pop2{ from{ transform:scale(1.5);} to{ transform:scale(1);} }
      #fx{ position:absolute; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
      .ftx{
        position:absolute; transform:translate(-50%,-50%);
        font-weight:900; font-size:18px; color:#fff; white-space:nowrap;
        -webkit-text-stroke:2px #000; paint-order:stroke fill; text-shadow:2px 2px 0 #000;
        animation:floatUp .85s ease-out forwards;
      }
      .ftx.crit{ color:var(--gold); font-size:24px; }
      .ftx.miss{ color:#ff8c7a; font-size:15px; }
      @keyframes floatUp{ from{ opacity:1; margin-top:0; } to{ opacity:0; margin-top:-46px; } }
      /* ---------- Crosshair ---------- */
      #crosshair{
        position:absolute; width:46px; height:46px; z-index:3; pointer-events:none;
        transform:translate(-50%,-50%); display:none;
        filter:drop-shadow(2px 2px 0 rgba(0,0,0,.85));
      }
      #crosshair.show{ display:block; }
      #crosshair .ring{ stroke:var(--gold); }
      #crosshair.lock .ring{ stroke:var(--lime); }
      #crosshair.lock{ transform:translate(-50%,-50%) scale(.88); }
      #crosshair.miss .ring{ stroke:var(--red); }
      /* ---------- Reel minigame ---------- */
      #reelUI{
        position:absolute; right:10px; top:44px; bottom:64px; width:78px;
        display:none; gap:8px; z-index:4;
      }
      #reelUI.show{ display:flex; }
      #rTrack{
        position:relative; flex:1 1 auto; border:3px solid #000; box-shadow:4px 4px 0 #000;
        background:repeating-linear-gradient(180deg,#0b2f45 0 14px,#0d3a54 14px 28px);
        overflow:hidden;
      }
      #rZone{
        position:absolute; left:0; right:0; background:rgba(76,255,122,.38);
        border-top:3px solid var(--lime); border-bottom:3px solid var(--lime);
        box-sizing:border-box;
      }
      #rZone.on{ background:rgba(76,255,122,.62); }
      #rFish{ position:absolute; left:50%; width:40px; height:28px; margin-left:-20px; margin-bottom:-14px; }
      #rFish.out{ animation:jitter .12s infinite alternate; }
      @keyframes jitter{ from{ transform:translateX(-2px);} to{ transform:translateX(2px);} }
      #rProg{
        flex:0 0 20px; border:3px solid #000; box-shadow:3px 3px 0 #000; background:#2c3e46;
        position:relative; overflow:hidden;
      }
      #rProgFill{ position:absolute; left:0; right:0; bottom:0; height:30%; background:var(--gold); }
      /* ---------- Controls ---------- */
      #controls{
        flex:0 0 auto; height:150px;
        display:flex; gap:12px; align-items:stretch;
        padding:10px; background:var(--page); z-index:5;
      }
      .cbtn{
        position:relative; overflow:hidden;
        flex:1 1 0; min-height:56px;
        font-weight:900; font-size:26px; letter-spacing:.03em;
        border:3px solid #000; box-shadow:4px 4px 0 #000; cursor:pointer;
        color:#101418; background:var(--gold);
        display:none; align-items:center; justify-content:center; gap:8px;
        touch-action:none; padding:6px;
      }
      .cbtn.show{ display:flex; }
      .cbtn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
      .cbtn.fire{ background:var(--coral); color:#fff; flex:0 0 46%; font-size:28px; }
      .cbtn.reel{ background:var(--teal); color:#fff; }
      .cbtn.holding{ transform:translate(3px,3px); box-shadow:1px 1px 0 #000; filter:brightness(1.2); }
      .cbtn:disabled{ filter:grayscale(.7) brightness(.75); cursor:default; }
      .cbtn svg{ width:30px; height:30px; flex:0 0 auto; }
      .cbtn .lbl{ position:relative; z-index:2; display:flex; align-items:center; gap:8px; text-align:center; line-height:1.05; }
      #stickZone{
        position:relative; flex:1 1 0; display:none; touch-action:none;
      }
      #stickZone.show{ display:block; }
      #stickBase{
        position:absolute; left:50%; top:50%; width:124px; height:124px; margin:-62px 0 0 -62px;
        border-radius:50%; border:3px solid #000; box-shadow:4px 4px 0 #000;
        background:var(--panel); opacity:.95;
      }
      #stickBase.live{ opacity:1; }
      #stickBase svg{ position:absolute; inset:0; width:100%; height:100%; opacity:.35; }
      #stickKnob{
        position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px;
        border-radius:50%; background:var(--gold); border:3px solid #000; box-shadow:2px 2px 0 #000;
      }
      /* ---------- Overlays ---------- */
      .overlay{
        position:absolute; inset:0; z-index:10;
        display:none; align-items:center; justify-content:center;
        background:rgba(3,18,28,.72); padding:18px; overflow:auto;
      }
      .overlay.show{ display:flex; }
      .card{
        background:var(--panel); color:var(--panel-ink);
        border:4px solid #000; box-shadow:8px 8px 0 #000;
        padding:22px 20px; max-width:420px; width:100%; text-align:center;
      }
      .card h1{
        font-weight:900; margin:0 0 10px;
        font-size:clamp(34px,10vw,52px); line-height:.95; letter-spacing:.01em;
      }
      .card h2{
        font-weight:900; margin:0 0 10px;
        font-size:clamp(24px,7vw,34px); line-height:1;
      }
      .card p{ margin:0 0 14px; font-size:16px; font-weight:700; line-height:1.4; }
      .card .story{ font-size:18px; line-height:1.45; }
      .bigbtn{
        font-weight:900; font-size:20px;
        background:var(--gold); color:#101418;
        border:3px solid #000; box-shadow:4px 4px 0 #000;
        padding:12px 26px; min-height:52px; cursor:pointer; width:100%;
      }
      .bigbtn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
      .bigbtn.teal{ background:var(--teal); color:#fff; }
      .upbtn{
        display:block; width:100%; text-align:left; margin-top:10px;
        background:var(--gold); color:#101418; font:inherit;
        border:3px solid #000; box-shadow:4px 4px 0 #000; padding:10px 14px; cursor:pointer;
      }
      .upbtn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
      .upbtn b{ display:block; font-size:18px; font-weight:900; }
      .upbtn span{ display:block; font-size:14px; font-weight:700; margin-top:2px; }
      .loadbar{
        height:18px; border:3px solid #000; background:#2c3e46; overflow:hidden; margin-top:14px;
      }
      .loadbar div{ height:100%; width:0%; background:var(--gold); animation:load 1s linear forwards; }
      @keyframes load{ to{ width:100%; } }
      .wiggle{ display:inline-block; animation:wig 1.2s ease-in-out infinite; }
      @keyframes wig{ 0%,100%{ transform:rotate(-4deg);} 50%{ transform:rotate(4deg);} }
      @media (max-width:480px){
        .pip{ width:16px; height:12px; }
        .pips{ gap:3px; }
        .hud-row{ gap:7px; }
        .hud-label{ font-size:10px; }
        #hud{ padding:8px 8px 6px; }
        .cbtn{ font-size:22px; }
        .cbtn.fire{ font-size:24px; }
      }
      @media (max-height:640px){
        #controls{ height:128px; }
        #stickBase{ width:104px; height:104px; margin:-52px 0 0 -52px; }
        #stickKnob{ width:50px; height:50px; margin:-25px 0 0 -25px; }
      }
      @media (prefers-reduced-motion: reduce){
        .wiggle,#monFill.weak,#rodFill.crit,#stateWord.windup,#rFish.out,.ftx,#combo.show{ animation:none; }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="hud">
        <div class="hud-row">
          <span class="hud-label">LANDED</span>
          <div class="pips" id="catchPips">
            <div class="pip catch"></div><div class="pip catch"></div><div class="pip catch"></div>
          </div>
          <span class="hud-label" style="margin-left:4px;">ROD</span>
          <div class="bar-wrap"><div class="bar-track"><div class="bar-fill" id="rodFill"></div><div class="bar-num" id="rodTxt">100</div></div></div>
          <button class="iconbtn" id="soundBtn" aria-label="Toggle sound">
            <svg id="sndOn" viewBox="0 0 24 24" fill="none" stroke="#101418" stroke-width="2.4" stroke-linecap="square"><path d="M4 9v6h4l6 5V4L8 9H4z" fill="#101418"/><path d="M17 8c1.5 1.2 1.5 6.8 0 8M19.5 5.5c2.8 2.4 2.8 10.6 0 13"/></svg>
            <svg id="sndOff" viewBox="0 0 24 24" fill="none" stroke="#101418" stroke-width="2.4" stroke-linecap="square" style="display:none"><path d="M4 9v6h4l6 5V4L8 9H4z" fill="#101418"/><path d="M17 9l6 6M23 9l-6 6"/></svg>
          </button>
          <button class="iconbtn" id="pauseBtn" aria-label="Pause" style="display:none">
            <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#101418"/><rect x="14" y="5" width="4" height="14" fill="#101418"/></svg>
          </button>
        </div>
        <div class="hud-row" id="monRow">
          <span class="hud-label" id="monName">MONSTER</span>
          <div class="bar-wrap"><div class="bar-track"><div class="bar-fill" id="monFill"></div></div></div>
        </div>
      </div>

      <div id="stage">
        <div id="gl"></div>
        <div id="crosshair" aria-hidden="true"><svg viewBox="0 0 46 46" width="46" height="46" fill="none"><circle class="ring" cx="23" cy="23" r="13" stroke-width="3"/><path class="ring" d="M23 2v10M23 34v10M2 23h10M34 23h10" stroke-width="3"/><circle cx="23" cy="23" r="2.6" fill="#ffc61a" stroke="#000" stroke-width="1"/></svg></div>
        <div id="scoreBox"><span class="sl">SCORE</span><span class="sv" id="scoreVal">0</span><span id="combo">x2</span></div>
        <div id="reelUI" aria-hidden="true">
          <div id="rTrack">
            <div id="rZone"></div>
            <div id="rFish"><svg viewBox="0 0 40 28" width="40" height="28"><path id="rFishPath" d="M2 14 Q14 0 28 8 L38 2 L36 14 L38 26 L28 20 Q14 28 2 14Z" fill="#12b5a5" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/><circle cx="11" cy="12" r="2.6" fill="#fff" stroke="#000" stroke-width="1.4"/><circle cx="11.6" cy="12" r="1" fill="#000"/></svg></div>
          </div>
          <div id="rProg"><div id="rProgFill"></div></div>
        </div>
        <div id="fx"></div>
        <div id="stateWord"></div>
        <div id="bigWord"></div>
        <div id="hint"></div>

        <div class="overlay show" id="ovLoad">
          <div class="card">
            <h2>MONSTER REEL</h2>
            <p>Baiting the big ones…</p>
            <div class="loadbar"><div></div></div>
          </div>
        </div>

        <div class="overlay" id="ovMenu">
          <div class="card">
            <div class="wiggle" aria-hidden="true">
              <svg width="72" height="72" viewBox="0 0 72 72"><path d="M8 44 Q36 66 64 44 L58 58 Q36 68 14 58 Z" fill="#ff4d2e" stroke="#000" stroke-width="3"/><path d="M36 44 V14" stroke="#000" stroke-width="4"/><path d="M36 14 Q58 10 60 26" fill="none" stroke="#000" stroke-width="3"/><circle cx="60" cy="30" r="4" fill="#ffc61a" stroke="#000" stroke-width="2"/></svg>
            </div>
            <h1>MONSTER<br/>REEL</h1>
            <p id="howtoLine"></p>
            <p id="bestLine"></p>
            <p id="saveLine"></p>
            <button class="bigbtn" id="startBtn">START FISHING</button>
          </div>
        </div>

        <div class="overlay" id="ovStory">
          <div class="card">
            <p class="story" id="storyText"></p>
            <button class="bigbtn teal" id="storyBtn">NEXT</button>
          </div>
        </div>

        <div class="overlay" id="ovUpgrade">
          <div class="card">
            <h2>PICK A REWARD</h2>
            <p id="upSub" style="margin-bottom:4px;">One upgrade for the next monster.</p>
            <div id="upChoices"></div>
          </div>
        </div>

        <div class="overlay" id="ovEnd">
          <div class="card">
            <h2 id="endTitle">LANDED!</h2>
            <p id="endText"></p>
            <button class="bigbtn" id="againBtn">FISH AGAIN</button>
          </div>
        </div>
        <div class="overlay" id="ovPause">
          <div class="card">
            <h2>PAUSED</h2>
            <button class="bigbtn teal" id="resumeBtn">RESUME</button>
            <button class="bigbtn" id="pauseSoundBtn" style="margin-top:10px;">SOUND: ON</button>
            <button class="bigbtn" id="abandonBtn" style="margin-top:10px; background:var(--coral); color:#fff;">ABANDON RUN</button>
            <div id="abandonConfirm" style="display:none; margin-top:12px;">
              <p>Abandon this run? The catches from this run are lost.</p>
              <button class="bigbtn" id="abandonYes" style="background:var(--coral); color:#fff;">YES, ABANDON</button>
              <button class="bigbtn teal" id="abandonNo" style="margin-top:10px;">KEEP FISHING</button>
            </div>
          </div>
        </div>
      </div>

      <div id="controls">
        <button class="cbtn" id="btnMain">CAST</button>
        <button class="cbtn reel" id="btnReel"><span class="lbl">HOLD<br/>TO REEL</span></button>
        <div id="stickZone" aria-label="Aim stick">
          <div id="stickBase">
            <svg viewBox="0 0 124 124" fill="none" stroke="#101418" stroke-width="3" stroke-linecap="square"><path d="M62 10v22M62 92v22M10 62h22M92 62h22"/></svg>
            <div id="stickKnob"></div>
          </div>
        </div>
        <button class="cbtn fire" id="btnFire"><span class="lbl">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6" stroke-linecap="square"/></svg>
          <span>SHOOT</span></span>
        </button>
      </div>
    </main>

    <script>
    "use strict";
    /* ================= helpers ================= */
    var $ = function(id){ return document.getElementById(id); };
    var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
    var rand = function(a,b){ return a + Math.random()*(b-a); };
    var stage = $("stage");
    var W = 390, H = 500;
    function resize(){
      var r = stage.getBoundingClientRect();
      W = Math.max(280, r.width); H = Math.max(300, r.height);
      if(S3){ S3.renderer.setSize(W, H, false); S3.camera.aspect = W/H; S3.camera.updateProjectionMatrix(); }
    }
    window.addEventListener("resize", resize);
    var AC = null, muted = false;
    function ac(){
      if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; } }
      if(AC && AC.state === "suspended"){ AC.resume(); }
      return AC;
    }
    function tone(f, d, type, vol, slide){
      if(muted) return; var a = ac(); if(!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type||"square"; o.frequency.setValueAtTime(f, a.currentTime);
      if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), a.currentTime + d); }
      g.gain.setValueAtTime(vol||0.12, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + d);
    }
    function noiseBurst(d, vol){
      if(muted) return; var a = ac(); if(!a) return;
      var len = Math.floor(a.sampleRate*d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
      for(var i=0;i<len;i++){ ch[i] = (Math.random()*2-1)*(1-i/len); }
      var s = a.createBufferSource(); s.buffer = buf;
      var g = a.createGain(); g.gain.value = vol||0.15;
      var f = a.createBiquadFilter(); f.type="lowpass"; f.frequency.value = 900;
      s.connect(f); f.connect(g); g.connect(a.destination); s.start();
    }

    var sfx = {
      cast:   function(){ tone(500,.18,"sine",.12, 900); },
      splash: function(){ noiseBurst(.25,.18); },
      bite:   function(){ tone(1150,.12,"square",.16); setTimeout(function(){ tone(1500,.14,"square",.16); },90); },
      hook:   function(){ tone(300,.15,"sawtooth",.16, 700); },
      shoot:  function(){ tone(760,.07,"square",.10, 220); noiseBurst(.06,.08); },
      hit:    function(){ tone(170,.10,"sawtooth",.16, 90); noiseBurst(.08,.10); },
      crit:   function(){ tone(170,.10,"sawtooth",.16, 90); noiseBurst(.08,.10); setTimeout(function(){ tone(880,.1,"square",.12,1320); },50); setTimeout(function(){ tone(1320,.14,"square",.12,1760); },110); },
      miss:   function(){ tone(190,.08,"square",.08,120); noiseBurst(.06,.06); },
      hurt:   function(){ tone(120,.28,"sawtooth",.22, 55); noiseBurst(.2,.16); },

    function reelUpdate(dt, m){

      r.cv = clamp(r.cv, -1.4, 1.4);
      r.c += r.cv * dt;
      var lo = r.zs/2, hi = 1 - r.zs/2;
      if(r.c < lo){ r.c = lo; r.cv = Math.abs(r.cv)*0.25; }
      if(r.c > hi){ r.c = hi; r.cv = -Math.abs(r.cv)*0.25; }

      r.fT -= dt;
      if(r.fT <= 0){
        r.fT = rand(d.retarget[0], d.retarget[1]);
        var dir = (r.f > 0.78) ? -1 : (r.f < 0.22 ? 1 : (Math.random()<0.5 ? -1 : 1));

    // Analog aim stick: it floats to wherever the thumb lands, then reads

      var dx = e.clientX - stickOx, dy = e.clientY - stickOy, l = Math.sqrt(dx*dx + dy*dy);

    var OUTLINE_VS = "uniform float uThick; void main(){ vec3 n = normalize(normalMatrix * normalize(position)); vec4 mv = modelViewMatrix * vec4(position, 1.0); mv.xyz += n * uThick * (0.55 + 0.04 * (-mv.z)); gl_Position = projectionMatrix * mv; }";

      for(var i=0;i<list.length;i++){

    function render3D(dt){
      if(!S3) return;
      var t = G.time;
      // ocean waves
      var pos = S3.seaGeo.attributes.position, base = S3.seaBase;
      for(var i=0;i<pos.count;i++){
        var bx = base[i*3], by = base[i*3+1];
        pos.array[i*3+2] = Math.sin(bx*0.16 + t*1.4)*0.22 + Math.cos(by*0.13 + t*1.1)*0.22;
      }
      pos.needsUpdate = true;
      // camera: the current rig (low for fishing, high for shooting) + a gentle bob and hit-shake
      var cam = S3.camera, c = G.cam;
      var sh = G.boatShake>0 ? G.boatShake : 0;
      cam.position.set(c.px + Math.sin(t*0.6)*0.06 + (sh ? rand(-0.12,0.12)*sh*3 : 0), c.py + Math.sin(t*1.25)*0.08 + (sh ? rand(-0.12,0.12)*sh*3 : 0), c.pz);
      cam.lookAt(c.lx, c.ly, c.lz);
      // boat bob
      var boat = S3.boat;
      boat.position.y = 0.05 + Math.sin(t*1.25)*0.07;
      boat.rotation.x = Math.sin(t*0.9)*0.012;
      boat.rotation.z = G.boatShake>0 ? Math.sin(t*50)*0.05*G.boatShake*3 : 0;
      // bobber
      if(S3.bobber.visible){
        var dip = (G.biteT>=0) ? 0.3 + Math.sin(t*26)*0.08 : Math.sin(t*2.6)*0.07;
        S3.bobber.position.y = 0.16 - dip*0.4;
        S3.bobber.position.x = 2.6 + Math.sin(t*0.8)*0.3;
      }
      // ripples that show where the monster will surface
      var m = G.mon, showR = !!m && G.phase==="monster" && m.state==="hidden";
      for(var ri=0; ri<S3.ripples.length; ri++){
        var rg = S3.ripples[ri]; rg.visible = showR;
        if(showR){
          var fr = (t*1.3 + ri*0.5) % 1, sc = (1.5 + fr*3.0) * m.def.scale;
          rg.position.set(m.px, 0.55, m.pz); rg.scale.set(sc, sc, sc);
          rg.material.opacity = (1 - fr)*0.85;
        }
      }
      if(showR){
        m.bubT -= dt;
        if(m.bubT<=0){ m.bubT = 0.22; burst3({x:m.px + rand(-1,1), y:0.3, z:m.pz + rand(-1,1)}, 2, 0xdff6ff); }
      }
      // monster
      if(S3.monGroup && m){
        var g = S3.monGroup, mp = S3.monParts;
        g.visible = m.rise > 0.02;
        g.position.x = m.px;
        g.position.z = m.pz;
        g.position.y = 0.6 + (m.rise-1)*6.5 + Math.sin(m.bobP)*0.22*m.rise + m.rearP*1.0 - (G.phase==="caught" ? m.sink*2.6 : 0);
        if(m.state==="warn"){
          g.position.x += Math.sin(t*70)*0.14;
          g.rotation.z = Math.sin(t*55)*0.05;
        } else { g.rotation.z = 0; }
        g.rotation.x = -m.rearP*0.42 + Math.sin(m.bobP*0.7)*0.02;
        g.rotation.y = (G.phase==="reel" ? 0 : Math.atan2(-m.px, 4 - m.pz)*0.8) + Math.sin(m.bobP*0.5)*0.14;
        var fl = m.flash>0 ? 1.35 : 1;
        g.scale.setScalar(m.def.scale * fl * (G.phase==="caught" ? Math.max(0.4, 1 - m.sink*0.5) : 1));
        if(mp){
          // the real tell: eyes flare red and swell while it rears up to lash
          if(mp.eyes){
            var flare = (m.state==="warn");
            for(var ei=0; ei<mp.eyes.length; ei++){
              var eye = mp.eyes[ei];
              if(eye.userData.baseCol==null){ eye.userData.baseCol = eye.material.color.getHex(); }
              eye.material.color.setHex(flare ? 0xff2222 : eye.userData.baseCol);
              eye.scale.setScalar(flare ? 1.55 : 1);
            }
          }
          if(mp.tongue){ mp.tongue.visible = (m.hp<=0); }   // spent monsters gape and show the tongue
          if(mp.jaw){ mp.jaw.rotation.x = 0.25 + Math.abs(Math.sin(t*1.8))*0.4 + m.rearP*0.5 + (m.hp<=0 ? 0.65 : 0); }
          if(mp.tail){ mp.tail.rotation.y = Math.sin(t*3.2)*0.3; }
          if(mp.foam){ var fs = 1 + Math.sin(t*3)*0.07 + m.rearP*0.25; mp.foam.scale.set(fs, fs, 1); }
          for(var ti=0; ti<mp.tentacles.length; ti++){ mp.tentacles[ti].rotation.x += Math.sin(t*2.4 + ti*1.1)*0.0035; }
        }
        // fishing line: rod tip -> monster mouth (it strains red when the monster slips the bar)
        var lp = S3.line.geometry.attributes.position.array;
        var strain = (G.phase==="reel" && G.reel && !G.reel.inside);
        lp[0]=-1.5; lp[1]=3.1; lp[2]=2.6;
        lp[3]=g.position.x; lp[4]=Math.max(0.3, g.position.y+0.8); lp[5]=g.position.z+2.6*m.def.scale;
        S3.line.geometry.attributes.position.needsUpdate = true;
        S3.line.visible = (m.state!=="spent");
        S3.line.material.opacity = strain ? (0.55 + 0.4*Math.sin(t*30)) : 0.75;
        S3.line.material.color.setHex(strain ? 0xff5040 : 0xdff4ff);
      } else {
        S3.line.visible = S3.bobber.visible;
        if(S3.bobber.visible){
          var bp = S3.line.geometry.attributes.position.array;
          bp[0]=-1.5; bp[1]=3.1; bp[2]=2.6;
          bp[3]=S3.bobber.position.x; bp[4]=0.3; bp[5]=S3.bobber.position.z;
          S3.line.geometry.attributes.position.needsUpdate = true;
        }
      }
      // spit projectiles fly at the boat (visual only — the rod damage is already dealt)
      for(var si=S3.spit.length-1; si>=0; si--){
        var s = S3.spit[si];
        s.position.x += s.userData.vx*dt; s.position.y += s.userData.vy*dt; s.position.z += s.userData.vz*dt;
        s.userData.vy -= 3.5*dt;
        if(s.position.z > 6.5 || s.position.y < -1){ S3.scene.remove(s); S3.spit.splice(si,1); }
      }
      // pillars erupt and fall
      for(var qi=S3.pillars.length-1; qi>=0; qi--){
        var pl = S3.pillars[qi]; pl.userData.t += dt;
        var ph = pl.userData.t<0.22 ? pl.userData.t/0.22 : Math.max(0, 1-(pl.userData.t-0.22)/0.4);
        pl.scale.y = Math.max(0.01, ph*5.2); pl.position.y = pl.scale.y/2;
        if(pl.userData.t>0.7){ S3.scene.remove(pl); S3.pillars.splice(qi,1); }
      }
      // particles
      var any = false;
      for(var vi=0; vi<S3.PMAX; vi++){
        var pt = S3.parts[vi]; if(!pt) continue;
        pt.t += dt;
        if(pt.t>pt.life){ S3.parts[vi] = null; S3.pPos[vi*3+1] = -999; any = true; continue; }
        pt.vy -= 7*dt;
        S3.pPos[vi*3] += pt.vx*dt; S3.pPos[vi*3+1] += pt.vy*dt; S3.pPos[vi*3+2] += pt.vz*dt;
        any = true;
      }
      if(any){ S3.pGeo.attributes.position.needsUpdate = true; }
      // tracer + muzzle light decay
      if(S3.tracerT>0){ S3.tracerT -= dt; if(S3.tracerT<=0){ S3.tracer.visible = false; } }
      if(S3.flashLight.intensity>0){ S3.flashLight.intensity = Math.max(0, S3.flashLight.intensity - dt*16); }
      S3.renderer.render(S3.scene, S3.camera);
    }

    /* ================= main loop ================= */
    var lastT = 0;
    function loop(ts){
      var dt = Math.min(0.033, (ts - lastT)/1000 || 0.016);
      lastT = ts;
      if(!G.paused && (G.screen==="play" || G.screen==="story" || G.screen==="end")){ update(dt); }
      else { G.time += dt; }
      render3D(dt);
      requestAnimationFrame(loop);
    }
    S3 = initThree();
    addSceneExtras();
    resize();
    positionCrosshair();
    requestAnimationFrame(loop);
    setTimeout(function(){
      $("ovLoad").classList.remove("show");
      $("ovMenu").classList.add("show");
      G.screen = "menu";
      refreshMenuStats();
    }, 1100);

    /* debug hook for verification */
    window.MR_DEBUG = {
      G: G,
      has3D: function(){ return !!S3; },
      start: function(){ $("startBtn").click(); },
      skipStory: function(){ while(G.screen==="story" && $("ovStory").classList.contains("show")){ $("storyBtn").click(); } },
      castNow: function(){ if(G.phase==="cast") doCast(); },
      forceBite: function(){ if(G.phase==="wait"){ G.waitT = 0; } },
      hookNow: function(){ if(G.phase==="wait" && G.biteT>=0) doHook(); },
      step: function(dt){ update(dt||0.1); },
      reelOn: function(){ G.reelKey = true; },
      reelOff: function(){ G.reelKey = false; },
      finishReel: function(){ if(G.reel){ G.reel.c = G.reel.f; G.reel.p = 1; } },
      setAim: function(x,y){ G.aim.x = clamp(x,0,1); G.aim.y = clamp(y,0,1); positionCrosshair(); },
      aimAtMonster: function(){ var b = monsterBox(); if(b){ G.aim.x = b.cx; G.aim.y = b.cy; positionCrosshair(); } return b; },
      box: function(){ return monsterBox(); },
      shoot: function(){ G.fireCD = 0; fireGun(); },
      stick: function(x,y){ G.stick.x = x; G.stick.y = y; },
      state: function(){ var m = G.mon; return m ? { state:m.state, hp:m.hp, rise:m.rise, sx:m.sx, sy:m.sy, upT:m.upT } : null; },
      upgrades: function(){ return $("upChoices").children.length; },
      pickUpgrade: function(i){ var b = $("upChoices").children[i||0]; if(b){ b.click(); } },
      hintText: function(){ return hintEl.classList.contains("show") ? hintEl.textContent : ""; },
      endText: function(){ return $("endText").textContent; }
    };
    </script>
  </body>
</html>
