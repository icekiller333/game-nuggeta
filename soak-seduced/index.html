<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Mash Dating Sim: Soak &amp; Seduced</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --space:#1d0b36; --space-deep:#12061f; --panel:rgba(34,14,66,.95); --ink:#f7ebff; --haze:#bca6e2;
  --spark:#ffc65e; --pink:#ff5fae; --teal:#4fe0d2; --danger:#ff6b8b; --line:rgba(188,166,226,.38);
  --ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tale:"Yellowtail","Brush Script MT",cursive;
  --track:#432375; --zone:#2fae9f;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --space:#1d0b36; --space-deep:#12061f; --ink:#f7ebff; --haze:#bca6e2; } }
:root[data-theme="dark"]{ --space:#1d0b36; --space-deep:#12061f; --ink:#f7ebff; --haze:#bca6e2; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--space-deep);color:var(--ink);font-family:var(--ui);line-height:1.35;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* stage + scene */
#stage{flex:1;min-height:0;position:relative;container-type:size;background:#43237a}
#scene{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(100cqw,calc((100cqh - 128px) * 16 / 9));aspect-ratio:16/9;overflow:hidden;border-radius:18px 18px 0 0;transition:width .6s ease;box-shadow:0 0 0 2px var(--line)}
#svg,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;font-family:var(--tale);font-size:1.7rem;white-space:nowrap;animation:floatUp 1.9s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.7)}
@keyframes floatUp{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1;transform:translateY(-8px) scale(1)}100%{transform:translateY(-70px);opacity:0}}
.bob{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.flick{animation:flick 3.4s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}47%{opacity:.55}49%{opacity:1}83%{opacity:.7}85%{opacity:1}}
.zz{animation:zz 2.6s ease-in infinite;opacity:0}.zz2{animation-delay:1.2s}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}25%{opacity:.9}100%{opacity:0;transform:translate(10px,-24px)}}
.sway{transform-box:fill-box;transform-origin:left center;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;pointer-events:none;padding:10px 64px 0;display:flex;flex-direction:column;align-items:center;z-index:2}
#score{font-size:44px;font-weight:800;line-height:1;text-shadow:0 2px 18px rgba(255,95,174,.35);font-variant-numeric:tabular-nums;transition:transform .12s}
#score.bump{transform:scale(1.2)}
#moodTxt{font-family:var(--tale);font-size:22px;color:var(--pink);line-height:1.1;min-height:24px}
#vwrap{position:relative;width:min(70vw,300px);height:10px;border-radius:6px;background:rgba(188,166,226,.22);overflow:hidden;margin-top:3px}
#vfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fd2c5,#ff5fae 60%,#ffc65e)}
#vwrap .tick{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.55}
#sectorLine{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--haze);margin-top:5px;min-height:18px}
#clout{color:var(--spark);font-weight:700}
#heat{margin-top:5px;width:min(70vw,300px);height:5px;border-radius:3px;background:rgba(188,166,226,.2);overflow:hidden}
#heat i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:left}
#heat.low i{background:var(--danger)}
#heat.low{animation:heatblink .5s linear infinite}
@keyframes heatblink{50%{opacity:.45}}
#hud[data-mode="title"] #score,#hud[data-mode="title"] #moodTxt,#hud[data-mode="title"] #vwrap,#hud[data-mode="title"] #sectorLine,#hud[data-mode="title"] #heat,
#hud[data-mode="lobby"] #score,#hud[data-mode="lobby"] #moodTxt,#hud[data-mode="lobby"] #vwrap,#hud[data-mode="lobby"] #heat{visibility:hidden}
#tip{margin-top:10px;display:flex;align-items:center;gap:12px;max-width:min(92vw,420px);background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 16px 10px 12px;transition:opacity .25s,transform .25s}
#tip.hidden{opacity:0;transform:translateY(-8px)}
#tip.noicon{padding-left:16px}
#tipIcon{width:46px;height:46px;flex:none;border-radius:12px;overflow:hidden}
#tipIcon svg{width:100%;height:100%;display:block}
#tip.noicon #tipIcon{display:none}
#tip strong{display:block;font-size:17px;font-weight:700;color:var(--spark)}
#tip strong:empty{display:none}
#tipText{font-size:15.5px;line-height:1.35}
.corner{position:absolute;top:10px;right:12px;display:flex;gap:8px;z-index:5}
.corner button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:rgba(29,11,54,.7);font-size:20px;line-height:1;cursor:pointer;position:relative}
#badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--spark);color:#2a1c00;font:700 12px/20px var(--ui);padding:0 5px}
#badge[hidden]{display:none}
#help.attn{animation:attn 1.1s ease-in-out 3}
@keyframes attn{50%{transform:scale(1.18);border-color:var(--spark)}}

/* banner */
#banner{position:absolute;left:0;right:0;top:calc(40% - 40px);display:flex;justify-content:center;padding:0 20px;pointer-events:none;opacity:0;z-index:3}
#banner .bp{text-align:center;padding:14px 30px 16px;background:linear-gradient(180deg,rgba(40,18,80,.94),rgba(18,6,36,.95));border:1.5px solid var(--line);border-radius:22px;box-shadow:0 12px 48px rgba(0,0,0,.4)}
#banner small{display:block;font-size:14px;letter-spacing:.06em;color:var(--haze)}
#bName{display:block;font-family:var(--tale);font-weight:400;font-size:clamp(34px,9vw,54px);line-height:1.1;margin-top:2px;color:#ffd0e8;text-shadow:0 0 26px rgba(255,59,154,.55)}
#banner.show{animation:banner 3s ease-in-out forwards}
@keyframes banner{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* dock */
#dock{flex:none;background:linear-gradient(180deg,#2a1250,#1d0b36);border-top:2px solid var(--line);padding:8px 14px 10px;position:relative;z-index:2}
.dockin{max-width:780px;margin:0 auto;display:grid;gap:8px}
#speech{display:grid;gap:6px;min-height:92px;align-content:start}
#gsay{min-height:46px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.07);font-size:16px;line-height:1.3}
#gsay b{font-family:var(--tale);font-weight:400;font-size:21px;white-space:nowrap}
#coach{min-height:54px;display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:14px;border:1.5px solid var(--spark);background:rgba(255,198,94,.1);font-size:15px;line-height:1.3;transition:opacity .35s}
#coach.off{opacity:0;pointer-events:none}
#coach b{color:var(--spark);white-space:nowrap}
.reveal{animation:reveal 1s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#monster.enter{animation:fadein 1s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#moodTxt{display:none}
#score,#vwrap{transition:opacity .9s}
#hud.novibe #score,#hud.novibe #vwrap{opacity:0}
#speech em,.line em{color:var(--haze)}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;transition:opacity .2s}
#controls.locked{opacity:.5;pointer-events:none}
.ctrl{border-radius:14px;padding:2px 4px}
.ctrl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.ctrl-h label{font-weight:700}
.read b{font-size:18px;font-variant-numeric:tabular-nums}
.sl{position:relative;padding:5px 0 3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:0;border-radius:99px;
  background:linear-gradient(90deg,var(--track) 0 var(--z0,0%),var(--zone) var(--z0,0%) var(--z1,0%),var(--track) var(--z1,0%) 100%);touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--pink);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:grab}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--pink);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:grab}
input[type=range]::-moz-range-track{background:transparent}
.needle{position:absolute;top:1px;width:4px;height:32px;margin-left:-2px;background:#fff;border-radius:3px;pointer-events:none;opacity:.7}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--haze)}
.tut-glow{animation:glow 1.1s ease-in-out infinite;box-shadow:0 0 0 2px var(--spark)}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--spark),0 0 22px 3px rgba(255,198,94,.6)}}
#bombs{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#controls.solo{grid-template-columns:1fr}
.unlockline{margin:10px 0 0;color:var(--spark);font-size:14.5px}
.bomb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border-radius:14px;border:2px solid rgba(188,166,226,.25);background:rgba(255,255,255,.04);cursor:pointer}
.bomb .bi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;box-shadow:inset 0 -5px 10px rgba(0,0,0,.2)}
.bomb .bn{font-size:11px;font-weight:600;line-height:1.1;text-align:center;color:var(--haze)}
.bomb .bc{position:absolute;top:2px;right:4px;font-size:11px;font-weight:800;background:var(--space);border-radius:8px;padding:0 5px}
.bomb[disabled]{opacity:.35;cursor:not-allowed}
.bomb.sel{border-color:var(--spark);background:rgba(255,198,94,.12)}
.bomb.active{border-color:var(--teal);background:rgba(79,224,210,.12)}
#bombrow{grid-column:1/-1;display:flex;gap:10px;align-items:center;min-height:36px}
#buff{flex:1;font-size:13.5px;color:var(--haze);line-height:1.25;min-height:34px}
.pill{min-height:40px;padding:0 18px;border-radius:22px;border:2px solid var(--line);background:rgba(29,11,54,.72);font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s}
.pill:active{transform:scale(.96)}
.pill.primary{background:var(--spark);border-color:var(--spark);color:#2a1c00;box-shadow:0 0 26px rgba(255,198,94,.35)}
.pill.small{min-height:34px;padding:0 14px;font-size:14px}
.pill[hidden]{display:none}

/* beat sheet */
#beat{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#beat[hidden]{display:none}
.sheet{max-width:640px;margin:0 auto;background:linear-gradient(180deg,rgba(40,18,80,.97),rgba(18,6,36,.98));border:1.5px solid var(--line);border-radius:22px;padding:14px 16px 14px;box-shadow:0 -8px 40px rgba(0,0,0,.45);animation:rise .4s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.who{font-family:var(--tale);font-size:1.6rem;line-height:1.1;min-height:1.1em}
.pre{font-size:14px;color:var(--haze);margin:2px 0 0}
.line{margin:.25rem 0 .6rem;font-size:1.05rem;max-width:70ch}
.line.narr{font-style:italic;color:var(--haze)}
.choices{display:grid;gap:8px}
.choice{display:block;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:13px;padding:10px 14px;cursor:pointer;font-size:15.5px;transition:border-color .12s,transform .12s}
.choice:hover{border-color:var(--pink);transform:translateX(2px)}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:1px 9px;border-radius:99px;margin-right:8px;color:#fff}
.tag.f{background:#d81b77}.tag.s{background:#0b8f86}.tag.j{background:#a86a00}

/* overlay + story cards */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);transition:opacity .3s;z-index:4}
#overlay.hidden{opacity:0;visibility:hidden}
#overlay.low{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4vh)}
.panel{background:linear-gradient(180deg,rgba(40,18,80,.95),rgba(18,6,36,.97));border:1.5px solid var(--line);border-radius:24px;box-shadow:0 12px 48px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}
#overlay .panel{width:min(100%,440px);padding:22px 22px 16px;max-height:100%;overflow:auto;pointer-events:auto}
#ovTitle{font-family:var(--tale);font-weight:400;font-size:44px;line-height:1;margin:0 0 6px;color:#ffd0e8;text-shadow:0 0 24px rgba(255,59,154,.5)}
#ovTitle:empty{display:none}
#ovText{font-size:17px;line-height:1.45;margin:0 auto 14px;max-width:34ch;color:var(--ink)}
#ovExtra{margin:0 auto 14px}
#ovExtra:empty{display:none}
.btns{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 12px}
.btns .pill{min-width:230px;min-height:48px;font-size:18px}
#ovCta{font-size:14px;color:var(--haze);margin:0}
.guestrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.guestrow figure{margin:0;width:84px;font-size:13px}
.port{width:100%;aspect-ratio:1;border-radius:14px;display:block;border:2px solid var(--line)}
.rstats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rstats div{border-radius:14px;background:rgba(255,255,255,.06);padding:8px 12px;min-width:84px}
.rstats b{display:block;font-size:22px}
.rstats span{font-size:12.5px;color:var(--haze)}
.sumlist{display:grid;gap:8px;text-align:left}
.sum{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
.sum .port{width:48px;border-radius:10px}
.sum small{display:block;color:var(--haze)}
#story{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px 22px;background:rgba(10,3,22,.4);z-index:5}
#story[hidden]{display:none}
.scard{width:100%;max-width:470px;padding:22px 24px 16px;background:linear-gradient(180deg,rgba(40,18,80,.97),rgba(18,6,36,.98));border:1.5px solid var(--line);border-radius:24px;box-shadow:0 12px 48px rgba(0,0,0,.5);animation:rise .5s cubic-bezier(.2,.8,.2,1)}
#sLabel{font-family:var(--tale);font-size:28px;color:var(--pink);line-height:1.1;margin-bottom:6px;min-height:30px}
#sText{font-size:19px;line-height:1.5;margin:0;text-wrap:pretty}
#sText .ghost{opacity:0}
#sNext{margin-top:12px;font-size:14px;color:var(--haze);opacity:0;transition:opacity .3s}

/* modals */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,3,22,.7);z-index:6}
.modal[hidden]{display:none}
.modal .card{background:var(--space);border:2px solid var(--line);border-radius:24px;width:min(100%,460px);max-height:calc(100% - 10px);overflow-y:auto;padding:16px 18px 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,255,255,.05);border-radius:14px;padding:4px}
.tab{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;color:var(--haze);font-weight:600;font-size:16px;cursor:pointer}
.tab.on{background:rgba(255,95,174,.2);color:var(--ink)}
.modal h3{margin:0 0 4px;font-size:24px}
.lead{margin:0 0 8px;color:var(--haze);font-size:14.5px;line-height:1.4}
.progress{height:8px;border-radius:4px;background:rgba(188,166,226,.2);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;width:0;background:var(--pink);border-radius:4px;transition:width .3s}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.entry{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 9px;border-radius:16px;border:2px solid rgba(188,166,226,.22);background:rgba(255,255,255,.04);font-weight:600;font-size:14.5px;cursor:pointer}
.entry .port{width:64px;border-radius:12px}
.entry.locked{color:var(--haze);border-style:dashed}
.entry .q{width:64px;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.05);color:var(--haze)}
.entry small{font-weight:400;font-size:12.5px;color:var(--haze)}
.entry .new{position:absolute;top:6px;right:8px;font-size:11px;color:#2a1c00;background:var(--spark);border-radius:8px;padding:1px 6px;font-weight:700}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.dhead .port{width:84px;flex:none}
.dhead p{margin:2px 0 0;color:var(--haze);font-size:14.5px}
.lore{font-family:var(--tale);font-size:21px;line-height:1.25;margin:0 0 10px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14.5px;margin:0 0 12px}
.pips{display:flex;gap:4px}
.pips i{flex:1;max-width:26px;height:10px;border-radius:5px;background:rgba(188,166,226,.2)}
.pips i.on{background:var(--pink)}
.stats .v{color:var(--haze);font-size:13.5px;text-align:right;min-width:60px}
.minis{display:flex;gap:10px;margin-bottom:6px}
.minis div{flex:1;border-radius:14px;background:rgba(255,255,255,.06);padding:8px 12px}
.minis b{display:block;font-size:20px}
.minis span{font-size:12.5px;color:var(--haze)}
.brow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(188,166,226,.15)}
.brow:last-child{border-bottom:0}
.brow .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.brow p{margin:2px 0 0;font-size:13.5px;color:var(--haze);line-height:1.3}
.pipsmall{display:flex;gap:4px;margin-top:5px}
.pipsmall i{width:22px;height:8px;border-radius:5px;background:rgba(188,166,226,.2)}
.pipsmall i.on{background:var(--teal)}
.badge2{display:inline-block;font-weight:700;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--pink);color:#2a0a22}
.mrow{display:flex;gap:10px;margin-top:12px}
.mrow button{flex:1;min-height:44px;border-radius:14px;border:2px solid var(--line);background:transparent;font-weight:600;font-size:15.5px;cursor:pointer}
.mrow button.primary{background:var(--spark);border-color:var(--spark);color:#2a1c00}
.mrow button[hidden]{display:none}
.mrow button[disabled]{opacity:.45;cursor:not-allowed}
.cloutline{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#end .card{text-align:center;padding:24px 22px 16px}
#end h3{font-family:var(--tale);font-weight:400;font-size:44px;color:#ffd0e8;margin:0 0 4px}

@media (max-width:640px){
  #score{font-size:38px}
  #controls{grid-template-columns:1fr;gap:6px}
  .bomb .bn{font-size:10px}
  #hud{padding:8px 58px 0}
}
@media (max-height:560px){
  #controls{grid-template-columns:1fr 1fr}
  #speech{min-height:40px}
  #stage{container-type:size}
  #scene{width:min(100cqw,calc((100cqh - 90px) * 16 / 9))}
}

/* layout v3: tub pinned to the top, vibe meter directly beneath it */
#scene{top:0;bottom:auto;width:min(100cqw,calc(100cqh * 16 / 9));border-radius:0 0 18px 18px}

#score{grid-area:score;font-size:40px;min-width:2.2ch;text-align:center}

nyx:{id:'nyx',name:'Nyx Morrow',short:'Nyx',tag:'Necromancer. Has not slept since the equinox.',color:'#c3a2ff',bg:'#33206b',
 temp:39,bub:55,love:'lavender',hate:'brim',pref:{f:0,s:2,j:1},
 hints:{cold:'It’s freezing. Even my zombies are complaining. Warmer.',hot:'I’m on my fourth day awake. Please don’t cook me.',low:'More bubbles… I need white noise to drift off.',high:'Too loud. Too bubbly. Dial it back…'},
 loveLine:'Lavender?! Oh, I could cry. I might. A little.',hateLine:'Brimstone? I want to close my eyes, not summon something!',
 scenes:[
  {arrive:'Nyx Morrow shuffles in, robe over pajamas, clutching a mug that reads WORLD’S OKAYEST NECROMANCER. A tiny skull minion trails her, holding a towel.',beats:[
   B(30,'I raised forty skeletons today. Forty. Do you know how many said thank you? Zero.',
    ['Let me say thank you. Slowly. Dramatically.','*blinks slowly* …Too tired to blush. But thanks.'],
    ['Forty is a lot. You’re allowed to be exhausted.','*exhales, shoulders dropping* Thank you. No one says that.'],
    ['Bones are famously bad at manners.','*tired laugh* Bone-afide rude. Yeah.']),
   B(65,'If I fall asleep in here, don’t wake me. Unless there’s a fire. Or it’s Tuesday.',
    ['Sleep tight. I’ll keep you warm.','…Sweet, but I’m too tired to flirt back. Try again when I’m a person.'],
    ['I’ll watch over you. You can rest.','*mumbling* …safe. This is safe. Thank you, Ren.'],
    ['What’s special about Tuesday? Skeleton rave?','*snort-laughs* I’ve actually been to one. Never again.'])]},
  {arrive:'Nyx arrives with an iced coffee in each hand and a third balanced on her head. She has not slept. She may never sleep.',beats:[
   B(30,'Be honest: is it normal to hear the dead gossip about me?',
    ['They’re gossiping about how good you look.','*dead-eyed stare, then a tiny smile* Nice try.'],
    ['That sounds exhausting. Want to talk about it?','*sighs* I want to talk about it for approximately nine hours.'],
    ['Tell them to mind their own graves.','Ha! “Mind your own graves.” I’m stealing that.']),
   B(65,'Sometimes I wonder if anyone would notice if I just… stopped raising things.',
    ['I’d notice. I’d notice everything about you.','*soft blink* …Okay. That landed. Ugh.'],
    ['I’d notice. And I’d make sure you got some rest.','*eyes shining* …Okay, now I’m crying. Thanks.'],
    ['Honestly, the skeletons would unionize.','*laughs, then sniffs* They’d absolutely unionize.'])]}],
 date:{arrive:'Nyx shows up at midnight in an actual dress, bags under her eyes hidden beneath glitter. She is nervous and, miraculously, awake.',beats:[
   B(35,'I… cleared my schedule. All of tomorrow. I’ve never cleared my schedule.',
    ['Then let me make the most of it.','*coughs into her mug* Ren. I’m blushing and I don’t have the blood volume.'],
    ['That means a lot. I’ll make it worth it.','*a small, real smile* I think that’s all I ever wanted.'],
    ['Wow. A day without raising anyone. Dangerous.','*dry* Cute. Be romantic, please. I’m very fragile.']),
   B(70,'If I fall asleep on you, will you still be here when I wake up?',
    ['I’d be here. And warm. And devastatingly sexy.','…Mm. You’re trying. Points for trying.'],
    ['Always. I’m a hot tub. I don’t move. That’s kind of the point.','*half-laughing, half-sobbing* That’s the nicest thing anyone’s ever said to me.'],
    ['Only if you promise to snore at least a little.','*grins* I snore like a haunted house. Deal.'])],
  end:'Nyx falls asleep with her cheek on your rim, smiling. It’s the best she’s slept since the last equinox.'},
 banter:['Nyx sinks until only her nose is above the water. “Mmf. Hi, Ren. I forgot what day it is.”','“Do you think a skeleton can get imposter syndrome?”','“If I fall asleep in here, tell my necromancy club I’m sick.”'],
 react:['Too much. Too much… my brain is toast.','Mm. Okay. Whatever. I’m barely here.','That’s nice. Thank you.','Ren… that’s the nicest thing I’ve heard in a month. Don’t make me cry.'],
 peak:'Nyx is fully asleep, smiling, one hand floating on the surface. Even the little skull minion has stopped fidgeting. Total peace.',
 good:'Nyx stumbles out, glowing and dazed. “Best nap of my life. Put me on the calendar. Please.”',
 ok:'Nyx yawns and collects her mug. “Fine. Good enough. I’ll sleep standing up.”',
 leave:'Nyx jolts upright. “I can’t relax. I’m leaving. Keep the tip.” She leaves no tip.'},

rex:{id:'rex',name:'Rex Hatchett',short:'Rex',tag:'Off-duty slasher. Shy. Brings his own rubber duck.',color:'#7ec8ff',bg:'#1f3566',
 temp:42,bub:80,love:'brim',hate:'crimson',pref:{f:1,s:2,j:0},
 hints:{cold:'Uh… could it be warmer? My shoulders are, like, really sore.',hot:'Ow! Hot hot hot! Sorry, sorry, a bit cooler?',low:'Could the jets be… stronger? My back’s a knot.',high:'Whoa, that’s a lot of bubbles. Sorry. Can we ease up?'},

    ['Cute. Is it also load-bearing?','*polite chuckle* Uh. Ha. Yeah. Sure.']),
   B(65,'People think I enjoy the work. Honestly, I just like the lake. And the quiet. And, uh, ducks.',
    ['A man who loves ducks? Swoon.','*accidentally squeaks the duck* Oh no. Sorry. That was loud.'],
    ['You don’t have to be what people expect in here.','*duck squeak* …Thank you. Truly. I needed that.'],

  {arrive:'Rex returns holding a small gift bag with both hands. “It’s a thank-you. Sorry it’s kind of late. By one visit.”',beats:[

    ['I’d wear it. Anything from you is a gift.','*spluttering* Oh. OH. Okay! Okay.'],
    ['That’s the sweetest thing. Thank you, Rex.','*sniffles inside the mask* Sorry. Allergies.'],
    ['Is the duck going to be okay without a licence?','*long beat* …Uh. He passed his swim test. Mostly.']),

    ['Movie night with you? Count me in.','*nervous squeak* I’ll bring snacks. Many snacks.'],
    ['I’d love a movie night. Let’s make it a thing.','*beaming behind the mask* Really? Really?'],
    ['Great. I’ll heckle the villain.','*laughing, awkward* The villain is… me. Heckle away?'])]}],
 date:{arrive:'Rex arrives at closing in a tuxedo T-shirt, mask polished, duck held like a corsage. His knees are visibly shaking.',beats:[

    ['Four lines? That’s a haiku with ambition.','*nervous laughter* It’s a limerick. I think.']),

    ['I’d like that more than anything.','*tears in the eyeholes* Okay. Great. Really great.'],
    ['Fine, but you’re paying rent. In ducks.','*serious beat, then a laugh* I accept. Duck rent.'])],

 banter:['Rex peeks over the rim, mask gleaming. “Is it okay if I just… sit? No axe. Promise.”','“Do you think the lake is lonely without me? Asking for a friend.”','“I’m on my lunch break. My no-killing break. I get one weekend a month.”'],
 react:['Oh. Um. Okay. Sorry, I’m, um… sorry.','Oh. That’s… sure. Thanks?','*squeaks duck* That’s really nice. Thank you.','*the mask visibly fogs* …Okay. Wow. Thank you. Wow.'],

dolores:{id:'dolores',name:'Lady Dolores Whitlock',short:'Dolores',tag:'Victorian ghost. Wants to feel water again.',color:'#9fdcff',bg:'#1d4160',
 temp:28,bub:45,love:'ecto',hate:'salts',pref:{f:1,s:0,j:2},
 hints:{cold:'A tad chilly, even for the dead, dear. Warm it a smidge.',hot:'Heavens, I’m wilting! A proper ghost should be chilled.',low:'A few more bubbles, dear. I do miss the sea.',high:'Too frothy! I shall lose my petticoat. Figuratively.'},
 loveLine:'Ectoplasm! The vintage! You remembered my favourite.',hateLine:'Salts of the Damned? I’ve been damned for 150 years, dear. I don’t need the souvenir.',

    ['Haunt me. I’ve got room, and I look fabulous.','*delighted* The audacity!'],
    ['You’re welcome here any time.','*tilts her head* Mm. Sweet. A little plain.'],

 date:{arrive:'Dolores arrives in a gown that shimmers like moonlight on water. She has polished her pearls and her ghostly nerves.',beats:[
   B(35,'I haven’t been courted in a century and a half. Be gentle, or be terribly clever.',
    ['How about both?','*smiles* A good start.'],
    ['I’ll be sincere, and I’ll be gentle.','*politely* Mm. Sweet, but I do prefer wit.'],

   B(70,'Tell me, Ren: will you still adore a ghost when she’s past her prime?',

 banter:['Dolores floats on her back, teacup balanced on her stomach. “One does so love a bubble bath, even if one cannot technically feel it.”','“Last night I haunted a pub. They tipped me. In ghost pennies.”','“The living are so fascinating. They sweat. Terribly rude.”'],

 banter:['Hotep lounges with cucumber slices over his eyes. “Habibi, wake me when the New Kingdom returns.”','“My wraps are three thousand years old. Vintage! Do you have a lint roller?”','“I have been dead a long time. This is the first time I’ve felt moist.”'],

}

/* ---------- simulation ---------- */
const tolerances=()=>{const b=R&&R.bomb,k=R&&R.tut?1.4:1;return{tT:(4+S.up.heater)*(b==='salts'?1.2:1)*k,tB:(22+S.up.jets*6)*(b==='ecto'?1.2:1)*k};};

const MOODL=['Miserable','Grumpy','Fine','Cozy','Blissful'];

function sim(dt){
  const heat=(1.6+1.0*S.up.heater)*(R&&R.bomb==='brim'?2:1);
  G.actTemp+=clamp(G.setTemp-G.actTemp,-heat*dt,heat*dt);
  const bs=70+25*S.up.jets;G.actBub+=clamp(G.setBub-G.actBub,-bs*dt,bs*dt);
  if(G.force){G.force.t-=dt;if(G.force.t<=0)G.force=null;}
  if(!R||state!=='play'||R.phase!=='soak')return;
  R.clock+=dt;
  const id=ideal(),tol=tolerances(),dT=G.actTemp-id.t,dB=G.actBub-id.b;
  const ft=clamp(1-Math.abs(dT)/tol.tT,-1,1),fb=clamp(1-Math.abs(dB)/tol.tB,-1,1),fit=clamp((ft+fb)/2,-.8,1);

  const b=R.bomb,love=b&&b===R.mon.love,hate=b&&b===R.mon.hate;let rate;
  if(fit>=0){rate=3.4*fit*(1+.1*S.up.jets)*(love?1.5:hate?.5:b?1.15:1)*(b==='crimson'?1.1:1)*(R.tut?1.3:1);}
  else rate=3.4*fit*1.1*(hate?1.6:1)*(R.tut?.5:1);
  R.vibe=clamp(R.vibe+rate*dt,0,100);
  if(!R.freeze)R.t-=dt;
  // mood shifts (off while learning)
  if(!R.tut){
    R.shiftIn-=dt;
    if(R.shiftIn<=0){
      R.shiftIn=rand(11,16)*(b==='lavender'?1.7:1);
      if(Math.random()<.5){const d=(Math.random()<.5?-1:1)*rand(2,3.5);R.shT=clamp(R.mon.temp+R.shT+d,26,46)-R.mon.temp;}
      else{const d=(Math.random()<.5?-1:1)*rand(10,18);R.shB=clamp(R.mon.bub+R.shB+d,6,94)-R.mon.bub;}
      R.hintCD=Math.min(R.hintCD,1.5);hint('','',`${R.mon.short} shifts in the water. Their mood has changed.`);
      notice('shift','Mood swing','Guests change what they want mid-soak. Keep listening for new hints.',6);
    }

  const eT=dT/tol.tT,eB=dB/tol.tB,mo=R.mon;
  R.fxKind=eT<-.7?'cold':eT>.7?'hot':eB>.9?'foam':'';
  const stT=eT<-.9?'cold':eT>.9?'hot':Math.abs(eT)<.45?'ok':'near';
  const stB=eB<-.9?'low':eB>.9?'high':Math.abs(eB)<.45?'ok':'near';
  R.sayCD-=dt;
  if(R.focus==='temp'||R.focus==='bubbles'){
    const key=R.focus==='temp'?stT:stB;
    if(key!==R.last){
      R.last=key;
      const line={cold:mo.hints.cold,hot:mo.hints.hot,low:mo.hints.low,high:mo.hints.high,ok:NICE[mo.id]}[key];
      if(line&&(R.sayCD<=0||key==='ok')){hint(mo.name,mo.color,line);R.sayCD=1.6;}
      coach({cold:'Drag the temperature slider right to warm the water.',hot:'Too far. Drag the slider left to cool it down.',low:'Drag the bubble slider right for more bubbles.',high:'Drag the bubble slider left for gentler bubbles.',ok:R.focus==='temp'?'Hold it there. The vibe meter under the tub fills while they’re happy.':'Hold it there and watch the vibe fill.',near:'Almost. Small nudges.'}[key],{sticky:true});
      if(key==='ok'){R.vibeShown=true;sfx.good();if(R.focus==='temp'&&!R.nudged){R.nudged=true;const r=R;later(4.5,()=>{if(R===r&&r.last==='ok'&&r.phase==='soak')coach('Curious? Slide it a little too hot and watch their reaction, then bring it back.',{sticky:true});});}}
    }

    if(R.hintCD<=0&&Math.max(aT,aB)>.9){
      hint(mo.name,mo.color,aT>=aB?(dT>0?mo.hints.hot:mo.hints.cold):(dB>0?mo.hints.high:mo.hints.low));R.hintCD=6.5;

  if(R.vibe>=100&&R.bi>=R.beats.length&&!R.peak){startFinale();return;}
  if(R.t<=0)finishPatron('time');
}

  if(buy&&!buy.disabled){const k=buy.dataset.buy,p=BOMBS[k].price;if(S.clout>=p){S.clout-=p;S.bombs[k]++;save();sfx.good();renderCloset();updateHUD();}}
  const up=e.target.closest('[data-up]');
  if(up&&!up.disabled){const k=up.dataset.up,l=S.up[k];if(l<3&&S.clout>=UPS[k].costs[l]){S.clout-=UPS[k].costs[l];S.up[k]++;save();applyNeon();sfx.peak();renderCloset();updateHUD();}}
});
$('#dropBtn').addEventListener('click',()=>{if(selBomb)useBomb(selBomb);});
$('#wrapBtn').addEventListener('click',()=>{if(R&&R.phase==='soak'&&!R.tut)finishPatron('wrap');});
$('#sT').addEventListener('input',e=>{G.setTemp=parseFloat(e.target.value);});
$('#sB').addEventListener('input',e=>{G.setBub=parseFloat(e.target.value);});
$('#help').addEventListener('click',()=>{ensureAudio();openGuide();});
$('#closeGuide').addEventListener('click',closeGuide);
$('#tabR').addEventListener('click',()=>setTab('r'));$('#tabB').addEventListener('click',()=>setTab('b'));
$('#backBtn').addEventListener('click',()=>setTab('r'));
$('#guide').addEventListener('click',e=>{if(e.target.id==='guide')closeGuide();});
$('#replayTut').addEventListener('click',()=>{S.seen={};save();closeGuide();showTip('Tips reset. Each one will show again the next time it comes up.',{title:'Tips reset',dur:4.5});});
$('#tabS').addEventListener('click',()=>{cTab='s';renderCloset();});$('#tabU').addEventListener('click',()=>{cTab='u';renderCloset();});
$('#closeCloset').addEventListener('click',closeCloset);
$('#closet').addEventListener('click',e=>{if(e.target.id==='closet')closeCloset();});
$('#endKeep').addEventListener('click',()=>{endOpen=false;$('#end').hidden=true;});
$('#endAgain').addEventListener('click',()=>{endOpen=false;$('#end').hidden=true;newGame();});
const muteBtn=$('#mute');
const paintMute=()=>{muteBtn.textContent=muted?'🔇':'🔊';muteBtn.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');};
muteBtn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem(MUTE,muted?'1':'0');}catch(e){}paintMute();ensureAudio();if(!muted)sfx.click();muteBtn.blur();});
function onPress(){
  ensureAudio();
  if(guideOpen||closetOpen||endOpen)return;
  if(storyOpen){advanceCard();return;}
  if(state==='title'||state==='lobby'){ovPrimary&&ovPrimary();return;}
  if((state==='over'||state==='night')&&realT-overT>.7&&ovPrimary)ovPrimary();
}
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input,.modal,#dock,#beat,.corner,#overlay .panel'))return;
  onPress();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(guideOpen)closeGuide();else if(closetOpen)closeCloset();return;}
  if((e.key===' '||e.key==='Enter')&&!e.target.closest('button,input')){e.preventDefault();onPress();}
});

/* ---------- boot ---------- */
paintMute();applyNeon();drawRen();showTitle();updateHUD();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
