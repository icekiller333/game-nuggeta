<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Daily Roguelike — The Oven's Breath (2026-11-14)</title>
    <style>
      :root{
        --ink:#14100c;
        --paper:#fff6e3;
        --bg:#f4a950;
        --bg2:#e2703a;
        --panel:#fff6e3;
        --yellow:#ffd23f;
        --green:#3ecf5a;
        --green-dk:#1d7a35;
        --red:#e63946;
        --red-dk:#8f1d27;
        --orange:#ff7b1c;
        --blue:#57b8ff;
        --pink:#ff8fab;
        --shadow:5px 5px 0 var(--ink);
        --shadow-s:3px 3px 0 var(--ink);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#2a1440;
          --bg2:#170b28;
          --paper:#fff6e3;
          --panel:#fff6e3;
        }
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0;
        font-family:"Arial Black","Segoe UI",system-ui,-apple-system,sans-serif;
        color:var(--ink);
        background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
        overflow:hidden;
      }
      button{
        font-family:inherit; color:var(--ink); cursor:pointer;
        border:3px solid var(--ink); background:var(--paper);
        min-height:2.25rem; touch-action:manipulation; user-select:none;
        -webkit-user-select:none;
      }
      button:focus-visible{ outline:4px solid var(--ink); outline-offset:2px; }

      #app{
        height:100dvh; max-width:480px; margin:0 auto;
        display:flex; flex-direction:column;
        padding:8px 10px calc(8px + env(safe-area-inset-bottom));
        gap:7px; position:relative; overflow:hidden;
      }
      #app.shake{ animation:shake .45s linear; }
      @keyframes shake{
        0%,100%{ transform:translate(0,0); }
        15%{ transform:translate(-8px,3px) rotate(-.6deg); }
        30%{ transform:translate(8px,-3px) rotate(.6deg); }
        45%{ transform:translate(-7px,-2px); }
        60%{ transform:translate(7px,2px); }
        75%{ transform:translate(-4px,1px); }
      }
      #flash{
        position:fixed; inset:0; background:var(--red); opacity:0;
        pointer-events:none; z-index:60;
      }
      #flash.on{ animation:flashA .5s ease-out; }
      @keyframes flashA{ 0%{opacity:.55;} 100%{opacity:0;} }
      #fx{ position:fixed; inset:0; pointer-events:none; z-index:55; }

      /* ---------- HUD top row ---------- */
      #hudTop{
        flex:0 0 auto; display:flex; align-items:stretch; gap:6px;
      }
      .hudBox{
        background:var(--panel); border:3px solid var(--ink);
        box-shadow:var(--shadow-s); padding:4px 6px;
        display:flex; align-items:center; gap:4px; overflow:hidden;
      }
      #heartsBox{ flex:0 0 auto; }
      #loavesBox{ flex:1 1 auto; justify-content:center; }
      .pipSvg{ display:block; flex:0 0 auto; }
      .iconBtn{
        flex:0 0 auto; width:44px; padding:0; display:flex;
        align-items:center; justify-content:center;
        background:var(--yellow); box-shadow:var(--shadow-s);
      }
      .iconBtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }

      /* ---------- Dawn bar ---------- */
      #dawnWrap{ flex:0 0 auto; }
      .barLabel{
        font-size:11px; letter-spacing:.14em; font-weight:900;
        display:flex; justify-content:space-between; margin-bottom:3px;
        color:var(--ink);
      }
      .barOuter{
        height:16px; border:3px solid var(--ink); background:#3b2d5c;
        position:relative; overflow:hidden; box-shadow:var(--shadow-s);
      }
      #dawnFill{
        position:absolute; inset:0; width:100%;
        background:linear-gradient(90deg,#ffd23f,#ff8fab);
        transform-origin:left center;
      }
      .barOuter .moon{
        position:absolute; right:3px; top:50%; transform:translateY(-50%);
        font-size:0; z-index:2;
      }

      /* ---------- Scene ---------- */
      #scene{
        flex:1 1 auto; min-height:0; position:relative; overflow:hidden;
        background:#241533; border:4px solid var(--ink); box-shadow:var(--shadow);
      }
      #scene svg{ position:absolute; inset:0; width:100%; height:100%; }
      #burnTag{
        position:absolute; top:8px; left:50%; transform:translateX(-50%);
        background:var(--red); color:#fff; border:3px solid var(--ink);
        padding:3px 10px; font-size:14px; font-weight:900; letter-spacing:.08em;
        display:none; z-index:5; box-shadow:var(--shadow-s);
      }
      #burnTag.on{ display:block; animation:blink .18s steps(2) infinite; }
      @keyframes blink{ 50%{ opacity:.35; } }
      #loafPop{
        position:absolute; top:8px; right:8px; z-index:5; display:none;
        background:var(--green); border:3px solid var(--ink); color:var(--ink);
        padding:3px 10px; font-size:14px; font-weight:900; box-shadow:var(--shadow-s);
      }
      #loafPop.on{ display:block; animation:pop .3s ease-out; }
      @keyframes pop{ 0%{ transform:scale(.4) rotate(-8deg);} 100%{ transform:scale(1) rotate(0);} }

      /* ---------- Gauge ---------- */
      #gaugeWrap{ flex:0 0 auto; }
      #gaugeOuter{
        height:30px; border:4px solid var(--ink); position:relative;
        overflow:hidden; box-shadow:var(--shadow-s); background:#574b3a;
      }
      .zone{ position:absolute; top:0; bottom:0; }
      #zCold{ background:#4d7ea8; }
      #zGreen{ background:var(--green); }
      #zYel{ background:var(--yellow); }
      #zRed{ background:var(--red); }
      #flameFill{
        position:absolute; left:0; top:0; bottom:0; width:0%;
        background:repeating-linear-gradient(45deg,rgba(255,255,255,.85) 0 8px,rgba(255,255,255,.45) 8px 16px);
        border-right:5px solid var(--ink);
        mix-blend-mode:screen;
      }
      #gaugeTicks{ position:absolute; inset:0; pointer-events:none; }
      #gaugeTicks .tick{
        position:absolute; top:0; width:3px; height:9px; background:var(--ink);
        transform:translateX(-50%);
      }
      #gaugeTicks .tlab{
        position:absolute; bottom:1px; transform:translateX(-50%);
        font-size:9px; font-weight:900; color:var(--ink);
        background:rgba(255,246,227,.85); padding:0 2px; line-height:1.2;
      }
      #gaugeWrap.dark #gaugeTicks{ display:none; }
      #burnOuter{ display:none; }
      #burnFill{ display:none; }
      #guideBanner{
        position:absolute; top:8px; left:50%; transform:translateX(-50%);
        width:min(330px, calc(100% - 16px)); z-index:6;
        background:var(--paper); color:var(--ink);
        border:3px solid var(--ink); box-shadow:var(--shadow-s);
        padding:8px 10px; text-align:center;
        font-size:15px; font-weight:900; line-height:1.35;
        display:none;
      }
      #guideBanner.on{ display:block; }
      #guideBanner .gTitle{
        display:block; font-size:11px; letter-spacing:.14em; color:var(--green-dk); margin-bottom:2px;
      }

      /* ---------- Bake bar ---------- */
      #bakeWrap{ flex:0 0 auto; }
      #bakeOuter{
        height:22px; border:4px solid var(--ink); background:var(--paper);
        overflow:hidden; position:relative; box-shadow:var(--shadow-s);
      }
      #bakeFill{
        height:100%; width:0%;
        background:repeating-linear-gradient(-45deg,#e8a33d 0 12px,#d18a26 12px 24px);
      }
      #blackFill{
        position:absolute; top:0; bottom:0; right:0; width:0%;
        background:repeating-linear-gradient(45deg,#000000 0 9px,#2b2b2b 9px 18px);
        border-left:4px solid #ffffff;
        box-shadow:-2px 0 0 var(--ink);
      }
      #blackFill.zero{ border-left:none; box-shadow:none; }
      #bakeOuter .crust{
        position:absolute; right:4px; top:50%; transform:translateY(-50%);
      }

      /* ---------- Pump ---------- */
      #pump{
        flex:0 0 96px; width:100%;
        background:var(--orange); color:var(--ink);
        border:4px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
        font-size:34px; font-weight:900; letter-spacing:.12em;
        display:flex; align-items:center; justify-content:center; gap:12px;
        touch-action:none;
      }
      #pump small{ font-size:12px; letter-spacing:.1em; display:block; }
      #pump .pumpInner{ text-align:center; line-height:1.05; }
      #pump.down{
        transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink);
        background:#ff9435;
      }
      #pump.guided{ outline:5px solid var(--yellow); outline-offset:3px; animation:pumpPulse .8s ease-in-out infinite; }
      @keyframes pumpPulse{ 50%{ filter:brightness(1.18);} }
      #pump.jiggle{ animation:jig .3s ease-in-out; }
      @keyframes jig{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-1.6deg) scale(1.02);} 75%{transform:rotate(1.6deg) scale(1.02);} }
      #pump:disabled{ filter:grayscale(.6); opacity:.55; }

      /* ---------- Overlay / cards ---------- */
      #overlay{
        position:fixed; inset:0; z-index:70; display:none;
        align-items:center; justify-content:center; padding:18px;
        background:rgba(20,10,30,.72);
      }
      #overlay.on{ display:flex; }
      .card{
        background:var(--paper); border:4px solid var(--ink);
        box-shadow:8px 8px 0 var(--ink); max-width:400px; width:100%;
        padding:22px 20px; text-align:center; max-height:92dvh; overflow:hidden;
      }
      .card h1{
        margin:0 0 12px; font-size:26px; line-height:1.15; letter-spacing:.02em;
      }
      .card h1.red{ color:var(--red-dk); }
      .card h1.green{ color:var(--green-dk); }
      .card p{ margin:0 0 16px; font-size:17px; line-height:1.45; font-family:Georgia,serif; font-weight:700; }
      .card p.howto{ font-family:inherit; font-size:18px; }
      .card .bigBtn{
        background:var(--yellow); border:4px solid var(--ink);
        box-shadow:var(--shadow-s); font-size:20px; font-weight:900;
        padding:12px 26px; letter-spacing:.06em; min-height:52px;
      }
      .card .bigBtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
      .card .bigBtn.green{ background:var(--green); }
      .card .bigBtn.red{ background:var(--red); color:#fff; }
      #lawsList{ text-align:left; margin:0 0 16px; padding:0; list-style:none; }
      #lawsList li{
        border:3px solid var(--ink); background:#fff; margin-bottom:8px;
        padding:8px 10px; font-size:14px; font-weight:900; line-height:1.3;
        box-shadow:var(--shadow-s);
      }
      #lawsList li .lawN{
        display:inline-block; background:var(--ink); color:var(--yellow);
        padding:1px 7px; margin-right:8px; font-size:12px;
      }
      .lawsEmpty{ font-family:Georgia,serif; font-weight:700; font-size:16px; margin:0 0 16px; }
      .statPips{ display:flex; justify-content:center; gap:5px; margin:0 0 14px; flex-wrap:wrap; }
      .card .art{ margin:0 auto 14px; display:block; }

      /* ---------- Spotlight ---------- */
      #spot{
        position:fixed; inset:0; z-index:65; display:none; pointer-events:none;
      }
      #spot.on{ display:block; }
      #spotBox{
        position:absolute; border:5px solid var(--yellow);
        box-shadow:0 0 0 9999px rgba(20,10,30,.72), var(--shadow-s);
        pointer-events:none;
      }
      #spotCard{
        position:absolute; left:50%; transform:translateX(-50%);
        width:min(340px,calc(100vw - 32px));
        background:var(--paper); border:4px solid var(--ink);
        box-shadow:var(--shadow); padding:14px 16px; text-align:center;
        pointer-events:auto;
      }
      #spotCard h2{ margin:0 0 6px; font-size:19px; }
      #spotCard p{ margin:0 0 12px; font-size:15px; font-weight:700; line-height:1.4; }
      #spotCard button{
        background:var(--green); border:3px solid var(--ink);
        box-shadow:var(--shadow-s); font-weight:900; font-size:16px;
        padding:9px 22px; min-height:44px;
      }
      #spotCard button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }

      .flameFlash{ animation:fflash .16s steps(2) infinite; }
      @keyframes fflash{ 50%{ opacity:.45; } }

      @media (max-height:640px){
        #pump{ flex-basis:78px; font-size:28px; }
        .card h1{ font-size:22px; }
        .card p{ font-size:15px; }
      }
      @media (prefers-reduced-motion: reduce){
        #app.shake, #pump.jiggle, #burnTag.on, #loafPop.on{ animation:none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- HUD top: hearts / loaves / sound / laws -->
      <div id="hudTop">
        <div class="hudBox" id="heartsBox" aria-label="Hearts"></div>
        <div class="hudBox" id="loavesBox" aria-label="Loaves baked"></div>
        <button class="iconBtn" id="muteBtn" aria-label="Toggle sound"></button>
        <button class="iconBtn" id="lawsBtn" aria-label="Open laws sheet"></button>
      </div>

      <!-- Dawn clock -->
      <div id="dawnWrap">
        <div class="barLabel"><span>NIGHT</span><span>DAWN</span></div>
        <div class="barOuter">
          <div id="dawnFill"></div>
          <span class="moon" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24"><path d="M20 14.5A9 9 0 1 1 9.5 4 7 7 0 0 0 20 14.5Z" fill="#fff6e3" stroke="#14100c" stroke-width="2"/></svg>
          </span>
        </div>
      </div>

      <!-- Oven scene -->
      <div id="scene" aria-label="The oven">
        <svg viewBox="0 0 360 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <!-- wall bricks -->
          <rect x="0" y="0" width="360" height="300" fill="#3a2358"/>
          <g stroke="#2a1844" stroke-width="4">
            <path d="M0 40 H360 M0 90 H360 M0 250 H360"/>
            <path d="M70 0 V40 M160 0 V40 M250 0 V40 M110 40 V90 M210 40 V90 M310 40 V90 M60 250 V300 M170 250 V300 M280 250 V300"/>
          </g>
          <!-- oven body -->
          <path d="M50 285 V120 Q50 40 180 40 Q310 40 310 120 V285 Z" fill="#8a4b2a" stroke="#14100c" stroke-width="6"/>
          <path d="M50 285 V120 Q50 40 180 40 Q310 40 310 120 V285 Z" fill="none" stroke="#5d3016" stroke-width="14" opacity=".35"/>
          <!-- chimney -->
          <rect x="160" y="4" width="40" height="42" fill="#5d3016" stroke="#14100c" stroke-width="5"/>
          <!-- mouth -->
          <path d="M95 285 V170 Q95 105 180 105 Q265 105 265 170 V285 Z" fill="#160a20" stroke="#14100c" stroke-width="6"/>
          <!-- coals -->
          <g>
            <ellipse cx="135" cy="272" rx="20" ry="9" fill="#54260e"/>
            <ellipse cx="180" cy="278" rx="24" ry="10" fill="#6b3211"/>
            <ellipse cx="225" cy="272" rx="20" ry="9" fill="#54260e"/>
            <circle cx="150" cy="268" r="4" fill="#ff7b1c"/>
            <circle cx="200" cy="273" r="4" fill="#ffd23f"/>
            <circle cx="222" cy="266" r="3" fill="#ff7b1c"/>
          </g>
          <!-- loaf on stone -->
          <g id="loafG">
            <ellipse cx="180" cy="238" rx="52" ry="10" fill="#0d0514"/>
            <path id="loafBody" d="M132 236 Q132 208 180 206 Q228 208 228 236 Q228 244 180 244 Q132 244 132 236Z" fill="#f3e2b8" stroke="#14100c" stroke-width="4"/>
            <path d="M155 216 Q165 222 175 217 M182 214 Q192 220 202 215" stroke="#14100c" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
          <!-- flame -->
          <g id="flameG" transform="translate(180 278)">
            <g id="flameFlashG">
              <path id="flameOuter" d="M0 0 C -34 -18 -30 -58 -14 -84 C -10 -66 -4 -62 0 -78 C 3 -94 10 -104 16 -118 C 20 -92 38 -74 34 -44 C 31 -18 18 -4 0 0Z" fill="#ff7b1c" stroke="#14100c" stroke-width="4" stroke-linejoin="round"/>
              <path id="flameMid" d="M0 -2 C -20 -14 -18 -42 -8 -60 C -4 -48 0 -46 2 -58 C 5 -70 9 -78 13 -88 C 16 -68 24 -54 21 -34 C 18 -14 10 -4 0 -2Z" fill="#ffd23f"/>
              <path id="flameCore" d="M0 -3 C -9 -10 -8 -26 -3 -36 C 0 -29 3 -29 5 -38 C 8 -28 11 -20 9 -10 C 7 -3 3 -1 0 -3Z" fill="#fff3c4"/>
            </g>
          </g>
          <!-- grate bars -->
          <g stroke="#14100c" stroke-width="7">
            <path d="M112 285 V196"/><path d="M146 285 V186"/><path d="M180 285 V182"/>
            <path d="M214 285 V186"/><path d="M248 285 V196"/>
          </g>
          <!-- bellows hint at side -->
          <g>
            <path d="M316 210 L348 226 L348 258 L316 268 Z" fill="#c98a3d" stroke="#14100c" stroke-width="4"/>
            <path d="M316 210 L316 268" stroke="#14100c" stroke-width="4"/>
            <rect x="306" y="228" width="12" height="22" fill="#5d3016" stroke="#14100c" stroke-width="3"/>
          </g>
        </svg>
        <div id="burnTag">GETTING BURNT!</div>
        <div id="loafPop">LOAF DONE!</div>
        <div id="guideBanner" role="status"></div>
      </div>

      <!-- Flame gauge -->
      <div id="gaugeWrap">
        <div class="barLabel"><span>FLAME</span><span id="gaugeState">COLD</span></div>
        <div id="gaugeOuter">
          <div class="zone" id="zCold"></div>
          <div class="zone" id="zGreen"></div>
          <div class="zone" id="zYel"></div>
          <div class="zone" id="zRed"></div>
          <div id="flameFill"></div>
          <div id="gaugeTicks"></div>
        </div>
        <div id="burnOuter"><div id="burnFill"></div></div>
      </div>

      <!-- Bake bar -->
      <div id="bakeWrap">
        <div class="barLabel"><span>BAKE</span><span id="bakeState">DOUGH</span></div>
        <div id="bakeOuter">
          <div id="bakeFill"></div>
          <div id="blackFill" class="zero"></div>
          <span class="crust" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 36 24"><path d="M3 20 Q3 5 18 4 Q33 5 33 20 Q33 23 18 23 Q3 23 3 20Z" fill="#e8a33d" stroke="#14100c" stroke-width="3"/></svg>
          </span>
        </div>
      </div>

      <!-- The one big control -->
      <button id="pump" aria-label="Hold to pump the bellows">
        <span class="pumpInner">PUMP<small>HOLD TO FEED FLAME</small></span>
      </button>
    </div>

    <div id="flash"></div>
    <canvas id="fx"></canvas>

    <!-- Spotlight (tour + break lessons) -->
    <div id="spot" aria-live="polite">
      <div id="spotBox"></div>
      <div id="spotCard">
        <h2 id="spotTitle"></h2>
        <p id="spotText"></p>
        <button id="spotBtn">GOT IT</button>
      </div>
    </div>

    <!-- Full-screen card overlay -->
    <div id="overlay"></div>

    <script>
      "use strict";
      /* ================= State ================= */
      var DAWN_TOTAL = 120, GREEN_LO = 40, GREEN_HI = 75;
      var S;
      function freshState(){
        return {
          phase: "story",        // story | howto | intro | play | over
          flame: 30, bake: 0, black: 0, loaves: 0, hearts: 3,
          dawn: DAWN_TOTAL, burn: 0,
          pumping: false, muted: false,
          pumpRate: 16, drift: -5, bakeMult: 1, redStart: 85,
          breaksTaken: 0, tourStep: 0, introStep: -1, introTimer: 0,
          elapsed: 0, paused: false
        };
      }
      /* Faster bake: green 9–15%/s (was 3–6%/s). Over the band still bakes
         at 11–15%/s but adds black. Black rate scales with how far over:
         just over ≈3%/s, deep red ≈30%/s. Black at 100 = burnt loaf. */
      function greenRate(f){
        return 9 + ((f - GREEN_LO) / (GREEN_HI - GREEN_LO)) * 6;
      }
      function overBakeRate(f){
        return 11 + Math.min(25, f - GREEN_HI) * 0.15;
      }
      function blackRate(f){
        var over = f - GREEN_HI;
        if (over <= 0) return 0;
        return 2 + over * 1.1;
      }
      S = freshState();

      var BREAKS = [
        { name: "DARK GAUGE", law: "DARK GAUGE — no numbers",
          lesson: "The gauge went dark. Judge the flame by its size and colour." },
        { name: "STIFF PUMP", law: "STIFF PUMP — weaker pumps",
          lesson: "The bellows stiffened. Each pump feeds less flame." },
        { name: "FAST DRIFT", law: "FAST DRIFT — flame falls faster",
          lesson: "A draft got in. The flame sinks faster when you rest." },
        { name: "COLD DOUGH", law: "COLD DOUGH — slower bake",
          lesson: "The dough is cold through. Baking runs slower now." },
        { name: "OVEN HUNGER", law: "HUNGER — red starts lower",
          lesson: "The oven is hungrier. Red starts sooner, flame falls fastest." }
      ];
      function applyBreak(i){
        if (i === 0){ document.getElementById("gaugeWrap").classList.add("dark"); }
        if (i === 1){ S.pumpRate = 11; }
        if (i === 2){ S.drift = -8; }
        if (i === 3){ S.bakeMult = 0.75; }
        if (i === 4){ S.redStart = 80; S.drift = -10; layoutZones(); }
      }

      /* ================= DOM ================= */
      function $(id){ return document.getElementById(id); }
      var app=$("app"), pumpBtn=$("pump"), overlay=$("overlay"), spot=$("spot");

      function heartSVG(full){
        return '<svg class="pipSvg" width="20" height="18" viewBox="0 0 24 22" aria-hidden="true">' +
          '<path d="M12 20 C4 14 2 10 2 6.5 C2 3.4 4.4 1.5 7 1.5 C9 1.5 11 2.8 12 4.6 C13 2.8 15 1.5 17 1.5 C19.6 1.5 22 3.4 22 6.5 C22 10 20 14 12 20Z" fill="' +
          (full ? "#e63946" : "#cbbfa5") + '" stroke="#14100c" stroke-width="2.2"/></svg>';
      }
      function loafSVG(done){
        return '<svg class="pipSvg" width="24" height="16" viewBox="0 0 36 24" aria-hidden="true">' +
          '<path d="M3 20 Q3 5 18 4 Q33 5 33 20 Q33 23 18 23 Q3 23 3 20Z" fill="' +
          (done ? "#e8a33d" : "#e6dbc2") + '" stroke="#14100c" stroke-width="2.4"/>' +
          '<path d="M11 11 Q15 14 19 11.5 M20 10 Q24 12.5 27 11" stroke="#14100c" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
      }
      function speakerSVG(){
        return '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M3 9v6h4l5 4V5L7 9H3Z" fill="#14100c"/>' +
          (S.muted

        fctx.clearRect(0,0,fx.width,fx.height);

          if (p.life >= p.max){ parts.splice(i,1); continue; }
          p.vy += p.grav*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;

      /* ================= Simulation ================= */
      var tickAcc = 0;
      function zoneOf(f){
        if (f >= S.redStart) return "red";
        if (f > GREEN_HI) return "yellow";
        if (f >= GREEN_LO) return "green";
        return "cold";
      }
      function tick(dt){
        S.elapsed += dt;
        S.dawn -= dt;
        if (S.dawn <= 0){
          S.dawn = 0;
          if (S.loaves >= 6) endScreen("win"); else endScreen("time");
          return;
        }
        /* flame */
        if (S.pumping) S.flame += S.pumpRate * dt;
        else S.flame += S.drift * dt;
        if (S.flame > 100) S.flame = 100;
        if (S.flame < 0) S.flame = 0;

        var z = zoneOf(S.flame);
        /* Bake: green bakes clean. Over the green (yellow/red) the loaf
           KEEPS baking — but black fills the bar too, faster the further
           over. Back in the green (or cold) the black stops growing; it
           never heals. Black at 100 = the loaf burns. */
        var bakingNow = false;
        if (z === "green"){
          S.bake += greenRate(S.flame) * S.bakeMult * dt; bakingNow = true;
        } else if (z === "yellow" || z === "red"){
          S.bake += overBakeRate(S.flame) * S.bakeMult * dt; bakingNow = true;
          S.black += blackRate(S.flame) * dt;
          tickAcc += dt;
          if (tickAcc > 0.25){ tickAcc = 0; sndTick(); }
        } else {
          tickAcc = 0;
        }
        /* Burn check first: a loaf that fills black burns even if it
           would also have finished this frame. */
        if (S.black >= 100){

          sndBurn();
          app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
          var fl = $("flash"); fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on");
          if (S.hearts <= 0){ endScreen("hearts"); return; }
        } else if (bakingNow && S.bake >= 100){
          S.bake = 0; S.black = 0; S.loaves++; renderPips();
          sndLoaf(); confettiBurst(false);
          var lp = $("loafPop"); lp.classList.add("on");
          setTimeout(function(){ lp.classList.remove("on"); }, 1400);
          if (S.loaves >= 6){ endScreen("win"); return; }
          var bi = S.loaves - 1;
          if (bi < BREAKS.length){
            applyBreak(bi); S.breaksTaken = S.loaves;
            breakLesson(bi);

        /* ambient embers */
        if (Math.random() < dt * (S.pumping ? 26 : 8)){
          var p = scenePoint(0.5, 0.9);
          spawn(p.x + (Math.random()-0.5)*60, p.y, 1,

      /* ================= Render ================= */
      var loafEl = $("loafBody"), flameG = $("flameG"), flashG = $("flameFlashG");
      var outerEl = $("flameOuter"), midEl = $("flameMid"), coreEl = $("flameCore");
      function lerpColor(a, b, t){
        var r = Math.round(a[0] + (b[0]-a[0])*t),
            g = Math.round(a[1] + (b[1]-a[1])*t),
            bl = Math.round(a[2] + (b[2]-a[2])*t);

      function render(now){
        /* flame size + colour by value/zone */
        var f = S.flame, z = zoneOf(f);
        var sc = 0.25 + (f/100) * 1.05;
        var wob = 1 + Math.sin(now/90) * 0.04 + (S.pumping ? Math.sin(now/40)*0.05 : 0);
        flameG.setAttribute("transform",
          "translate(180 280) scale(" + (sc*(2-wob)).toFixed(3) + " " + (sc*wob).toFixed(3) + ")");

        else if (z === "green"){ oc = "#ff7b1c"; mc = "#ffd23f"; }
        else if (z === "yellow"){ oc = "#ff5e1c"; mc = "#ff9f1c"; }
        else { oc = "#e63946"; mc = "#ff7b1c"; }
        outerEl.setAttribute("fill", oc); midEl.setAttribute("fill", mc);
        coreEl.setAttribute("fill", z === "cold" ? "#eaf7ff" : "#fff3c4");
        if (z === "red") flashG.classList.add("flameFlash"); else flashG.classList.remove("flameFlash");

        /* loaf browning, then blackening as black grows */
        var bt = Math.min(1, S.bake/100);
        var loafCol = lerpColor([243,226,184],[168,94,26], bt);
        if (S.black > 0){
          var bk = Math.min(1, S.black/100);
          /* blend the browned colour toward charcoal by black amount */

          var r2 = Math.round(Number(m[0]) * (1 - bk*0.85)),
              g2 = Math.round(Number(m[1]) * (1 - bk*0.85)),

        }
        loafEl.setAttribute("fill", loafCol);

        /* gauge + bars */
        $("flameFill").style.width = f + "%";
        $("gaugeState").textContent =
          z === "cold" ? "COLD" : z === "green" ? "BAKING" : z === "yellow" ? "HOT — BURNING" : "TOO HOT — BURNING!";
        $("gaugeState").style.color = (z === "yellow" || z === "red") ? "#8f1d27" : "";
        $("bakeFill").style.width = Math.min(100, S.bake) + "%";
        var bf = $("blackFill");
        bf.style.width = Math.min(100, S.black) + "%";
        bf.classList.toggle("zero", S.black <= 0);
        $("bakeState").textContent =
          S.black > 0 ? ("BURNT " + Math.floor(S.black) + "%") :
          bt >= 1 ? "DONE" : bt > 0.66 ? "GOLDEN" : bt > 0.3 ? "RISING" : "DOUGH";
        $("bakeState").style.color = S.black > 0 ? "#14100c" : "";
        $("dawnFill").style.width = (S.dawn / DAWN_TOTAL * 100) + "%";
        $("burnTag").classList.toggle("on", (z === "yellow" || z === "red") && S.phase === "play");
      }

      /* ================= Main loop ================= */
      var last = performance.now();
      function loop(now){
        var dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (!S.paused){
          if (S.phase === "play") tick(dt);
          else if (S.phase === "intro") tickIntro(dt);
        }
        render(now);
        drawFx(dt);
        requestAnimationFrame(loop);
      }
      renderPips();
      pumpBtn.disabled = false;
      storyCard1();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
