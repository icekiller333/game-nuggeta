/* ============================== HELPERS ============================== */
const rnd = (a, b) => a + Math.random() * (b - a);

function cellAt(x, y) { const c = Math.floor((x - GX) / CW), r = Math.floor((y - GY) / CH); if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return -1; const i = r * COLS + c; return active(i) ? i : -1; }

/* ============================== USER AI ============================== */
function newUserName() { const n = fileN++; return pick([`memo_${n}.doc`, `letter${n}.doc`, `notes${n}.txt`, `scan${n}.bmp`, `report${n}.xls`, `draft${n}.doc`]); }
function done(w) { st.user.act = null; st.user.wait = w + (st.easy ? 1.2 : 0); }
function chooseAction() {
  const u = st.user;
  const err = st.wins.find(w => w.kind === 'error');
  if (err) { u.act = { kind: 'ok', w: err, t: 0 }; u.tx = err.x + err.w / 2; u.ty = err.y + err.h - 18; return; }
  if (st.tut) { startAct(u.queue.length ? u.queue.shift() : { kind: 'wander' }); return; }
  if (u.queue.length) { startAct(u.queue.shift()); return; }

    u.queue.push({ kind: 'save', file: `~ins${n}.tmp`, junk: true }, { kind: 'save', file: `setup${n % 10}.log`, junk: true });
    startAct({ kind: 'save', file: `pxp${n}.tmp`, junk: true });

/* ============================== UPDATE ============================== */
function update(dt) {
  st.glitch = Math.max(0, Math.min(1.2, st.glitch) - dt * 1.6);
  if (st.banner) { st.banner.life -= dt; if (st.banner.life <= 0) st.banner = null; }
  for (let k = st.particles.length - 1; k >= 0; k--) {
    const p = st.particles[k]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
    if (p.life <= 0) st.particles.splice(k, 1);
  }
  if (st.phase === 'boot') { st.bootT += dt; return; }
  if (st.phase !== 'play') { st.overT += dt; return; }

  const night0 = isNight(st.clock);
  if (!(st.tut && st.tut.freeze)) {
    const prev = st.clock;
    st.clock = (st.clock + (night0 ? 480 / 45 : 960 / (st.easy ? 45 : 75)) * dt) % 1440;
    if (crossed(prev, st.clock, 420)) startDay();
    if (crossed(prev, st.clock, 1380)) startNight();
  }
  if (st.tut) { st.tut.t += dt; const s = TUT[st.tut.step]; if (s.done && s.done()) setStep(st.tut.step + 1); }
  const night = isNight(st.clock);
  st.dayAmt += ((night ? 0 : 1) - st.dayAmt) * Math.min(1, dt * 1.2);

  let exposed = 0, hidden = 0;
  for (const c of cells) { if (!c) continue; if (c.type === 'frag') exposed++; else if (c.type === 'folder') hidden += c.frags; }
  if (st.drag && st.drag.active && st.drag.item.type === 'frag') exposed++;
  st.exposed = exposed; st.hidden = hidden; st.total = exposed + hidden;
  st.stats.peak = Math.max(st.stats.peak, st.total);
  if (st.total === 0) { if (st.tut) { spawnFree(); spawnFree(); } else { gameOver('erased'); return; } }

  st.cycles += st.total * .05 * (night ? 2 : 1) * dt;
  if (st.fakeCD > 0) st.fakeCD -= dt;

  if (!st.tut) { if (night) st.sus -= .12 * dt; else st.sus += exposed * (st.easy ? .005 : .011) * dt; }
  st.sus = clamp(st.sus, 0, st.tut ? 95 : 100);
  for (const [lvl, msg] of [[50, '> User: “This computer is acting weird lately.”'], [75, '> User: “Maybe I should call my nephew…”'], [90, '> The user is dialing their nephew. Calm them down!']]) {
    if (!st.tut && st.sus >= lvl && !st.susFlags[lvl]) { st.susFlags[lvl] = true; log(msg, C_BAD); SFX.warn(); }
    if (st.sus < lvl - 10) st.susFlags[lvl] = false;
  }
  if (st.sus >= 100) { gameOver('reformat'); return; }

  // growth at night (or forced during the tutorial)
  const tutGrow = st.tut && TUT[st.tut.step].grow;
  if ((night && !st.tut) || tutGrow) {
    st.growT += dt;
    if (st.growT >= (tutGrow ? .9 : 2.4)) { st.growT = 0; growOnce(); }
  }

  // antivirus
  if (!st.scan) {
    if (!st.tut || st.tut.allowScan) st.scanIn -= dt;
    if (st.scanIn <= 6 && !st.scanWarned) { st.scanWarned = true; log('> ScanGuard 95: scheduled scan in 6 seconds. Move fragments behind the beam or into folders.', C_YEL); SFX.warn(); }
    if (st.scanIn <= 0) { st.scan = { x: GX - 16, speed: st.tut ? 45 : 70 + st.defs * 14 }; st.scanId++; st.scanKills = 0; }
  } else {
    const sc = st.scan; sc.x += sc.speed * dt;
    cells.forEach((c, i) => {
      if (!c || !active(i)) return;
      const cx = cellX(i) + 32;
      if (Math.abs(cx - sc.x) > 10) return;
      if (c.type === 'frag') { destroyFrag(i); st.scanKills++; }
      else if (c.type === 'folder' && st.defs >= 4 && c.lastScan !== st.scanId && c.frags > 0) {
        c.lastScan = st.scanId; let k = 0; for (let n = 0; n < c.frags; n++) if (Math.random() < .4) k++;
        if (k) { c.frags -= k; st.scanKills += k; const p = cellCenter(i); burst(p.x, p.y, ['#4dff9a', '#ffffff'], 12, 90); SFX.lose(); }
      }
    });
    if (st.drag && st.drag.active && st.drag.item.type === 'frag' && Math.abs(mouse.x - sc.x) < 14) {
      burst(mouse.x, mouse.y, ['#4dff9a', '#ff2fd0'], 20, 140); st.drag = null; st.scanKills++; SFX.lose(); st.glitch = .9;
    }
    if (sc.x > GX + (st.small ? SC : COLS) * CW + 16) {
      st.scan = null; st.scanWarned = false; st.ev.scanDone = true;
      if (st.tut) st.tut.allowScan = false;
      st.scanIn = st.easy ? 999 : rnd(55, 75) / (1 + .12 * (st.defs - 1));
      log(st.scanKills ? `> Scan complete. ${st.scanKills} fragment${st.scanKills > 1 ? 's' : ''} quarantined.` : '> Scan complete. Nothing found. You’re not a bug.', st.scanKills ? C_BAD : C_OK);
    }
  }

  if (!night && st.user.visible) updateUser(dt);
  if (st.bubble) { st.bubble.life -= dt; if (st.bubble.life <= 0) st.bubble = null; }
  st.wins = st.wins.filter(w => (w.life -= dt) > 0);

    lines = ['C:\\> FORMAT C: /U', 'WARNING, ALL DATA ON NON-REMOVABLE DISK', 'DRIVE C: WILL BE LOST!', 'Proceed with Format (Y/N)? Y', 'Formatting 540M ... 100 percent completed.', '', 'The user’s nephew “fixed” the computer.', `Survived ${days} night${days > 1 ? 's' : ''}. Peak size ${peak} KB.`, '', '[ Click to reboot ]'];
    col = k => k === 9 ? C_PINK : k < 5 ? '#c8c8c8' : '#ffb3c8';
  }
  g.font = MONO(30);
  typeLines(lines, Math.floor(st.overT * 40), 80, 130, 34, col);
}
function draw() {
  const t = T;
  if (st.phase === 'boot') { drawBoot(); drawParticles(); drawCursor(mouse.x, mouse.y, '#ff3fd0', '#2ff5ff'); return; }
  if (st.phase !== 'play') { drawEnd(); drawCursor(mouse.x, mouse.y, '#ff3fd0', '#2ff5ff'); return; }
  const night = isNight(st.clock);
  drawWallpaper(t, st.dayAmt);

  drawUnmapped();
  const gh = (st.small ? SR : ROWS) * CH;
  if (st.scan) { g.fillStyle = 'rgba(80,255,150,.07)'; g.fillRect(GX, GY, Math.max(0, st.scan.x - GX), gh); }
  for (const a of st.targets) {
    const x = cellX(a.i), y = cellY(a.i), pulse = .5 + .5 * Math.sin(T * 12);
    const urgent = cells[a.i] && cells[a.i].type === 'frag';
    g.fillStyle = `rgba(255,40,60,${(urgent ? .22 : .1) + .12 * pulse})`; g.fillRect(x + 3, y + 2, CW - 6, CH - 6);
    g.strokeStyle = `rgba(255,60,80,${.6 + .4 * pulse})`; g.setLineDash([4, 3]); g.lineWidth = 2; g.strokeRect(x + 3, y + 2, CW - 6, CH - 6); g.setLineDash([]); g.lineWidth = 1;
    g.font = MONO(15); g.fillStyle = '#fff'; g.fillText('save', x + 7, y + 14);
  }
  const hov = (!st.drag || !st.drag.active) ? cellAt(mouse.x, mouse.y) : -1;
  for (let i = 0; i < cells.length; i++) {
    const it = cells[i]; if (!it || !active(i)) continue;
    const x = cellX(i), y = cellY(i);
    drawIcon(it, x + 16, y + 8, t);
    drawLabel(it, x + 32, y + 56, i === hov);
  }
  if (st.drag && st.drag.active) {
    const j = cellAt(mouse.x, mouse.y);
    if (j >= 0) { g.strokeStyle = 'rgba(255,255,255,.8)'; g.setLineDash([2, 2]); g.strokeRect(cellX(j) + 4, cellY(j) + 3, CW - 8, CH - 8); g.setLineDash([]); }
  }
  drawWindows();
  if (st.scan) {
    const x = st.scan.x, gr = g.createLinearGradient(x - 18, 0, x + 18, 0);
    gr.addColorStop(0, 'rgba(60,255,140,0)'); gr.addColorStop(.5, 'rgba(120,255,170,.55)'); gr.addColorStop(1, 'rgba(60,255,140,0)');
    g.fillStyle = gr; g.fillRect(x - 18, GY - 4, 36, gh + 6);
    g.fillStyle = '#d6ffe4'; g.fillRect(x - 1, GY - 4, 2, gh + 6);
    g.font = MONO(16); g.fillStyle = '#d6ffe4'; g.fillText('SCANGUARD', x + 6, GY + 10);
  }
  drawPanel(night);
  drawTaskbar(night);
  if (!st.scan && st.scanIn < 6) {
    const bx = GX + COLS * CW - 270, by = TB - 46;
    g.fillStyle = '#ffffe1'; g.fillRect(bx, by, 262, 36); g.strokeStyle = '#000'; g.strokeRect(bx + .5, by + .5, 261, 35);
    g.fillStyle = '#000'; g.font = UI_BOLD; g.fillText('ScanGuard 95', bx + 8, by + 15);
    g.font = UI_FONT; g.fillText(`Scheduled scan of C:\\ starts in ${Math.ceil(st.scanIn)}s.`, bx + 8, by + 29);
  }
  drawDial();
  drawTutorial();
  drawParticles();
  const u = st.user;
  if (u.visible && !night) {
    if (u.click > 0) { g.strokeStyle = `rgba(255,255,255,${u.click / .3})`; g.beginPath(); g.arc(u.x, u.y, 14 - u.click * 30, 0, 6.283); g.stroke(); }
    drawCursor(u.x, u.y, '#ffffff', '#000000');
    g.font = MONO(14); g.fillStyle = '#000'; g.fillRect(u.x + 12, u.y + 16, 30, 12); g.fillStyle = '#fff'; g.fillText('USER', u.x + 14, u.y + 26);
    if (st.bubble) {
      g.font = UI_FONT; const w = g.measureText(st.bubble.text).width + 14;
      const bx = clamp(u.x + 14, 4, W - w - 4), by = clamp(u.y - 34, 4, H);
      g.fillStyle = '#ffffe1'; g.fillRect(bx, by, w, 20); g.strokeStyle = '#000'; g.strokeRect(bx + .5, by + .5, w - 1, 19);
      g.fillStyle = '#000'; g.fillText(st.bubble.text, bx + 7, by + 14);
    }
  }
  if (st.drag && st.drag.active) { g.globalAlpha = .85; drawIcon(st.drag.item, mouse.x - 16, mouse.y - 16, t); g.globalAlpha = 1; }
  drawBanner();
  drawCursor(mouse.x, mouse.y, '#ff3fd0', '#2ff5ff');
}
function drawParticles() { for (const p of st.particles) { g.globalAlpha = clamp(p.life * 2, 0, 1); g.fillStyle = p.c; g.fillRect(p.x, p.y, p.s, p.s); } g.globalAlpha = 1; }

/* ============================== INPUT ============================== */
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  const ux = (e.clientX - r.left) / r.width, uy = 1 - (e.clientY - r.top) / r.height;
  const cx = ux * 2 - 1, cy = uy * 2 - 1;
  const nx = cx * (1 + K * cy * cy), ny = cy * (1 + K * cx * cx);
  return { x: (nx * .5 + .5) * W, y: (1 - (ny * .5 + .5)) * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; pointerDown = true; initAudio();
  if (st.phase === 'boot') { if (st.bootDone) { SFX.boot(); newGame(); } else st.bootT = 99; return; }
  if (st.phase !== 'play') { if (st.overT > 1.2) newGame(); return; }
  if (st.tut) for (const b of st.tut.btns) if (inRect(p, b.x, b.y, b.w, b.h)) { b.fn(); return; }
  if (st.dial) {
    for (let k = st.dial.prompts.length - 1; k >= 0; k--) {
      const pr = st.dial.prompts[k];
      if (inRect(p, pr.x, pr.y, 140, 64)) { st.dial.prompts.splice(k, 1); st.dial.p = Math.min(1, st.dial.p + .03); SFX.ack(); burst(p.x, p.y, ['#2ff5ff', '#ff2fd0'], 10, 80); return; }
    }
  }
  for (const b of buttons()) if (inRect(p, b.x, b.y, b.w, b.h)) { b.fn(); return; }
  if (inRect(p, W - 156, TB + 4, 22, 21)) { muted = !muted; return; }
  const i = cellAt(p.x, p.y);
  if (i >= 0 && cells[i] && cells[i].type !== 'bin') st.drag = { i, item: cells[i], sx: p.x, sy: p.y, active: false };
});
cv.addEventListener('pointermove', e => {
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  const d = st.drag;
  if (d && !d.active && Math.hypot(p.x - d.sx, p.y - d.sy) > 5) {
    if (cells[d.i] === d.item) { cells[d.i] = null; d.active = true; SFX.pick(); } else st.drag = null;
  }
});
function endPointer(e) {
  pointerDown = false;
  const d = st.drag; if (!d) return; st.drag = null;
  if (st.phase !== 'play') return;
  const p = toLogical(e);
  if (!d.active) { if (d.item.type === 'folder' && d.item.frags > 0 && cells[d.i] === d.item) releaseFrag(d.i); return; }
  drop(d, p);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => { mouse.x = -50; mouse.y = -50; });
addEventListener('keydown', e => { if (e.key === 'm' || e.key === 'M') muted = !muted; });

/* ============================== LOOP ============================== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  update(dt); draw();
  texture.needsUpdate = true;
  mat.uniforms.uTime.value = T; mat.uniforms.uGlitch.value = Math.min(1, st.glitch);
  renderer.render(scene, cam);
}
const fontReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('26px VT323'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
fontReady.then(() => requestAnimationFrame(t => { last = t; frame(t); }));
})();
</script>
