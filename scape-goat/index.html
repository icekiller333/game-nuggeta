<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Scape Goat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
    <style>
      :root{
        --ink:#16130e;
        --paper:#fffdf4;
        --yellow:#ffd23f;
        --pink:#ff8fab;
        --mint:#7bf1a8;
        --sky:#aee7ff;
        --orange:#ff9f45;
        --red:#ff5252;
        --panel:#fffdf4;
        --xpc:#6a1b9a;
      }
      @media (prefers-color-scheme: dark){
        :root{ --panel:#232733; --paper:#232733; --ink:#f5efdf; --xpc:#e1bee7; }
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0; background:#20301f; color:var(--ink);
        font-family:"Nunito",system-ui,sans-serif; font-weight:800;
        display:flex; align-items:stretch; justify-content:center;
        overflow:hidden;
      }
      @media (prefers-color-scheme: light){ body{ background:#7ec8e3; } }
      #wrap{
        position:relative; width:100%; max-width:520px; height:100dvh;
        overflow:hidden; background:#9be2fe;
        box-shadow:0 0 0 4px #16130e;
        touch-action:none; user-select:none; -webkit-user-select:none;
      }
      canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

      /* ---------- HUD ---------- */
      #hud{
        position:absolute; top:0; left:0; right:0; z-index:5;
        display:flex; justify-content:space-between; align-items:flex-start;
        padding:10px 10px 0; pointer-events:none; gap:8px;
      }
      .hudbox{
        background:var(--paper); border:3px solid #16130e; border-radius:10px;
        box-shadow:4px 4px 0 #16130e; padding:5px 10px;
        display:flex; align-items:center; gap:8px;
      }
      #hearts{ display:flex; gap:3px; }
      .heart{ width:22px; height:20px; display:block; }
      .heart path{ fill:#ff4d6d; stroke:#16130e; stroke-width:1.6; }
      .heart.lost path{ fill:#8d8d93; }
      #dayLabel{ font-family:"Bungee",sans-serif; font-size:15px; letter-spacing:.5px; color:var(--ink); }
      #scoreBox{ flex-direction:column; align-items:flex-end; gap:0; padding:4px 10px; }
      #score{ font-family:"Bungee",sans-serif; font-size:19px; line-height:1; color:var(--ink); }
      #combo{ font-family:"Bungee",sans-serif; font-size:12px; color:#d35400; min-height:15px; }
      #xpLine{ font-family:"Bungee",sans-serif; font-size:12px; color:var(--xpc); min-height:15px; }
      #combo.pop{ animation:pop .25s ease; }
      @keyframes pop{ 40%{ transform:scale(1.45) rotate(-3deg); } }

      #fluffBar{
        position:absolute; left:10px; bottom:10px; z-index:5; pointer-events:none;
        background:var(--paper); border:3px solid #16130e; border-radius:10px;
        box-shadow:4px 4px 0 #16130e; padding:5px 10px;
        display:flex; align-items:center; gap:7px;
      }
      #fluffBar .lbl{ font-family:"Bungee",sans-serif; font-size:12px; color:var(--ink); }
      #pips{ display:flex; gap:3px; }
      .pip{ width:13px; height:13px; border-radius:50%; border:2px solid #16130e; background:#e8e2d0; }
      .pip.on{ background:#fff3b0; }
      .pip.hot{ background:var(--yellow); }
      #stageName{ font-family:"Bungee",sans-serif; font-size:12px; color:#b8860b; }

      .iconbtn{
        pointer-events:auto; position:absolute; z-index:6; top:64px;
        width:40px; height:40px; border:3px solid #16130e; border-radius:10px;
        background:var(--paper); box-shadow:3px 3px 0 #16130e; cursor:pointer;
        font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center;
        color:var(--ink); font-family:"Nunito",sans-serif; font-weight:900;
      }
      .iconbtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 #16130e; }
      #btnPause{ right:10px; }
      #btnMute{ right:58px; }

      /* ---------- Overlays ---------- */
      .overlay{
        position:absolute; inset:0; z-index:10; display:flex;
        flex-direction:column; align-items:center; justify-content:center;
        padding:20px; text-align:center;
      }
      .hidden{ display:none !important; }

      #ovTitle{ justify-content:flex-start; padding-top:7dvh; background:linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.12)); }
      .title-big{
        font-family:"Bungee",sans-serif; font-size:min(17vw,76px); line-height:.95;
        color:#fffdf4; -webkit-text-stroke:2px #16130e;
        text-shadow:5px 5px 0 #16130e; margin:0; letter-spacing:1px;
      }
      .title-big .alt{ color:var(--yellow); }
      .tagline{
        margin-top:12px; background:#16130e; color:#fffdf4; padding:4px 14px;
        font-family:"Bungee",sans-serif; font-size:14px; border-radius:8px; transform:rotate(-1.5deg);
      }
      .howto{
        margin-top:auto; margin-bottom:14px; background:var(--paper); color:var(--ink);
        border:3px solid #16130e; border-radius:12px; box-shadow:5px 5px 0 #16130e;
        padding:12px 16px; font-size:17px; max-width:92%;
      }
      .bigbtn{
        font-family:"Bungee",sans-serif; font-size:22px; cursor:pointer;
        background:var(--yellow); color:#16130e; border:4px solid #16130e; border-radius:14px;
        padding:13px 34px; box-shadow:6px 6px 0 #16130e; letter-spacing:.5px;
      }
      .bigbtn:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 #16130e; }
      .bigbtn.mint{ background:var(--mint); }
      .bigbtn.pink{ background:var(--pink); }
      .bigbtn.small{ font-size:16px; padding:10px 22px; }

      .card{
        background:var(--panel); border:4px solid #16130e; border-radius:16px;
        box-shadow:8px 8px 0 #16130e; padding:22px 22px 18px; max-width:94%;
        color:var(--ink);
      }
      .card h2{ font-family:"Bungee",sans-serif; margin:0 0 10px; font-size:27px; line-height:1.1; }
      .card p{ margin:0 0 14px; font-size:18px; line-height:1.45; font-weight:800; }
      .card .btnrow{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
      .cardStats{ font-family:"Bungee",sans-serif; font-size:15px; line-height:1.7; margin-bottom:12px; }

      /* ---------- Level-up shop ---------- */
      #ovShop{ z-index:11; background:rgba(10,10,20,.45); }
      .shopcard{ max-height:94dvh; overflow-y:auto; width:min(94%,470px); }
      #shopXP{ font-family:"Bungee",sans-serif; font-size:17px; color:var(--xpc); text-align:center; }
      .upgRow{
        display:flex; gap:10px; align-items:center; text-align:left;
        border:3px solid #16130e; border-radius:12px; padding:9px 11px; margin-bottom:9px;
        background:var(--paper); color:var(--ink);
      }
      .upgInfo{ flex:1; min-width:0; }
      .upgName{ font-family:"Bungee",sans-serif; font-size:14.5px; line-height:1.25; }
      .upgPips{ letter-spacing:2px; font-size:11px; color:var(--xpc); }
      .upgDesc{ font-size:13.5px; font-weight:800; line-height:1.35; margin-top:2px; }
      .buyBtn{
        font-family:"Bungee",sans-serif; font-size:14px; padding:9px 12px; cursor:pointer;
        border:3px solid #16130e; border-radius:10px; background:var(--yellow); color:#16130e;
        box-shadow:3px 3px 0 #16130e; white-space:nowrap;
      }
      .buyBtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 #16130e; }
      .buyBtn:disabled{ background:#cfc9b8; color:#6d675a; cursor:default; box-shadow:none; transform:none; }
      .buyBtn.maxed{ background:var(--mint); }
      #dayNotes{
        text-align:left; margin:0 auto 14px; max-width:340px; padding:10px 14px;
        background:rgba(127,127,127,.12); border:3px dashed #16130e; border-radius:10px;
      }
      #dayNotes .nh{ font-family:"Bungee",sans-serif; font-size:12px; margin-bottom:5px; }
      #dayNotes div.rule{ font-size:14.5px; line-height:1.5; font-weight:800; }
      #dayNotes div.rule b{ color:#c2185b; }

      /* ---------- Tour ---------- */
      #tourBox{
        position:absolute; z-index:8; border:4px dashed var(--yellow); border-radius:14px;
        box-shadow:0 0 0 9999px rgba(10,10,20,.45); pointer-events:none;
        transition:all .3s ease;
      }
      #tourCard{
        position:absolute; z-index:9; left:50%; transform:translateX(-50%);
        bottom:76px; width:min(92%,430px);
        background:var(--panel); border:4px solid #16130e; border-radius:14px;
        box-shadow:6px 6px 0 #16130e; padding:14px 16px; text-align:center; color:var(--ink);
      }
      #tourText{ font-size:17px; line-height:1.45; margin:0 0 12px; font-weight:800; }
      #tourCard .bigbtn{ font-size:17px; padding:9px 24px; }

      #flashRed{
        position:absolute; inset:0; z-index:7; pointer-events:none;
        background:radial-gradient(ellipse at center, transparent 45%, rgba(255,30,30,.55));
        opacity:0; transition:opacity .12s;
      }
      #pausedCard{ z-index:12; background:rgba(10,10,20,.45); }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="cv"></canvas>

      <div id="hud" class="hidden">
        <div class="hudbox">
          <div id="hearts"></div>
          <div id="dayLabel">DAY 1</div>
        </div>
        <div class="hudbox" id="scoreBox">
          <div id="score">0</div>
          <div id="combo"></div>
          <div id="xpLine">XP 0</div>
        </div>
      </div>

      <div id="fluffBar" class="hidden">
        <span class="lbl">FLUFF</span>
        <div id="pips"></div>
        <span id="stageName">FLUFFY</span>
      </div>

      <button class="iconbtn hidden" id="btnMute" aria-label="Toggle sound">♪</button>
      <button class="iconbtn hidden" id="btnPause" aria-label="Pause">❚❚</button>

      <div id="flashRed"></div>

      <!-- TITLE -->
      <div class="overlay" id="ovTitle">
        <h1 class="title-big">SCAPE<br /><span class="alt">GOAT</span></h1>
        <div class="tagline">A LOVE STORY, WITH ARROWS</div>
        <div class="howto">Block only the arrows that would truly hit her — every arrow she survives earns XP.</div>
        <button class="bigbtn" id="btnPlay">▶ PLAY</button>
        <button class="bigbtn small pink" id="btnShopTitle" style="margin-top:14px">⬆ UPGRADES · XP 0</button>
      </div>

      <!-- STORY / DAY / END CARDS (one reusable card) -->
      <div class="overlay hidden" id="ovCard">
        <div class="card">
          <h2 id="cardTitle">…</h2>
          <p id="cardText">…</p>
          <div class="cardStats hidden" id="cardStats"></div>
          <div id="dayNotes" class="hidden">
            <div class="nh">FIELD NOTES — NEWEST FIRST</div>
            <div id="dayNotesList"></div>
          </div>
          <div class="btnrow" id="cardBtns"></div>
        </div>
      </div>

      <!-- TOUR -->
      <div id="tourBox" class="hidden"></div>
      <div id="tourCard" class="hidden">
        <p id="tourText">…</p>
        <button class="bigbtn" id="tourNext">NEXT ▶</button>
      </div>

      <!-- LEVEL-UP SHOP -->
      <div class="overlay hidden" id="ovShop">
        <div class="card shopcard">
          <h2>LEVEL-UP SHOP</h2>
          <p id="shopXP">BANKED XP: 0</p>
          <div id="shopList"></div>
          <div class="btnrow"><button class="bigbtn mint" id="btnShopDone">DONE ▶</button></div>
        </div>
      </div>

      <!-- PAUSE -->
      <div class="overlay hidden" id="pausedCard">
        <div class="card">
          <h2>PAUSED</h2>
          <p>The arrows wait. Buttercup waits. No pressure.</p>
          <div class="btnrow"><button class="bigbtn mint" id="btnResume">▶ KEEP BLOCKING</button></div>
        </div>
      </div>
    </div>

    <script>
    "use strict";
    // ================= SCAPE GOAT =================
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var wrap = document.getElementById('wrap');
    var W = 0, H = 0, DPR = 1;
    function resize(){
      DPR = Math.min(2, window.devicePixelRatio || 1);
      W = wrap.clientWidth; H = wrap.clientHeight;
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    }
    window.addEventListener('resize', resize); resize();

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var darkMq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');

    // ---------- palettes ----------
    function pal(){
      if (darkMq && darkMq.matches) return {
        sky1:'#232a4d', sky2:'#3a4a7a', hill:'#5b4a8a', hillTop:'#3f7d5a',
        grass1:'#2e6b46', grass2:'#245638', laneA:'rgba(255,255,255,0.05)', laneB:'rgba(255,255,255,0.11)',
        rock:'#6b5670', fence:'#8a6a4a', cloud:'rgba(230,235,255,0.5)'
      };
      return {
        sky1:'#8fd8fb', sky2:'#d8f6ff', hill:'#ffb26b', hillTop:'#69c24f',
        grass1:'#8fe388', grass2:'#63c957', laneA:'rgba(255,255,255,0.10)', laneB:'rgba(255,255,255,0.22)',
        rock:'#e08e4f', fence:'#a9743f', cloud:'rgba(255,255,255,0.9)'
      };
    }

    // ---------- audio ----------
    var AC = null, muted = false;
    function ac(){
      if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; } }
      if (AC && AC.state === 'suspended') AC.resume();
      return AC;
    }
    function tone(f0, f1, dur, type, vol, delay){
      if (muted || !ac()) return;
      var t = AC.currentTime + (delay || 0);
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, freq, vol, type, delay){
      if (muted || !ac()) return;
      var t = AC.currentTime + (delay || 0);
      var len = Math.max(1, Math.floor(AC.sampleRate * dur));
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = AC.createBufferSource(); src.buffer = buf;
      var f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
      var g = AC.createGain(); g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
    }
    var sfx = {
      twang: function(){ tone(280, 70, 0.09, 'triangle', 0.20); noise(0.05, 1800, 0.08, 'bandpass'); },
      thunk: function(){ noise(0.12, 420, 0.5); tone(110, 45, 0.14, 'sine', 0.5); },
      close: function(){ tone(900, 1400, 0.08, 'square', 0.12); noise(0.12, 420, 0.5); tone(110, 45, 0.14, 'sine', 0.5); },
      bonk:  function(){ tone(300, 60, 0.22, 'square', 0.25); noise(0.15, 300, 0.5); },
      chomp: function(){ noise(0.07, 900, 0.4); noise(0.07, 700, 0.35, 'lowpass', 0.09); },
      sizzle:function(){ noise(0.45, 2600, 0.30, 'highpass'); },
      poof:  function(){ noise(0.18, 500, 0.35); },
      tick:  function(){ tone(1250, 1650, 0.06, 'square', 0.10); },
      baa:   function(){ tone(420, 300, 0.32, 'sawtooth', 0.16); tone(435, 290, 0.32, 'sawtooth', 0.10, 0.03); },
      hurt:  function(){ tone(520, 180, 0.4, 'sawtooth', 0.22); noise(0.2, 500, 0.3); },
      fanfare:function(){ var n=[523,659,784,1046]; for (var i=0;i<4;i++) tone(n[i], n[i], 0.16, 'square', 0.14, i*0.11); },
      sad:   function(){ tone(392, 392, 0.22, 'square', 0.15); tone(370, 370, 0.22, 'square', 0.15, 0.24); tone(349, 300, 0.45, 'square', 0.15, 0.48); }
    };

    // ---------- helpers ----------
    function rnd(a, b){ return a + Math.random() * (b - a); }
    function irnd(a, b){ return Math.floor(rnd(a, b + 1)); }
    function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
    function laneX(l){ return W * (l + 0.5) / 3; }
    function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    // ---------- game state ----------
    var GOAT_Y = 0.68, SPOUSE_Y = 0.905, SPAWN_Y = 0.155, BURN_Y = 0.52;
    var FRONT_Y = 0.68, BACK_Y = 0.80;
    function goatYF(){ return FRONT_Y + (BACK_Y - FRONT_Y) * S.depthPos; }
    function isThreat(traj){ return traj === 'on' || traj === 'lob' || traj === 'skim'; }
    var S = {
      mode: 'title',           // title | story | tour | card | play | end
      paused: false,
      day: 1, endless: false,
      hearts: 3, score: 0, best: 0,
      combo: 0, bestCombo: 0, blocked: 0,
      charges: 0, stage: 0,
      goatPos: 1, goatTarget: 1, goatFrom: 1, lastLaneChangeT: -9, goatStun: 0, goatHurtT: 0, goatFaceT: 0,
      spouseHurtT: 0, spouseBlink: rnd(2, 5),
      arrows: [], draws: [], events: [], hayItems: [], particles: [], floaters: [], stuck: [],
      dayTime: 0, dayCfg: null, dayStartScore: 0, dayStartCharges: 0,
      shake: 0, slowmo: 0, time: 0, tourStep: -1, tutorial: false,
      storyIdx: 0, notes: [], clouds: [], flowers: [],
      depthT: 0, depthPos: 0, xpRun: 0, windUsed: false, spot: null, spotReturn: 'play'
    };
    window.SG = S; // probe/debug handle

    // ---------- meta progression (persistent) ----------
    var META = (function(){
      var def = { xp: 0, upg: { heart: 0, grit: 0, depth: 0, hooves: 0, fluff: 0, eyes: 0, wind: 0, sniff: 0 },
                  seenDud: false, seenDepth: false, depthJustBought: false, depthNote: false };
      try {
        var m = JSON.parse(localStorage.getItem('sg_meta_v1'));
        if (m && m.upg){ for (var k in def.upg) if (typeof m.upg[k] !== 'number') m.upg[k] = 0; m.xp = m.xp || 0; return m; }
      } catch (e) {}
      return def;
    })();
    window.SG_META = META; // probe/debug handle
    function saveMeta(){ try { localStorage.setItem('sg_meta_v1', JSON.stringify(META)); } catch (e) {} }
    var UPGS = [
      { id: 'heart',  name: 'EXTRA HEART',     desc: 'Buttercup +1 heart. She takes one more bonk, forever.', costs: [15, 30, 50] },
      { id: 'grit',   name: 'GOAT GRIT',       desc: 'Lv1: HEAVY arrows can\'t shove you. Lv2: FIRE arrows can\'t singe your fluff.', costs: [20, 40] },
      { id: 'depth',  name: 'FORWARD & BACK',  desc: 'Lv1: W/S, ↑/↓ or swipe ↕ steps you front/back. Unlocks LOBBED + SKIMMER arrows — they need it. Lv2: quicker steps.', costs: [25, 45] },
      { id: 'hooves', name: 'QUICK HOOVES',    desc: 'Faster lane changes.', costs: [15, 35] },
      { id: 'fluff',  name: 'FULL FLUFF START', desc: 'Begin every run one fluff stage bigger.', costs: [25, 50] },
      { id: 'eyes',   name: 'KEEN EYES',       desc: 'Archers aim longer; shot previews read stronger.', costs: [20, 40] },
      { id: 'wind',   name: 'SECOND WIND',     desc: 'Once per run, a fatal hit leaves Buttercup at 1 heart instead.', costs: [30] },
      { id: 'sniff',  name: 'XP SNIFF',        desc: '+25% XP from every arrow she survives.', costs: [20, 40] }
    ];
    function maxHearts(){ return 3 + META.upg.heart; }
    function fluffStartCharges(){ return [0, 2, 5][META.upg.fluff]; }
    function addXP(n, lanePos, yFrac){
      var gain = Math.max(1, Math.round(n * (1 + 0.25 * META.upg.sniff)));
      META.xp += gain; S.xpRun += gain; saveMeta();
      if (lanePos !== undefined) addFloater(lanePos, yFrac, '+' + gain + ' XP', '#6a1b9a', 15);
      renderHUD();
    }

    for (var ci = 0; ci < 5; ci++) S.clouds.push({ x: Math.random(), y: rnd(0.03, 0.2), s: rnd(0.6, 1.3), v: rnd(0.004, 0.01) });
    for (var fi = 0; fi < 46; fi++) S.flowers.push({ x: Math.random(), y: rnd(0.3, 0.98), c: ['#ff8fab', '#ffd23f', '#ffffff', '#c39bff'][fi % 4], s: rnd(2, 3.6) });

    function stageOf(ch){ return ch >= 5 ? 2 : (ch >= 2 ? 1 : 0); }
    function coverHalf(){ return [0.47, 0.72, 1.07][S.stage]; }
    var STAGE_NAMES = ['FLUFFY', 'POOFED!', 'MEGA FLUFF'];

    // ---------- day configs ----------
    function dayCfg(n){
      if (n <= 6) return [
        null,
        { arrows: 10, interval: 1.55, travel: 2.35, draw: 0.95, doubles: 0,    heavy: 0, fire: 0, low: 0, hay: 0, dud: 0.38 },
        { arrows: 14, interval: 1.28, travel: 2.05, draw: 0.85, doubles: 0.30, heavy: 0, fire: 0, low: 0, hay: 0, dud: 0.38 },
        { arrows: 14, interval: 1.22, travel: 2.00, draw: 0.85, doubles: 0.20, heavy: 0, fire: 0, low: 0, hay: 4, dud: 0.32 },
        { arrows: 16, interval: 1.12, travel: 1.90, draw: 0.80, doubles: 0.30, heavy: 4, fire: 0, low: 0, hay: 2, dud: 0.30 },
        { arrows: 18, interval: 1.02, travel: 1.80, draw: 0.76, doubles: 0.35, heavy: 2, fire: 5, low: 0, hay: 3, dud: 0.30 },

    function buildEvents(n){
      var cfg = dayCfg(n); S.dayCfg = cfg;
      var types = [];
      for (var i = 0; i < cfg.arrows; i++) types.push('normal');
      var specials = [];
      for (i = 0; i < cfg.heavy; i++) specials.push('heavy');
      for (i = 0; i < cfg.fire; i++) specials.push('fire');
      for (i = 0; i < cfg.low; i++) specials.push('low');
      shuffle(specials);
      var slots = shuffle(types.map(function(_, ix){ return ix; })).slice(0, specials.length);
      slots.forEach(function(slot, ix){ types[slot] = specials[ix]; });

        var special = ty !== 'normal';

        if (Math.random() < cfg.doubles){
          var l2 = irnd(0, 2); if (l2 === ev.lane) l2 = (l2 + 1) % 3;
          ev.lane2 = l2;
          var t2 = rollTraj();

    function dudResolve(a, label){
      a.dead = true;
      sfx.tick();
      addFloater(a.lane, a.y - 0.09, label, '#1b5e20', 19);
      burst(a.lane, a.y, 6, a.traj === 'high' ? '#a9743f' : '#8d6e63');
      addXP(1, a.lane, a.y - 0.18);
    }

    // ---------- combat resolution ----------
    function resolveBlock(a){
      var dist = Math.abs(a.lane - S.goatPos);
      var close = (S.time - S.lastLaneChangeT) < 0.30;
      var mult = comboMult();
      if (a.type === 'heavy' && a.hp > 1){
        a.hp = 1; a.y = goatYF() - 0.16; a.vy *= 0.55; a.passed = false; a.bounced = true;
        sfx.bonk(); S.shake = Math.max(S.shake, reduced ? 2 : 6);
        burst(a.lane, GOAT_Y - 0.05, 8, '#ffffff');
        if (S.stage === 0 && META.upg.grit < 1){
          var nt = S.goatTarget === 1 ? (Math.random() < 0.5 ? 0 : 2) : 1;
          setTarget(nt); S.goatStun = 0.22;
          addFloater(a.lane, GOAT_Y - 0.2, 'SHOVED!', '#c2185b', 20);
        } else {
          addFloater(a.lane, GOAT_Y - 0.2, 'BOING!', '#16130e', 20);
        }
        renderHUD(); return;
      }
      // destroyed
      a.dead = true;
      S.combo++; S.bestCombo = Math.max(S.bestCombo, S.combo); S.blocked++;
      var pts = 10;
      if (a.type === 'heavy') pts = 30;
      var label = null, col = '#16130e';
      if (a.type === 'fire'){
        if (dist > 0.18 && META.upg.grit < 2){
          pts = 10; label = 'SINGED! −FLUFF'; col = '#e65100';
          sfx.sizzle(); setCharges(S.charges - 2);
          burst(a.lane, GOAT_Y - 0.04, 10, '#ff9f45');
        } else {
          pts = 30; label = 'SMOTHERED!'; col = '#c2185b';
          sfx.poof();
          burst(a.lane, GOAT_Y - 0.04, 10, '#ff8fab');
        }
      }
      if (!label && a.traj === 'lob'){ label = 'LOB CAUGHT!'; col = '#6a1b9a'; }
      if (!label && a.traj === 'skim'){ label = 'SKIM STOPPED!'; col = '#6a1b9a'; }
      if (close && a.type !== 'fire'){ pts += 15; label = 'CLOSE! +' + (pts * mult); col = '#d35400'; }
      S.score += pts * mult;
      var xpGain = (a.type === 'heavy' || a.type === 'fire') ? 3 : 2;
      if (close) xpGain += 1;
      addXP(xpGain, a.lane, goatYF() - 0.30);
      if (label) addFloater(a.lane, GOAT_Y - 0.2, label, col, 21);
      else if (S.combo % 10 === 0) addFloater(a.lane, GOAT_Y - 0.2, 'COMBO ×' + comboMult(), '#d35400', 22);
      if (close) { sfx.close(); S.slowmo = 0.12; } else sfx.thunk();
      S.shake = Math.max(S.shake, reduced ? 1.5 : 4);
      burst(a.lane, GOAT_Y - 0.05, a.type === 'heavy' ? 16 : 9, '#ffffff');
      if (S.stuck.length < 9 && a.type !== 'fire')
        S.stuck.push({ ang: rnd(-2.4, -0.7), type: a.type, len: rnd(14, 24) });
      popCombo(); renderHUD();
      if (S.tutorial){ S.tutorial = false; addFloater(1, 0.42, 'THUNK! That\'s love.', '#c2185b', 24); setTimeout(endTour, 900); }
    }
    function spouseHit(a){
      a.dead = true;
      if (S.tutorial){ addFloater(1, 0.5, 'Ouch! That\'s what we\'re preventing — again!', '#c2185b', 19); spawnTutorial(); return; }
      S.hearts--; S.combo = 0; S.spouseHurtT = 0.9;
      sfx.hurt(); setTimeout(function(){ sfx.baa(); }, 120);
      S.shake = reduced ? 4 : 12;
      flashRed.style.opacity = '1'; setTimeout(function(){ flashRed.style.opacity = '0'; }, 160);
      addFloater(a.lane, SPOUSE_Y - 0.13, 'MAA!', '#c2185b', 26);
      burst(a.lane, SPOUSE_Y - 0.04, 12, '#ff8fab');
      renderHUD();
      if (S.hearts <= 0){
        if (META.upg.wind >= 1 && !S.windUsed){
          S.windUsed = true; S.hearts = 1;
          sfx.fanfare();
          addFloater(a.lane, SPOUSE_Y - 0.22, 'SECOND WIND!', '#6a1b9a', 25);
          renderHUD();
        } else { S.mode = 'dying'; S.slowmo = 0.7; setTimeout(gameOver, 850); }
      }
    }

    // ---------- update ----------
    function update(dt){
      S.time += dt;
      // clouds
      S.clouds.forEach(function(c){ c.x += c.v * dt; if (c.x > 1.15) c.x = -0.15; });
      // particles
      S.particles = S.particles.filter(function(p){
        p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
        return p.t < p.life;
      });
      S.floaters = S.floaters.filter(function(f){ f.t += dt; f.y -= 34 * dt; return f.t < f.life; });
      if (S.spouseHurtT > 0) S.spouseHurtT -= dt;
      if (S.goatHurtT > 0) S.goatHurtT -= dt;
      if (S.goatStun > 0) S.goatStun -= dt;
      if (S.slowmo > 0) S.slowmo -= dt;

      // depth movement (front <-> back line)
      if (S.depthPos !== S.depthT){
        var dRate = META.upg.depth >= 2 ? 6 : 3.2;
        var dd = S.depthT - S.depthPos;
        S.depthPos += clamp(dd, -dRate * dt, dRate * dt);
      }
      // goat movement
      var speed = 9 + 3 * META.upg.hooves; // lanes per second
      var diff = S.goatTarget - S.goatPos;
      if (Math.abs(diff) > 0.001){
        var step = clamp(diff, -speed * dt, speed * dt);
        S.goatPos += step;
      }
      var active = (S.mode === 'play') || (S.mode === 'tour' && S.tutorial) || S.mode === 'dying';
      if (!active || S.paused) return;

      if (S.mode === 'play') S.dayTime += dt;
      // fire events
      if (S.mode === 'play') S.events.forEach(function(ev){
        if (!ev.fired && S.dayTime >= ev.t){
          ev.fired = true;
          if (ev.hay){ S.hayItems.push({ lane: ev.lane, y: SPAWN_Y, vy: 1 / 2.6, rot: 0 }); }
          else {
            startDraw(ev.lane, ev.type, false, ev.traj);
            if (ev.lane2 !== undefined) startDraw(ev.lane2, 'normal', false, ev.traj2);
          }
        }
      });
      // draws
      for (var i = S.draws.length - 1; i >= 0; i--){
        var d = S.draws[i]; d.t += dt;
        if (d.t >= d.dur){
          S.draws.splice(i, 1);
          fireArrow(d);
        }
      }
      // arrows — resolved by trajectory: only true threats can hurt her
      var planeY = goatYF() - 0.035;
      var frontPlane = FRONT_Y - 0.035, backPlane = BACK_Y - 0.035;
      for (i = S.arrows.length - 1; i >= 0; i--){
        var a = S.arrows[i];
        var vy = a.vy;
        if (a.type === 'fire' && a.y > BURN_Y) vy *= 1.55;
        if (a.traj === 'short') vy *= Math.max(0.55, 1 - (a.y - SPAWN_Y) * 0.55); // droops and dies early
        a.y += vy * dt;
        a.wob = Math.sin(S.time * 9 + a.seed) * (a.bounced ? 0.05 : 0.012);
        var covered = Math.abs(a.lane - S.goatPos) <= coverHalf();
        if (a.traj === 'on'){
          if (!a.passed && a.y >= planeY){
            if (covered) resolveBlock(a); else a.passed = true;
          }
        } else if (a.traj === 'lob'){
          // arcs over the front line; only the BACK line can catch it
          if (!a.passed && a.y >= backPlane){
            if (S.depthPos > 0.5 && covered) resolveBlock(a); else a.passed = true;
          }
        } else if (a.traj === 'skim'){
          // races low; only the FRONT line can stop it — at the back it slides under the fluff
          if (!a.passed && a.y >= frontPlane){
            if (S.depthPos < 0.5 && covered) resolveBlock(a); else a.passed = true;
          }
        } else if (a.traj === 'high'){
          if (a.y >= 0.845) dudResolve(a, 'OVER HER HEAD!');
        } else if (a.traj === 'short'){
          if (a.y >= 0.79) dudResolve(a, 'INTO THE DIRT!');
        }
        if (!a.dead && isThreat(a.traj) && a.y >= SPOUSE_Y - 0.02) spouseHit(a);
        if (a.dead) S.arrows.splice(i, 1);
      }
      // hay
      for (i = S.hayItems.length - 1; i >= 0; i--){
        var hy = S.hayItems[i];
        hy.y += hy.vy * dt; hy.rot += dt * 1.5;
        if (!hy.passed && hy.y >= planeY){
          if (Math.abs(hy.lane - S.goatPos) <= coverHalf() + 0.1){
            hy.dead = true; sfx.chomp();
            var before = S.charges;
            setCharges(S.charges + 1);
            if (S.charges === before) addFloater(hy.lane, GOAT_Y - 0.2, 'FLUFF MAX!', '#b8860b', 19);
            else addFloater(hy.lane, GOAT_Y - 0.2, '+FLUFF', '#b8860b', 20);
            burst(hy.lane, GOAT_Y - 0.04, 8, '#ffd23f');
            S.score += 5;
          } else hy.passed = true;
        }
        if (!hy.dead && hy.y >= SPOUSE_Y - 0.02){ hy.dead = true; burst(hy.lane, SPOUSE_Y - 0.03, 5, '#ffd23f'); }
        if (hy.dead) S.hayItems.splice(i, 1);
      }
      // day end?
      if (S.mode === 'play'){
        var allFired = S.events.every(function(e){ return e.fired; });
        if (allFired && S.draws.length === 0 && S.arrows.length === 0 && S.hayItems.length === 0) dayComplete();
      }
      if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 26);
    }
    function startDraw(lane, type, tutorial, traj){
      traj = traj || 'on';
      // avoid two draws in same lane overlapping: delay behind the active one
      var delay = 0;
      for (var i = 0; i < S.draws.length; i++)
        if (S.draws[i].lane === lane) delay = Math.max(delay, S.draws[i].dur - S.draws[i].t + 0.15);
      var dur = tutorial ? 0.7 : (S.dayCfg ? S.dayCfg.draw : 0.85) * (type === 'low' ? 0.62 : 1) * (1 + 0.35 * META.upg.eyes);
      S.draws.push({ lane: lane, type: type, t: -delay, dur: dur, tutorial: !!tutorial, traj: traj });
      // first dud ever: boxed spotlight teaches the read
      if (!META.seenDud && !tutorial && delay === 0 && (traj === 'high' || traj === 'short') && S.mode === 'play' && !S.spot){
        META.seenDud = true; saveMeta();
        showSpot([
          { box: [0.02, 0.005, 0.96, 0.34], text: 'READ THE SHOT! See the PALE dotted line? This arrow was never going to hit her — it lands ' + (traj === 'high' ? 'clean OVER her head, into the fence.' : 'SHORT, thudding into the dirt.') + ' Let it fly!' },
          { box: [0.02, 0.005, 0.96, 0.34], text: 'Only RED previews can hurt Buttercup. Every arrow she survives — blocked by you or ignored by you — earns XP. Bank XP, die, spend it on level-ups, come back stronger.' }
        ]);
      }
    }
    function fireArrow(d){
      var cfg = S.dayCfg || { travel: 2.3 };
      var traj = d.traj || 'on';
      var travel = cfg.travel * (d.type === 'low' ? 0.62 : (d.type === 'heavy' ? 1.12 : 1));
      if (traj === 'skim') travel *= 0.60;
      else if (traj === 'lob') travel *= 1.18;
      else if (traj === 'high') travel *= 0.95;
      if (d.tutorial) travel = 3.6;
      S.arrows.push({ lane: d.lane, y: SPAWN_Y, vy: 1 / travel, type: d.type, traj: traj, hp: d.type === 'heavy' ? 2 : 1, seed: rnd(0, 9), passed: false, dead: false, bounced: false, wob: 0 });
      sfx.twang();
    }

    // ================= DRAWING =================
    function circle(x, y, r, fill, stroke){
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      if (fill){ ctx.fillStyle = fill; ctx.fill(); }
      if (stroke){ ctx.lineWidth = 3; ctx.strokeStyle = '#16130e'; ctx.stroke(); }
    }
    function ellipse(x, y, rx, ry, fill, stroke, rot){
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
      if (fill){ ctx.fillStyle = fill; ctx.fill(); }
      if (stroke){ ctx.lineWidth = 3; ctx.strokeStyle = '#16130e'; ctx.stroke(); }
    }
    function heartPath(x, y, s, fill){
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.85);
      ctx.bezierCurveTo(x - s * 1.15, y + s * 0.1, x - s * 0.62, y - s * 0.8, x, y - s * 0.18);
      ctx.bezierCurveTo(x + s * 0.62, y - s * 0.8, x + s * 1.15, y + s * 0.1, x, y + s * 0.85);
      ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#16130e'; ctx.stroke();
    }

    function drawScene(){
      var P = pal();
      // sky
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, P.sky1); g.addColorStop(0.35, P.sky2); g.addColorStop(0.36, P.grass1); g.addColorStop(1, P.grass2);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // clouds
      S.clouds.forEach(function(c){
        ctx.fillStyle = P.cloud;
        circle(c.x * W, c.y * H, 15 * c.s, P.cloud, false);
        circle(c.x * W + 16 * c.s, c.y * H + 3, 11 * c.s, P.cloud, false);
        circle(c.x * W - 16 * c.s, c.y * H + 3, 11 * c.s, P.cloud, false);
      });
      // lanes
      var lw = W / 3;
      for (var i = 0; i < 3; i++){
        ctx.fillStyle = i % 2 ? P.laneB : P.laneA;
        ctx.fillRect(i * lw, H * 0.13, lw, H * 0.87);
      }
      // lane glow for active draws
      S.draws.forEach(function(d){
        var pulse = 0.25 + 0.3 * Math.abs(Math.sin(S.time * 10));
        var col = d.type === 'fire' ? '255,120,40' : d.type === 'heavy' ? '90,90,110' : d.type === 'low' ? '70,200,90' : '255,240,170';
        ctx.fillStyle = 'rgba(' + col + ',' + pulse + ')';
        ctx.fillRect(d.lane * lw + 2, H * 0.13, lw - 4, H * 0.87);
        // chevrons
        ctx.fillStyle = 'rgba(22,19,14,0.65)';
        var cy = H * 0.17 + (S.time * 40 % 14);
        ctx.beginPath();
        ctx.moveTo(laneX(d.lane) - 10, cy); ctx.lineTo(laneX(d.lane) + 10, cy); ctx.lineTo(laneX(d.lane), cy + 9);
        ctx.closePath(); ctx.fill();
      });
      // flowers
      S.flowers.forEach(function(f){
        ctx.fillStyle = f.c;
        ctx.fillRect(f.x * W, f.y * H, f.s, f.s);
      });
      // cliff
      ctx.fillStyle = P.rock;
      ctx.fillRect(-4, 0, W + 8, H * 0.125);
      ctx.fillStyle = P.hillTop; ctx.fillRect(-4, 0, W + 8, H * 0.045);
      ctx.lineWidth = 3; ctx.strokeStyle = '#16130e';
      ctx.beginPath(); ctx.moveTo(0, H * 0.125); ctx.lineTo(W, H * 0.125); ctx.stroke();
      // fence behind spouse
      ctx.fillStyle = P.fence;
      ctx.fillRect(0, H * (SPOUSE_Y - 0.045), W, 5);
      ctx.fillRect(0, H * (SPOUSE_Y + 0.035), W, 5);
      for (i = 0; i < 8; i++) ctx.fillRect(i * W / 7 - 3, H * (SPOUSE_Y - 0.055), 7, H * 0.115);
      // burn line hint when fire is around
      if (S.arrows.some(function(a){ return a.type === 'fire'; })){
        ctx.strokeStyle = 'rgba(230,81,0,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
        ctx.beginPath(); ctx.moveTo(0, BURN_Y * H); ctx.lineTo(W, BURN_Y * H); ctx.stroke(); ctx.setLineDash([]);
      }
      // depth lines (only once FORWARD & BACK is owned)
      if (META.upg.depth >= 1){
        ctx.strokeStyle = 'rgba(22,19,14,0.4)'; ctx.lineWidth = 2; ctx.setLineDash([6, 7]);
        [FRONT_Y, BACK_Y].forEach(function(yy){
          ctx.beginPath(); ctx.moveTo(0, yy * H); ctx.lineTo(W, yy * H); ctx.stroke();
        });
        ctx.setLineDash([]);
        ctx.font = '10px Bungee, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(22,19,14,0.6)';
        ctx.fillText('FRONT', 6, FRONT_Y * H - 5);
        ctx.fillText('BACK', 6, BACK_Y * H - 5);
      }
    }

    // dashed trajectory previews — the READ: red lands on her, pale is a dud
    function drawPreviews(){
      S.draws.forEach(function(d){
        if (d.t < 0) return;
        var threat = isThreat(d.traj);
        var x0 = laneX(d.lane), y0 = H * 0.115, x1 = x0, y1, cy;
        if (d.traj === 'high'){ y1 = H * 0.845; cy = H * 0.30; }
        else if (d.traj === 'short'){ y1 = H * 0.79; cy = H * 0.42; }
        else if (d.traj === 'lob'){ y1 = H * (SPOUSE_Y - 0.02); cy = H * 0.15; }
        else if (d.traj === 'skim'){ y1 = H * (SPOUSE_Y - 0.01); cy = H * 0.55; }
        else { y1 = H * (SPOUSE_Y - 0.02); cy = H * 0.5; }
        var eyes = META.upg.eyes;
        var alpha = clamp((eyes >= 1 ? 0.9 : 0.6) + 0.18 * Math.sin(S.time * 8), 0.25, 1);
        ctx.save();
        ctx.lineWidth = eyes >= 2 ? 4 : 3;
        ctx.setLineDash([7, 9]);
        ctx.strokeStyle = threat ? 'rgba(225,25,25,' + alpha + ')' : 'rgba(255,255,255,' + alpha + ')';
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(x0, cy, x1, y1); ctx.stroke();
        ctx.setLineDash([]);
        // landing marker
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = threat ? 'rgba(225,25,25,' + alpha + ')' : 'rgba(27,94,32,' + alpha + ')';
        ctx.beginPath(); ctx.arc(x1, y1, eyes >= 1 ? 8 : 6, 0, Math.PI * 2); ctx.stroke();
        if (!threat){
          ctx.beginPath();
          ctx.moveTo(x1 - 4, y1); ctx.lineTo(x1 - 1, y1 + 3.5); ctx.lineTo(x1 + 4.5, y1 - 3.5);
          ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(225,25,25,' + alpha + ')';
          ctx.beginPath(); ctx.arc(x1, y1, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      });
    }

    function drawArcher(lane, draw){
      var x = laneX(lane), baseY = H * 0.125;
      var prog = draw ? clamp(draw.t / draw.dur, 0, 1) : 0;
      var bob = Math.sin(S.time * 2 + lane * 2) * 1.2;
      var y = baseY + bob;
      // cloak
      ctx.fillStyle = '#5d4037';
      ctx.beginPath();
      ctx.moveTo(x - 11, baseY + 2); ctx.lineTo(x, y - 26); ctx.lineTo(x + 11, baseY + 2);
      ctx.closePath(); ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#16130e'; ctx.stroke();
      // head + hood
      circle(x, y - 20, 7, '#f2c894', true);
      ctx.beginPath(); ctx.arc(x, y - 21, 8.5, Math.PI * 0.95, Math.PI * 2.05);
      ctx.lineWidth = 4; ctx.strokeStyle = '#3e2723'; ctx.stroke();
      // bow (vertical, pointing down-field)
      var bowX = x + 13, topY = y - 26, botY = y + 2;
      var flex = 3 + prog * 4;
      ctx.beginPath(); ctx.moveTo(bowX - flex, topY);
      ctx.quadraticCurveTo(bowX + 6, (topY + botY) / 2, bowX - flex, botY);
      ctx.lineWidth = 3; ctx.strokeStyle = '#6d4c41'; ctx.stroke();
      // string
      var pull = prog * 7;
      ctx.beginPath(); ctx.moveTo(bowX - flex, topY); ctx.lineTo(bowX - flex - pull, (topY + botY) / 2); ctx.lineTo(bowX - flex, botY);
      ctx.lineWidth = 1.4; ctx.strokeStyle = '#16130e'; ctx.stroke();
      // nocked arrow during draw — its pitch telegraphs the trajectory
      if (draw){
        var colr = draw.type === 'fire' ? '#ff6d00' : draw.type === 'heavy' ? '#37474f' : draw.type === 'low' ? '#2e7d32' : '#8d6e63';
        var aimAng = draw.traj === 'high' ? -0.5 : draw.traj === 'short' ? 0.42 : draw.traj === 'lob' ? -0.85 : draw.traj === 'skim' ? 0.12 : 0;
        ctx.save();
        ctx.translate(bowX - flex - pull, (topY + botY) / 2);
        ctx.rotate(aimAng);
        ctx.strokeStyle = colr; ctx.lineWidth = draw.type === 'heavy' ? 4 : 2.5;
        ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(0, 16); ctx.stroke();
        if (draw.type === 'fire') circle(0, 17, 3.5 + Math.random() * 1.5, '#ff9f45', false);
        ctx.restore();
      }
    }

    function drawArrowShape(a){
      var x = laneX(a.lane) + (a.wob || 0) * W;
      var y = a.y * H;
      var s = clamp(H / 620, 0.7, 1.15);
      if (a.traj === 'high') ellipse(x, y + 18 * s, 10 * s, 3.5 * s, 'rgba(22,19,14,0.20)', false); // flies high: shadow below
      ctx.save(); ctx.translate(x, y);
      if (a.traj === 'high') ctx.scale(0.82, 0.82);
      if (a.type === 'low'){ ctx.rotate(0.12); }
      if (a.traj === 'skim'){ ctx.rotate(0.1); }
      if (a.traj === 'lob'){ var lp = clamp((a.y - SPAWN_Y) / (SPOUSE_Y - SPAWN_Y), 0, 1); ctx.rotate(-0.65 + lp * 1.25); }
      if (a.traj === 'short'){ ctx.rotate(clamp((a.y - 0.3) * 0.85, 0, 0.55)); }
      var len = (a.type === 'low' ? 26 : 38) * s;
      var shaft = a.type === 'heavy' ? '#4e342e' : a.type === 'fire' ? '#6d2c00' : '#8d6e63';
      ctx.strokeStyle = shaft; ctx.lineWidth = (a.type === 'heavy' ? 6 : 3.4) * s;
      ctx.beginPath(); ctx.moveTo(0, -len); ctx.lineTo(0, 0); ctx.stroke();
      // tip
      ctx.fillStyle = a.type === 'fire' ? '#ff6d00' : a.type === 'heavy' ? '#263238' : '#90a4ae';
      ctx.beginPath();
      var tw = (a.type === 'heavy' ? 11 : 7) * s;
      ctx.moveTo(-tw / 2, -2); ctx.lineTo(tw / 2, -2); ctx.lineTo(0, 10 * s); ctx.closePath(); ctx.fill();
      ctx.lineWidth = 1.6; ctx.strokeStyle = '#16130e'; ctx.stroke();
      // fletching
      ctx.fillStyle = a.type === 'low' ? '#43a047' : a.type === 'fire' ? '#ff9f45' : '#ef5350';
      ctx.beginPath();
      ctx.moveTo(0, -len); ctx.lineTo(-6 * s, -len + 9 * s); ctx.lineTo(0, -len + 6 * s);
      ctx.lineTo(6 * s, -len + 9 * s); ctx.closePath(); ctx.fill();
      // fire flame
      if (a.type === 'fire'){
        var fl = (a.y > BURN_Y ? 15 : 10) * s * (0.85 + Math.random() * 0.35);
        ctx.fillStyle = '#ff6d00';
        ctx.beginPath(); ctx.moveTo(-4 * s, 2); ctx.quadraticCurveTo(0, 4 + fl, 4 * s, 2); ctx.quadraticCurveTo(0, 8 * s, -4 * s, 2); ctx.fill();
        ctx.fillStyle = '#ffd23f';
        ctx.beginPath(); ctx.moveTo(-2 * s, 2); ctx.quadraticCurveTo(0, 3 + fl * 0.55, 2 * s, 2); ctx.quadraticCurveTo(0, 6 * s, -2 * s, 2); ctx.fill();
        if (Math.random() < 0.25) S.particles.push({ x: x + rnd(-3, 3), y: y + 6, vx: rnd(-12, 12), vy: rnd(10, 40), life: 0.3, t: 0, r: rnd(1.5, 3), color: '#ff9f45' });
      }
      if ((a.type === 'low' || a.traj === 'skim') && Math.random() < 0.3)
        S.particles.push({ x: x + rnd(-6, 6), y: y + 4, vx: rnd(-16, 16), vy: rnd(-24, -6), life: 0.35, t: 0, r: rnd(1.5, 3.2), color: '#a1887f' });
      ctx.restore();
    }

    function drawHay(hy){
      var x = laneX(hy.lane), y = hy.y * H;
      var s = clamp(H / 620, 0.7, 1.15);
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(hy.rot) * 0.25);
      ctx.fillStyle = '#ffd23f';
      ctx.strokeStyle = '#16130e'; ctx.lineWidth = 3;
      var w = 30 * s, h = 20 * s;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, 7); else ctx.rect(-w / 2, -h / 2, w, h);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-w / 6, -h / 2); ctx.lineTo(-w / 6, h / 2); ctx.moveTo(w / 6, -h / 2); ctx.lineTo(w / 6, h / 2); ctx.stroke();
      ctx.restore();
      // sparkle
      if (Math.random() < 0.2) S.particles.push({ x: x + rnd(-14, 14), y: y + rnd(-8, 8), vx: 0, vy: -18, life: 0.4, t: 0, r: 2, color: '#fff59d' });
    }

    function drawGoat(x, y, scale, opts){
      opts = opts || {};
      var stage = opts.stage || 0;
      var t = S.time;
      var bob = Math.sin(t * 2.2 + (opts.phase || 0)) * 2.2;
      var moving = Math.abs(S.goatTarget - S.goatPos) > 0.03 && !opts.spouse;
      var legSwing = moving ? Math.sin(t * 26) * 5 : 0;
      y += bob * (opts.spouse ? 0.6 : 1);
      var rx = (30 + stage * 11) * scale, ry = (24 + stage * 7) * scale;
      if (stage === 2) rx *= 1.18;
      var cream = opts.spouse ? '#fff1f6' : '#fff7ea';
      // legs
      ctx.strokeStyle = '#16130e'; ctx.lineWidth = 4.4 * scale; ctx.lineCap = 'round';
      var legY = y + ry * 0.78, legH = 13 * scale;
      [[-0.55, legSwing], [-0.2, -legSwing], [0.25, -legSwing], [0.6, legSwing]].forEach(function(L){
        ctx.beginPath(); ctx.moveTo(x + rx * L[0], legY - 3);
        ctx.lineTo(x + rx * L[0] + L[1] * 0.4, legY + legH); ctx.stroke();
      });
      ctx.lineCap = 'butt';
      // tail
      var wag = Math.sin(t * (opts.spouse ? 3 : 6)) * 0.3;
      ctx.save(); ctx.translate(x - rx * 0.95, y - ry * 0.3); ctx.rotate(-0.7 + wag);
      circle(0, 0, 6 * scale, cream, true); ctx.restore();
      // body fluff: scalloped bumps + clean core
      var bumps = 11;
      for (var i = 0; i < bumps; i++){
        var ang = i / bumps * Math.PI * 2;
        circle(x + Math.cos(ang) * rx * 0.8, y + Math.sin(ang) * ry * 0.8, Math.min(rx, ry) * 0.46, cream, true);
      }
      ellipse(x, y, rx * 0.94, ry * 0.94, cream, false);
      // stuck arrows in fluff (player only)
      if (!opts.spouse){
        S.stuck.forEach(function(st){
          var ax = x + Math.cos(st.ang) * rx * 0.9, ay = y + Math.sin(st.ang) * ry * 0.7;
          ctx.save(); ctx.translate(ax, ay); ctx.rotate(st.ang + Math.PI / 2);
          ctx.strokeStyle = st.type === 'heavy' ? '#4e342e' : '#8d6e63'; ctx.lineWidth = st.type === 'heavy' ? 4 : 2.6;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -st.len); ctx.stroke();
          ctx.fillStyle = '#ef5350';
          ctx.beginPath(); ctx.moveTo(0, -st.len); ctx.lineTo(-4, -st.len + 7); ctx.lineTo(4, -st.len + 7); ctx.closePath(); ctx.fill();
          ctx.restore();
        });
      }
      // heart patch (player chest)
      if (!opts.spouse) heartPath(x, y + ry * 0.28, 8.5 * scale, '#ff8fab');
      // head
      var hx = x, hy2 = y - ry - 11 * scale;
      // horns
      ctx.strokeStyle = '#d7a86c'; ctx.lineWidth = 5 * scale; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx - 9 * scale, hy2 - 6 * scale); ctx.quadraticCurveTo(hx - 17 * scale, hy2 - 16 * scale, hx - 10 * scale, hy2 - 20 * scale); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx + 9 * scale, hy2 - 6 * scale); ctx.quadraticCurveTo(hx + 17 * scale, hy2 - 16 * scale, hx + 10 * scale, hy2 - 20 * scale); ctx.stroke();
      ctx.lineCap = 'butt';
      // ears
      ellipse(hx - 15 * scale, hy2 - 2 * scale, 7 * scale, 4 * scale, cream, true, 0.5);
      ellipse(hx + 15 * scale, hy2 - 2 * scale, 7 * scale, 4 * scale, cream, true, -0.5);
      circle(hx, hy2, 14.5 * scale, cream, true);
      // snout
      ellipse(hx, hy2 + 6.5 * scale, 8 * scale, 5.5 * scale, '#ffe3d3', true);
      circle(hx - 2.6 * scale, hy2 + 5.5 * scale, 1.1 * scale, '#16130e', false);
      circle(hx + 2.6 * scale, hy2 + 5.5 * scale, 1.1 * scale, '#16130e', false);
      // beard
      ctx.fillStyle = cream; ctx.strokeStyle = '#16130e'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(hx - 4 * scale, hy2 + 10 * scale); ctx.lineTo(hx + 4 * scale, hy2 + 10 * scale); ctx.lineTo(hx, hy2 + 17 * scale); ctx.closePath(); ctx.fill(); ctx.stroke();
      // eyes
      var hurt = opts.spouse ? S.spouseHurtT > 0 : S.goatHurtT > 0;
      var dizzy = !opts.spouse && S.goatStun > 0;
      ctx.strokeStyle = '#16130e'; ctx.fillStyle = '#16130e'; ctx.lineWidth = 1.8 * scale;
      if (hurt || dizzy){
        [[-6, -2], [6, -2]].forEach(function(E){
          var ex = hx + E[0] * scale, ey = hy2 + E[1] * scale;
          ctx.beginPath();
          ctx.moveTo(ex - 2.6 * scale, ey - 2.6 * scale); ctx.lineTo(ex + 2.6 * scale, ey + 2.6 * scale);
          ctx.moveTo(ex + 2.6 * scale, ey - 2.6 * scale); ctx.lineTo(ex - 2.6 * scale, ey + 2.6 * scale);
          ctx.stroke();
        });
      } else {
        var blink = (Math.sin(t * 0.7 + (opts.phase || 0)) > 0.985);
        if (blink){ ctx.beginPath(); ctx.moveTo(hx - 8.5 * scale, hy2 - 2 * scale); ctx.lineTo(hx - 3.5 * scale, hy2 - 2 * scale); ctx.moveTo(hx + 3.5 * scale, hy2 - 2 * scale); ctx.lineTo(hx + 8.5 * scale, hy2 - 2 * scale); ctx.stroke(); }
        else { circle(hx - 6 * scale, hy2 - 2 * scale, 1.9 * scale, '#16130e', false); circle(hx + 6 * scale, hy2 - 2 * scale, 1.9 * scale, '#16130e', false); }
      }
      // spouse extras: bow + cheeks + lashes
      if (opts.spouse){
        ctx.fillStyle = 'rgba(255,120,160,0.55)';
        circle(hx - 10.5 * scale, hy2 + 3.5 * scale, 3 * scale, 'rgba(255,120,160,0.55)', false);
        circle(hx + 10.5 * scale, hy2 + 3.5 * scale, 3 * scale, 'rgba(255,120,160,0.55)', false);
        var bx = hx + 10 * scale, by = hy2 - 13 * scale;
        ctx.fillStyle = '#ff4d6d'; ctx.strokeStyle = '#16130e'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - 8 * scale, by - 5 * scale); ctx.lineTo(bx - 7 * scale, by + 4 * scale); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 8 * scale, by - 5 * scale); ctx.lineTo(bx + 7 * scale, by + 4 * scale); ctx.closePath(); ctx.fill(); ctx.stroke();
        circle(bx, by, 2.6 * scale, '#ff4d6d', true);
      }
      return { x: x, y: y, rx: rx, ry: ry };
    }

    function draw(){
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (S.shake > 0) ctx.translate(rnd(-S.shake, S.shake), rnd(-S.shake, S.shake));
      drawScene();
      drawPreviews();
      for (var i = 0; i < 3; i++){
        var d = null;
        for (var j = 0; j < S.draws.length; j++) if (S.draws[j].lane === i) d = S.draws[j];
        drawArcher(i, d);
      }
      S.hayItems.forEach(drawHay);
      S.arrows.forEach(drawArrowShape);
      // spouse
      var spX = laneX(1) + Math.sin(S.time * 0.45) * W * 0.05;
      drawGoat(spX, SPOUSE_Y * H - 12, clamp(W / 430, 0.62, 0.85), { spouse: true, phase: 2.2, stage: 1 });
      if (S.spouseHurtT <= 0 && Math.sin(S.time * 0.9) > 0.93) heartPath(spX + 20, SPOUSE_Y * H - 52, 6, '#ff8fab');
      // player goat
      var gx = laneX(S.goatPos);
      var squash = Math.abs(S.goatTarget - S.goatPos) > 0.03 ? 1.06 : 1;
      drawGoat(gx, goatYF() * H, clamp(W / 430, 0.8, 1.05) * squash, { stage: S.stage, phase: 0 });
      // coverage hint at mega fluff
      if (S.stage === 2 && (S.mode === 'play')){
        ctx.fillStyle = 'rgba(255,210,63,0.10)';
        var hw = coverHalf() * (W / 3);
        ctx.fillRect(gx - hw, goatYF() * H - 34, hw * 2, 76);
      }
      // particles
      S.particles.forEach(function(p){
        ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
        circle(p.x, p.y, p.r, p.color, false);
      });
      ctx.globalAlpha = 1;
      // floaters
      S.floaters.forEach(function(f){
        ctx.globalAlpha = clamp(1.4 - f.t / f.life, 0, 1);
        ctx.font = f.size + 'px Bungee, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 5; ctx.strokeStyle = '#fffdf4';
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
      });
      ctx.globalAlpha = 1;
    }

    // ---------- main loop ----------
    var lastT = performance.now();
    function loop(now){
      var rawDt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      var dt = rawDt * (S.slowmo > 0 ? 0.35 : 1);
      if (!S.paused) update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    // returning players keep their build: hearts + starting fluff from upgrades
    S.hearts = maxHearts();
    S.charges = fluffStartCharges();
    S.stage = stageOf(S.charges);
    renderShop();
    renderHUD();
    requestAnimationFrame(loop);
    </script>
  </body>
</html>
