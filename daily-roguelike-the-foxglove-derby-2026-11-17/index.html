<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Daily Roguelike — The Foxglove Derby</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#241b3a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100dvh;max-width:480px;margin:0 auto;padding:6px 8px;display:flex;flex-direction:column;gap:6px}
#app.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
/* top bar */
#topbar{flex:none;height:44px;display:flex;align-items:center;gap:6px;background:#1a1230;border:3px solid #0d0918;box-shadow:3px 3px 0 #0d0918;padding:0 8px}
#topbar .title{flex:1;font-weight:900;letter-spacing:1px;font-size:16px;color:#ffe9a8;white-space:nowrap;overflow:hidden}
.tbtn{background:#ffc93c;color:#14101f;border:2px solid #14101f;box-shadow:2px 2px 0 #14101f;font-weight:800;font-size:13px;padding:4px 8px;cursor:pointer;flex:none}
.tbtn:active{transform:translate(2px,2px);box-shadow:none}
/* HUD */
#hud{flex:none;height:40px;display:flex;align-items:center;gap:8px;background:#3b2d5c;border:3px solid #14101f;padding:0 8px}
#hud .lbl{font-size:12px;font-weight:900;color:#fff;flex:none}
#pursebar{flex:1;height:14px;background:#241b3a;border:2px solid #14101f;overflow:hidden}
#pursefill{height:100%;width:25%;background:linear-gradient(90deg,#ffc93c,#ff9d2e)}
#pursenum{font-size:14px;font-weight:900;color:#ffe9a8;flex:none}
#legpips{display:flex;gap:5px;align-items:center;flex:none}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid #b9a8e8;background:transparent}
.pip.now{background:#ffc93c;border-color:#ffc93c}
.pip.done{background:#7ee081;border-color:#7ee081}
#leglbl{font-size:12px;font-weight:900;color:#fff;flex:none}
/* track */
#track{flex:1 1 auto;min-height:0;position:relative;background:#463672;border:3px solid #14101f;overflow:hidden}
.lane{position:relative;height:33.333%;border-bottom:2px dashed rgba(255,255,255,.28)}
.lane:last-child{border-bottom:none}
.lane .lname{position:absolute;left:5px;top:2px;font-size:10px;font-weight:800;color:#e8ddff;z-index:2}
.startline{position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,#fff 0 8px,#14101f 8px 16px);z-index:2}
.finishline{position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(180deg,#fff 0 8px,#14101f 8px 16px);z-index:2}
.racer{position:absolute;width:58px;height:46px;z-index:3;will-change:left}
.racer svg{width:58px;height:46px;display:block}
.racer .bob{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.racer.wobble .bob{animation:wob .18s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-9deg) translateY(0)}to{transform:rotate(9deg) translateY(-3px)}}
.racer .tell{position:absolute;left:18px;top:-16px;font-size:16px;font-weight:900;color:#ffe9a8;text-shadow:2px 2px 0 #14101f;display:none}
.racer .streaks{position:absolute;left:-14px;top:14px;display:none}
.racer .streaks i{display:block;width:14px;height:3px;background:#9be8ff;margin:3px 0;box-shadow:1px 1px 0 #14101f}
.racer.charging .streaks{display:block}
.racer.charging .tell{display:block}
.racer.wobble .tell{display:block}
.racer.in-fog{opacity:0}
#fog{position:absolute;left:33%;width:34%;top:0;bottom:0;z-index:4;pointer-events:none;display:none;
 background:linear-gradient(90deg,rgba(226,226,240,0),rgba(226,226,240,.93) 18%,rgba(226,226,240,.93) 82%,rgba(226,226,240,0));
 animation:fogdrift 5s ease-in-out infinite alternate}
@keyframes fogdrift{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
#fog .fogtag{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:#fff;color:#14101f;font-size:10px;font-weight:900;padding:1px 6px;border:2px solid #14101f}
/* cards */
#cards{flex:none;height:138px;display:flex;gap:6px}
.card{flex:1;min-width:0;border:3px solid #14101f;box-shadow:3px 3px 0 #14101f;padding:3px 2px 2px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;overflow:hidden;user-select:none}
.card.hare{background:#fff3d6}.card.tortoise{background:#d9f7d9}.card.fox{background:#ffe0cc}
.card svg{height:50px;width:76px;flex:none}
.card .cname{font-size:12px;font-weight:900;color:#14101f;line-height:1.1}
.card .codds{font-size:16px;font-weight:900;color:#14101f;line-height:1.15}
.card .clive{font-size:10px;font-weight:800;color:#5b21b6;line-height:1}
.card .stake{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#ffc93c;border:2px solid #14101f;color:#14101f;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card .star{position:absolute;top:3px;left:3px;font-size:15px;color:#14101f;display:none}
.card.backed .star{display:block}
.card.dim{opacity:.42;filter:saturate(.35)}
.card .csub{font-size:9px;font-weight:800;color:#14101f;opacity:.75}
/* action row */
#actionrow{flex:none;height:52px;display:flex;gap:8px;align-items:center}
#hint{flex:1;font-size:13px;font-weight:700;color:#ffe9a8;min-width:0}
#racebtn{background:#ff5da2;color:#14101f;border:3px solid #14101f;box-shadow:3px 3px 0 #14101f;font-size:18px;font-weight:900;padding:8px 16px;cursor:pointer;flex:none}
#racebtn:active{transform:translate(3px,3px);box-shadow:none}
#racebtn:disabled{background:#3f3a55;color:#fff;box-shadow:none;cursor:default}
/* overlay */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,8,32,.78);z-index:50;padding:16px}
#overlay.hidden{display:none}
#ocard{width:min(330px,92vw);max-height:86dvh;overflow:hidden;background:#fff3d6;color:#14101f;border:3px solid #14101f;box-shadow:8px 8px 0 #14101f;padding:16px;text-align:center}
#ocard .otitle{font-size:20px;font-weight:900;margin-bottom:8px;line-height:1.15}
#ocard .obody{font-size:15px;line-height:1.4}
#ocard .obody .line{margin-bottom:6px}
#ocard .obody .line:last-child{margin-bottom:0}
#ocard .obtn{margin-top:14px;background:#ff5da2;color:#14101f;border:3px solid #14101f;box-shadow:3px 3px 0 #14101f;font-size:16px;font-weight:900;padding:9px 20px;cursor:pointer}
#ocard .obtn:active{transform:translate(3px,3px);box-shadow:none}
#ocard .lawlist{text-align:left;font-size:14px;line-height:1.45}
#ocard .lawlist .law{margin-bottom:8px}
#ocard .lawlist .law b{display:block}
#flash{position:fixed;inset:0;background:rgba(255,40,60,.32);opacity:0;pointer-events:none;z-index:60}
#flash.go{animation:flash .5s}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.cf{position:fixed;width:10px;height:14px;z-index:70;pointer-events:none;animation:cfall 1.6s ease-in forwards}
@keyframes cfall{from{transform:translateY(0) rotate(0)}to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
@media (max-width:430px){
  #topbar .title{font-size:14px}
  .tbtn{font-size:12px;padding:3px 6px}
  #hint{font-size:12px}
}
</style>
</head>

<script>
'use strict';
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ============ audio (WebAudio, try/catch, mute toggle) ============ */
let AC=null, muted=false;
function beep(f,d,type,g){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.value=f;gn.gain.value=g||0.06;o.connect(gn);gn.connect(AC.destination);o.start();gn.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function sfx(n){if(muted)return;try{
  if(n==='tap')beep(600,0.06,'square',0.05);
  else if(n==='coin'){beep(880,0.07,'square',0.06);setTimeout(()=>beep(1320,0.09,'square',0.06),70);}
  else if(n==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.14,'square',0.07),i*90));}
  else if(n==='lose'){beep(160,0.35,'sawtooth',0.08);setTimeout(()=>beep(110,0.4,'sawtooth',0.08),160);}
  else if(n==='go')beep(440,0.1,'square',0.06);
}catch(e){}}
/* ============ race model (shared by game + Monte Carlo) ============ */
/* Bases calibrated so equal-form racers finish ~17s: tortoise steady, hare pays
   2 stumbles, fox gains 1 burst. Form spread is narrow (1.15/1.00/0.87) and each
   racer draws a per-race pace jitter, so form hints but never decides: the hot
   racer wins ~55%, mid ~30%, cold ~15% (see Monte Carlo), matching gate odds. */
const RACERS=[{id:'hare',name:'HARE',base:6.94},{id:'tortoise',name:'TORTOISE',base:5.9},{id:'fox',name:'FOX',base:5.5}];
const FORM_S={hot:1.05,mid:1.00,cold:0.95};
const GATE={hot:2,mid:3,cold:6};
const LIVE=[2,4,8]; // leader, middle, trailer — trailer pays more than the gate
// cold (6:1) because a trailer mid-race is a worse position than a cold gate
const TRACK=100, STUMBLE_DUR=1.3, BURST_DUR=1.3, BURST_X=1.9, TELL_LEAD=1.0;
function shuffle(a,rng){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildRace(leg,rng,forceWinner,forceForm){
  const order=shuffle(['hot','mid','cold'],rng);
  const form={};RACERS.forEach((r,i)=>form[r.id]=order[i]);
  if(forceWinner){
    // Forced winner keeps a big strength edge; its form is settable so the probe
    // can force a cold (6:1) winner. Other racers take the remaining forms.
    const wf=forceForm||'hot';form[forceWinner]=wf;
    const rest=shuffle(['hot','mid','cold'].filter(f=>f!==wf),rng);
    RACERS.filter(r=>r.id!==forceWinner).forEach((r,i)=>form[r.id]=rest[i]);
  }
  const ev={hare:[],tortoise:[],fox:[]};
  // Hare stumbles 1-3 times (37.5/50/12.5), times spread with a 2.5s min gap.
  const nSt=1+(rng()<0.5?1:0)+(rng()<0.25?1:0);
  let st=3.5+rng()*3; for(let i=0;i<nSt;i++){ev.hare.push({t:st,kind:'stop'});st=Math.min(st+2.5+rng()*3,14);}
  // Tortoise sometimes stops for a snack (1.3s), 50% of races.
  if(rng()<0.5)ev.tortoise.push({t:4+rng()*9,kind:'stop'});
  // Fox bursts: 0-2 in legs 1-2, exactly 2 in leg 3 (THE FOX CHEATS).
  const nb=leg>=3?2:(rng()<0.25?0:(rng()<0.67?1:2));
  let bt=3.5+rng()*4; for(let i=0;i<nb;i++){ev.fox.push({t:bt,kind:'boost'});bt=Math.min(bt+3+rng()*3.5,15);}
  if(forceWinner==='hare'){ev.hare=[];ev.tortoise=[];} // forced winner runs clean
  if(forceWinner==='fox'){ev.fox.push({t:5+rng()*4,kind:'boost'});}
  // Per-race pace jitter: each racer's true pace varies ±14% around its form.
  const jit={};RACERS.forEach(r=>jit[r.id]=0.86+rng()*0.28);
  const segs={},fin={};
  for(const r of RACERS){
    const S=FORM_S[form[r.id]]*jit[r.id]*(forceWinner?(r.id===forceWinner?1.55:0.55):1);
    const b=r.base*S, list=[];
    let cur=0,sp=b;
    const events=ev[r.id].slice().sort((x,y)=>x.t-y.t);
    for(const e of events){list.push([cur,e.t,sp]);const ns=e.kind==='stop'?0:b*BURST_X;list.push([e.t,e.t+(e.kind==='stop'?STUMBLE_DUR:BURST_DUR),ns]);cur=e.t+(e.kind==='stop'?STUMBLE_DUR:BURST_DUR);sp=b;}
    list.push([cur,300,sp]);segs[r.id]=list;
    let d=0,ft=300;
    for(const [a,c,s] of list){const need=TRACK-d;if(s<=0){continue;}const dt=need/s;if(a+dt<=c){ft=a+dt;d=TRACK;break;}d+=s*(c-a);}
    fin[r.id]=ft;
  }
  let winner=RACERS[0].id;for(const r of RACERS)if(fin[r.id]<fin[winner])winner=r.id;
  return {leg,form,ev,segs,fin,winner,jit};
}
function posAt(race,id,t){let p=0;for(const [a,c,s] of race.segs[id]){if(t<=a)break;p+=s*(Math.min(t,c)-a);if(t<=c)break;}return Math.min(p,TRACK);}
function speedAt(race,id,t){for(const [a,c,s] of race.segs[id]){if(t>=a&&t<c)return s;}return 0;}
function liveOddsAt(race,t){const rank=RACERS.map(r=>r.id).sort((x,y)=>posAt(race,y,t)-posAt(race,x,t));const o={};rank.forEach((id,i)=>o[id]=LIVE[i]);return o;}
function tellAt(race,id,t){ // {wobble|charge} during telegraph window, else null
  for(const e of race.ev[id]){if(t>=e.t-TELL_LEAD&&t<e.t)return e.kind==='stop'?'wobble':'charge';}
  return null;
}
/* ============ Monte Carlo (same model) ============ */
function simRun(policy,rng,stats){
  const skilled=policy.indexOf('skilled')===0;
  const aggro=policy.indexOf('aggro')===0;
  const tSw=policy==='skilled8'?8:policy==='skilled11'||policy==='aggro11'?11:10; // switch time (s)
  let purse=10;
  for(let leg=1;leg<=3;leg++){
    const race=buildRace(leg,rng);
    if(stats){for(const r of RACERS){stats.formN[race.form[r.id]]++;if(r.id===race.winner)stats.formWin[race.form[r.id]]++;}}
    const gate={};for(const r of RACERS)gate[r.id]=GATE[race.form[r.id]];
    // backed: array of {id, stake, odds}; `left` tracks the purse as stakes are placed
    let backed=[];let left=purse;
    if(aggro){
      // All-in: 5 on mid, 5 on cold, 5 on hot (as far as the purse reaches), then
      // the one switch consolidates everything onto the best read.
      for(const f of ['mid','cold','hot']){const r=RACERS.find(x=>race.form[x.id]===f);if(left>0){const s=Math.min(5,left);left-=s;backed.push({id:r.id,stake:s,odds:gate[r.id]});}}
    }
    else if(skilled){
      for(const r of RACERS)if(race.form[r.id]==='mid'){const s=Math.min(5,left);left-=s;backed.push({id:r.id,stake:s,odds:gate[r.id]});}
      if(purse>=20){ // bankroll allows a hedge: 5 on mid + 5 on cold, switch consolidates
        for(const r of RACERS)if(race.form[r.id]==='cold'&&left>=5){left-=5;backed.push({id:r.id,stake:5,odds:gate[r.id]});}
      }
      if(purse>=30){ // big bankroll: 5 on all three, one confident read wins the run
        for(const r of RACERS)if(race.form[r.id]==='hot'&&left>=5){left-=5;backed.push({id:r.id,stake:5,odds:gate[r.id]});}
      }
    }else{
      // blind: 5 gold on each of two random racers, never switches
      const ids=shuffle(RACERS.map(r=>r.id),rng).slice(0,2);
      for(const id of ids){if(left<=0)break;const s=Math.min(5,left);left-=s;backed.push({id,stake:s,odds:gate[id]});}
    }
    let stake=0;for(const b of backed)stake+=b.stake;
    purse-=stake;
    if(skilled||aggro){
      // Tell-aware projection: a human reads the pace tells. Recent speed, recovered
      // from a mid-stumble lull; wobble = a stop is coming (+1.3s); charge = a burst
      // is coming (-1.1s). Projected winner = min projected finish.
      const t=tSw;let best=null,bestT=1e9;
      for(const r of RACERS){
        const p1=posAt(race,r.id,t),p0=posAt(race,r.id,t-2);
        const vRec=Math.max((p1-p0)/2,0.4),vAvg=Math.max(p1/t,0.4);
        const v=Math.max(vRec,0.6*vAvg);
        let rem=(TRACK-p1)/v;
        const tell=tellAt(race,r.id,t);
        if(tell==='wobble')rem+=STUMBLE_DUR;
        if(tell==='charge')rem-=1.1;
        const ft=t+Math.max(rem,0.5);
        if(ft<bestT){bestT=ft;best=r.id;}
      }
      const live=liveOddsAt(race,t);
      const sole=backed.length===1?backed[0].id:null;
      if(best!==sole){ // switch whole stake: to an unbacked read, or consolidate a split stake
        backed=[{id:best,stake,odds:live[best]}];
      }
    }
    for(const b of backed)if(b.id===race.winner)purse+=b.stake*b.odds;
    if(purse<=0)return{final:purse,bust:true,win:false};
    if(purse>=40)return{final:purse,bust:false,win:true};
  }
  return{final:purse,bust:purse<=0,win:purse>=40};
}
function monteCarlo(policy,n,seed){
  const rng=mulberry32(seed||12345);let win=0,bust=0;const finals=[];const formWin={hot:0,mid:0,cold:0},formN={hot:0,mid:0,cold:0};
  for(let i=0;i<n;i++){const r=simRun(policy,rng,{formWin,formN});if(r.win)win++;if(r.bust)bust++;finals.push(r.final);}
  finals.sort((a,b)=>a-b);
  return{policy,n,winPct:+(100*win/n).toFixed(1),bustPct:+(100*bust/n).toFixed(1),medianFinal:finals[Math.floor(n/2)],
    formWinRate:{hot:+(formWin.hot/Math.max(1,formN.hot)).toFixed(3),mid:+(formWin.mid/Math.max(1,formN.mid)).toFixed(3),cold:+(formWin.cold/Math.max(1,formN.cold)).toFixed(3)},
    formRaces:formN};
}
/* ============ game state ============ */
const KEEPERS={1:'MOLE',2:'BADGER',3:'OWL'};
const LAWS={
  2:{name:'FOG',text:'The middle of the track hides in fog. Racers vanish there.'},
  3:{name:'THE FOX CHEATS',text:'The Fox bursts twice per race.'}
};
const G={phase:'story',storyIdx:0,leg:1,purse:10,stakes:{hare:0,tortoise:0,fox:0},locked:{},gate:{hare:3,tortoise:3,fox:3},
  race:null,clock:0,switchUsed:false,forced:null,timeScale:1,raf:0,lastTs:0,laws:[],flags:{bet:false,sw:false},overlayId:null,overlaySeq:[]};
const totalStaked=()=>G.stakes.hare+G.stakes.tortoise+G.stakes.fox;
const wealth=()=>G.purse+totalStaked();
/* ============ overlay (one at a time) ============ */
function showOverlay(id,title,lines,btn,onBtn,isLawList){
  G.overlayId=id;G.overlaySeq.push(id);
  const oc=$('#ocard');
  oc.innerHTML='';
  const t=document.createElement('div');t.className='otitle';t.textContent=title;oc.appendChild(t);
  if(isLawList){
    const l=document.createElement('div');l.className='obody lawlist';
    if(!G.laws.length){const d=document.createElement('div');d.className='law';d.textContent='No laws yet. The wood is quiet.';l.appendChild(d);}
    for(const law of G.laws){const d=document.createElement('div');d.className='law';const b=document.createElement('b');b.textContent=law.name;const s=document.createElement('span');s.textContent=law.text;d.appendChild(b);d.appendChild(s);l.appendChild(d);}
    const h=document.createElement('div');h.className='law';h.textContent='How to play: Tap a racer to put 1 gold on them, tap RACE, then tap a racer once mid-race to move your whole stake.';l.appendChild(h);
    oc.appendChild(l);
  }else{
    const b=document.createElement('div');b.className='obody';
    for(const ln of lines){const d=document.createElement('div');d.className='line';d.textContent=ln;b.appendChild(d);}
    oc.appendChild(b);
  }
  const bt=document.createElement('button');bt.className='obtn';bt.type='button';bt.textContent=btn;
  bt.addEventListener('click',()=>{sfx('tap');hideOverlay();if(onBtn)onBtn();});
  oc.appendChild(bt);
  $('#overlay').classList.remove('hidden');
}
function hideOverlay(){G.overlayId=null;$('#overlay').classList.add('hidden');}
const overlayUp=()=>G.overlayId!==null;
/* ============ render ============ */
function render(){
  $('#pursenum').textContent=wealth()+'/40';
  $('#pursefill').style.width=Math.min(100,wealth()/40*100)+'%';
  $('#leglbl').textContent='LEG '+G.leg;
  $$('#legpips .pip').forEach(p=>{const n=+p.dataset.leg;p.className='pip'+(n<G.leg?' done':n===G.leg?' now':'');});
  const racing=G.phase==='race';
  for(const r of RACERS){
    const card=$(`.card[data-racer="${r.id}"]`);
    const oddsEl=card.querySelector('.codds');
    if(racing&&G.race){oddsEl.textContent=liveOddsAt(G.race,G.clock)[r.id]+':1';card.querySelector('.clive').textContent='LIVE';}
    else if(G.race){oddsEl.textContent=G.gate[r.id]+':1';card.querySelector('.clive').textContent='GATE';}
    else{oddsEl.textContent='—';card.querySelector('.clive').textContent='';} // no leg drawn yet: no placeholder odds
    card.querySelector('.stake').textContent=G.stakes[r.id];
    card.classList.toggle('backed',G.stakes[r.id]>0);
    card.classList.toggle('dim',racing&&G.switchUsed);
    card.querySelector('.csub').textContent=racing?(G.switchUsed?'SWITCH USED':'TAP TO SWITCH'):'TAP TO BET 1';
  }
  const rb=$('#racebtn');
  if(G.phase==='bet'){rb.disabled=totalStaked()<1;rb.textContent='RACE';$('#hint').textContent=totalStaked()<1?'TAP A RACER TO BET':'TAP RACE TO RUN';}
  else if(racing){rb.disabled=true;rb.textContent='RACING…';$('#hint').textContent=G.switchUsed?'SWITCH USED':'TAP A CARD: SWITCH';}
  else{rb.disabled=true;rb.textContent='RACE';$('#hint').textContent='';}
  $('#fog').style.display=(G.leg===2&&G.phase!=='story')?'block':'none';
}
/* ============ flow ============ */
const STORY=[
  'Midnight in the foxglove wood. Three racers — Hare, Tortoise, Fox — run for the Hollow\'s purse, and the forest\'s bookkeepers take the bets.',
  'You hold the book tonight. Three legs, three bookkeepers, one purse. Back the right racers — or the wood keeps your gold.'
];
const HOWTO='Tap a racer to put 1 gold on them, tap RACE, then tap a racer once mid-race to move your whole stake.';
function startGame(){
  G.phase='story';G.storyIdx=0;
  showOverlay('story1','MIDNIGHT',[STORY[0]],'NEXT',()=>{
    G.storyIdx=1;
    showOverlay('story2','THE BOOK',[STORY[1]],'START',()=>{
      showOverlay('howto','HOW TO PLAY',[HOWTO],'PLAY',()=>{legIntro(1);});
    });
  });
}
function legIntro(leg){
  G.leg=leg;G.phase='bet';G.stakes={hare:0,tortoise:0,fox:0};G.locked={};G.switchUsed=false;G.clock=0;
  // ONE race object per leg, built here: gate odds shown in BET come from this same race,
  // so the odds locked at bet time are the odds the race pays. Never redrawn.
  G.race=buildRace(leg,Math.random,G.forced?G.forced.id:null,G.forced?G.forced.form:null);G.forced=null;
  G.gate={};for(const r of RACERS)G.gate[r.id]=GATE[G.race.form[r.id]];
  const lines=['LEG '+leg+' · '+KEEPERS[leg]+' KEEPS THE BOOK'];
  if(LAWS[leg]){G.laws.unshift({name:LAWS[leg].name,text:LAWS[leg].text});lines.push('NEW LAW — '+LAWS[leg].name+': '+LAWS[leg].text);}
  render();
  showOverlay('leg'+leg,'LEG '+leg,lines,'TO THE BETS',()=>{
    if(leg===1&&!G.flags.bet){
      G.flags.bet=true;
      showOverlay('spot-bet','PLACE YOUR BETS',['Tap a racer to put 1 gold on them.','Tap the gold number to take it back.'],'GOT IT',()=>{render();});
    }
    render();
  });
}
function placeBet(id){
  if(G.phase!=='bet'||overlayUp())return;
  if(G.stakes[id]>=5||G.purse<=0)return; // each tap moves 1 gold purse->stake; purse>0 is the only total guard
  G.stakes[id]++;G.purse--;G.locked[id]=G.gate[id];sfx('coin');render();
}
function removeBet(id,e){
  if(e)e.stopPropagation();
  if(G.phase!=='bet'||overlayUp())return;
  if(G.stakes[id]<=0)return;
  G.stakes[id]--;G.purse++;if(G.stakes[id]===0)delete G.locked[id];sfx('tap');render();
}
function startRace(){
  if(G.phase!=='bet'||totalStaked()<1||overlayUp())return;
  G.phase='race';
  // G.race was built in legIntro; locked odds stay exactly as set at bet time.
  G.clock=0;G.switchUsed=false;
  render();sfx('go');
  if(G.leg===1&&!G.flags.sw){
    G.flags.sw=true;
    showOverlay('spot-switch','THE SWITCH',['Once per race, tap a different racer to move your whole stake to them at their live odds.'],'RACE ON',()=>{beginClock();});
  }else beginClock();
}
function beginClock(){G.lastTs=performance.now();cancelAnimationFrame(G.raf);G.raf=requestAnimationFrame(tick);}
function tick(ts){
  if(G.phase!=='race')return;
  const dt=Math.min(0.1,(ts-G.lastTs)/1000)*G.timeScale;G.lastTs=ts;G.clock+=dt;
  const race=G.race;
  for(const r of RACERS){
    const el=$('#r-'+r.id);const p=posAt(race,r.id,G.clock);
    el.style.left='calc('+(p*0.88).toFixed(2)+'% + 4px)';
    const tell=tellAt(race,r.id,G.clock);
    el.classList.toggle('wobble',tell==='wobble');
    el.classList.toggle('charging',tell==='charge');
    el.querySelector('.tell').textContent=r.id==='fox'?'⚡':'!';
    el.classList.toggle('in-fog',G.leg===2&&p>=33&&p<=66);
  }
  // live odds refresh (cheap: update text only)
  for(const r of RACERS){const c=$(`.card[data-racer="${r.id}"] .codds`);c.textContent=liveOddsAt(race,G.clock)[r.id]+':1';}
  if(G.clock>=race.fin[race.winner]){finishRace();return;}
  G.raf=requestAnimationFrame(tick);
}
function switchTo(id){
  if(G.phase!=='race'||overlayUp()||G.switchUsed)return;
  const backed=RACERS.filter(r=>G.stakes[r.id]>0).map(r=>r.id);
  if(backed.length===1&&backed[0]===id)return;
  const total=totalStaked();if(total<1)return;
  const live=liveOddsAt(G.race,G.clock)[id];
  G.stakes={hare:0,tortoise:0,fox:0};G.stakes[id]=total;G.locked={};G.locked[id]=live;
  G.switchUsed=true;sfx('coin');render();
}
function finishRace(){
  cancelAnimationFrame(G.raf);
  const race=G.race,winner=race.winner;
  const winAmt=G.stakes[winner]>0?G.stakes[winner]*G.locked[winner]:0;
  const staked=totalStaked();
  if(winAmt>0){G.purse+=winAmt;sfx('win');confetti();}
  else if(staked>0){sfx('lose');const app=$('#app');app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');const fl=$('#flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');}
  G.stakes={hare:0,tortoise:0,fox:0};G.locked={};
  const w=wealth();
  const wname=RACERS.find(r=>r.id===winner).name;
  const lines=[wname+' WINS',winAmt>0?('YOU WIN '+winAmt+' GOLD'):('NO PAYOUT — '+staked+' GOLD LOST'),'PURSE '+w+'/40'];
  render();
  if(w>=40){G.phase='win';showOverlay('win','THE BOOK BALANCES',lines.concat(['The Hollow pays out. The book balances.']),'PLAY AGAIN',()=>retry());}
  else if(w<=0){G.phase='lose';showOverlay('lose','THE WOOD KEEPS YOUR GOLD',lines.concat(['Your purse is empty.']),'RETRY',()=>retry());}
  else if(G.leg>=3){G.phase='lose';showOverlay('lose','SHORT OF THE MARK',lines.concat(['The book needed 40 gold.']),'RETRY',()=>retry());}
  else{G.phase='legEnd';showOverlay('legend','LEG '+G.leg+' DONE',lines,'NEXT LEG',()=>legIntro(G.leg+1));}
}
function retry(){
  G.phase='story';G.leg=1;G.purse=10;G.stakes={hare:0,tortoise:0,fox:0};G.locked={};G.switchUsed=false;
  G.race=null;G.clock=0;G.laws=[];G.flags={bet:false,sw:false};G.forced=null;
  for(const r of RACERS){const el=$('#r-'+r.id);el.style.left='4px';el.classList.remove('wobble','charging','in-fog');}
  render();startGame();
}
function openLaws(){
  if(overlayUp())return;
  showOverlay('laws','LAWS',[],'CLOSE',null,true);
}
function confetti(){
  const colors=['#ffc93c','#ff5da2','#7ee081','#9be8ff','#ff8c42','#b9a8e8'];
  for(let i=0;i<40;i++){const d=document.createElement('div');d.className='cf';d.style.left=(Math.random()*100)+'vw';d.style.top='-20px';d.style.background=colors[i%colors.length];d.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
}
/* ============ input ============ */
$$('.card').forEach(c=>{
  c.addEventListener('click',()=>{
    if(G.phase==='bet')placeBet(c.dataset.racer);
    else if(G.phase==='race')switchTo(c.dataset.racer);
  });
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(G.phase==='bet')placeBet(c.dataset.racer);else if(G.phase==='race')switchTo(c.dataset.racer);}});
});
$$('.card .stake').forEach(b=>b.addEventListener('click',e=>removeBet(b.dataset.racer,e)));
$('#racebtn').addEventListener('click',()=>{if(G.phase==='bet')startRace();});
$('#lawsbtn').addEventListener('click',openLaws);
$('#soundbtn').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';});
document.addEventListener('keydown',e=>{
  if(overlayUp()){if(e.key==='Enter'||e.key===' '){e.preventDefault();const b=$('#ocard .obtn');if(b)b.click();}return;}
  const idx=['hare','tortoise','fox'];
  if(e.key>='1'&&e.key<='3'){const id=idx[+e.key-1];if(G.phase==='bet')placeBet(id);else if(G.phase==='race')switchTo(id);}
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(G.phase==='bet')startRace();}
  else if(e.key==='l'||e.key==='L')openLaws();
});
/* ============ probe hooks ============ */
/* Diagnostic: per-leg switch accuracy + oracle (perfect-read) ceiling, for tuning. */
function diagnose(n,seed,tSw){
  const rng=mulberry32(seed||777);let legs=0,switched=0,swRight=0,holdWin=0,holdN=0,oracleWin=0,oracleRuns=0;
  let projRight=0,projN=0;
  const t=tSw||10;
  for(let i=0;i<n;i++){
    let purse=10,orPurse=10,alive=true,orAlive=true;
    for(let leg=1;leg<=3;leg++){
      const race=buildRace(leg,rng);
      const gate={};for(const r of RACERS)gate[r.id]=GATE[race.form[r.id]];
      const midId=RACERS.find(r=>race.form[r.id]==='mid').id;
      // skilled leg
      let stake=Math.min(5,purse);purse-=stake;let backed=midId,odds=gate[midId];
      let best=null,bestT=1e9;
      for(const r of RACERS){
        const p1=posAt(race,r.id,t),p0=posAt(race,r.id,t-2);
        const v=Math.max(Math.max((p1-p0)/2,0.4),0.6*Math.max(p1/t,0.4));
        let rem=(TRACK-p1)/v;const tell=tellAt(race,r.id,t);
        if(tell==='wobble')rem+=STUMBLE_DUR;if(tell==='charge')rem-=1.1;
        const ft=t+Math.max(rem,0.5);if(ft<bestT){bestT=ft;best=r.id;}
      }
      projN++;if(best===race.winner)projRight++;
      const live=liveOddsAt(race,t);legs++;
      if(best!==backed){switched++;if(best===race.winner)swRight++;backed=best;odds=live[best];}
      else{holdN++;if(backed===race.winner)holdWin++;}
      if(backed===race.winner)purse+=stake*odds;
      if(purse<=0){alive=false;break;} if(purse>=40)break;
      // oracle leg (same bet, perfect switch to true winner)
      let oStake=Math.min(5,orPurse);orPurse-=oStake;let oBacked=midId,oOdds=gate[midId];
      if(race.winner!==oBacked){oBacked=race.winner;oOdds=live[race.winner];}
      if(oBacked===race.winner)orPurse+=oStake*oOdds;
      if(orPurse<=0){orAlive=false;break;} if(orPurse>=40)break;
    }
    if(alive&&purse>=40)void 0;
    if(orAlive&&orPurse>=40)oracleWin++;
    oracleRuns++;
  }
  return{n,projAcc:+(projRight/projN).toFixed(3),switchRate:+(switched/legs).toFixed(3),
    switchWinRate:+(swRight/Math.max(1,switched)).toFixed(3),holdWinRate:+(holdWin/Math.max(1,holdN)).toFixed(3),
    oracleWinPct:+(100*oracleWin/oracleRuns).toFixed(1)};
}
window.__fd={
  state:()=>({phase:G.phase,overlay:G.overlayId,overlaySeq:G.overlaySeq.slice(),leg:G.leg,purse:G.purse,wealth:wealth(),
    stakes:Object.assign({},G.stakes),locked:Object.assign({},G.locked),gate:Object.assign({},G.gate),
    switchUsed:G.switchUsed,laws:G.laws.map(l=>l.name),clock:+G.clock.toFixed(2),
    winner:G.race?G.race.winner:null,form:G.race?Object.assign({},G.race.form):null,
    fin:G.race?Object.assign({},G.race.fin):null,
    live:(G.phase==='race'&&G.race)?liveOddsAt(G.race,G.clock):null,
    ev:G.race?{hare:G.race.ev.hare.length,tortoise:G.race.ev.tortoise.length,fox:G.race.ev.fox.length}:null,
    muted}),
  overlays:()=>G.overlayId?[G.overlayId]:[],
  forceWinner:(id,form)=>{G.forced={id,form:form||null};},
  setTimeScale:n=>{G.timeScale=n;},
  monteCarlo,diagnose,
  story:STORY.slice(),howto:HOWTO,
  laws:()=>G.laws.map(l=>({name:l.name,text:l.text}))
};
/* ============ boot ============ */
for(const r of RACERS){$('#r-'+r.id).style.left='4px';}
render();
startGame();
</script>
