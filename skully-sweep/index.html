<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skully Sweep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F0FF; --panel:#FFFFFF; --ink:#3B2A55; --muted:#6E5E8C; --line:#3B2A55;
  --pink:#FF8DBF; --mint:#7EE3C1; --butter:#FFD86B;
  --shadow:#3B2A55; --silhouette:#B7A9D6; --scrim:rgba(40,26,70,.42); --tint:rgba(255,141,191,.14);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1630; --panel:#2C2244; --ink:#F6EEFF; --muted:#C2B4DE; --line:#F6EEFF;
    --shadow:#FF8DBF; --silhouette:#54457A; --scrim:rgba(12,8,24,.55); --tint:rgba(255,141,191,.18); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1630; --panel:#2C2244; --ink:#F6EEFF; --muted:#C2B4DE; --line:#F6EEFF;
  --shadow:#FF8DBF; --silhouette:#54457A; --scrim:rgba(12,8,24,.55); --tint:rgba(255,141,191,.18); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Nunito","Segoe UI",system-ui,sans-serif;font-weight:500}
.bar{display:flex;align-items:center;gap:10px 16px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:"Mochiy Pop One","M PLUS Rounded 1c",system-ui,sans-serif;font-size:1.2rem}
.hud{flex:1;display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:4px 18px;font-weight:800;font-variant-numeric:tabular-nums}
.hud[hidden]{display:none}
.hud b{display:inline-block;font-family:"Mochiy Pop One",system-ui,sans-serif;font-weight:400;font-size:1.25rem;margin-left:4px}
.stat.hurry b{color:#E8457F}
.night{color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:8px}
.btn{font:inherit;font-weight:800;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:999px;
  padding:10px 20px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn[hidden]{display:none}
.btn.sm{padding:6px 14px;font-size:.9rem}
.btn.big{font-family:"Mochiy Pop One",system-ui,sans-serif;font-weight:400;font-size:1.3rem;padding:14px 48px}
.btn.primary{background:var(--pink);color:#2A1B40;border-color:#3B2A55}
.btn.quiet{box-shadow:none;border-style:dashed;font-weight:500}
.btn.wide{width:100%}
.btn.toggle[aria-pressed="false"]{opacity:.65;border-style:dashed;box-shadow:none}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.stage{position:relative;flex:1;min-height:360px;margin:0 12px 12px;border:3px solid var(--line);border-radius:28px;overflow:hidden;background:#4B3B7C}
canvas#c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--scrim);overflow:auto}
.overlay[hidden]{display:none}
.overlay.dialog{align-items:end;background:linear-gradient(rgba(30,18,52,0) 35%,var(--scrim))}
.overlay.clear{align-items:start;background:transparent;pointer-events:none}
.overlay.clear .card{pointer-events:auto;margin:0 auto}
.overlay.solid{background:linear-gradient(#2F2552,#6A55A3);color:#FFF6EA}
.card{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:26px;box-shadow:7px 7px 0 var(--shadow);
  padding:24px 24px 22px;width:100%;max-width:400px;margin:auto;text-align:center}
.card h2{font-family:"Mochiy Pop One",system-ui,sans-serif;font-weight:400;font-size:1.8rem;margin:0 0 8px;line-height:1.15}
.card .note{color:var(--muted);margin:0 auto 18px;line-height:1.5;max-width:34ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.stack{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
.logo{font-family:"Mochiy Pop One","M PLUS Rounded 1c",system-ui,sans-serif;font-weight:400;font-size:clamp(2.5rem,10vw,3.8rem);line-height:1;
  margin:0 0 10px;color:#FFF6EA;-webkit-text-stroke:3px #3B2A55;paint-order:stroke fill;text-shadow:4px 4px 0 #FF8DBF}
.logo span{display:block}
.logo span:first-child{margin-right:1.1em}
.logo span+span{color:#7EE3C1;margin-left:1.1em;transform:rotate(-4deg)}
.menu-card{max-width:440px}
.menu-card .btn.big{margin-bottom:16px}
.tiles{list-style:none;padding:0;margin:0 0 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid var(--line);border-radius:18px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile b{font-family:"Mochiy Pop One",system-ui,sans-serif;font-weight:400}
.tile span{font-size:.85rem;color:var(--muted);line-height:1.3}
.big-line{font-family:"Mochiy Pop One",system-ui,sans-serif;font-size:1.25rem;margin:0 0 12px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--butter);color:#3B2A55;border:2px solid #3B2A55;border-radius:999px;padding:2px 12px;font-weight:800;margin:0 0 12px;transform:rotate(-3deg)}
.badge[hidden]{display:none}
.haul{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:0 0 14px;padding:0;list-style:none}
.haul li{position:relative;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.8rem;width:48px}
.haul .new{position:absolute;top:-6px;right:-4px;background:var(--butter);color:#3B2A55;border:2px solid #3B2A55;border-radius:999px;font-size:.6rem;padding:0 4px}
.quip{display:flex;gap:12px;align-items:center;text-align:left;background:var(--tint);border-radius:18px;padding:10px 14px;margin:0 0 18px}
.quip p{margin:0;line-height:1.45;font-size:.95rem}
.quip canvas{flex:none;border-radius:50%;border:2px solid #3B2A55;background:#EDE4FF}
.book-card{max-width:680px}
.pets{list-style:none;padding:0;margin:0 0 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pet{font:inherit;color:inherit;background:none;width:100%;border:3px solid var(--rc);border-radius:18px;padding:6px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer}
.pet[aria-pressed="true"]{background:var(--tint)}
.pet.locked{border:2px dashed var(--silhouette);cursor:default}
.pet .nm{font-weight:800;font-size:.85rem;line-height:1.2}
.pet .tag{font-size:.72rem;color:var(--muted)}
.strip{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 5px;padding:8px 12px;pointer-events:none}
.strip[hidden]{display:none}
.chip{position:relative;display:flex;line-height:0;padding:2px;border:2px solid var(--rc);border-radius:12px;background:rgba(30,18,52,.66)}
.chip.got{opacity:.4;border-style:dashed}
.chip.got canvas{filter:grayscale(.85)}
.chip.got::after{content:"✓";position:absolute;right:-5px;top:-7px;width:18px;height:18px;display:grid;place-items:center;font-size:.75rem;font-weight:800;line-height:1;color:#2A1B40;background:#7EE3C1;border:2px solid #3B2A55;border-radius:999px}
.strip-left{margin-left:4px;padding:2px 10px;font-weight:800;font-size:.85rem;line-height:1.4;color:#FFF6EA;background:rgba(30,18,52,.66);border:2px solid #FFF6EA;border-radius:999px}
.list-card{max-width:680px}
.list-card .pet{cursor:default}
.pet.got{opacity:.5;border-style:dashed}
.pet.got .nm{text-decoration:line-through}
.ledger{min-height:3em;margin:0 auto 16px;line-height:1.45;max-width:46ch}
.speech{display:flex;gap:16px;align-items:flex-start;max-width:680px;width:100%;margin:0 auto;background:var(--panel);color:var(--ink);
  border:3px solid var(--line);border-radius:26px;box-shadow:6px 6px 0 var(--shadow);padding:16px 18px;cursor:pointer}
.speech canvas{flex:none;border-radius:50%;background:#EDE4FF;border:3px solid #3B2A55}
.speech canvas#portrait{display:none}
.dialog-wrap{width:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
.chars{display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;margin-bottom:-4px;pointer-events:none}
.char{--cs:clamp(110px,24vh,190px);width:var(--cs);height:var(--cs);visibility:hidden;filter:drop-shadow(0 4px 0 rgba(30,18,52,.45))}
.char.on{visibility:visible}
.speech-body{flex:1;min-width:0}
.speaker{font-family:"Mochiy Pop One",system-ui,sans-serif;font-size:1rem;margin-bottom:4px}
.speech p{font-size:1.1rem;line-height:1.55;margin:0 0 10px;min-height:3.1em;max-width:58ch}
.speech .row{justify-content:flex-end}
.loader{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.loader .logo{font-size:clamp(2rem,8vw,3rem);margin:0}
.loader .logo span{margin:0}
.loadrow{display:flex;gap:10px;min-height:48px}
.loader p{margin:0;font-weight:800;min-height:1.5em}
@media (max-width:520px){.card{padding:20px 16px 18px}.brand{font-size:1rem}.hud{order:3;flex-basis:100%;gap:12px}.speech canvas{width:56px;height:56px}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Skully Sweep</div>
  <div class="hud" id="hud" hidden>
    <span class="night" id="hNight">Night 1</span>
    <span class="stat" id="timeStat">Time <b id="hTime">60</b></span>
    <span class="stat">Score <b id="hScore">0</b></span>
  </div>
  <div class="tools">
    <button class="btn sm" id="pauseBtn" hidden>Pause</button>
    <button class="btn sm" id="bookBtn">Pets <span id="progHead"></span></button>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="c" aria-label="Graveyard play area"></canvas>
  <div class="strip" id="strip" hidden></div>

  <div class="overlay solid" id="loadingScreen">
    <div class="loader">
      <div class="logo" aria-hidden="true"><span>Skully Sweep</span></div>
      <div class="loadrow" id="loadRow" aria-hidden="true"></div>
      <p id="loadMsg" role="status">Waking up the graveyard…</p>
      <button class="btn primary" id="beginBtn" hidden>Tap to begin</button>
    </div>
  </div>

  <div class="overlay" id="menuScreen" hidden>
    <div class="card menu-card">
      <h1 class="logo" aria-label="Skully Sweep"><span>Skully</span><span>Sweep</span></h1>
      <p class="note" id="menuLede"></p>
      <button class="btn primary big" id="playBtn">Start</button>
      <div class="row">
        <button class="btn sm" data-book>Pets <span class="progTxt"></span></button>
        <button class="btn sm" id="howBtn">How to play</button>
        <button class="btn sm" id="settingsBtn">Settings</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="howScreen" hidden>
    <div class="card">
      <h2>How to play</h2>
      <ul class="tiles" id="howTiles"></ul>
      <button class="btn primary" id="howBack">Got it</button>
    </div>
  </div>

  <div class="overlay" id="settingsScreen" hidden>
    <div class="card" style="max-width:360px">
      <h2>Settings</h2>
      <div class="stack">
        <button class="btn toggle wide" id="sfxToggle" aria-pressed="true">Sound effects</button>
        <button class="btn toggle wide" id="musToggle" aria-pressed="true">Music</button>
        <button class="btn toggle wide" id="shakeToggle" aria-pressed="true">Screen shake</button>
        <button class="btn quiet wide" id="replayBtn" hidden>Replay the intro</button>
        <button class="btn quiet wide" id="resetBtn">Erase all progress</button>
      </div>
      <button class="btn primary" id="settingsBack">Done</button>
    </div>
  </div>

  <div class="overlay dialog" id="storyScreen" hidden>
   <div class="dialog-wrap">
    <div class="chars" aria-hidden="true"><canvas class="char" id="charL" width="380" height="380"></canvas><canvas class="char" id="charR" width="380" height="380"></canvas></div>
    <div class="speech" id="speech">
      <canvas id="portrait" width="72" height="72" style="width:72px;height:72px" aria-hidden="true"></canvas>
      <div class="speech-body">
        <div class="speaker" id="speaker">Grandma Bones</div>
        <p id="storyText" aria-live="polite"></p>
        <div class="row">
          <button class="btn quiet sm" id="skipStory">Skip</button>
          <button class="btn primary sm" id="nextStory">Next</button>
        </div>
      </div>
    </div>
   </div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <div class="card" style="max-width:380px">
      <h2>Paused</h2>
      <p class="note" id="pauseNote">The skullkins will wait for you.</p>
      <div class="row">
        <button class="btn primary" id="resumeBtn">Resume</button>
        <button class="btn" id="quitBtn">Quit to menu</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="resultsScreen" hidden>
    <div class="card">
      <h2 id="rTitle">Night done!</h2>
      <p class="big-line" id="rSummary"></p>
      <p class="note" id="rQuota" hidden></p>
      <p class="badge" id="rBest" hidden>New best!</p>
      <ul class="haul" id="rHaul"></ul>
      <div class="quip"><canvas id="rPortrait" width="48" height="48" style="width:48px;height:48px" aria-hidden="true"></canvas><p id="rGranny"></p></div>
      <div class="row">
        <button class="btn primary" id="againBtn">Next night</button>
        <button class="btn" id="resMenu">Menu</button>
      </div>
    </div>
  </div>

  <div class="overlay clear" id="endScreen" hidden>
    <div class="card">
      <div class="logo" aria-hidden="true"><span>The End?</span></div>
      <h2 style="position:absolute;left:-9999px">The End?</h2>
      <p class="note" id="endSummary"></p>
      <div class="row">
        <button class="btn primary" id="freeBtn">Keep sweeping</button>
        <button class="btn" id="endMenu">Menu</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="listScreen" hidden>
    <div class="card list-card" role="dialog" aria-labelledby="listTitle">
      <h2 id="listTitle">Grandma’s list</h2>
      <p class="note" id="listNote"></p>
      <ul class="pets" id="listGrid"></ul>
      <div class="row">
        <button class="btn primary big" id="listGo" hidden>Start night</button>
        <button class="btn" id="listBack">Back</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="bookScreen" hidden>
    <div class="card book-card" role="dialog" aria-labelledby="bookTitle">
      <h2 id="bookTitle">Grandma’s pets</h2>
      <p class="note" id="bookProg"></p>
      <ul class="pets" id="bookGrid"></ul>
      <p class="ledger" id="bookDetail" aria-live="polite"></p>
      <button class="btn primary" id="closeBook">Close</button>
    </div>
  </div>
</main>

<script>
(()=>{
const TAU=Math.PI*2, INK='#3B2A55', S2=[-1,1];
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- Lifecycle ---------- */
const ac=new AbortController(), sig=ac.signal, timers=new Set();
let rafId=0, running=false, onScreen=true, audioHeld=false, needDraw=true, resizeQueued=false, ro=null, io=null;
const later=(fn,ms)=>{ const t=setTimeout(()=>{ timers.delete(t); fn(); },ms); timers.add(t); return t; };
const pop=(el,s)=>{ if(!RM&&el.animate) el.animate([{transform:`scale(${s||1.35})`},{transform:'scale(1)'}],{duration:240,easing:'cubic-bezier(.3,1.6,.5,1)'}); };

/* ---------- Data ---------- */
const RAR=[
  {name:'Common',   pts:10, w:52, col:'#C9BCEB', speed:48, life:5.5},
  {name:'Sweet',    pts:25, w:28, col:'#FF9EC7', speed:60, life:5.0},
  {name:'Rare',     pts:60, w:14, col:'#7EE3C1', speed:78, life:4.2},
  {name:'Legendary',pts:150,w:6,  col:'#FFD86B', speed:100,life:3.4}
];
const SKULLS=[
  {id:'bonbon', name:'Bonbon',      rar:0,bone:'#FFF6EA',acc:'bow',     eyes:'sparkle',blurb:'Wears its best bow to every haunting.'},
  {id:'sprout', name:'Sprout',      rar:0,bone:'#E6FFF4',acc:'sprout',  eyes:'happy',  blurb:'Something is growing up there. Nobody asks.'},
  {id:'peach',  name:'Peachy',      rar:0,bone:'#FFE7DA',acc:'star',    eyes:'sparkle',blurb:'Keeps a star clip for luck.'},
  {id:'snooze', name:'Snooze',      rar:0,bone:'#EEE6FF',acc:'nightcap',eyes:'sleepy', blurb:'Has been napping since 1843.'},
  {id:'nyan',   name:'Nyan',        rar:1,bone:'#FFF6EA',acc:'cat',     eyes:'happy',  blurb:'Nine lives, zero regrets.'},
  {id:'bun',    name:'Bun',         rar:1,bone:'#FFF0F6',acc:'bunny',   eyes:'sparkle',blurb:'Thumps the ground when happy.'},
  {id:'party',  name:'Confetti',    rar:1,bone:'#FFF6EA',acc:'party',   eyes:'wink',   blurb:'Brought its own hat. Always does.'},
  {id:'gum',    name:'Bubblegum',   rar:1,bone:'#FFD6EA',acc:'bubble',  eyes:'happy',  blurb:'Please do not pop the bubble.'},
  {id:'cupcake',name:'Cupcake',     rar:1,bone:'#FFF1DC',acc:'cupcake', eyes:'sparkle',blurb:'Frosted, fresh and a little spooky.'},
  {id:'angel',  name:'Angelbone',   rar:2,bone:'#FFFFFF',acc:'halo',    eyes:'happy',  blurb:'Far too nice for this graveyard.'},
  {id:'imp',    name:'Lil Imp',     rar:2,bone:'#FFC9D2',acc:'horns',   eyes:'wink',   blurb:'Mostly harmless. Mostly.'},
  {id:'bloom',  name:'Bloom',       rar:2,bone:'#FFF6EA',acc:'flowers', eyes:'sparkle',blurb:'Weaves a new crown every spring.'},
  {id:'ribbit', name:'Ribbit',      rar:2,bone:'#D9F7C8',acc:'frog',    eyes:'happy',  blurb:'Hat or frog? Yes.'},
  {id:'royal',  name:'Royal Bones', rar:3,bone:'#FFE7A3',acc:'crown',   eyes:'sparkle',blurb:'Rules the graveyard from a very small throne.'},
  {id:'cosmo',  name:'Cosmo',       rar:3,bone:'#3D3A7A',acc:'cosmic',  eyes:'sparkle',blurb:'Fell out of the night sky and stayed.'},
  {id:'prism',  name:'Prism',       rar:3,bone:'rainbow',acc:'rainbow', eyes:'happy',  blurb:'Changes color whenever you look away.'}
];
const GRANNY={id:'granny',name:'Grandma Bones',rar:0,bone:'#F4EBDD',acc:'granny',eyes:'happy'};
const byRar=[0,1,2,3].map(k=>SKULLS.filter(s=>s.rar===k));
/* Each night's list is the first `goal` pets in SKULLS (easiest first), so every night adds new kinds. */
const NIGHTS=[{goal:5,time:60},{goal:8,time:60},{goal:11,time:70},{goal:13,time:80},{goal:SKULLS.length,time:90}];
function pickType(boost){
  let tot=0; const ws=SKULLS.map(s=>{ let w=RAR[s.rar].w/byRar[s.rar].length;
    if(boost){
      if(storyRound&&nightList.length){ if(nightList.includes(s)) w*=gotTonight.has(s.id)?.35:3; else w*=.5; }
      else if(!save.counts[s.id]) w*=2.5;
    }
    tot+=w; return w; });
  let n=Math.random()*tot; for(let i=0;i<SKULLS.length;i++){ n-=ws[i]; if(n<=0) return SKULLS[i]; } return SKULLS[0];
}

const INTRO=[
  ['G','Oh! A ghost! Perfect. I mean… oh no, dearie, I’m in terrible trouble.'],
  ['G','My sixteen precious pets ran off into the graveyard. Again. I simply must get them back.'],
  ['Y','Your pets are… skulls?'],
  ['G','Skullkins, dearie. Very loyal. Very valuable. Emotionally valuable, I mean.'],
  ['Y','Wait, didn’t I help you find Bonbon last full moon? It had a different bow. And a different face.'],
  ['G','Pets grow so fast. Now listen closely, dearie: I need just one of each kind. A second Bonbon is no use to me. I mean, I couldn’t possibly love two.'],
  ['G','Each night I’ll give you a list. Tonight there are only five kinds on it. A few more every night after that, until the whole set is home.'],
  ['Y','Don’t worry, Grandma! I’ll bring all your babies home!'],
  ['G','Bless your see-through heart. Keep an eye on the list along the top to see who’s still missing. Mind the bats, grab the lanterns, and don’t ask questions. Go!']
];
const ENDING=[
  ['G','All sixteen! Oh, you wonderful, gullible… I mean wonderful little ghost.'],
  ['Y','Now you can have your picnic with all your pets together!'],
  ['G','Picnic, yes. Right before the auction. Picnic first.'],
  ['Y','What’s an auction?'],
  ['G','A lovely party where strangers wave paddles at my pets and give me money. Very wholesome.'],
  ['Y','Aww. Same time next full moon? They always seem to run away again.'],
  ['G','Funny how that keeps happening. See you then, dearie.']
];
const NOTES={

/* ---------- Update ---------- */
function update(rdt){
  let dt=rdt;
  if(hitStop>0){ hitStop-=rdt; dt=0; }
  dt*=timeScale; if(!finalPending) timeScale+=(1-timeScale)*Math.min(1,rdt*3);
  shake=Math.max(0,shake-rdt*45); basketBounce=Math.max(0,basketBounce-rdt*4);
  T+=dt;
  for(const q of graves) q.wob=Math.max(0,q.wob-rdt*2.5);
  if(banner){ banner.life-=rdt; if(banner.life<=0) banner=null; }

  if(state==='play'){
    if(countdown>0){
      countdown-=rdt; cdAge+=rdt;
      const lab=countdown>2.6?'3':countdown>1.6?'2':countdown>.6?'1':'Sweep!';
      if(lab!==cdLabel){ cdLabel=lab; cdAge=0; if(lab==='Sweep!'){ sfx.go(); addShake(4); for(let i=0;i<3;i++) spawnSkull(false); } else sfx.count(); }
      updatePlayer(rdt);
    } else {
      if(!finalPending){ roundLeft-=dt; elapsed+=dt; ramp=Math.min(elapsed,60); }
      const sec=Math.ceil(roundLeft);
      if(roundLeft<=10&&roundLeft>0&&sec!==lastTickSec){ lastTickSec=sec; sfx.tick(); pop($('#hTime'),1.4); }
      if(roundLeft<=0&&!finalPending){ endRound(false); }
      else if(!finalPending){
        spawnTimer-=dt;
        let alive=0; for(const s of skulls) if(s.phase!=='sink') alive++; const maxS=6+Math.floor(ramp/12);
        if(spawnTimer<=0&&alive<maxS){ spawnSkull(false); spawnTimer=(0.85-0.4*(ramp/60))*rand(.7,1.3); }
        batTimer-=dt;
        if(batTimer<=0){ const dir=Math.random()<.5?1:-1;
          bats.push({x:dir>0?-40:W+40,dir,baseY:rand(MINY+10,H-50),y:0,vx:dir*rand(150,200)*(1+ramp/90),t:rand(0,5),warn:.8});
          batTimer=rand(4.5,7)*(1-ramp/150); }
        lanternTimer-=dt;
        if(lanternTimer<=0&&!lanterns.length){ lanterns.push({x:rand(60,W-60),y:rand(MINY+30,H-30),life:7,t:0}); lanternTimer=rand(14,18); }
      }
      if(state==='play') updatePlayer(dt);
    }
  } else if(state==='ending'){
    if(Math.random()<rdt*10) parts.push({x:rand(0,W),y:-10,vx:rand(-30,30),vy:rand(40,90),gr:20,life:5,max:5,kind:'conf',col:['#FF8DBF','#FFD86B','#7EE3C1','#9DB4FF'][Math.floor(rand(0,4))],s:rand(4,7),rot:rand(0,TAU)});
    if(Math.random()<rdt*.6){ const p=picnic[Math.floor(rand(0,picnic.length))]; if(p) burst(p.x,p.y-p.r*2,5,'heart',['#FF8DBF','#FFD86B']); }
  } else if(state!=='loading'){
    spawnTimer-=dt;
    if(spawnTimer<=0){ if(skulls.length<5&&graves.length) spawnSkull(true); spawnTimer=rand(.9,1.6); }
  }

  for(const s of skulls) updateSkull(s,dt);
  if(state==='play'&&countdown<=0&&!finalPending){
    for(const s of skulls){ if(s.dead||s.phase==='sink') continue; if(s.phase==='rise'&&s.p<.5) continue;
      if(Math.hypot(s.x-player.x,(s.y-player.y)*1.2)<player.r+s.r*.8) catchSkull(s); }
  }
  { let j=0; for(let i=0;i<skulls.length;i++){ const s=skulls[i]; if(!s.dead) skulls[j++]=s; } skulls.length=j; }

  for(const b of bats){
    if(b.warn>0){ b.warn-=dt; b.baseY+=0; continue; }
    b.t+=dt; b.x+=b.vx*dt; b.y=b.baseY+Math.sin(b.t*3)*28;
    if(b.x<-70||b.x>W+70) b.dead=true;
    if(state==='play'&&!finalPending&&player.stun<=0&&Math.hypot(b.x-player.x,b.y-(player.y-34))<32){
      player.stun=1.1; combo=0; say(player.x,player.y-74,'Bonk!','#FF8DBF',22); sfx.bonk(); addShake(10); hitStop=.08;
      player.vx=Math.sign(b.vx)*260; player.vy=-60;
      burst(player.x,player.y-40,10,'star',['#FFD86B','#FFF6EA']); }
  }
  bats=bats.filter(b=>!b.dead);

  for(const L of lanterns){ L.t+=dt; L.life-=dt; if(L.life<=0) L.dead=true;
    if(state==='play'&&Math.hypot(L.x-player.x,(L.y-player.y)*1.2)<36){ L.dead=true; player.magnet=6;
      showBanner('Lantern! Skulls come running','#FFD86B'); sfx.lantern(); addShake(3);
      rings.push({x:L.x,y:L.y-20,r:10,max:190,life:.6,maxL:.6,col:'#FFD86B'}); burst(L.x,L.y-20,12,'star',['#FFD86B','#FFB86B']); } }
  lanterns=lanterns.filter(L=>!L.dead);

  for(const f of flyers){ f.t+=rdt; if(f.t>=f.dur){ f.dead=true; burst(f.tx,f.ty,4,'star',['#FFD86B','#FFF6EA'],.5);
    if(f.id){ const ch=document.querySelector(`#strip .chip[data-id="${f.id}"]`); if(ch){ ch.classList.add('got'); pop(ch,1.35); } updStrip(); } } }
  flyers=flyers.filter(f=>!f.dead);
  for(const r of rings){ r.life-=rdt; } rings=rings.filter(r=>r.life>0);
  for(const p of parts){ p.vy+=p.gr*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.rot!==undefined) p.rot+=dt*6; }
  { let j=0; for(let i=0;i<parts.length;i++){ const p=parts[i]; if(p.life>0&&p.y<H+20) parts[j++]=p; } parts.length=j; } if(parts.length>700) parts.splice(0,parts.length-700);
  for(const t of texts){ t.y-=40*dt; t.life-=dt; } texts=texts.filter(t=>t.life>0);
  player.blink-=rdt; if(player.blink<-.12) player.blink=rand(2,5);
}
function updatePlayer(dt){
  const p=player, speed=330; let tvx=0,tvy=0;
  const ax=(keys.r?1:0)-(keys.l?1:0), ay=(keys.d?1:0)-(keys.u?1:0);
  if(ax||ay){ const l=Math.hypot(ax,ay); tvx=ax/l*speed; tvy=ay/l*speed; pointerTarget=null; }
  else if(pointerTarget){ const dx=pointerTarget.x-p.x, dy=pointerTarget.y-p.y, d=Math.hypot(dx,dy); if(d>4){ const s=Math.min(speed,d*6); tvx=dx/d*s; tvy=dy/d*s; } }
  if(p.stun>0){ p.stun-=dt; tvx*=.2; tvy*=.2; }
  if(p.magnet>0) p.magnet=Math.max(0,p.magnet-dt);
  const k=Math.min(1,dt*10); p.vx+=(tvx-p.vx)*k; p.vy+=(tvy-p.vy)*k;
  p.x=clamp(p.x+p.vx*dt,p.r,W-p.r); p.y=clamp(p.y+p.vy*dt,MINY,H-6);
  if(Math.hypot(p.vx,p.vy)>150&&Math.random()<dt*40) parts.push({x:p.x+rand(-10,10),y:p.y-24+rand(0,14),vx:-p.vx*.1,vy:-12,gr:-20,life:.45,max:.45,kind:'wisp',col:'#FFFFFF',s:rand(4,8)});
}
function updateSkull(s,dt){
  if(s.phase==='rise'){ s.p+=dt/.4; if(s.p>=1){ s.p=1; s.phase='roam'; } return; }
  if(s.phase==='sink'){ s.p-=dt/.3; if(s.p<=0) s.dead=true; return; }
  s.life-=dt; if(s.life<=0){ s.phase='sink'; return; }
  if(state==='play'){ const dx=player.x-s.x, dy=player.y-s.y, d=Math.hypot(dx,dy)||1;
    if(player.magnet>0&&d<190){ s.x+=dx/d*170*dt; s.y+=dy/d*170*dt; }
    else if(s.T.rar>=2&&d<120){ s.vx-=dx/d*260*dt; s.vy-=dy/d*260*dt; } }
  if(Math.random()<dt*.5){ const a=rand(0,TAU), sp=Math.hypot(s.vx,s.vy); s.vx=Math.cos(a)*sp; s.vy=Math.sin(a)*sp*.7; }
  const sp=Math.hypot(s.vx,s.vy); if(sp>s.maxSp){ s.vx*=s.maxSp/sp; s.vy*=s.maxSp/sp; }
  s.x+=s.vx*dt; s.y+=s.vy*dt;
  if(s.x<s.r+6){ s.x=s.r+6; s.vx=Math.abs(s.vx); } if(s.x>W-s.r-6){ s.x=W-s.r-6; s.vx=-Math.abs(s.vx); }
  if(s.y<MINY){ s.y=MINY; s.vy=Math.abs(s.vy); } if(s.y>H-6){ s.y=H-6; s.vy=-Math.abs(s.vy); }
  s.hopT+=dt*s.hopRate; const ph=s.hopT%1; s.z=Math.sin(ph*Math.PI)*s.hopH; s.squash=ph<.14?(.14-ph)/.14*.2:0;
  s.blink-=dt; if(s.blink<-.13) s.blink=rand(2,5);
  if(s.T.rar===3&&Math.random()<dt*9) parts.push({x:s.x+rand(-12,12),y:s.y-s.r-s.z+rand(-12,12),vx:0,vy:-20,life:.6,max:.6,kind:'star',col:'#FFE9A0',s:3.5,gr:0});
}

function drawGrave(q){

  const w=26, h=34*q.h;

  g.beginPath(); g.moveTo(-w,4); g.lineTo(-w,-h); g.arc(0,-h,w,Math.PI,0); g.lineTo(w,4); g.closePath(); g.fillStyle='#D3C7F4'; g.fill();
  g.save(); g.clip(); g.fillStyle='rgba(90,70,150,.2)'; g.fillRect(w*.4,-h-w,w,h+w+10); g.restore();
  g.lineWidth=3; g.strokeStyle=INK; g.lineJoin='round'; g.stroke(); g.lineCap='round';
  if(q.face){ g.lineWidth=2.2;
    if(q.wob>.2){ for(const s of S2){ g.beginPath(); g.arc(s*8,-h+2,3.2,0,TAU); g.stroke(); } g.beginPath(); g.arc(0,-h+10,3,0,TAU); g.stroke(); }
    else { for(const s of S2){ g.beginPath(); g.arc(s*8,-h+2,4,Math.PI*.15,Math.PI*.85); g.stroke(); } g.beginPath(); g.arc(0,-h+8,3,.2,Math.PI-.2); g.stroke(); }

  const x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); x.clearRect(0,0,s,s);
  x.fillStyle=who==='Y'?'#D9F7EC':'#EDE4FF'; x.fillRect(0,0,s,s);
  if(who==='Y') withCtx(x,()=>drawGhost({x:s/2,y:s*.98,vx:0,vy:0,r:s*.3,stun:0,magnet:0,blink:blink?-1:1}));
  else { x.translate(s/2,s*.62); drawSkull(x,GRANNY,s*.3,0,blink); }
}
function showMenu(anim){
  state='menu'; $('#hud').hidden=true; setPlayTools(false); paused=false; timeScale=1; finalPending=false;
  const play=$('#playBtn');
  play.textContent=!save.storySeen?'Start':(!save.ended?`Play night ${save.cleared+1}`:'Free sweep');
  const nextGoal=NIGHTS[Math.min(save.cleared,NIGHTS.length-1)].goal;
  $('#menuLede').textContent=save.ended?'Grandma’s pets escaped again. Weird. Better go get them.'
    :`Grandma lost her pets again. Tonight she wants ${nextGoal} different kinds. Just one of each. Don’t ask why.`;
  updateProgress(); showOverlay('menuScreen');
  if(anim!==false){ panelPop('menuScreen');
    const spans=document.querySelectorAll('#menuScreen .logo span');
    if(!RM) spans.forEach((s,i)=>s.animate([{transform:`translateY(-40px) rotate(${i?-12:8}deg)`,opacity:0},{transform:i?'rotate(-4deg)':'none',opacity:1}],{duration:520,delay:120+i*140,easing:'cubic-bezier(.3,1.7,.5,1)',fill:'backwards'})); }
  play.focus();
}
function syncToggles(){
  [['#sfxToggle','sound','Sound effects'],['#musToggle','music','Music'],['#shakeToggle','shake','Screen shake']].forEach(([s,k,l])=>{
    const b=$(s); b.setAttribute('aria-pressed',String(!!save[k])); b.textContent=`${l}: ${save[k]?'on':'off'}`; });
  $('#replayBtn').hidden=!save.storySeen;
}
let story=null;
const SPEAKERS={G:{name:'Grandma Bones',col:'#E8457F'},Y:{name:'You',col:'#2FA77F'}};
function playStory(lines,done){ story={lines,i:0,done,typing:null}; showOverlay('storyScreen'); typeLine(); $('#nextStory').focus(); }
function typeLine(){
  const s=story, [who,txt]=s.lines[s.i], el=$('#storyText'), pt=$('#portrait'); clearInterval(s.typing); s.shown=0;
  $('#speaker').textContent=SPEAKERS[who].name; $('#speaker').style.color=SPEAKERS[who].col;
  $('#nextStory').textContent=s.i===s.lines.length-1?(state==='ending'?'Finish':'Let’s go!'):'Next';
  drawPortrait(pt,who,false);
  if(!RM&&pt.animate) pt.animate([{transform:'translateY(0)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'}],{duration:300,easing:'ease-out'});
  if(RM){ el.textContent=txt; s.shown=txt.length; return; }
  el.textContent='';
  s.typing=setInterval(()=>{ s.shown+=1; el.textContent=txt.slice(0,s.shown); if(s.shown%3===0) sfx.blip();
    if(s.shown%24===0) drawPortrait(pt,who,true); else if(s.shown%24===3) drawPortrait(pt,who,false);
    if(s.shown>=txt.length){ clearInterval(s.typing); s.typing=null; drawPortrait(pt,who,false); } },22);
}
function advanceStory(){
  if(!story) return; const s=story;
  if(s.typing){ clearInterval(s.typing); s.typing=null; $('#storyText').textContent=s.lines[s.i][1]; drawPortrait($('#portrait'),s.lines[s.i][0],false); return; }
  sfx.ui(); s.i++; if(s.i>=s.lines.length) finishStory(); else typeLine();
}
function finishStory(){ if(!story) return; charWho=''; clearInterval(story.typing); const d=story.done; story=null; showOverlay(null); d&&d(); }
function grannyLine(){
  if(!storyRound) return pick(['Back again, dearie? Business is booming. I mean, the family is growing!','Funny how they keep escaping. Anyway, scoop scoop!','Any skull will do. I’m not picky. Neither are the buyers.']);
  const goal=nightList.length, got=gotTonight.size, miss=nightList.filter(s=>!gotTonight.has(s.id));
  if(nightCleared){ const nx=NIGHTS[nightIdx+1].goal;
    return pick([`One of each, and not a single repeat! Tomorrow night I’ll need ${nx}. My friends are coming over. Lots of friends.`,`Lovely, dearie! Tomorrow the list grows to ${nx}. Grandma’s spreadsheet is very pleased.`]); }
  let line=got===0?pick(['Nothing from my list? The buyers will be furious. I mean, I’m sad, dearie.','Not one pet on the list? Grandma’s yacht fund weeps. Er, Grandma weeps.'])
    :pick([`Only ${got} of ${goal}, dearie. I need one of each. Just one, but of each!`,`${miss.length} still missing. The dear buyers are getting restless. I mean, my friends.`]);
  if(miss.some(s=>s.rar===3)) line+=' The shiny ones love to dodge, so grab a lantern.';
  return line;
}
function showResults(isBest){
  const total=Object.values(roundCatch).reduce((a,b)=>a+b,0);
  $('#rTitle').textContent=storyRound?(nightCleared?`Night ${nightIdx+1} cleared!`:`Night ${nightIdx+1}: not quite`):'Moon’s down!';
  const q=$('#rQuota');
  if(storyRound){ const goal=nightList.length, got=gotTonight.size, miss=nightList.filter(s=>!gotTonight.has(s.id));
    q.textContent=nightCleared?`Grandma’s list: ${got} of ${goal}. Time bonus +${timeBonus}.`
      :`Grandma’s list: ${got} of ${goal}. Missing ${miss.slice(0,4).map(s=>s.name).join(', ')}${miss.length>4?` and ${miss.length-4} more`:''}.`;
    q.hidden=false; } else q.hidden=true;
  const el=$('#rSummary'), txt=k=>`${total} skull${total===1?'':'s'}, ${Math.round(score*k).toLocaleString('en')} points`;
  if(!total) el.textContent='Zero skulls. Grandma is “fine.”';
  else if(RM) el.textContent=txt(1);
  else { const t0=performance.now(); const step=now=>{ const k=Math.min(1,(now-t0)/800); el.textContent=txt(k); if(k<1&&!$('#resultsScreen').hidden) requestAnimationFrame(step); else el.textContent=txt(1); }; requestAnimationFrame(step); }
  $('#rBest').hidden=!(isBest&&score>0);
  drawPortrait($('#rPortrait'),'G',false); $('#rGranny').textContent=grannyLine();
  const ul=$('#rHaul'); ul.innerHTML=''; ul.hidden=!total;
  SKULLS.forEach(Tp=>{ const n=roundCatch[Tp.id]; if(!n) return;
    const li=document.createElement('li'); li.appendChild(skullCanvas(Tp,44,false));
    const c=document.createElement('span'); c.textContent=`×${n}`; li.appendChild(c);
    if(newThisRound.includes(Tp.id)){ const b=document.createElement('span'); b.className='new'; b.textContent='New'; li.appendChild(b); }
    li.setAttribute('aria-label',`${Tp.name}, ${n}`); ul.appendChild(li); });
  $('#againBtn').textContent=storyRound?(nightCleared?'Next night':'Try again'):'Again';
  showOverlay('resultsScreen'); panelPop('resultsScreen'); $('#againBtn').focus();
}
let listMode='brief';
function renderList(){
  const brief=listMode==='brief', goal=nightList.length, got=gotTonight.size, left=goal-got;
  $('#listTitle').textContent=brief?`Night ${nightIdx+1}: Grandma’s list`:'Grandma’s list';
  $('#listNote').textContent=brief?`Bring home these ${goal}. Just one of each, spares are no use to Grandma.`
    :(left?`${left} still to find, ${got} of ${goal} home. Just one of each!`:'Every pet on the list is home!');
  $('#listGo').hidden=!brief; const b=$('#listBack'); b.textContent=brief?'Back':'Resume'; b.classList.toggle('primary',!brief);
  const ul=$('#listGrid'); ul.innerHTML='';
  [...nightList].sort((a,c)=>gotTonight.has(a.id)-gotTonight.has(c.id)).forEach(Tp=>{
    const done=gotTonight.has(Tp.id), R=RAR[Tp.rar], li=document.createElement('li'), el=document.createElement('div');
    el.className='pet'+(done?' got':''); el.style.setProperty('--rc',R.col);
    el.appendChild(skullCanvas(Tp,56,false));
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=Tp.name; el.appendChild(nm);
    const tg=document.createElement('span'); tg.className='tag'; tg.textContent=done?'Home!':R.name; el.appendChild(tg);
    el.setAttribute('aria-label',done?`${Tp.name}, home`:`${Tp.name}, ${R.name.toLowerCase()}, still needed`);
    li.appendChild(el); ul.appendChild(li); });
}
function showBriefing(){ prepNight(); listMode='brief'; renderList(); showOverlay('listScreen'); panelPop('listScreen'); $('#listGo').focus(); }
function closeList(){ if(listMode==='brief') showMenu(false); else setPause(false); }
function beginNight(){ if(save.ended) startRound(); else showBriefing(); }
let bookReturn='menuScreen', resetArmed=false;
function openBook(){
  if(state==='loading'||(state==='ending'&&story)) return;
  if(state==='play'){ paused=true; bookReturn='pauseScreen'; } else bookReturn=currentOverlay()||'menuScreen';
  if(bookReturn==='bookScreen') return;
  renderBook(); showOverlay('bookScreen'); panelPop('bookScreen'); $('#closeBook').focus();
}
function closeBook(){ showOverlay(bookReturn); }
function renderBook(){
  const f=found();
  $('#bookProg').textContent=f===SKULLS.length?'All 16 home! (Why do they all have price tags?)':`${f} of ${SKULLS.length} home. Tap one to read Grandma’s note.`;
  $('#bookDetail').textContent=f?'':'No pets yet. Go scoop some up!';
  const ul=$('#bookGrid'); ul.innerHTML='';
  SKULLS.forEach(Tp=>{ const n=save.counts[Tp.id]||0, R=RAR[Tp.rar], li=document.createElement('li');
    const el=document.createElement(n?'button':'div'); el.className='pet'+(n?'':' locked'); el.style.setProperty('--rc',R.col);
    el.appendChild(skullCanvas(Tp,60,!n));
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=n?Tp.name:'???'; el.appendChild(nm);
    const tg=document.createElement('span'); tg.className='tag'; tg.textContent=n?`Tag: ${Tp.price.toLocaleString('en')} coins`:R.name; el.appendChild(tg);
    if(n){ el.setAttribute('aria-pressed','false');
      el.addEventListener('click',()=>{ ul.querySelectorAll('.pet[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed','false')); el.setAttribute('aria-pressed','true'); sfx.ui();
        $('#bookDetail').textContent=`${Tp.name} (${R.name.toLowerCase()}, caught ${n}×). Grandma’s note: “${Tp.note}”`; }); }
    else el.setAttribute('aria-label',`Unknown ${R.name.toLowerCase()} pet`);
    li.appendChild(el); ul.appendChild(li); });
}
function renderHow(){
  const ul=$('#howTiles'); ul.innerHTML='';
  [['ghost','Move','Mouse, finger or arrow keys'],['skull','Scoop','Just one of each. Watch the list up top'],['lantern','Lanterns','Pull skulls toward you'],['bat','Bats','Bonk! Watch for the “!”']]
    .forEach(([k,t,s])=>{ const li=document.createElement('li'); li.className='tile'; li.appendChild(iconCanvas(k,56));
      const b=document.createElement('b'); b.textContent=t; li.appendChild(b); const sp=document.createElement('span'); sp.textContent=s; li.appendChild(sp); ul.appendChild(li); });
}
function showEndCard(){
  const n=save.endNights;
  $('#endSummary').textContent=`You brought all 16 pets home in ${n} night${n===1?'':'s'}. Grandma bought a yacht. Probably unrelated.`;
  showOverlay('endScreen'); panelPop('endScreen'); $('#freeBtn').focus();
}
function setPause(v){
  if(state!=='play'||finalPending) return; paused=v; for(const k in keys) keys[k]=false;
  if(v) $('#pauseNote').textContent=pick(['The skullkins will wait for you.','Grandma is tapping her foot.','Take your time. Grandma’s buyers can wait. Probably.']);
  showOverlay(v?'pauseScreen':null); if(v){ panelPop('pauseScreen'); $('#resumeBtn').focus({preventScroll:true}); } else last=performance.now();
}

/* ---------- Input ---------- */
const keymap={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
addEventListener('keydown',e=>{
  if(state==='loading'&&!$('#beginBtn').hidden&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); begin(); return; }
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){
    if(!$('#listScreen').hidden){ closeList(); e.preventDefault(); return; }
    if(!$('#bookScreen').hidden){ closeBook(); return; }
    if(!$('#howScreen').hidden||!$('#settingsScreen').hidden){ showMenu(false); return; }
    if(state==='play'){ setPause(!paused); e.preventDefault(); return; }
  }
  const k=keymap[e.key]; if(k&&state==='play'&&!paused){ keys[k]=true; e.preventDefault(); }
},{signal:sig});
addEventListener('keyup',e=>{ const k=keymap[e.key]; if(k) keys[k]=false; },{signal:sig});
function setTarget(e){ const r=cv.getBoundingClientRect(); pointerTarget={x:e.clientX-r.left,y:e.clientY-r.top+(e.pointerType==='mouse'?34:0)}; }
cv.addEventListener('pointerdown',e=>{ if(state!=='play'||paused) return; ensureAudio(); dragging=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} setTarget(e); });
cv.addEventListener('pointermove',e=>{ if(state!=='play'||paused) return; if(e.pointerType==='mouse'||dragging) setTarget(e); });
const up=e=>{ dragging=false; if(e.pointerType!=='mouse') pointerTarget=null; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play'&&!paused) setPause(true); holdAudio(document.hidden); syncRun(); },{signal:sig});
addEventListener('blur',()=>{ if(state==='play'&&!paused) setPause(true); },{signal:sig});

$('#playBtn').addEventListener('click',()=>{ sfx.ui(); if(!save.storySeen){ playStory(INTRO,()=>{ save.storySeen=true; persist(); beginNight(); }); } else beginNight(); });
$('#howBtn').addEventListener('click',()=>{ sfx.ui(); renderHow(); showOverlay('howScreen'); panelPop('howScreen'); $('#howBack').focus(); });
$('#howBack').addEventListener('click',()=>{ sfx.ui(); showMenu(false); });
$('#settingsBtn').addEventListener('click',()=>{ sfx.ui(); syncToggles(); resetArmed=false; $('#resetBtn').textContent='Erase all progress'; showOverlay('settingsScreen'); panelPop('settingsScreen'); $('#settingsBack').focus(); });
$('#settingsBack').addEventListener('click',()=>{ sfx.ui(); showMenu(false); });
$('#replayBtn').addEventListener('click',()=>{ sfx.ui(); playStory(INTRO,()=>showMenu(false)); });
$('#speech').addEventListener('click',e=>{ if(e.target.closest('button')) return; advanceStory(); });
$('#nextStory').addEventListener('click',advanceStory);
$('#skipStory').addEventListener('click',()=>{ sfx.ui(); finishStory(); });
$('#againBtn').addEventListener('click',beginNight);
$('#listGo').addEventListener('click',()=>{ sfx.ui(); startRound(); });
$('#listBack').addEventListener('click',()=>{ sfx.ui(); closeList(); });
$('#resMenu').addEventListener('click',()=>{ sfx.ui(); showMenu(); });
$('#resumeBtn').addEventListener('click',()=>setPause(false));
$('#pauseBtn').addEventListener('click',()=>{ if(state==='play') setPause(!paused); });
$('#quitBtn').addEventListener('click',()=>{ skulls.forEach(s=>{ if(s.phase!=='sink') s.phase='sink'; }); bats=[]; lanterns=[]; showMenu(); });
$('#freeBtn').addEventListener('click',()=>{ layoutGraves(); startRound(); });
$('#endMenu').addEventListener('click',()=>{ layoutGraves(); parts=[]; showMenu(); });
document.querySelectorAll('[data-book]').forEach(b=>b.addEventListener('click',()=>{ sfx.ui(); openBook(); }));
$('#bookBtn').addEventListener('click',()=>{ $('#bookScreen').hidden?openBook():closeBook(); });
$('#closeBook').addEventListener('click',closeBook);
$('#resetBtn').addEventListener('click',()=>{
  if(!resetArmed){ resetArmed=true; $('#resetBtn').textContent='Tap again to erase everything'; return; }
  Object.assign(save,{counts:{},best:0,plays:0,nights:0,cleared:0,storySeen:false,ended:false,endNights:0,total:0}); persist();
  resetArmed=false; $('#resetBtn').textContent='Progress erased'; syncToggles(); updateProgress();
});
function toggle(k){ save[k]=!save[k]; persist(); syncToggles(); applyVolumes(); if(k==='sound'&&save.sound) sfx.ui(); if(k==='shake'&&save.shake) addShake(6); }
$('#sfxToggle').addEventListener('click',()=>toggle('sound'));
$('#musToggle').addEventListener('click',()=>toggle('music'));
$('#shakeToggle').addEventListener('click',()=>toggle('shake'));

/* ---------- Boot ---------- */
async function boot(){
  const steps=['Counting Grandma’s pets…','Hiding the price tags…','Feeding the bats…','Polishing tombstones…','Hanging up the moon…'];
  const icons=[SKULLS[0],SKULLS[4],SKULLS[9],SKULLS[13],SKULLS[15]], row=$('#loadRow');
  icons.forEach(t=>row.appendChild(skullCanvas(t,48,true,'rgba(255,246,234,.25)')));
  const fontP=(document.fonts&&document.fonts.load)?Promise.race([Promise.all([document.fonts.load('20px "Mochiy Pop One"'),document.fonts.load('800 16px "M PLUS Rounded 1c"')]),wait(2500)]).catch(()=>{}):Promise.resolve();
  for(let i=0;i<steps.length;i++){
    $('#loadMsg').textContent=steps[i]; await wait(RM?80:300);
    const c=skullCanvas(icons[i],48,false); row.children[i].replaceWith(c);
    if(!RM&&c.animate) c.animate([{transform:'translateY(-14px) scale(1.3)'},{transform:'none'}],{duration:300,easing:'cubic-bezier(.3,1.7,.5,1)'});
    if(i===1) await fontP;
  }
  $('#loadMsg').textContent='The graveyard is ready.'; const b=$('#beginBtn'); b.hidden=false; b.focus(); pop(b,1.2);
}
function begin(){ ensureAudio(); startMusic(); sfx.go(); showMenu(); }
$('#beginBtn').addEventListener('click',begin);

let last=performance.now();
function frame(now){
  rafId=0; if(!running) return;
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(state==='loading'){ needDraw=false; }
  else if(!paused){ update(dt); draw(); updHud(); needDraw=false; }
  else if(needDraw){ draw(); needDraw=false; }
  if(paused||state==='loading') return;
  rafId=requestAnimationFrame(frame);
}
function setRunning(v){
  if(v===running) return; running=v;
  if(v){ last=performance.now(); needDraw=true; if(!rafId) rafId=requestAnimationFrame(frame); }
  else if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
}
const syncRun=()=>setRunning(!document.hidden&&onScreen);
function holdAudio(v){
  if(!actx) return;
  if(v&&actx.state==='running'){ audioHeld=true; Promise.resolve(actx.suspend()).catch(()=>{}); }
  else if(!v&&audioHeld){ audioHeld=false; Promise.resolve(actx.resume()).catch(()=>{}); }
}
function destroy(){
  ac.abort(); timers.forEach(clearTimeout); timers.clear();
  if(rafId) cancelAnimationFrame(rafId); rafId=0; running=false;
  clearInterval(mTimer); mTimer=null; if(story&&story.typing) clearInterval(story.typing);
  if(ro) ro.disconnect(); if(io) io.disconnect();
  if(actx){ try{ actx.close(); }catch(e){} actx=null; }
}
addEventListener('pagehide',e=>{ if(e.persisted){ setRunning(false); holdAudio(true); } else destroy(); },{signal:sig});
addEventListener('pageshow',e=>{ if(e.persisted){ holdAudio(false); syncRun(); } },{signal:sig});
ro=new ResizeObserver(()=>{ if(resizeQueued) return; resizeQueued=true; requestAnimationFrame(()=>{ resizeQueued=false; resize(); }); });
ro.observe(stage);
if('IntersectionObserver' in window){
  io=new IntersectionObserver(es=>{ onScreen=es[es.length-1].isIntersecting; if(!onScreen&&state==='play'&&!paused) setPause(true); syncRun(); },{threshold:.01});
  io.observe(stage);
}
resize(); updateProgress(); syncToggles(); syncRun(); boot();
})();
</script>
