<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Daily Roguelike — Tilted Stack (2026-11-22)</title>
<style>
  :root{
    --ink:#101010;
    --paper:#fff7e0;
    --gold:#ffd23f;
    --gold2:#f5a623;
    --pink:#ff6b9d;
    --teal:#2ec4b6;
    --mint:#7bf1a8;
    --red:#d90429;
    --felt:#0b6e4f;
    --felt2:#084c37;
    --purple:#b388eb;
    --ch:15px;
    --tw:76px;
    --dc:52px;
    --bw:2.5px;
    --cbw:3.5px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;height:100dvh;overflow:hidden;background:#171321;color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;
  }
  button{font-family:inherit;cursor:pointer;min-height:44px}
  .black{font-family:"Arial Black","Arial Bold",Arial,sans-serif;font-weight:900}
  #app{
    width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;
    background:var(--paper);overflow:hidden;position:relative;
  }
  /* ---------- HUD ---------- */
  #hud{
    display:flex;gap:6px;padding:8px 8px 6px;background:var(--paper);
    border-bottom:3px solid var(--ink);flex:0 0 auto;align-items:stretch;
  }
  .stat{
    flex:1;border:3px solid var(--ink);padding:3px 6px;background:#fff;
    box-shadow:3px 3px 0 var(--ink);min-width:0;
  }
  .stat .lab{font-size:10px;font-weight:900;letter-spacing:.08em}
  .stat .val{font-size:20px;font-weight:900;line-height:1.05}
  #statStack{flex:1.6;background:var(--gold)}
  #statLeft{background:#fff}
  #stackBar{height:7px;border:2px solid var(--ink);background:#fff;margin-top:2px}
  #stackFill{height:100%;width:0%;background:var(--teal)}
  /* ---------- patience strip ---------- */
  #patStrip{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 8px;
    background:var(--paper);border-bottom:3px solid var(--ink);
  }
  #patLab{font-size:11px;font-weight:900;letter-spacing:.08em;white-space:nowrap}
  #patBar{
    flex:1;height:14px;border:3px solid var(--ink);background:#fff;position:relative;overflow:hidden;
  }
  #patFill{height:100%;width:100%;background:var(--teal)}
  #patTick{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--ink)}
  #patStrip.urgent #patFill{background:var(--red)}
  #patStrip.urgent #patLab{color:var(--red);animation:patPulse .5s steps(2) infinite}
  @keyframes patPulse{50%{opacity:.45}}
  .miniBtn{
    border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:900;font-size:11px;
    padding:4px 8px;min-height:32px;letter-spacing:.05em;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;
  }
  .miniBtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  /* ---------- scene ---------- */
  #scene{
    flex:1 1 auto;min-height:0;position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 115%, var(--felt2) 0 62%, transparent 78%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 14px, transparent 14px 28px),
      var(--felt);
    border-bottom:3px solid var(--ink);
  }
  #scene.shake{animation:shake .5s linear}
  @keyframes shake{
    0%,100%{transform:translate(0,0)}15%{transform:translate(-8px,3px)}
    30%{transform:translate(7px,-3px)}45%{transform:translate(-6px,-2px)}
    60%{transform:translate(6px,2px)}75%{transform:translate(-4px,1px)}90%{transform:translate(3px,0)}
  }
  #moon{
    position:absolute;top:10px;right:12px;width:44px;height:44px;border-radius:50%;
    background:#fdf6d8;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  }
  #moon::after{content:"";position:absolute;top:9px;left:8px;width:9px;height:9px;border-radius:50%;background:#e8d9a0}
  #sign{
    position:absolute;top:12px;left:10px;background:var(--pink);border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);padding:3px 8px;font-size:13px;transform:rotate(-3deg);
  }
  #rail{
    position:absolute;left:4%;right:4%;top:8px;border-top:3px dashed rgba(255,255,255,.5);pointer-events:none;
  }
  /* faint aim guide: drops from the dropper coin's centre to the bottom of
     the play area; sits behind the tower and table so it reads as a hint,
     never a game element */
  #guide{
    position:absolute;left:50%;top:calc(16px + var(--dc) / 2);bottom:0;width:2px;margin-left:-1px;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.30) 0 6px, rgba(255,255,255,0) 6px 12px);
    z-index:3;pointer-events:none;will-change:transform;
  }
  #table{
    position:absolute;left:0;right:0;bottom:0;height:34px;
    background:repeating-linear-gradient(90deg,#8a5a2b 0 46px,#774c22 46px 92px);
    border-top:4px solid var(--ink);z-index:4;
  }
  #towerWrap{
    position:absolute;bottom:32px;left:50%;width:var(--tw);margin-left:calc(var(--tw) / -2);z-index:5;
    transform-origin:50% 100%;
  }
  #towerWrap.fallen{transition:transform .55s cubic-bezier(.6,-0.2,.8,1)}
  #tower{display:flex;flex-direction:column-reverse;align-items:center}
  .scoin{
    width:100%;height:var(--ch);border:var(--bw) solid var(--ink);margin-top:calc(var(--bw) * -1);
    position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden;
  }
  .scoin .eye{width:4px;height:4px;border-radius:50%;background:var(--ink)}
  .scoin .beak{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink)}
  /* distance simplification: as the camera zooms out the face detail drops
     away first, then the outline thins to a hairline — flat discs only */
  #tower[data-detail="mid"] .eye, #tower[data-detail="mid"] .beak,
  #tower[data-detail="flat"] .eye, #tower[data-detail="flat"] .beak{display:none}
  .scoin.c0{background:var(--gold)} .scoin.c1{background:#ffe066}
  .scoin.c2{background:var(--gold2)} .scoin.c3{background:#ffcf87}
  #base{
    height:12px;background:var(--ink);margin-top:2px;position:relative;
  }
  #base::after{content:"";position:absolute;inset:3px 8px;background:var(--red)}
  /* dropper + falling coin */
  .coin{
    position:absolute;width:var(--dc);height:var(--dc);border-radius:50%;z-index:8;
    background:radial-gradient(circle at 35% 32%, #fff3b0 0 18%, var(--gold) 45%, var(--gold2) 100%);
    border:var(--cbw) solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
  }
  .coin .face{position:relative;width:58%;height:50%}
  .coin .e{position:absolute;top:12%;width:20%;height:30%;border-radius:50%;background:var(--ink)}
  .coin .e.l{left:13%}.coin .e.r{right:13%}
  .coin .bk{position:absolute;left:50%;top:46%;transform:translateX(-50%);width:0;height:0;
    border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #e07b00}
  .coin .ring{position:absolute;inset:10%;border:2px dashed rgba(16,16,16,.55);border-radius:50%}
  #hoverCoin{top:16px;left:50%;margin-left:calc(var(--dc) / -2);will-change:transform}
  #fallCoin{display:none;will-change:transform,opacity}
  .particle{
    position:absolute;width:9px;height:9px;z-index:9;pointer-events:none;border:2px solid var(--ink);
  }
  .spark{
    position:absolute;width:14px;height:14px;z-index:9;pointer-events:none;
    background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);
  }
  #flashMsg{
    position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:10;
    font-size:24px;color:#fff;text-align:center;
    text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);
    pointer-events:none;opacity:0;white-space:nowrap;
  }
  #flashMsg.pop{animation:pop .9s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
  /* ---------- under scene ---------- */
  #underScene{flex:0 0 auto;padding:5px 8px 1px;background:var(--paper)}
  #decide{
    font-size:14px;font-weight:700;padding:2px 2px;min-height:24px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  /* ---------- controls ---------- */
  #controls{
    flex:0 0 auto;display:flex;gap:8px;padding:6px 8px 10px;background:var(--paper);
  }
  .bigBtn{
    flex:1;border:3.5px solid var(--ink);font-size:21px;
    padding:10px 4px;box-shadow:4px 4px 0 var(--ink);letter-spacing:.03em;min-height:56px;
  }
  .bigBtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  #btnDrop{background:var(--gold)}
  /* ---------- overlays ---------- */
  #overlay{
    position:absolute;inset:0;background:rgba(16,12,28,.72);z-index:50;
    display:none;align-items:center;justify-content:center;padding:18px;
  }
  #overlay.show{display:flex}
  .card{
    background:var(--paper);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);
    padding:20px 18px;max-width:340px;width:100%;text-align:center;max-height:92dvh;overflow:hidden;
  }
  .card h1{font-size:24px;margin:0 0 10px;line-height:1.15}
  .card h2{font-size:20px;margin:0 0 8px;line-height:1.2}
  .card p{font-size:16px;font-weight:500;line-height:1.45;margin:0 0 14px}
  .card .big{font-size:19px;font-weight:900}
  .cardBtn{
    border:3.5px solid var(--ink);background:var(--gold);
    font-size:18px;padding:11px 22px;box-shadow:4px 4px 0 var(--ink);width:100%;
  }
  .cardBtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .cardBtn.alt{background:var(--teal)}
  .spotTag{
    display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:900;
    letter-spacing:.1em;padding:3px 8px;margin-bottom:10px;
  }
  /* ---------- boot + main menu screens ---------- */
  .screen{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;padding:24px 22px;text-align:center;
  }
  .screen.show{display:flex}
  #boot{background:#171321;color:var(--paper);z-index:70}
  #boot .bTitle{font-size:30px;color:var(--gold);margin:16px 0 4px;text-shadow:3px 3px 0 #000}
  #boot .bSub{font-size:12px;font-weight:900;letter-spacing:.14em;opacity:.8;margin-bottom:24px}
  #loadBar{width:216px;max-width:80%;height:16px;border:3px solid var(--paper)}
  #loadFill{height:100%;width:0%;background:var(--gold);transition:width 1.1s linear}
  #boot .bHint{margin-top:12px;font-size:11px;font-weight:900;letter-spacing:.14em;opacity:.65}
  .bigCoin{
    width:76px;height:76px;border-radius:50%;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 35% 32%, #fff3b0 0 18%, var(--gold) 45%, var(--gold2) 100%);
    border:4px solid var(--gold);box-shadow:4px 4px 0 rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
  }
  .bigCoin .face{position:relative;width:58%;height:50%}
  .bigCoin .e{position:absolute;top:12%;width:20%;height:30%;border-radius:50%;background:var(--ink)}
  .bigCoin .e.l{left:13%}.bigCoin .e.r{right:13%}
  .bigCoin .bk{position:absolute;left:50%;top:46%;transform:translateX(-50%);width:0;height:0;
    border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #e07b00}
  #menu{background:var(--paper);z-index:60}
  .menuStack{display:flex;flex-direction:column-reverse;align-items:center;width:76px;margin-bottom:14px}
  .menuStack .scoin{width:100%}
  #menu .mTitle{font-size:40px;line-height:1.02;margin:0 0 8px}
  #menu .mSub{font-size:15px;font-weight:700;line-height:1.4;margin:0 0 24px;max-width:290px}
  .menuBtns{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px}
  #btnPlay{font-size:24px;padding:13px 22px}
  #btnMuteMenu{background:#fff;font-size:14px;padding:9px 22px}
  /* ---------- story panels ---------- */
  .panelArt{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);margin-bottom:12px;line-height:0;background:#171321}
  .panelArt svg{width:100%;height:auto;display:block}
  @media (prefers-reduced-motion: reduce){
    #scene.shake{animation:none}
    #flashMsg.pop{animation-duration:.01s}
    #patStrip.urgent #patLab{animation:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat" id="statStack"><div class="lab">STACK · GOAL 100</div><div class="val black" id="stackVal">0 / 100</div><div id="stackBar"><div id="stackFill"></div></div></div>
    <div class="stat" id="statLeft"><div class="lab">DEBT LEFT</div><div class="val black" id="leftVal">100</div></div>
  </div>

  <div id="patStrip">
    <div id="patLab">PATIENCE</div>
    <div id="patBar"><div id="patFill"></div><div id="patTick"></div></div>
    <button class="miniBtn" id="btnMute" aria-label="Toggle sound">SOUND ON</button>
  </div>

  <div id="scene">
    <div id="sign" class="black">THE GULL</div>
    <div id="moon"></div>
    <div id="rail"></div>
    <div id="guide"></div>
    <div id="hoverCoin" class="coin"><div class="ring"></div><div class="face"><div class="e l"></div><div class="e r"></div><div class="bk"></div></div></div>
    <div id="fallCoin" class="coin"><div class="ring"></div><div class="face"><div class="e l"></div><div class="e r"></div><div class="bk"></div></div></div>
    <div id="towerWrap"><div id="tower"></div><div id="base"></div></div>
    <div id="table"></div>
    <div id="flashMsg" class="black"></div>
  </div>

  <div id="underScene">
    <div id="decide">The tower waits.</div>
  </div>

  <div id="controls">
    <button class="bigBtn black" id="btnDrop">DROP</button>
  </div>

  <div id="overlay"><div class="card" id="cardBox"></div></div>

  <div id="menu" class="screen">
    <div class="menuStack" aria-hidden="true">
      <div class="scoin c0"><span class="eye"></span><span class="beak"></span><span class="eye"></span></div>
      <div class="scoin c1"><span class="eye"></span><span class="beak"></span><span class="eye"></span></div>
      <div class="scoin c2"><span class="eye"></span><span class="beak"></span><span class="eye"></span></div>
      <div class="scoin c3"><span class="eye"></span><span class="beak"></span><span class="eye"></span></div>
      <div class="scoin c0"><span class="eye"></span><span class="beak"></span><span class="eye"></span></div>
    </div>
    <h1 class="mTitle black">TILTED<br>STACK</h1>
    <p class="mSub">The Gull wants his hundred coins back — one stack, built by your hand, on his felt.</p>
    <div class="menuBtns">
      <button class="cardBtn black" id="btnPlay">PLAY</button>
      <button class="cardBtn black" id="btnMuteMenu">SOUND ON</button>
    </div>
  </div>

  <div id="boot" class="screen show">
    <div class="bigCoin" aria-hidden="true"><div class="face"><div class="e l"></div><div class="e r"></div><div class="bk"></div></div></div>
    <div class="bTitle black">TILTED STACK</div>
    <div class="bSub">THE GULL CASINO · LAST NIGHT</div>
    <div id="loadBar"><div id="loadFill"></div></div>
    <div class="bHint">LOADING…</div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var scene=$("scene"), towerWrap=$("towerWrap"), towerEl=$("tower"),
    hoverCoin=$("hoverCoin"), fallCoin=$("fallCoin"), guide=$("guide"), flash=$("flashMsg"),
    overlay=$("overlay"), cardBox=$("cardBox"), patStrip=$("patStrip");

var GOAL=100, FULL_CH=15, BASE_W=76, BASE_DC=52;
var DROP_SPEED=150;           // px per second, constant
var PAT_NORMAL=6, PAT_TOTAL=12;
/* Quantized landing offsets: a coin lands exactly one of 5 steps from the
   centre of the coin below — k in {-2,-1,0,1,2}, each step 0.22 of the
   tower width. Max |offset| is 0.44 of the width, so the coin always
   still lands on the stack. */
var STEP_FRAC=0.22, K_MAX=2, MAX_FRAC=STEP_FRAC*K_MAX;
var LEAN_PER_FRAC=0.9;        // lean added per tower-width of a landed coin's offset from the axis
var BEND=0.5;                 // top-of-live-section sideways bend at lean 1, in tower widths
var LOCK_N=10;                // only the top 10 coins are live; below that, locked

/* ---------------- state ---------------- */
var S=null;
function freshState(){
  // coins[i] (0 = bottom): { k: quantized step vs the coin below,
  //   frac: centre offset from the tower axis, in tower widths (on the step grid),
  //   frozen: rendered offset in tower widths, set once when the coin locks }
  return { stack:0, lean:0, phase:"story", over:false, coins:[] };
}
var dropX=0, dropDir=1, falling=false;
var readyAt=0, impatient=false, awaiting=false;
var M={ch:FULL_CH, z:1, tw:BASE_W, dc:BASE_DC, towerH:14, spanHalf:60, bw:2.5, pitch:FULL_CH-2.5};

/* ---------------- audio ---------------- */
var AC=null, muted=false;
function beep(freq,dur,type,vol){
  if(muted) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"square"; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.06,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+(dur||0.09));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+(dur||0.09));
  }catch(e){}
}
function sndLand(){ beep(520,0.08,"square",0.07); setTimeout(function(){beep(780,0.07,"square",0.05);},50); }
function sndPerfect(){ beep(880,0.09,"triangle",0.09); setTimeout(function(){beep(1320,0.12,"triangle",0.09);},70); }
function sndTopple(){ beep(160,0.3,"sawtooth",0.09); setTimeout(function(){beep(90,0.4,"sawtooth",0.09);},90); }
function sndWarn(){ beep(196,0.16,"sawtooth",0.08); setTimeout(function(){beep(147,0.2,"sawtooth",0.08);},140); }
function sndWin(){ var n=[660,880,1100,1320]; for(var i=0;i<n.length;i++){ (function(f,d){ setTimeout(function(){beep(f,0.14,"triangle",0.09);},d); })(n[i],i*110); } }

/* ---------------- modal queue (one at a time) ---------------- */
var modalQueue=[], modalOpen=false, modalAction=null;
function showCard(html,onBtn){
  modalQueue.push({html:html,onBtn:onBtn});
  pumpModal();
}
function pumpModal(){
  if(modalOpen||!modalQueue.length) return;
  var m=modalQueue.shift();
  modalOpen=true; modalAction=m.onBtn||null;
  cardBox.innerHTML=m.html;
  overlay.classList.add("show");
  var b=cardBox.querySelector("[data-act]");
  if(b) b.addEventListener("click",closeModal);
}
function closeModal(){
  overlay.classList.remove("show");
  modalOpen=false;
  var a=modalAction; modalAction=null;
  if(a) a();
  pumpModal();
}

/* ---------------- camera / metrics ----------------
   Every stacked coin zooms the camera out a little: coin height, tower
   width and dropper size all shrink by the same factor, and the dropper's
   travel span across the top grows. The whole tower always fits. */
function computeMetrics(){
  var sceneH=scene.clientHeight||360, sceneW=scene.clientWidth||360;
  var fitH=Math.max(60, sceneH-118);            // room for dropper + table
  // Zoom starts on coin 1: extra headroom begins at the value that makes
  // ch exactly FULL_CH at stack 0 and eases to zero by stack 99, so the
  // denominator grows (and the target shrinks) every single coin, while
  // the end scale at 99 and the fit headroom (denom >= stack+6) are kept.
  var head0=Math.max(0, fitH/FULL_CH-6);
  var denom=S.stack+6+head0*Math.max(0,(99-S.stack)/99);
  var ch=Math.min(FULL_CH, fitH/denom);
  var z=ch/FULL_CH;
  // Coin outline thins as the camera pulls back: full 2.5px up close,
  // then 1.6 / 1.1 / 0.8px hairlines — the stack stays gold, not black.
  var bw=ch>=12?2.5:(ch>=8?1.6:(ch>=5.5?1.1:0.8));
  M.ch=ch; M.z=z; M.bw=bw; M.pitch=ch-bw;       // pitch = visible rise per coin (borders overlap)
  M.tw=Math.max(10, BASE_W*z);
  M.dc=Math.max(14, BASE_DC*z);
  M.towerH=stackHeight(S.stack)+14;            // exact rendered height: coins + base
  var spanFrac=0.5+0.48*(1-z);                  // half-span as fraction of half scene width
  M.spanHalf=Math.max(20,(sceneW/2)*spanFrac - M.dc/2);
  var rs=document.documentElement.style;
  rs.setProperty("--ch",ch+"px");
  rs.setProperty("--tw",M.tw+"px");
  rs.setProperty("--dc",M.dc+"px");
  rs.setProperty("--bw",bw+"px");
  rs.setProperty("--cbw",Math.max(1.5,3.5*z)+"px");
}
/* Exact rendered height of n stacked coins: the first coin is a full ch,
   every coin above adds only pitch because its border overlaps the one below. */
function stackHeight(n){
  return n>0 ? n*M.pitch+M.bw : 0;
}
/* Coins with LOCK_N or more coins above them are locked. */
function lockCount(){
  return Math.max(0, S.stack-LOCK_N);
}
/* Sideways bend of live coin i, in tower widths: zero at the lock line,
   full lean bend at the top coin. Locked coins never use this. */
function bendAt(i){
  var lc=lockCount(), live=S.stack-lc;
  if(live<=0) return 0;
  var progress=(i-lc+1)/live;
  return S.lean*BEND*progress;
}
/* Rendered centre offset of coin i, in tower widths. A locked coin returns
   the value frozen at lock time — it never changes again. */
function coinRenderFrac(i){
  var c=S.coins[i];
  if(!c) return 0;
  if(i<lockCount()) return (c.frozen!=null?c.frozen:c.frac);
  return c.frac+bendAt(i);
}
function towerTopX(){
  // centre of the tower's top coin, px offset from scene centre
  if(!S||S.stack===0) return 0;
  return coinRenderFrac(S.stack-1)*M.tw;
}
function elapsedNow(){
  if(!readyAt) return 0;
  return (performance.now()-readyAt)/1000;
}

/* ---------------- rendering ---------------- */
function renderHUD(){
  $("stackVal").textContent=S.stack+" / "+GOAL;
  $("leftVal").textContent=GOAL-S.stack;
  $("stackFill").style.width=Math.min(100,S.stack/GOAL*100)+"%";
}
function renderTower(){
  computeMetrics();
  // keep the coin records in sync with the stack count
  while(S.coins.length<S.stack) S.coins.push({k:0,frac:0,frozen:null});
  if(S.coins.length>S.stack) S.coins.length=S.stack;
  var lc=lockCount();
  // Freeze any coin that has just crossed the lock line: capture the exact
  // offset it is rendered at now (its own offset + a whisper of bend, as the
  // bottom live coin) and never compute it again.
  for(var j=0;j<lc;j++){
    var cj=S.coins[j];
    if(cj.frozen==null) cj.frozen=cj.frac+S.lean*BEND/LOCK_N;
    cj.renderFrac=cj.frozen;
  }
  // Detail level from the zoom: full face up close, plain discs far out.
  towerEl.dataset.detail=M.ch>=11?"full":(M.ch>=7?"mid":"flat");
  var html="";
  for(var i=0;i<S.stack;i++){
    var c=S.coins[i], locked=i<lc, rf;
    if(locked){ rf=c.frozen; }
    else { rf=c.frac+bendAt(i); c.renderFrac=rf; }
    var bx=rf*M.tw;
    html+='<div class="scoin c'+(i%4)+'" data-i="'+i+'" data-locked="'+(locked?1:0)+'" data-bx="'+bx.toFixed(2)+'" style="transform:translateX('+bx.toFixed(2)+'px)"><span class="eye"></span><span class="beak"></span><span class="eye"></span></div>';
  }
  towerEl.innerHTML=html;
  renderHUD();
}
function setDecide(txt){ $("decide").textContent=txt; }
function resetPatience(){
  readyAt=performance.now();
  impatient=false;
  patStrip.classList.remove("urgent");
  $("patFill").style.width="100%";
}

/* ---------------- juice ---------------- */
function burst(x,y,n,cls,colors){
  for(var i=0;i<n;i++){
    var p=document.createElement("div");
    p.className=cls||"particle";
    p.style.background=colors[i%colors.length];
    p.style.left=(x-5)+"px"; p.style.top=(y-5)+"px";
    scene.appendChild(p);
    var ang=Math.random()*Math.PI*2, dist=26+Math.random()*46;
    var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-18;
    p.animate([
      {transform:"translate(0,0) rotate(0deg)",opacity:1},
      {transform:"translate("+dx+"px,"+dy+"px) rotate("+(Math.random()*260-130)+"deg)",opacity:0}
    ],{duration:480+Math.random()*220,easing:"cubic-bezier(.2,.8,.3,1)"});
    (function(el){ setTimeout(function(){el.remove();},760); })(p);
  }
}
function flashText(txt){
  flash.textContent=txt;
  flash.classList.remove("pop"); void flash.offsetWidth; flash.classList.add("pop");
}
function towerTopPoint(){
  var r=scene.getBoundingClientRect();
  return {x:r.width/2+towerTopX(), y:r.height-(32+M.towerH)};
}
/* Y (scene coords) of the top surface of a stack of n coins, using the
   current metrics — the exact line a falling coin must reach. */
function stackTopY(n){
  var r=scene.getBoundingClientRect();
  return r.height-(32+stackHeight(n)+14);
}

/* ---------------- run flow ---------------- */
function startRun(){
  S=freshState();
  S.phase="play";
  dropX=0; dropDir=1; falling=false; awaiting=false;
  towerWrap.classList.remove("fallen");
  towerWrap.style.transform="";
  renderTower();
  resetPatience();
  setDecide("Time the drop — dead centre keeps it standing.");
}
function winRun(){
  S.phase="win";
  sndWin();
  var c=towerTopPoint();
  burst(c.x,c.y-8,14,"spark",["#ffd23f","#fff3b0","#ffd23f"]);
  showCard(
    '<span class="spotTag">THE CONTRACT, FULFILLED</span>'+
    '<h2 class="black">THE DEBT IS PAID</h2>'+
    "<p>One hundred coins, one stack, built by your hand. The Gull signs the contract's last line and slides it into the tide.</p>"+
    '<button class="cardBtn black" data-act="1">PLAY AGAIN</button>',
    function(){ startRun(); }
  );
}
function loseRun(title,body){
  S.phase="lose";
  showCard(
    '<span class="spotTag">RUN OVER</span>'+
    '<h2 class="black">'+title+"</h2>"+
    "<p>"+body+"</p>"+
    '<p class="big">Stack reached: '+S.stack+" of "+GOAL+".</p>"+
    '<button class="cardBtn black" data-act="1">PLAY AGAIN</button>',
    function(){ startRun(); }
  );
}
function crashTower(after){
  sndTopple();
  scene.classList.remove("shake"); void scene.offsetWidth; scene.classList.add("shake");
  towerWrap.classList.add("fallen");
  var dir=S.lean!==0?Math.sign(S.lean):(Math.random()<0.5?-1:1);
  towerWrap.style.transform="rotate("+(dir*82)+"deg)";
  setTimeout(after,650);
}
function toppleLose(){
  crashTower(function(){
    loseRun("IT FELL.","One coin too crooked. The stack scatters across the felt — and the debt remains.");
  });
}
function patienceLose(){
  if(S.phase!=="play") return;
  S.phase="crashing";
  setDecide("Too late.");
  crashTower(function(){
    loseRun("HIS PATIENCE SNAPPED","Twelve seconds of dithering. The Gull sweeps the felt — stack, debt, and all.");
  });
}

/* ---------------- drop (synchronous resolution) ---------------- */
function drop(){
  if(!S||S.phase!=="play"||modalOpen||falling) return;
  var rawOffset=dropX-towerTopX();           // px from the top coin's centre

  /* ---- quantize: snap to one of 5 discrete steps ---- */
  var stepPx=STEP_FRAC*M.tw;
  var kReq=Math.max(-K_MAX,Math.min(K_MAX,Math.round(rawOffset/stepPx)));
  var prevFrac=S.stack>0?S.coins[S.stack-1].frac:0;
  var newFrac=Math.max(-MAX_FRAC,Math.min(MAX_FRAC,prevFrac+kReq*STEP_FRAC));
  var kEff=Math.round((newFrac-prevFrac)/STEP_FRAC);   // step actually taken after the on-stack clamp
  var perfect=newFrac===0;

  /* ---- resolve outcome NOW, synchronously ---- */
  S.coins.push({k:kEff,frac:newFrac,frozen:null});
  S.stack++;
  // Torque: every coin's weight pulls from where it sits on the axis, so
  // repeated off-centre landings keep accumulating lean until it topples.
  S.lean+=newFrac*LEAN_PER_FRAC;
  if(S.lean>1.2)S.lean=1.2; if(S.lean<-1.2)S.lean=-1.2;
  var toppled=Math.abs(S.lean)>0.85;
  var won=!toppled&&S.stack>=GOAL;
  awaiting=true;

  /* ---- decorative animation only ---- */
  falling=true;
  // Re-measure at the NEW stack's zoom so the fall ends exactly where the
  // re-rendered tower's top surface will be: the falling coin's bottom edge
  // travels the full distance and stops on contact with the previous top.
  computeMetrics();
  var sr=scene.getBoundingClientRect();
  var startX=sr.width/2+dropX;
  var landX=sr.width/2+coinRenderFrac(S.stack-1)*M.tw;
  var surfaceY=stackTopY(S.stack-1);
  fallCoin.style.display="flex";
  fallCoin.style.left=(startX-M.dc/2)+"px";
  fallCoin.style.top="16px";
  fallCoin.style.width=M.dc+"px"; fallCoin.style.height=M.dc+"px";
  hoverCoin.style.visibility="hidden";
  guide.style.visibility="hidden";
  var fallDist=Math.max(10, surfaceY-16-M.dc+2);   // +2px: a touch of contact overlap
  var anim=fallCoin.animate([
    {transform:"translate(0,0)"},
    {transform:"translate("+(landX-startX)+"px,"+fallDist+"px)"}
  ],{duration:260, easing:"cubic-bezier(.5,.1,.9,.75)"});

  anim.onfinish=function(){
    fallCoin.style.display="none";
    hoverCoin.style.visibility="visible";
    guide.style.visibility="visible";
    falling=false; awaiting=false;
    renderTower();
    if(toppled){ toppleLose(); return; }
    if(perfect){
      sndPerfect();
      var c=towerTopPoint();
      burst(c.x,c.y-6,10,"spark",["#ffd23f","#fff3b0","#ffd23f"]);
      flashText("PERFECT");
      setDecide("Dead centre. No lean. "+S.stack+" stacked.");
    }else{
      sndLand();
      var c2=towerTopPoint();
      burst(c2.x,c2.y-4,6,"particle",["#ffd23f","#ff6b9d","#2ec4b6"]);
      if(Math.abs(S.lean)>0.45) setDecide("Leaning hard — land the next one opposite.");
      else if(Math.abs(S.lean)>0.15) setDecide("It leans. Correct with the next drop.");
      else setDecide("Stacked. "+S.stack+" of "+GOAL+".");
    }
    if(won){ winRun(); return; }
    resetPatience();
  };
}

/* ---------------- main loop ---------------- */
var lastT=performance.now();
function loop(){
  var nowMs=performance.now();
  var dt=Math.min(0.05,(nowMs-lastT)/1000); lastT=nowMs;
  if(S&&S.phase==="play"&&!modalOpen){
    // dropper: constant-speed sweep across the top
    if(!falling){
      dropX+=dropDir*DROP_SPEED*dt;
      if(dropX>M.spanHalf){ dropX=M.spanHalf; dropDir=-1; }
      else if(dropX<-M.spanHalf){ dropX=-M.spanHalf; dropDir=1; }
      hoverCoin.style.transform="translateX("+dropX+"px)";
      guide.style.transform="translateX("+dropX+"px)";
    }
    // impatience shake: only the LIVE top coins tremble — the locked
    // column below the lock line never moves.
    if(impatient&&!towerWrap.classList.contains("fallen")){
      var jx=(Math.random()-0.5)*4;
      var els=towerEl.children;
      for(var ci=0;ci<els.length;ci++){
        if(els[ci].dataset.locked==="0"){
          els[ci].style.transform="translateX("+(parseFloat(els[ci].dataset.bx)+jx)+"px)";
        }
      }
    }
    // patience timer
    if(!awaiting&&!falling){
      var el=elapsedNow();
      $("patFill").style.width=Math.max(0,Math.min(100,(1-el/PAT_TOTAL)*100))+"%";
      if(el>=PAT_NORMAL&&!impatient){
        impatient=true;
        patStrip.classList.add("urgent");
        sndWarn();
        flashText("HE'S GETTING IMPATIENT");
        setDecide("He's getting impatient — drop the coin!");
      }
      if(el>=PAT_TOTAL){ patienceLose(); }
    }
  }
  requestAnimationFrame(loop);
}

/* ---------------- test hook (verification harness) ---------------- */
window.__TS={
  state:function(){
    var ks=[],fr=[],rf=[],fz=[];
    if(S){ for(var i=0;i<S.coins.length;i++){ var c=S.coins[i];
      ks.push(c.k); fr.push(+c.frac.toFixed(3));
      rf.push(+(c.renderFrac!=null?c.renderFrac:coinRenderFrac(i)).toFixed(3));
      fz.push(c.frozen!=null?+c.frozen.toFixed(3):null);
    } }
    return {
      stack:S?S.stack:0, lean:S?+S.lean.toFixed(3):0, phase:S?S.phase:"none",
      zoom:+M.z.toFixed(4), targetW:+M.tw.toFixed(1), coinH:+M.ch.toFixed(2),
      borderW:+M.bw.toFixed(2), pitch:+M.pitch.toFixed(2), detail:towerEl.dataset.detail||"full",
      lockCount:S?lockCount():0, stepPx:+(STEP_FRAC*M.tw).toFixed(2),
      coinKs:ks, coinFracs:fr, coinRenderFracs:rf, coinFrozen:fz,
      lastK:S&&S.coins.length?S.coins[S.coins.length-1].k:null,
      dropperX:+dropX.toFixed(1), topX:+towerTopX().toFixed(1),
      spanHalf:+M.spanHalf.toFixed(1),
      elapsed:+elapsedNow().toFixed(2), impatient:impatient, modalOpen:modalOpen,
      screen:$("boot").classList.contains("show")?"boot":($("menu").classList.contains("show")?"menu":"game")
    };
  },
  coinRects:function(){
    var sr=scene.getBoundingClientRect(), out=[];
    var els=towerEl.children;
    for(var i=0;i<els.length;i++){ var r=els[i].getBoundingClientRect();

        cx:+(r.left+r.width/2-sr.left).toFixed(2), top:+(r.top-sr.top).toFixed(2),
        bottom:+(r.bottom-sr.top).toFixed(2), w:+r.width.toFixed(2)});

  setElapsed:function(sec){ readyAt=performance.now()-sec*1000; },
  setLean:function(v){ S.lean=v; renderTower(); }
};
