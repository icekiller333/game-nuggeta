<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Daily Roguelike — The Last Post (2026-10-28)</title>
<style>
  :root{
    --ink:#111111;
    --paper:#FFF6D8;
    --sky:#BDE8FF;
    --pink:#FFB3C7;
    --yellow:#FFD93D;
    --green:#2E9E4F;
    --green-dark:#14532D;
    --brown:#8B5A2B;
    --brown-dark:#4A2E12;
    --blue:#1D6FD1;
    --blue-dark:#0B2E59;
    --red:#D92323;
    --gold:#FFB800;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:Verdana, Geneva, Tahoma, sans-serif;
    background:var(--sky);
    color:var(--ink);
    overflow:hidden;
  }
  #app{
    height:100dvh;
    max-width:560px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    background:
      radial-gradient(circle at 12% 88%, #8ED081 0 34px, transparent 35px),
      radial-gradient(circle at 88% 84%, #8ED081 0 44px, transparent 45px),
      linear-gradient(#BDE8FF 0 62%, #A8E063 62% 100%);
    border-left:4px solid var(--ink);
    border-right:4px solid var(--ink);
  }
  /* ---------- HUD ---------- */
  #hud{
    flex:0 0 auto;
    padding:8px 10px 6px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:5;
  }
  .hud-row{display:flex; align-items:center; gap:8px;}
  #stopName{
    background:var(--yellow);
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    font-weight:900;
    font-size:15px;
    letter-spacing:.4px;
    padding:5px 9px;
    white-space:nowrap;
  }
  .hud-spacer{flex:1;}
  .icon-btn{
    background:#FFFFFF;
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    font-weight:900;
    font-size:13px;
    padding:5px 8px;
    cursor:pointer;
    line-height:1;
    color:var(--ink);
  }
  .icon-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  #deliveredLabel{font-weight:900; font-size:14px; background:#FFFFFF; border:3px solid var(--ink); padding:4px 8px; white-space:nowrap;}
  #missPips{display:flex; gap:4px; align-items:center;}
  .pip{
    width:26px; height:26px;
    border:3px solid var(--ink);
    background:#FFFFFF;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:16px; color:var(--red);
  }
  .pip .xmark{visibility:hidden;}
  .pip.used{background:#FFC9C9;}
  .pip.used .xmark{visibility:visible;}
  #progressTrack{
    height:16px;
    border:3px solid var(--ink);
    background:#FFFFFF;
    overflow:hidden;
  }
  #progressFill{
    height:100%;
    width:0%;
    background:repeating-linear-gradient(45deg, var(--green) 0 12px, #57C878 12px 24px);
    transition:width .3s ease;
  }
  /* ---------- Scene ---------- */
  #scene{
    flex:1 1 auto;
    min-height:0;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px 12px;
  }
  /* post cart decoration */
  #cart{
    position:absolute;
    bottom:2px; left:50%;
    transform:translateX(-50%);
    width:230px; height:54px;
    pointer-events:none;
    opacity:.95;
  }
  #letterWrap{
    position:relative;
    z-index:3;
    width:min(320px, 84vw);
    height:200px;
    display:flex; align-items:center; justify-content:center;
  }
  #letter{
    position:relative;
    width:100%;
    height:184px;
    background:var(--paper);
    border:4px solid var(--ink);
    box-shadow:7px 7px 0 var(--ink);
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease;
    user-select:none;
    touch-action:manipulation;
  }
  #letter.selected{
    transform:translateY(-12px) rotate(-1.5deg);
    animation:wiggle .45s ease-in-out infinite;
  }
  #letter.rush{border-color:var(--ink); outline:5px solid var(--gold); outline-offset:-11px;}
  @keyframes wiggle{
    0%,100%{transform:translateY(-12px) rotate(-1.5deg);}
    50%{transform:translateY(-14px) rotate(1.5deg);}
  }
  #letter.shake{animation:shake .4s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-12px) rotate(-2deg);}
    40%{transform:translateX(12px) rotate(2deg);}
    60%{transform:translateX(-9px);}
    80%{transform:translateX(9px);}
  }
  #letter.fly{transition:transform .38s ease-in, opacity .38s ease-in;}
  .flap{
    position:absolute; top:0; left:0; right:0; height:64px;
    background:#FFE9A8;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    border-bottom:3px solid var(--ink);
  }
  .stamp{
    position:absolute; top:10px; right:10px;
    width:38px; height:46px;
    background:var(--pink);
    border:3px dashed var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .addr-lines{position:absolute; left:16px; bottom:16px; width:44%;}
  .addr-lines div{height:7px; background:var(--ink); margin-top:7px;}
  .addr-lines div:first-child{width:90%; margin-top:0;}
  .addr-lines div:nth-child(2){width:70%;}
  .addr-lines div:nth-child(3){width:80%;}
  .seal-zone{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; gap:14px;
  }
  .seal{
    border-radius:50%;
    border:3px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    background:#FFFFFF;
    flex:0 0 auto;
  }
  .seal.big{width:84px; height:84px;}
  .seal.small{width:58px; height:58px;}
  .seal svg{width:72%; height:72%; display:block;}
  #rushRing{
    position:absolute; top:8px; left:8px;
    width:46px; height:46px;
    display:none;
    z-index:4;
  }
  #rushRing.on{display:block;}
  #flash{
    position:absolute; inset:0;
    background:rgba(217,35,35,.45);
    opacity:0; pointer-events:none;
    z-index:6;
  }
  #flash.on{animation:flashA .35s ease;}
  @keyframes flashA{0%{opacity:1;}100%{opacity:0;}}
  #app.shakeScreen{animation:shake .35s ease;}
  .particle{
    position:absolute;
    width:11px; height:11px;
    border:2px solid var(--ink);
    pointer-events:none;
    z-index:8;
  }
  /* ---------- Bins ---------- */
  #bins{
    flex:0 0 auto;
    display:flex;
    gap:10px;
    padding:8px 10px 12px;
    z-index:5;
  }
  .bin{
    flex:1 1 0;
    min-width:0;
    height:148px;
    border:4px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:8px 4px 6px;
    touch-action:manipulation;
    user-select:none;
    color:var(--ink);
  }
  .bin:active{transform:translate(2px,2px); box-shadow:3px 3px 0 var(--ink);}
  .bin.bump{animation:bump .3s ease;}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
  .bin-toadstool{background:#CFF5D2;}
  .bin-hollow{background:#F3DFC2;}
  .bin-pond{background:#CFE8FF;}
  .bin-slot{
    width:78%; height:12px;
    background:var(--ink);
    margin-bottom:6px;
    flex:0 0 auto;
  }
  .bin-icon{width:52px; height:52px; flex:0 0 auto;}
  .bin-icon svg{width:100%; height:100%; display:block;}
  .bin-name{
    margin-top:5px;
    font-weight:900;
    font-size:14px;
    letter-spacing:.3px;
    background:#FFFFFF;
    border:3px solid var(--ink);
    padding:2px 6px;
    white-space:nowrap;
  }
  .bin-key{font-size:11px; font-weight:900; margin-top:3px; color:var(--ink);}
  .bin-band{
    width:82%; height:10px;
    border:3px solid var(--ink);
    margin-top:6px;
    flex:0 0 auto;
  }
  .bin-toadstool .bin-band{background:var(--green);}
  .bin-hollow .bin-band{background:var(--brown);}
  .bin-pond .bin-band{background:var(--blue);}
  /* ---------- Overlay / cards ---------- */
  #overlay{
    position:absolute; inset:0;
    background:rgba(17,17,17,.55);
    display:none;
    align-items:center; justify-content:center;
    padding:18px;
    z-index:20;
  }
  #overlay.on{display:flex;}
  .card{
    background:var(--paper);
    border:4px solid var(--ink);
    box-shadow:8px 8px 0 var(--ink);
    padding:22px 20px;
    max-width:420px;
    width:100%;
    text-align:center;
    max-height:calc(100dvh - 36px);
    overflow-y:auto;
  }
  .card p{
    font-size:19px;
    font-weight:700;
    line-height:1.45;
    margin:0 0 18px;
    color:var(--ink);
  }
  .card p.small{font-size:16px;}
  .big-btn{
    background:var(--yellow);
    border:4px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    font-family:inherit;
    font-weight:900;
    font-size:17px;
    padding:12px 26px;
    cursor:pointer;
    color:var(--ink);
    letter-spacing:.5px;
  }
  .big-btn:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink);}
  .result-title{
    font-size:30px; font-weight:900; margin:0 0 10px; letter-spacing:.5px;
  }
  .result-score{font-size:18px; font-weight:900; margin:0 0 18px;}
  #lawsList{text-align:left; margin:0 0 18px; padding:0; list-style:none;}
  #lawsList li{
    border:3px solid var(--ink);
    background:#FFFFFF;
    padding:8px 10px;
    margin-bottom:8px;
    font-weight:700;
    font-size:14px;
    line-height:1.35;
  }
  #lawsList li b{display:block; font-size:13px; letter-spacing:.4px;}
  .confetti{
    position:absolute; top:-16px;
    width:12px; height:16px;
    border:2px solid var(--ink);
    z-index:30; pointer-events:none;
  }
  @media (max-height:620px){
    #letterWrap{height:168px;}
    #letter{height:154px;}
    .bin{height:128px;}
    .bin-icon{width:42px; height:42px;}
    .seal.big{width:70px; height:70px;}
    .seal.small{width:50px; height:50px;}
  }
  @media (prefers-reduced-motion: reduce){
    #letter.selected{animation:none;}
    #app.shakeScreen{animation:none;}
  }
</style>
</head>
<body>
<div id="app">
  <!-- HUD -->
  <div id="hud">
    <div class="hud-row">
      <div id="stopName">TOADSTOOL LANE</div>
      <div class="hud-spacer"></div>
      <button class="icon-btn" id="lawsBtn" type="button" aria-label="Open laws sheet">LAWS</button>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Toggle sound">🔊</button>
    </div>
    <div class="hud-row">
      <div id="deliveredLabel">DELIVERED 0/30</div>
      <div class="hud-spacer"></div>
      <div id="missPips" aria-label="Mis-sorts remaining">
        <div class="pip" id="pip0"><span class="xmark">✕</span></div>
        <div class="pip" id="pip1"><span class="xmark">✕</span></div>
        <div class="pip" id="pip2"><span class="xmark">✕</span></div>
      </div>
    </div>
    <div id="progressTrack"><div id="progressFill"></div></div>
  </div>

  <!-- Scene -->
  <div id="scene">
    <svg id="cart" viewBox="0 0 230 54" aria-hidden="true">
      <rect x="20" y="8" width="150" height="26" fill="#FF8FA3" stroke="#111" stroke-width="4"/>
      <rect x="170" y="16" width="42" height="18" fill="#FFD93D" stroke="#111" stroke-width="4"/>
      <circle cx="52" cy="42" r="11" fill="#fff" stroke="#111" stroke-width="4"/>
      <circle cx="150" cy="42" r="11" fill="#fff" stroke="#111" stroke-width="4"/>
      <rect x="34" y="16" width="52" height="10" fill="#fff" stroke="#111" stroke-width="3"/>
    </svg>
    <div id="letterWrap">
      <div id="letter" role="button" aria-label="Letter. Tap to select." tabindex="0">
        <div class="flap"></div>
        <div class="stamp">🍄</div>
        <svg id="rushRing" viewBox="0 0 46 46" aria-hidden="true">
          <circle cx="23" cy="23" r="19" fill="#FFFFFF" stroke="#111" stroke-width="3"/>
          <circle id="rushArc" cx="23" cy="23" r="15" fill="none" stroke="#B97E00" stroke-width="6"
                  stroke-dasharray="94.2" stroke-dashoffset="0" transform="rotate(-90 23 23)"/>
        </svg>
        <div class="seal-zone" id="sealZone"></div>
        <div class="addr-lines"><div></div><div></div><div></div></div>
      </div>
    </div>
    <div id="flash"></div>
  </div>

  <!-- Bins -->
  <div id="bins">
    <div class="bin bin-toadstool" id="bin-toadstool" role="button" tabindex="0" aria-label="Toadstool bin">
      <div class="bin-slot"></div>
      <div class="bin-icon" data-icon="leaf" data-color="#14532D"></div>
      <div class="bin-band"></div>
      <div class="bin-name">TOADSTOOL</div>
      <div class="bin-key">KEY 1</div>
    </div>
    <div class="bin bin-hollow" id="bin-hollow" role="button" tabindex="0" aria-label="Hollow bin">
      <div class="bin-slot"></div>
      <div class="bin-icon" data-icon="key" data-color="#4A2E12"></div>
      <div class="bin-band"></div>
      <div class="bin-name">HOLLOW</div>
      <div class="bin-key">KEY 2</div>
    </div>
    <div class="bin bin-pond" id="bin-pond" role="button" tabindex="0" aria-label="Pond bin">
      <div class="bin-slot"></div>
      <div class="bin-icon" data-icon="drop" data-color="#0B2E59"></div>
      <div class="bin-band"></div>
      <div class="bin-name">POND</div>
      <div class="bin-key">KEY 3</div>
    </div>
  </div>

  <!-- Single-message overlay -->
  <div id="overlay"><div class="card" id="card"></div></div>
</div>

<script>
(function(){
  "use strict";
  // ---------- Seal artwork (item-specific shapes) ----------
  function sealSVG(shape, color){
    if(shape==="leaf"){
      return '<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M31 4 C47 10 54 24 50 38 C46 50 33 57 21 53 C10 49 4 37 8 24 C11 14 19 7 31 4 Z" fill="'+color+'" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M13 51 C21 37 33 22 47 11" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/><path d="M13 51 L8 57" stroke="#111" stroke-width="4" stroke-linecap="round"/></svg>';
    }
    if(shape==="key"){
      return '<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="22" cy="22" r="12" fill="none" stroke="'+color+'" stroke-width="7"/><path d="M31 31 L50 50 M42 42 L50 34 M47 47 L54 40" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="square"/></svg>';
    }
    return '<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 5 C30 5 12 28 12 39 C12 49 20 55 30 55 C40 55 48 49 48 39 C48 28 30 5 30 5 Z" fill="'+color+'" stroke="#111" stroke-width="3" stroke-linejoin="round"/><ellipse cx="23" cy="40" rx="5" ry="8" fill="#FFFFFF" opacity="0.75"/></svg>';
  }
  var DEST = {
    toadstool:{shape:"leaf", clear:"#2E9E4F", smudged:"#8FA38F"},
    hollow:{shape:"key", clear:"#8B5A2B", smudged:"#A79B8C"},
    pond:{shape:"drop", clear:"#1D6FD1", smudged:"#93A5B5"}
  };
  var DESTS = ["toadstool","hollow","pond"];
  var STOPS = [
    {name:"TOADSTOOL LANE"},
    {name:"HOLLOW WAY"},
    {name:"POND PATH"},
    {name:"NIGHT MARKET"},
    {name:"LAST LIGHT"}
  ];
  var SPOTLIGHTS = {
    2:"Smudged seals: read the shape.",
    3:"Gold letters: sort fast for 2.",
    4:"Two seals: the bigger one wins.",
    5:"Last stop: everything at once."
  };
  var LAWS = [
    {stop:"STOP 1 · TOADSTOOL LANE", text:"Match the seal to its village: green leaf, brown key, blue droplet."},
    {stop:"STOP 2 · HOLLOW WAY", text:"Smudged seals: read the shape, not the color."},
    {stop:"STOP 3 · POND PATH", text:"Gold letters: sort before the ring empties to deliver 2."},
    {stop:"STOP 4 · NIGHT MARKET", text:"Two seals: the bigger one wins."},
    {stop:"STOP 5 · LAST LIGHT", text:"Everything at once: smudged, gold, and double seals."}
  ];

  // ---------- State ----------
  var delivered = 0;
  var misses = 0;
  var currentStop = 1;      // 1..5, derived from delivered
  var spotlitStops = {1:true};
  var letter = null;        // {dest, seals:[{dest,big}], smudged, rush, rushEnds, rushDone}
  var selected = false;
  var busy = false;         // during fly animation only; resolution already done
  var playing = false;
  var over = false;
  var muted = false;
  var rushTimer = null;

  // ---------- DOM ----------
  var $ = function(id){ return document.getElementById(id); };
  var appEl=$("app"), letterEl=$("letter"), sealZone=$("sealZone"),
      stopNameEl=$("stopName"), deliveredEl=$("deliveredLabel"),
      fillEl=$("progressFill"), overlayEl=$("overlay"), cardEl=$("card"),
      flashEl=$("flash"), rushRing=$("rushRing"), rushArc=$("rushArc"),
      sceneEl=$("scene");

  document.querySelectorAll(".bin-icon").forEach(function(el){
    el.innerHTML = sealSVG(el.getAttribute("data-icon"), el.getAttribute("data-color"));
  });

  // ---------- Audio (synthesized, can never break input) ----------
  var actx = null;
  function tone(freq, dur, type, delay, vol){
    try{
      if(muted) return;
      if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; actx = new AC(); }
      if(actx.state==="suspended"){ actx.resume(); }
      var t = actx.currentTime + (delay||0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(vol||0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+dur+0.02);
    }catch(e){ /* audio is decorative only */ }
  }
  function sndSelect(){ tone(520,0.07,"square",0,0.06); }
  function sndGood(){ tone(660,0.12,"sine",0,0.12); tone(880,0.16,"sine",0.09,0.12); }
  function sndBonus(){ tone(660,0.1,"sine",0,0.12); tone(880,0.1,"sine",0.08,0.12); tone(1320,0.2,"sine",0.16,0.12); }
  function sndBad(){ tone(140,0.25,"sawtooth",0,0.12); tone(98,0.3,"sawtooth",0.05,0.1); }
  function sndWin(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f,0.22,"triangle",i*0.11,0.13); }); }

  // ---------- Overlay: exactly one message at a time ----------
  function showCard(html){
    cardEl.innerHTML = html;
    overlayEl.classList.add("on");
  }
  function hideCard(){ overlayEl.classList.remove("on"); cardEl.innerHTML=""; }

  // ---------- Opening sequence ----------
  function openStory1(){
    playing = false;
    showCard('<p>The Mushroom Lane post route has no postie left — except you.</p>' +
             '<button class="big-btn" id="cardBtn" type="button">NEXT</button>');
    $("cardBtn").addEventListener("click", function(){ sndSelect(); openStory2(); });
  }
  function openStory2(){
    showCard('<p>Five villages wait for their letters. Sort them right, and the lane stays lit.</p>' +
             '<button class="big-btn" id="cardBtn" type="button">NEXT</button>');
    $("cardBtn").addEventListener("click", function(){ sndSelect(); openHowTo(); });
  }
  function openHowTo(){
    showCard('<p class="small">Tap a letter, then its village bin — green seal to Toadstool, brown seal to Hollow, blue seal to Pond — and deliver 30 letters before 3 mis-sorts end the route.</p>' +
             '<button class="big-btn" id="cardBtn" type="button">START ROUTE</button>');
    $("cardBtn").addEventListener("click", function(){ sndSelect(); hideCard(); playing = true; nextLetter(); });
  }

  // ---------- Spotlight / results / laws ----------
  function showSpotlight(stop){
    playing = false;
    showCard('<p>'+SPOTLIGHTS[stop]+'</p>' +
             '<button class="big-btn" id="cardBtn" type="button">GOT IT</button>');
    $("cardBtn").addEventListener("click", function(){ sndSelect(); hideCard(); playing = true; dealLetter(); });
  }
  function showWin(){
    over = true; playing = false;
    showCard('<p class="result-title">ROUTE COMPLETE</p>' +
             '<p class="result-score">DELIVERED '+delivered+'/30</p>' +
             '<button class="big-btn" id="cardBtn" type="button">RETRY</button>');
    $("cardBtn").addEventListener("click", function(){ restart(); });
    confetti();
  }
  function showLose(){
    over = true; playing = false;
    showCard('<p class="result-title">ROUTE LOST</p>' +
             '<p class="result-score">DELIVERED '+delivered+'/30</p>' +
             '<button class="big-btn" id="cardBtn" type="button">RETRY</button>');
    $("cardBtn").addEventListener("click", function(){ restart(); });
  }
  function showLaws(){
    var wasPlaying = playing;
    playing = false;
    var items = "";
    for(var s = currentStop; s >= 1; s--){
      items += '<li><b>'+LAWS[s-1].stop+'</b>'+LAWS[s-1].text+'</li>';
    }
    showCard('<p class="result-title" style="font-size:24px;">LAWS</p>' +
             '<ul id="lawsList">'+items+'</ul>' +
             '<button class="big-btn" id="cardBtn" type="button">CLOSE</button>');
    $("cardBtn").addEventListener("click", function(){
      sndSelect(); hideCard();
      if(!over){ playing = wasPlaying; }
    });
  }

  // ---------- HUD ----------
  function stopFor(del){ return Math.min(5, Math.floor(del/6)+1); }
  function updateHUD(){
    stopNameEl.textContent = STOPS[currentStop-1].name;
    deliveredEl.textContent = "DELIVERED "+delivered+"/30";
    fillEl.style.width = Math.min(100, delivered/30*100)+"%";
    for(var i=0;i<3;i++){ $("pip"+i).classList.toggle("used", i < misses); }
  }

  // ---------- Letter generation ----------
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function makeLetter(stop){
    var dest = pick(DESTS);
    var L = {dest:dest, smudged:false, rush:false, double:false, other:null};
    if(stop===2){ L.smudged = true; }
    else if(stop===3){ L.rush = true; }
    else if(stop===4){ L.double = true; }
    else if(stop===5){
      L.smudged = Math.random() < 0.55;
      L.rush = Math.random() < 0.5;
      L.double = Math.random() < 0.5;
      if(!L.smudged && !L.rush && !L.double){ L.smudged = true; }
    }
    if(L.double){
      var others = DESTS.filter(function(d){ return d!==dest; });
      L.other = pick(others);
    }
    return L;
  }
  function renderLetter(){
    sealZone.innerHTML = "";
    var color = letter.smudged ? DEST[letter.dest].smudged : DEST[letter.dest].clear;
    var main = document.createElement("div");
    main.className = "seal big";
    main.innerHTML = sealSVG(DEST[letter.dest].shape, color);
    if(letter.double){
      var oColor = letter.smudged ? DEST[letter.other].smudged : DEST[letter.other].clear;
      var small = document.createElement("div");
      small.className = "seal small";
      small.innerHTML = sealSVG(DEST[letter.other].shape, oColor);
      // Randomize side; bigger seal is always the true destination.
      if(Math.random() < 0.5){ sealZone.appendChild(small); sealZone.appendChild(main); }
      else { sealZone.appendChild(main); sealZone.appendChild(small); }
    } else {
      sealZone.appendChild(main);
    }
    letterEl.classList.toggle("rush", !!letter.rush);
    selected = false;
    letterEl.classList.remove("selected","shake","fly");
    letterEl.style.transform = "";
    letterEl.style.opacity = "";
    // Rush ring
    stopRushTimer();
    if(letter.rush){
      letter.rushEnds = Date.now() + 6000;
      letter.rushDone = false;
      rushRing.classList.add("on");
      drawRing();
      rushTimer = setInterval(drawRing, 80);
    } else {
      rushRing.classList.remove("on");
    }
  }
  function drawRing(){
    if(!letter || !letter.rush) return;
    var remain = Math.max(0, letter.rushEnds - Date.now());
    var frac = remain / 6000;
    rushArc.style.strokeDashoffset = String(94.2 * (1 - frac));
    if(remain <= 0){ letter.rushDone = true; stopRushTimer(); }
  }
  function stopRushTimer(){ if(rushTimer){ clearInterval(rushTimer); rushTimer = null; } }

  function nextLetter(){
    // Stop transitions: spotlight first, letter dealt after GOT IT.
    var s = stopFor(delivered);
    if(s !== currentStop){
      currentStop = s;
      updateHUD();
    }
    if(!spotlitStops[currentStop] && SPOTLIGHTS[currentStop]){
      spotlitStops[currentStop] = true;
      showSpotlight(currentStop);
      return;
    }
    dealLetter();
  }
  function dealLetter(){
    letter = makeLetter(currentStop);
    renderLetter();
    updateHUD();
  }

  // ---------- Sorting (resolves synchronously in the tap handler) ----------
  function selectLetter(){
    if(!playing || busy || over) return;
    selected = true;
    letterEl.classList.add("selected");
    sndSelect();
  }
  function sortTo(destKey){
    if(!playing || busy || over || !letter) return;
    // Resolution happens HERE, synchronously — never in an animation callback.
    selected = true;
    letterEl.classList.add("selected");
    var correct = (destKey === letter.dest);
    if(correct){
      var gained = (letter.rush && !letter.rushDone && Date.now() < letter.rushEnds) ? 2 : 1;
      delivered = Math.min(30, delivered + gained);
      stopRushTimer();
      rushRing.classList.remove("on");
      if(gained === 2){ sndBonus(); } else { sndGood(); }
      updateHUD();
      flyToBin(destKey);
      if(delivered >= 30){
        busy = true;
        setTimeout(function(){ busy = false; sndWin(); showWin(); }, 420);
      } else {
        busy = true;
        setTimeout(function(){ busy = false; if(!over){ nextLetter(); } }, 400);
      }
    } else {
      misses += 1;
      sndBad();
      updateHUD();
      letterEl.classList.remove("shake");
      void letterEl.offsetWidth;
      letterEl.classList.add("shake");
      flashEl.classList.remove("on");
      void flashEl.offsetWidth;
      flashEl.classList.add("on");
      appEl.classList.remove("shakeScreen");
      void appEl.offsetWidth;
      appEl.classList.add("shakeScreen");
      if(misses >= 3){
        over = true;
        setTimeout(showLose, 450);
      }
    }
  }
  function flyToBin(destKey){
    var bin = $("bin-"+destKey);
    if(bin){ bin.classList.remove("bump"); void bin.offsetWidth; bin.classList.add("bump"); }
    try{
      var lr = letterEl.getBoundingClientRect();
      var br = bin.getBoundingClientRect();
      var dx = (br.left + br.width/2) - (lr.left + lr.width/2);
      var dy = (br.top + br.height/2) - (lr.top + lr.height/2);
      letterEl.classList.add("fly");
      letterEl.style.transform = "translate("+dx+"px,"+dy+"px) scale(0.25) rotate(8deg)";
      letterEl.style.opacity = "0.2";
    }catch(e){ /* visual only */ }
    particles(destKey);
  }
  function particles(destKey){
    try{
      var bin = $("bin-"+destKey);
      var sr = sceneEl.getBoundingClientRect();
      var br = bin.getBoundingClientRect();
      var cx = br.left - sr.left + br.width/2;
      var cy = br.top - sr.top + 10;
      var colors = ["#FFD93D","#FF8FA3","#2E9E4F","#1D6FD1","#FFB800"];
      for(var i=0;i<12;i++){
        var p = document.createElement("div");
        p.className = "particle";
        p.style.background = colors[i % colors.length];
        p.style.left = cx+"px"; p.style.top = cy+"px";
        sceneEl.appendChild(p);
        (function(el){
          var ang = Math.random()*Math.PI*2, dist = 40 + Math.random()*60;
          var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 30;
          el.animate([
            {transform:"translate(0,0) rotate(0deg)", opacity:1},
            {transform:"translate("+dx+"px,"+(dy+70)+"px) rotate("+(Math.random()*260-130)+"deg)", opacity:0}
          ], {duration:550+Math.random()*250, easing:"ease-out"});
          setTimeout(function(){ el.remove(); }, 850);
        })(p);
      }
    }catch(e){ /* visual only */ }
  }
  function confetti(){
    try{
      var colors = ["#FFD93D","#FF8FA3","#2E9E4F","#1D6FD1","#FFB800","#B983FF"];
      for(var i=0;i<40;i++){
        var c = document.createElement("div");
        c.className = "confetti";
        c.style.background = colors[i % colors.length];
        c.style.left = Math.random()*100+"%";
        appEl.appendChild(c);
        (function(el){
          el.animate([
            {transform:"translateY(0) rotate(0deg)", opacity:1},
            {transform:"translateY(105dvh) rotate("+(Math.random()*720-360)+"deg)", opacity:0.9}
          ], {duration:1800+Math.random()*1400, delay:Math.random()*500, easing:"ease-in"});
          setTimeout(function(){ el.remove(); }, 3800);
        })(c);
      }
    }catch(e){ /* visual only */ }
  }

  function restart(){
    delivered = 0; misses = 0; currentStop = 1;
    spotlitStops = {1:true};
    letter = null; selected = false; busy = false; over = false;
    stopRushTimer();
    rushRing.classList.remove("on");
    hideCard();
    updateHUD();
    playing = true;
    dealLetter();
  }

  // ---------- Input ----------
  letterEl.addEventListener("click", selectLetter);
  letterEl.addEventListener("keydown", function(e){
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); selectLetter(); }
  });
  DESTS.forEach(function(d){
    var bin = $("bin-"+d);
    bin.addEventListener("click", function(){ sortTo(d); });
    bin.addEventListener("keydown", function(e){
      if(e.key==="Enter" || e.key===" "){ e.preventDefault(); sortTo(d); }
    });
  });
  document.addEventListener("keydown", function(e){
    if(overlayEl.classList.contains("on")) return;
    if(e.key==="1"){ sortTo("toadstool"); }
    else if(e.key==="2"){ sortTo("hollow"); }
    else if(e.key==="3"){ sortTo("pond"); }
  });
  $("soundBtn").addEventListener("click", function(){
    muted = !muted;
    this.textContent = muted ? "🔇" : "🔊";
    if(!muted){ sndSelect(); }
  });
  $("lawsBtn").addEventListener("click", function(){
    if(overlayEl.classList.contains("on")) return;
    sndSelect();
    showLaws();
  });

  // ---------- Boot ----------
  updateHUD();
  letter = makeLetter(1);
  renderLetter();
  openStory1();
})();
</script>
</body>
</html>
