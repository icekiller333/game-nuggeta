<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parry Card King</title>
<style>
:root{color-scheme:dark;--ink:#e9e2d0}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:#07060a;color:var(--ink);font-family:Georgia,'Hiragino Mincho ProN','Yu Mincho',serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
#top{padding-top:10px}
#enn{font-size:15px;letter-spacing:.14em}
.bar{height:9px;background:#1a1420;border:1px solid #3a2f44;border-radius:5px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;width:100%;background:#d6303a;transition:width .15s}
#phpb{background:#5bc98a}
#tb{background:#fff;transition:none}
#omen{display:flex;gap:6px;align-items:center;font-size:12px;opacity:.9;margin-top:4px}
.chip{width:30px;height:30px;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-size:18px;border-radius:50%;background:#0b080e}
.chip:first-of-type{box-shadow:0 0 12px var(--c);transform:scale(1.12)}
#mid{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;text-align:center}
#tk{font-size:56px;line-height:1;text-shadow:0 0 22px currentColor}
#tn{font-size:13px;letter-spacing:.2em;text-shadow:0 2px 4px #000;min-height:16px}
#mid .bar{width:70%;height:6px}
#bot{padding-bottom:8px}
#pstat{display:flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.08em}
#pstat .bar{flex:1;margin:0}
#stk{color:#f0c24b;min-width:80px;text-align:right}
#cw{position:relative;height:250px;margin-top:8px;pointer-events:auto;touch-action:none}
.card{--c:#999;position:absolute;left:50%;top:0;margin-left:-88px;width:176px;height:246px;border-radius:14px;border:2px solid var(--c);background:linear-gradient(160deg,#1a1320,#0a070d);box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 30px #000a;display:flex;flex-direction:column;align-items:center;padding:10px 8px;text-align:center}
.card .tag{font-size:10px;letter-spacing:.3em;opacity:.6}
.card .k{font-size:88px;line-height:1;color:var(--c);text-shadow:0 0 18px var(--c);margin-top:8px}
.card .nm{letter-spacing:.22em;font-size:15px;margin-top:4px}
.card .ds{font-size:12px;opacity:.78;margin-top:auto;line-height:1.3}
.pk{opacity:.55;filter:brightness(.6)}
#p2{transform:translate(-26px,-6px) rotate(-7deg) scale(.94)}
#p1{transform:translate(22px,-8px) rotate(6deg) scale(.96)}
#card{touch-action:none;cursor:grab;transition:transform .15s}
.pop{animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.86) translateY(16px);opacity:.3}to{transform:none;opacity:1}}
.fly{transition:transform .26s ease-in,opacity .26s;pointer-events:none}
#btns{display:flex;gap:10px;margin-top:8px;pointer-events:auto}
button{font:inherit;color:var(--ink);background:#150f1a;border:1px solid #5a4a66;border-radius:8px;padding:12px;letter-spacing:.14em;cursor:pointer;touch-action:manipulation}
button:active{background:#2a1c33}
#btns button{flex:1}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle,#0b0710d8,#050408f2);z-index:5}
#ov h1{font-size:clamp(34px,9vw,64px);letter-spacing:.12em;margin:0;color:#e9e2d0;text-shadow:0 0 30px #d6303a}
#ov h2{margin:0;font-weight:normal;letter-spacing:.14em}
#ov p{max-width:440px;line-height:1.55;margin:0;font-size:15px;opacity:0;animation:fi .9s forwards}
#ov p.s{opacity:.75;font-size:13px}
.big{font-size:90px;color:#d6303a;text-shadow:0 0 30px #d6303a;line-height:1}
@keyframes fi{to{opacity:.9}}
.row{display:flex;gap:10px;justify-content:center}
.rc{position:relative;left:auto;top:auto;margin:0;width:min(29vw,150px);height:min(46vw,214px);cursor:pointer;padding:8px 4px}
.rc .k{font-size:min(14vw,58px)}
.rc .ds{font-size:10px}
.rc:active{transform:scale(.96)}
.cc{position:relative;left:auto;top:auto;margin:0;width:74px;height:100px;padding:4px;cursor:pointer}.cc .k{font-size:34px;margin-top:2px}.cc .nm{font-size:9px;letter-spacing:.05em}
#fl{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:3}
.bn{position:fixed;left:50%;top:44%;font-weight:bold;letter-spacing:.12em;text-shadow:0 0 18px currentColor,0 2px 0 #000;white-space:nowrap;pointer-events:none;z-index:4}
#hl{position:fixed;display:none;border:2px solid #f0c24b;border-radius:14px;box-shadow:0 0 0 100vmax rgba(4,2,8,.64),0 0 24px #f0c24b;pointer-events:none;z-index:6;animation:hlp 1.1s infinite}
@keyframes hlp{50%{border-color:#fff}}
#tp{position:fixed;display:none;left:50%;transform:translateX(-50%);width:min(92vw,420px);background:#120c18f2;border:1px solid #f0c24b;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.45;text-align:center;box-shadow:0 0 30px #000;z-index:7;pointer-events:none}
#tp button{display:block;width:100%;margin-top:10px;pointer-events:auto}
#tps{display:block;pointer-events:auto;margin-top:8px;opacity:.55;font-size:11px;text-decoration:underline;cursor:pointer}
#card.go{box-shadow:0 0 40px var(--c),0 0 90px var(--c)}#card.go::after,#card.sk::after{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:24px;font-weight:bold;letter-spacing:.2em;text-shadow:0 0 14px currentColor}#card.go::after{content:'PLAY';color:#f0c24b}#card.sk::after{content:'SKIP';color:#99a}
#ov.tl{background:radial-gradient(circle at 50% 30%,#0000 0,#050408d0 78%)}
#ov h1{line-height:1.05;animation:flick 5s infinite}@keyframes flick{0%,100%{text-shadow:0 0 30px #d6303a}45%{text-shadow:0 0 52px #ff4a55}50%{text-shadow:0 0 18px #d6303a}}
.fan{position:relative;height:140px;width:100%}.tc{left:50%;top:0;margin-left:-44px;width:88px;height:124px;padding:6px 4px;transform:translate(var(--x),var(--y)) rotate(var(--r));animation:fl 3.2s ease-in-out infinite}.tc .k{font-size:44px;margin-top:10px}.tc .nm{font-size:10px}@keyframes fl{50%{translate:0 -9px}}
button.pri{font-size:18px;padding:14px 30px;border-color:#f0c24b;box-shadow:0 0 24px #f0c24b66;animation:pul 2s infinite}@keyframes pul{50%{box-shadow:0 0 44px #f0c24bcc}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}#ov p{opacity:.9}}
button.gold{border-color:#f0c24b;color:#f0c24b}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:8;padding:6px 10px;font-size:16px;opacity:.7}
#ov{overflow-y:auto;justify-content:safe center}
</style></head><body>
<canvas id="c"></canvas><div id="fl"></div><div id="fx"></div>
<div id="ui">
 <div id="top"><span id="enn"></span><div class="bar"><i id="enhp"></i></div><div id="omen"></div></div>
 <div id="mid"><div id="tk"></div><div id="tn"></div><div class="bar"><i id="tb"></i></div></div>
 <div id="bot">
  <div id="pstat"><span>侍</span><div class="bar"><i id="phpb"></i></div><span id="phpt"></span><span id="dk"></span><span id="stk"></span></div>
  <div id="cw"><div class="card pk" id="p2"></div><div class="card pk" id="p1"></div><div class="card" id="card"></div></div>
  <div id="btns"><button id="bl">◀ SKIP</button><button id="br">PLAY ▶</button></div>
 </div>
</div>
<button id="mute" onclick="toggleMute()">🔊</button><div id="hl"></div><div id="tp"><div id="tpt"></div><button id="tpb" onclick="tpb()">CONTINUE</button><small id="tps" onclick="tutDone()">skip tutorial</small></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a);
const cv=$('#c'),ctx=cv.getContext('2d');let W,H;
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();

/* ---------- data ---------- */
const AT={L:{k:'←',n:'LEFT',c:'#d6303a'},R:{k:'→',n:'RIGHT',c:'#3aa0d8'},U:{k:'↑',n:'UP',c:'#5bc98a'},D:{k:'↓',n:'DOWN',c:'#a35be0'},LU:{k:'↖',n:'UP-LEFT',c:'#ff8a3d'},LD:{k:'↙',n:'DOWN-LEFT',c:'#e0509a'},RU:{k:'↗',n:'UP-RIGHT',c:'#3ad8c8'},RD:{k:'↘',n:'DOWN-RIGHT',c:'#d8d03a'}};
const CARDS={
guard:{n:'Ukeru',k:'受',kind:'counter',ct:'SLASH',d:'Counters SLASH',col:'#d6303a'},
side:{n:'Sakeru',k:'避',kind:'counter',ct:'THRUST',d:'Counters THRUST',col:'#3aa0d8'},
break:{n:'Kudaku',k:'砕',kind:'counter',ct:'GRAB',d:'Counters GRAB',col:'#a35be0'},
kagami:{n:'Kagami',k:'鏡',kind:'counter',ct:'ANY',d:'Counters anything. Shorter window',col:'#cfd8e6'},
cut:{n:'Kiri',k:'斬',kind:'atk',dmg:3,hits:1,d:'3 dmg. Each strike in a window chains +1',col:'#f0c24b'},
flurry:{n:'Ranbu',k:'乱',kind:'atk',dmg:1,hits:4,d:'4 rapid hits',col:'#f0c24b'},
iai:{n:'Iai',k:'居',kind:'atk',dmg:9,hits:1,d:'9 dmg. Collapses the window',col:'#ff8a3d'},
mend:{n:'Iyasu',k:'癒',kind:'util',d:'Heal 5',col:'#5bc98a'},
ink:{n:'Sumi',k:'墨',kind:'util',d:'+2s to the parry window',col:'#5bc98a'},
dread:{n:'Kyō',k:'怖',kind:'curse',d:'Cursed. Play: lose 2 HP, destroy it',col:'#c0267a'}};
CARDS.pl={n:'Parry Left',k:'左',kind:'counter',ct:'L',d:'Parries attacks from the LEFT',col:'#d6303a'};CARDS.pr={n:'Parry Right',k:'右',kind:'counter',ct:'R',d:'Parries attacks from the RIGHT',col:'#3aa0d8'};CARDS.kasane={n:'Kasane',k:'重',kind:'atk',dmg:2,hits:1,d:'2 dmg. DOUBLE if played after another strike',col:'#f0c24b'};CARDS.cut.d='3 dmg. +1 per strike before it';
const KL={counter:'COUNTER',atk:'WEAPON',util:'SPIRIT',curse:'CURSE'};
const MON=[
{n:'The Drowned Retainer',sub:'He still bows to a court of water.',hp:22,pat:['SLASH','SLASH','THRUST'],tele:2.5,dmg:4,win:3.2,t:0},
{n:'The Hundred-Eye Monk',sub:'Every eye is a prayer that was never answered.',hp:30,pat:['THRUST','GRAB','SLASH','THRUST'],tele:2.1,dmg:5,win:3,t:1},
{n:'The Pale Shogun',sub:'He drank the moon. It is still drinking him.',hp:48,pat:['SLASH','THRUST','GRAB','GRAB','SLASH','THRUST'],tele:1.7,dmg:6,win:2.8,t:2}];
const POOL=['cut','kasane','flurry','iai','pl','pr','kagami','mend','ink'];

/* ---------- audio ---------- */
let AC;function au(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function tone(f,d,ty='sine',v=.15,f2){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start();o.stop(t+d)}
const NB={};function noise(d,v=.2,fr=1200){const n=AC.sampleRate*d|0,k=d+'';let b=NB[k];if(!b){b=NB[k]=AC.createBuffer(1,n,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n)}const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fr;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start()}
const SFX={flick:()=>noise(.06,.15,4000),warn:()=>tone(110,.4,'sawtooth',.12,70),
parry:()=>{const k=1+Math.min(G?G.streak:0,8)*.07;tone(1800*k,.3,'triangle',.2,900*k);tone(2700*k,.15,'square',.07);noise(.12,.3,6000)},
hit:()=>{noise(.15,.4,2500);tone(160,.15,'square',.14,50)},hurt:()=>{tone(90,.35,'sawtooth',.3,40);noise(.25,.4,500)},
chime:()=>{tone(2200,.25,'sine',.1,3000);tone(3300,.2,'sine',.06)},tick:()=>tone(900,.05,'square',.06),whiff:()=>tone(220,.1,'triangle',.08,150),heal:()=>tone(520,.3,'sine',.12,880),die:()=>{tone(200,1,'sawtooth',.2,30);noise(.8,.4,800)}};
function sfx(n){if(muted)return;try{au();SFX[n]()}catch(e){}}

/* ---------- state ---------- */
const K={SWIPE:70,SPARKLE:.4,HP:30,HEAL:3,RUN:21,MAX_REFUSALS:5,PARTS:500,FLAT_START:6,FLAT_END:3,BOSS:{hp:90,tele:1.1,dmg:11,win:1.5}};
let screen='title',G,F,freeze=0,shk=0,T=0,tut=null,ts=1,zoom=0;const rings=[],RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
const parts=[],slashes=[],floats=[],ash=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),s:R(.02,.06)}));
const MX=()=>W/2,MY=()=>H*.38,MS=()=>Math.min(W/420,H/900);
function spawn(x,y,n,col,sp=300,life=.6,g=600,sz=3){n=Math.min(n,K.PARTS-parts.length);for(let i=0;i<n;i++){const a=R(0,6.283),s=R(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.2,l:life*R(.6,1),L:life,col,g,sz})}}
function flash(c,o=.4){const f=$('#fl');f.style.background=c;f.animate([{opacity:o},{opacity:0}],{duration:300})}
function banner(t,c='#fff',sz=44){const b=document.createElement('div');b.className='bn';b.textContent=t;b.style.color=c;b.style.fontSize=sz+'px';$('#fx').appendChild(b);b.animate([{transform:'translate(-50%,-50%) scale(1.7)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.2},{transform:'translate(-50%,-80%) scale(1)',opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>b.remove()}

/* ---------- game flow ---------- */
function newRun(){G={hp:K.HP,max:K.HP,deck:['pl','cut'],disc:[],dirs:['L'],ref:0,bp:true,cnt:{fist:0,mace:0},mi:0,streak:0,best:0}}
function ov(h){const o=$('#ov');o.className='';o.innerHTML=h;o.style.display='flex'}
const hideOv=()=>$('#ov').style.display='none';
function titleOld(){screen='title';F=null;ov(`<div class="big">侍</div><h1>PARRY CARD KING</h1><p class="s" style="animation-delay:.3s">The moon did not set.</p>
<p class="s" style="animation-delay:.6s">Enemies strike from 8 directions. Play the matching block, then spend the broken guard on weapons.<br><br><b>Swipe left</b> to cycle · <b>swipe right/up</b> to play<br>(or ← / → keys, or the buttons)</p><button onclick="go()">DRAW YOUR BLADE</button><button onclick="start(1)">HOW TO PLAY</button>`)}
function start(g){au();tut=null;hideTut();newRun();G.guide=!!g;if(seen.lore){chapter();return}mark('lore');ov(`<h2>序</h2><p style="animation-delay:.2s">The moon fell upon Kōyō and did not set. Under it the dead rose to serve a Hollow Shogunate that rules by the turning of cards.</p>
<p style="animation-delay:1.2s">You were the Card King's last retainer. His deck is every duel he ever won — each card a kata, a memory of a blade. When the moon drank him, the deck remained. It chose you.</p>
<p style="animation-delay:2.2s">Read the omens. Turn the cards. Answer every blow — and when a guard breaks, cut.</p><button onclick="chapter()">ENTER THE SUNKEN COURT</button>`)}
function chapter(){const m=makeMon(G.mi);ov(`<div class="big">${G.mi>=K.RUN?'王':G.mi+1}</div><h2>${m.n}</h2><p style="animation-delay:.3s">${m.sub}</p><p class="s" style="animation-delay:.6s">${G.mi>=K.RUN?'The boss awaits':'Fight '+(G.mi+1)+' of '+K.RUN} · ${tot()} cards · flatfooted ${m.win.toFixed(1)}s · HP ${G.hp}/${G.max}<br>Enemy attack directions: ${G.dirs.map(d=>d===G.nd?'<b style="color:#f0c24b">'+AT[d].k+' NEW</b>':AT[d].k).join(' ')}${gaps()}</p><button onclick="startFight()">FACE IT</button>`)}
function startFight(){au();const m=tut?TM:makeMon(G.mi);if(!tut)fullShuffle();F={m,hp:m.hp,max:m.hp,pi:0,phase:'idle',t:1.6,dur:1,atk:null,combo:0,flash:0,dying:false,dyp:0,winMax:1};screen='fight';hideOv();$('#enn').textContent=m.n;renderCard();renderOmen();if(m.boss&&!seen.boss){mark('boss');pop=1;showPop('<small style="opacity:.6">BOSS</small><br>The Moon-Eater is flatfooted for only <b>1.5s</b> after a parry, its attacks come faster and hit harder, and attacking it while it is <b>not</b> flatfooted gets you <b>countered</b>.','#top',1)}G.nd=null;if(G.guide&&G.mi===0&&!tut){tut={i:0,hold:true,tap:true,c:0};tutShow()}}
function startTele(){const m=F.m;F.sp=0;F.atk=m.pat[F.pi%m.pat.length];F.dur=F.t=m.tele*(m.t===2&&F.hp<F.max/2?.8:1);F.phase='tele';sfx('warn');renderOmen()}
function enemyHit(){const m=F.m;G.streak=0;G.hp-=m.dmg;shk=24;freeze=.14;zoom=.09;vib(90);hud('#bot');sfx('hurt');flash('#d6303a',.6);
 slashes.push({x:W/2,y:H*.5,a:.7,l:.3,L:.3,col:AT[F.atk].c,len:Math.max(W,H)*.7});
 floats.push({x:W/2,y:H*.55,t:'-'+m.dmg,col:'#ff5a5a',l:.9,sz:48});
 G.deck.splice(1+(Math.random()*2|0),0,'dread');banner('CURSED  怖','#c0267a',30);
 if(tut)G.hp=Math.max(G.hp,10);F.pi++;F.phase='idle';F.t=.9;renderCard();renderOmen();if(G.hp<=0)die()}
function parry(c){const p=F.t/F.dur;G.streak++;G.best=Math.max(G.best,G.streak);
 F.winMax=F.t=Math.max(.8,F.m.win+(c.ct==='ANY'?-1.2:0));F.phase='stagger';F.combo=0;F.pi++;
 freeze=.16;shk=12;ts=.35;zoom=.07;rings.push({x:MX(),y:MY(),r:Math.min(W,H)*.7,l:.55,L:.55,col:'#ffe27a'},{x:MX(),y:MY(),r:Math.min(W,H)*.45,l:.4,L:.4,col:'#fff'});floats.push({x:W/2,y:H*.3,t:'受',col:'#fff',l:.7,sz:140});vib(35);$('#stk').animate([{transform:'scale(1.8)'},{transform:'none'}],{duration:300});sfx('parry');flash('#f0c24b',.45);spawn(MX(),MY(),44,'#ffe27a',560,.7,500,3);
 banner((p>.55?'PERFECT PARRY':'PARRY!')+(G.streak>1?'  x'+G.streak:''),'#f0c24b');renderOmen();tutEv('parry')}
function hit(d,big,f){if(F!==f||F.dying)return;F.hp=Math.max(0,F.hp-d);F.flash=.1;zoom=Math.max(zoom,big?.05:.02);if(big)ts=.4;vib(big?40:12);hud('#top');shk=Math.max(shk,big?16:7);freeze=Math.max(freeze,big?.1:.03);
 const x=MX()+R(-40,40),y=MY()+R(-60,40);slashes.push({x,y,a:R(-1.2,1.2),l:.25,L:.25,col:big?'#ff8a3d':'#fff',len:230});
 spawn(x,y,big?28:12,'#d6303a',380,.5,700,3);floats.push({x,y:y-20,t:'-'+d,col:big?'#ff8a3d':'#f0c24b',l:.8,sz:big?46:30});sfx('hit');if(F.hp<=0)killMon()}
function killMon(){if(tut)tutDone();F.dying=true;F.phase='dead';shk=30;freeze=.25;ts=.25;zoom=.1;vib([60,40,120]);sfx('die');flash('#fff',.7);spawn(MX(),MY(),120,'#d6303a',700,1.2,300,4);
 banner(G.mi===K.RUN?'THE MOON BREAKS':'SLAIN','#f0c24b',50);setTimeout(afterFight,1700)}
function die(){if(F.phase==='dead')return;F.phase='dead';F.dying=false;sfx('die');setTimeout(()=>{screen='dead';ov(`<div class="big">死</div><h2>YOU FELL</h2><p style="animation-delay:.3s">The moon keeps your card. Your face joins the deck.</p><p class="s">Fell in fight ${G.mi+1} · best streak ${G.best}</p><button onclick="start()">RISE AGAIN</button>`)},900)}

function reward(){screen='reward';const ids=pickRew();
