<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Orbit Gardener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <style>
      :root{
        --ink:#14100a;
        --paper:#fff6d8;
        --gold:#ffd93d;
        --gold-deep:#f5a623;
        --pink:#ffb3c1;
        --mint:#a8e6cf;
        --sky:#8ecdf0;
        --red:#ff6b5e;
        --shadow:5px 5px 0 #14100a;
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0; overflow:hidden; height:100dvh;
        font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
        background:#0d1830; color:var(--ink);
        user-select:none; -webkit-user-select:none;
      }
      #stage{ position:fixed; inset:0; }
      #stage canvas{ display:block; touch-action:none; }
      #fx{ position:fixed; inset:0; pointer-events:none; z-index:5; }

      /* ---------- HUD ---------- */
      #hud{
        position:fixed; top:0; left:0; right:0; height:60px; z-index:10;
        display:flex; align-items:center; justify-content:space-between;
        padding:10px 12px 0; pointer-events:none;
      }
      .pill{
        pointer-events:auto; display:inline-flex; align-items:center; gap:6px;
        background:var(--paper); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
        padding:4px 12px; font-weight:800; font-size:17px; line-height:1.15; color:var(--ink);
        min-height:38px;
      }
      .pill .ico{ font-size:19px; line-height:1; }
      #petalPill{ background:var(--gold); }
      #gearBtn, #worldBtn{
        pointer-events:auto; width:42px; height:42px; padding:0; cursor:pointer;
        background:var(--paper); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
        font-size:21px; line-height:1; color:var(--ink); font-family:inherit;
      }
      #gearBtn:active, #worldBtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
      #worldBtn{ display:none; }
      #hudRight{ display:flex; gap:8px; pointer-events:none; }
      #hudRight > *{ pointer-events:auto; }
      .jiggle{ animation:jig .38s ease; }
      @keyframes jig{ 0%{transform:rotate(0)} 25%{transform:rotate(-4deg) scale(1.12)} 55%{transform:rotate(3deg) scale(1.06)} 100%{transform:rotate(0)} }

      #hint{
        position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:10;
        pointer-events:none;
        background:var(--mint); border:3px solid var(--ink); box-shadow:var(--shadow);
        padding:6px 14px; font-weight:700; font-size:15px; color:var(--ink);
        white-space:nowrap; max-width:94vw; text-align:center;
      }
      @media (max-width:430px){ #hint{ font-size:13px; white-space:normal; } }

      #padBtn{
        position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:10;
        display:none; cursor:pointer; white-space:nowrap;
        background:var(--gold); border:3px solid var(--ink); box-shadow:var(--shadow);
        padding:8px 16px; font-family:inherit; font-weight:800; font-size:16px; color:var(--ink);
        min-height:44px;
      }
      #padBtn:active{ transform:translate(-50%,2px); box-shadow:1px 1px 0 var(--ink); }

      /* ---------- Spotlight ---------- */
      #spot{
        position:fixed; z-index:20; border:4px solid var(--gold); box-shadow:0 0 0 3px var(--ink), 0 0 26px 6px rgba(255,217,61,.55);
        pointer-events:none; display:none;
      }
      #spot::after{
        content:""; position:absolute; inset:-11px; border:3px dashed rgba(255,217,61,.55); pointer-events:none;
      }

      /* ---------- Cards / modals ---------- */
      #cardWrap{
        position:fixed; inset:0; z-index:30; display:none;
        align-items:flex-end; justify-content:center; padding:0 14px 86px;
        pointer-events:none;
      }
      #cardWrap.center{ align-items:center; padding-bottom:0; }
      .card{
        pointer-events:auto; width:100%; max-width:400px;
        background:var(--paper); border:3px solid var(--ink); box-shadow:var(--shadow);
        padding:16px 18px 14px; animation:pop .18s ease;
      }
      @keyframes pop{ from{ transform:scale(.92); } to{ transform:scale(1); } }
      .card h2{ margin:0 0 6px; font-size:22px; font-weight:800; line-height:1.15; color:var(--ink); }
      .card p{ margin:0 0 12px; font-size:16.5px; font-weight:600; line-height:1.35; color:#241c10; }
      .card .row{ display:flex; gap:10px; flex-wrap:wrap; }
      .btn{
        font-family:inherit; font-weight:800; font-size:16px; cursor:pointer; color:var(--ink);
        background:var(--gold); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
        padding:8px 18px; min-height:44px;
      }
      .btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
      .btn.alt{ background:var(--paper); }
      .btn.danger{ background:var(--red); color:var(--ink); }
      .btn:disabled{ opacity:.78; cursor:default; }
      .card .stat{ display:flex; justify-content:space-between; font-weight:800; font-size:17px; padding:3px 0; }
      .card .stat span:last-child{ color:#7a4b00; }
      .wrow{
        display:flex; align-items:center; justify-content:space-between; gap:8px;
        border:3px solid var(--ink); background:#fff; padding:8px 10px; margin-bottom:8px;
      }
      .wrow .wname{ font-weight:800; font-size:16px; line-height:1.1; }
      .wrow .wsub{ font-weight:600; font-size:13.5px; color:#5a4a28; line-height:1.15; }
      .wrow .btn{ min-height:40px; padding:6px 12px; font-size:15px; flex-shrink:0; }

      /* ---------- Settings ---------- */
      #settings{
        position:fixed; top:66px; right:12px; z-index:25; width:230px; display:none;
        background:var(--paper); border:3px solid var(--ink); box-shadow:var(--shadow);
        padding:12px 14px;
      }
      #settings h3{ margin:0 0 10px; font-size:17px; font-weight:800; }
      #settings .btn{ width:100%; margin-bottom:10px; }
      #settings .btn:last-child{ margin-bottom:0; }

      #loadErr{
        position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:20px;
        background:#0d1830; color:var(--paper); text-align:center; font-weight:700; font-size:17px;
      }
      /* ---------- Flight animation ---------- */
      #flight{
        position:fixed; inset:0; z-index:40; display:none; pointer-events:none;
        background:rgba(10,14,32,.55); overflow:hidden;
      }
      #flight.show{ display:block; }
      #flightRocket{
        position:absolute; top:55%; left:-10%; font-size:54px; line-height:1;
        filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45));
      }
      #flight.show #flightRocket{ animation:flyAcross .85s ease-in forwards; }
      @keyframes flyAcross{
        0%{ left:-10%; top:62%; transform:rotate(18deg) scale(.8); }
        55%{ top:38%; transform:rotate(8deg) scale(1.15); }
        100%{ left:104%; top:28%; transform:rotate(0deg) scale(1); }
      }
      #flightLabel{
        position:absolute; left:50%; bottom:18%; transform:translateX(-50%);
        background:var(--paper); border:3px solid var(--ink); box-shadow:var(--shadow);
        padding:6px 14px; font-weight:800; font-size:16px; color:var(--ink); white-space:nowrap;
      }
      @media (prefers-reduced-motion: reduce){
        .jiggle{ animation:none; } .card{ animation:none; }
        #flight.show #flightRocket{ animation:none; left:45%; top:40%; }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <canvas id="fx"></canvas>

    <div id="hud">
      <div class="pill" id="dayPill"><span class="ico">☀</span><span id="dayTxt">Day 1 · Home</span></div>
      <div class="pill" id="petalPill"><span class="ico">✿</span><span id="petalTxt">0</span></div>
      <div id="hudRight">
        <button id="worldBtn" aria-label="Travel between worlds">🌍</button>
        <button id="gearBtn" aria-label="Settings">⚙</button>
      </div>
    </div>

    <button id="padBtn">🚀 Build rocket pad · 25 ✿</button>

    <div id="hint">Drag to spin, tap soil to plant, tap plants to water — blooms grow slowly, so be patient.</div>

    <div id="spot"></div>

    <div id="cardWrap"><div class="card" id="card"></div></div>

    <div id="settings">
      <h3>Settings</h3>
      <button class="btn alt" id="soundBtn">🔊 Sound: ON</button>
      <button class="btn danger" id="abandonBtn">Abandon Run</button>
    </div>

    <div id="flight" aria-hidden="true"><div id="flightRocket">🚀</div><div id="flightLabel">Flying…</div></div>

    <div id="loadErr"><p>The garden could not load its 3D tools.<br/>Check your connection and reopen the page.</p></div>

<script>
"use strict";
/* ============================================================
   ORBIT GARDENER v2 — four worlds, Star Petals, rocket pads.
   PAD_COST 25 petals: a tended home planet yields ~1 bloom per
   15-20s of active play once 8 patches run, so 25 petals is
   ~4-6 days of casual play / ~10 min of focused tending.
   AWAY_CAP_S 120: plants off-screen simulate at most 2 min of
   real absence per return, so a long break stings but never
   wipes a world.
   v3 tuning: growth slowed ~2.5x on every world (Home grow
   bright 4/s, dark 1.6/s; see WORLDS tunes). Growth only flows
   while water is ABOVE thirstyAt — a thirsty plant stops growing;
   after DRY_GRACE_S (10s) thirsty its growth drains at
   REGRESS_PER_S (1.5/s). Wilt is separate: only at water 0,
   bright 8/s, dark 3/s on Home; 100 = death. Watering resets
   wilt and dryTime to 0. Seeds start water 60.
   Patches: each world starts with startUnlocked piles open; the
   rest are locked and unlock for UNLOCK_COSTS petals in order.
   Moon (mirror of home): moonflowers love the dark.
   Ember (harsher sun): dries fast, grows fast when watered.
   Little Rock (tiny, fast days): rare fast cometblooms, 4 patches.
   ============================================================ */
var PAD_COST = 25;
var AWAY_CAP_S = 120;
/* Water rule: once a plant is thirsty (water at/below its thirstyAt),
   growth stops. After DRY_GRACE_S seconds continuously thirsty, its
   growth meter drains at REGRESS_PER_S — slow on purpose, a nudge.
   Regression is NOT wilting: wilt only accrues at water 0 and kills;
   a regressed plant that gets watered simply grows again. */
var DRY_GRACE_S = 10;
var REGRESS_PER_S = 1.5;
/* Patch unlocks: escalating Star Petal cost per extra patch bought
   on a world, counted in purchase order (1st extra cheapest). Kept
   well under PAD_COST so patches vs pad is a real choice. */
var UNLOCK_COSTS = [3, 5, 8, 12];
function unlockCostFor(wi){
  var def = WORLDS[wi], ws = S.worlds[wi];
  var unlocked = ws.patches.filter(function(p){ return !p.locked; }).length;
  var n = Math.max(0, unlocked - def.startUnlocked);
  return UNLOCK_COSTS[Math.min(n, UNLOCK_COSTS.length - 1)];
}

var WORLDS = [
  { id:"home", name:"Home", plantName:"starflower",
    radius:2.0, daySecs:60, camZ:7.4, sunI:2.6, ambI:0.55,
    planet:0x63b06e, sky:0x0d1830, clouds:true, cloudCol:0xf4fbff,
    startUnlocked:4,
    tune:{ dryBright:5, dryDark:1.5, growBright:4, growDark:1.6, wiltBright:8, wiltDark:3, startWater:60, thirstyAt:30 },
    patches:[ {lat:4,lon:0},{lat:-8,lon:60},{lat:6,lon:120},{lat:-4,lon:180},
              {lat:9,lon:240},{lat:-9,lon:300},{lat:64,lon:35},{lat:-64,lon:215} ],
    flower:{ petals:5, petal:0xffd93d, center:0xff9f1c, bud:0xff8fab, stem:0x2f9e44, glow:0.55 },
    blurb:"Bright side grows fast, dries fast. Dark side grows slow, stays damp." },
  { id:"moon", name:"The Moon", plantName:"moonflower",
    radius:1.6, daySecs:90, camZ:6.6, sunI:2.0, ambI:0.45,
    planet:0x9aa7b8, sky:0x0a0f1e, clouds:false, cloudCol:0xffffff,
    startUnlocked:3,
    tune:{ dryBright:4, dryDark:1.2, growBright:1.2, growDark:3.6, wiltBright:7, wiltDark:2.5, startWater:60, thirstyAt:30 },
    patches:[ {lat:0,lon:0},{lat:0,lon:90},{lat:0,lon:180},{lat:0,lon:270},
              {lat:55,lon:45},{lat:-55,lon:225} ],
    flower:{ petals:6, petal:0xdfe9ff, center:0x9fd8ff, bud:0xb9c8ff, stem:0x7d9bb5, glow:1.1 },
    blurb:"Moonflowers love the dark — they bloom fast in shadow, slow in sun. Long slow days here." },
  { id:"ember", name:"Ember", plantName:"sunflare",
    radius:2.1, daySecs:60, camZ:7.6, sunI:3.4, ambI:0.5,
    planet:0xc25a3a, sky:0x1c0d10, clouds:true, cloudCol:0xffd0b0,
    startUnlocked:4,
    tune:{ dryBright:9, dryDark:3, growBright:5.6, growDark:2, wiltBright:12, wiltDark:5, startWater:60, thirstyAt:30 },
    patches:[ {lat:6,lon:20},{lat:-6,lon:80},{lat:10,lon:140},{lat:-10,lon:200},
              {lat:4,lon:260},{lat:-4,lon:320},{lat:58,lon:100},{lat:-58,lon:280} ],
    flower:{ petals:8, petal:0xff7a3c, center:0xffd93d, bud:0xff5e5e, stem:0x4d7a3a, glow:0.7 },
    blurb:"A harsh sun. Sunflares dry out fast — but watered, they grow faster than anything." },
  { id:"rock", name:"Little Rock", plantName:"cometbloom",
    radius:1.3, daySecs:30, camZ:5.6, sunI:2.6, ambI:0.55,
    planet:0x8a7f9e, sky:0x120a24, clouds:false, cloudCol:0xffffff,
    startUnlocked:2,
    tune:{ dryBright:6, dryDark:2, growBright:6.4, growDark:3.2, wiltBright:9, wiltDark:4, startWater:60, thirstyAt:30 },
    patches:[ {lat:10,lon:0},{lat:-10,lon:120},{lat:15,lon:240},{lat:-60,lon:300} ],
    flower:{ petals:4, petal:0xc9a7ff, center:0x6ff2ff, bud:0x9d7bff, stem:0x5e7a4d, glow:1.0 },
    blurb:"A tiny rock, quick little days. Rare cometblooms grow fast here — only four patches." }
];
var PAD_SITE = { lat:-38, lon:150 };
var SAVE_KEY = "orbit-gardener-save-v2";
var SAVE_KEY_V1 = "orbit-gardener-save-v1";

/* ---------------- State ---------------- */
function blankPatches(n, startUnlocked){
  var a = [];
  for (var i = 0; i < n; i++) a.push({ state:"empty", water:0, growth:0, wilt:0, dryTime:0, locked: i >= startUnlocked });
  return a;
}
function blankWorlds(){
  return WORLDS.map(function(w){
    return { patches: blankPatches(w.patches.length, w.startUnlocked), pad:false, totalRot:0, day:1, sum5:0, lastSeen:0 };
  });
}
var S = {
  started:false, sound:true, petals:0, cur:0,
  worlds: blankWorlds(),
  flags:{ story:false, tour:false, teachWater:false, teachHarvest:false, teachThirst:false,
          teachLocked:false, teachDry:false,
          ch3:false, ch7:false, teachPad:false, plantTaught:{ home:true }, win:false, winShown:false }
};
function curW(){ return S.worlds[S.cur]; }
function curDef(){ return WORLDS[S.cur]; }
function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){}
}
function load(){
  var raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){}
  if (raw){
    try {
      var d = JSON.parse(raw);
      if (!d || !d.worlds || d.worlds.length !== WORLDS.length) return false;
      S.petals = d.petals|0; S.cur = d.cur|0 || 0;
      if (S.cur < 0 || S.cur >= WORLDS.length) S.cur = 0;
      S.sound = d.sound !== false; S.worlds = d.worlds; S.flags = d.flags || S.flags;
      if (S.flags.teachLocked === undefined) S.flags.teachLocked = false;
      if (S.flags.teachDry === undefined) S.flags.teachDry = false;
      /* v2 -> v3 migration: old saves have no locked/dryTime fields.
         Existing patches stay unlocked (locked defaults false — never
         take a patch away); only brand-new games start with locks. */
      S.worlds.forEach(function(ws, wi){
        if (!ws.patches || ws.patches.length !== WORLDS[wi].patches.length){
          ws.patches = blankPatches(WORLDS[wi].patches.length, 99);
        }
        ws.patches.forEach(function(p){
          if (p.locked === undefined) p.locked = false;
          if (typeof p.dryTime !== "number") p.dryTime = 0;
        });
      });
      S.started = !!d.flags && !!d.flags.story;
      return true;
    } catch(e){ return false; }
  }
  /* v1 migration: a save without worlds starts with Home only, zero petals */
  try { raw = localStorage.getItem(SAVE_KEY_V1); } catch(e){ raw = null; }
  if (!raw) return false;
  try {
    var d1 = JSON.parse(raw);
    if (!d1 || !d1.patches || d1.patches.length !== 8) return false;
    S.petals = d1.blooms|0;
    S.worlds[0].patches = d1.patches;
    S.worlds[0].patches.forEach(function(p){ p.locked = false; if (typeof p.dryTime !== "number") p.dryTime = 0; });
    S.worlds[0].totalRot = +d1.totalRot||0;
    S.worlds[0].day = d1.day|0 || 1;
    S.worlds[0].sum5 = (d1.flags && d1.flags.sum5) || 0;
    S.sound = d1.sound !== false;
    if (d1.flags){
      ["story","tour","teachWater","teachHarvest","teachThirst","ch3","ch7"].forEach(function(k){
        S.flags[k] = !!d1.flags[k];
      });
    }
    S.started = !!S.flags.story;
    save();
    return true;
  } catch(e){ return false; }
}
var resumed = load();

/* ---------------- Audio (synth, starts on first gesture) ---------------- */
var AC = null;
function audio(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, t0, dur, type, vol, slideTo){
  if (!S.sound) return;
  var ac = audio(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  var t = ac.currentTime + t0;
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function noiseBurst(t0, dur, vol){
  if (!S.sound) return;
  var ac = audio(); if (!ac) return;
  var len = Math.floor(ac.sampleRate * dur);
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var ch = buf.getChannelData(0);
  for (var i = 0; i < len; i++) ch[i] = (Math.random()*2-1) * (1 - i/len);
  var src = ac.createBufferSource(); src.buffer = buf;
  var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
  var g = ac.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(ac.currentTime + t0);
}
var sfx = {
  pop:    function(){ tone(320, 0, 0.12, "sine", 0.22, 660); },
  splash: function(){ noiseBurst(0, 0.28, 0.30); tone(500, 0.02, 0.16, "sine", 0.08, 240); },
  chime:  function(){ tone(880, 0, 0.22, "triangle", 0.20); tone(1318, 0.09, 0.30, "triangle", 0.20); },
  harvest:function(){ tone(523, 0, 0.14, "triangle", 0.20); tone(659, 0.08, 0.14, "triangle", 0.20); tone(784, 0.16, 0.22, "triangle", 0.22); },
  thud:   function(){ tone(140, 0, 0.25, "sine", 0.20, 60); },
  tap:    function(){ tone(700, 0, 0.05, "square", 0.06); },
  whoosh: function(){ noiseBurst(0, 0.5, 0.25); tone(220, 0, 0.5, "sine", 0.12, 880); },
  win:    function(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f, i*0.12, 0.3, "triangle", 0.2); }); }
};

/* ---------------- Modal / tour queue (ONE at a time) ---------------- */
var cardWrap = document.getElementById("cardWrap");
var cardEl = document.getElementById("card");
var spotEl = document.getElementById("spot");
var queue = [], modalOpen = false, activeTour = null;

function enqueue(item){ queue.push(item); pumpQueue(); }
function pumpQueue(){
  if (modalOpen || !queue.length) return;
  showCard(queue.shift());
}
function showCard(item){
  modalOpen = true;
  activeTour = item.tour || null;
  cardWrap.style.display = "flex";
  cardWrap.classList.toggle("center", !!item.center);
  var html = "";
  if (item.title) html += "<h2>" + item.title + "</h2>";
  if (item.text) html += "<p>" + item.text + "</p>";
  if (item.stats) html += item.stats;
  if (item.rows) html += item.rows;
  html += '<div class="row">';
  (item.buttons || [{ label:"Next" }]).forEach(function(b, i){
    html += '<button class="btn' + (b.alt ? " alt" : "") + '"' + (b.disabled ? " disabled" : "") + ' data-bi="' + i + '">' + b.label + "</button>";
  });
  html += "</div>";
  cardEl.innerHTML = html;
  spotEl.style.display = activeTour ? "block" : "none";
  var btns = cardEl.querySelectorAll("button[data-bi]");
  for (var i = 0; i < btns.length; i++){
    btns[i].addEventListener("click", function(){
      var b = (item.buttons || [{ label:"Next" }])[+this.getAttribute("data-bi")];
      sfx.tap();
      closeCard();
      if (b && b.action) b.action();
    });
  }
  /* Travel Fly buttons live in item.rows, not item.buttons — wire them
     here, at render time, so they work even if the card was queued. */
  var goBtns = cardEl.querySelectorAll("button[data-go]");
  for (var j = 0; j < goBtns.length; j++){
    goBtns[j].addEventListener("click", function(){
      var dest = +this.getAttribute("data-go");
      sfx.tap();
      closeCard();
      switchWorld(dest);
    });
  }
  if (item.onShow) item.onShow();
}
function closeCard(){

function buildPlant(fc){
  var g = new THREE.Group();
  var stemMat = new THREE.MeshStandardMaterial({ color:new THREE.Color(fc.stem), roughness:0.8 });

  var leaf2 = new THREE.Mesh(leafGeo, stemMat);
  leaf2.scale.set(1.5, 0.45, 0.7); leaf2.position.set(0.13, -0.05, 0.42); leaf2.rotation.z = -0.6;
  g.add(leaf1); g.add(leaf2);
  var bud = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10),
    new THREE.MeshStandardMaterial({ color:new THREE.Color(fc.bud), roughness:0.6 }));
  bud.position.z = 0.68; g.add(bud);
  var flower = new THREE.Group();
  var center = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10),
    new THREE.MeshStandardMaterial({ color:new THREE.Color(fc.center), emissive:new THREE.Color(fc.center), emissiveIntensity:fc.glow, roughness:0.5 }));
  flower.add(center);
  var petalMat = new THREE.MeshStandardMaterial({ color:new THREE.Color(fc.petal), emissive:new THREE.Color(fc.petal), emissiveIntensity:fc.glow * 0.8, roughness:0.5 });
  for (var i = 0; i < fc.petals; i++){
    var p = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), petalMat);
    var a = (i/fc.petals) * Math.PI * 2;

    p.scale.set(1.25, 0.8, 0.45);

  return { group:g, stemMat:stemMat, bud:bud, flower:flower, leaf1:leaf1, leaf2:leaf2, stemBase:new THREE.Color(fc.stem) };

function disposeGroup(gr){
  gr.traverse(function(o){
    if (o.geometry) o.geometry.dispose();
    if (o.material){
      if (Array.isArray(o.material)) o.material.forEach(function(m){ m.dispose(); });
      else o.material.dispose();
    }
  });
}

function buildWorld(wi){
  var def = WORLDS[wi], ws = S.worlds[wi];

    var soilMat = new THREE.MeshStandardMaterial({ color:SOIL_EMPTY.clone(), roughness:1 });

    /* locked look: dashed outline + floating cost label */

        new THREE.RingGeometry(0.44, 0.52, 6, 1, (dsh/10) * Math.PI * 2, Math.PI * 0.11),

    var lockCanvas = document.createElement("canvas");

    var lockSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:lockTex, transparent:true, depthTest:false }));
    lockSprite.scale.set(0.78, 0.34, 1);
    lockSprite.position.z = 0.62;
    lockGroup.add(lockSprite);
    lockGroup.visible = false;
    grp.add(lockGroup);

    var plant = buildPlant(def.flower);
    plant.group.position.z = 0.02;
    grp.add(plant.group);

    var drop = new THREE.Group();
    var dMat = new THREE.MeshStandardMaterial({ color:0x3fa9f5, emissive:0x0b5fa5, emissiveIntensity:0.5, roughness:0.3 });
    var dBody = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), dMat);
    dBody.scale.set(1, 1.25, 1);
    var dTip = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.11, 10), dMat);
    dTip.rotation.x = -Math.PI/2; dTip.position.z = 0.13;

    drop.position.z = 1.05;

    patches.push({ grp:grp, soil:soil, soilMat:soilMat, ring:ring, ringMat:ringMat, plant:plant,
                   drop:drop, proxy:proxy, normal:n, lastArc:-1,
                   lockGroup:lockGroup, lockCanvas:lockCanvas, lockTex:lockTex,
                   lockSprite:lockSprite, lockLabel:"", shakeUntil:0 });
    proxies.push(proxy);

  /* rocket pad site */
  var pn = latLonNormal(PAD_SITE.lat, PAD_SITE.lon);

  padGroup.position.copy(pn).multiplyScalar(R);

    new THREE.MeshBasicMaterial({ color:0xffd93d, side:THREE.DoubleSide, transparent:true, opacity:0.85 }));
  padSiteRing.position.z = 0.014;
  padGroup.add(padSiteRing);
  padRocket = new THREE.Group();
  var rocketMat = new THREE.MeshStandardMaterial({ color:0xff6b5e, roughness:0.5 });
  var body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.42, 12), rocketMat);
  body.rotation.x = Math.PI/2; body.position.z = 0.24;
  var nose = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.2, 12),
    new THREE.MeshStandardMaterial({ color:0xffd93d, roughness:0.5 }));
  nose.rotation.x = Math.PI/2; nose.position.z = 0.55;
  var finMat = new THREE.MeshStandardMaterial({ color:0xfff6d8, roughness:0.5 });
  padRocket.add(body); padRocket.add(nose);
  for (var f = 0; f < 3; f++){
    var fin = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.16, 0.18), finMat);
    var fa = (f/3) * Math.PI * 2;
    fin.position.set(Math.cos(fa)*0.15, Math.sin(fa)*0.15, 0.12);
    fin.rotation.z = fa;
    padRocket.add(fin);
  }
  padGroup.add(padRocket);
  padProxy = new THREE.Mesh(new THREE.SphereGeometry(0.62, 10, 8),
    new THREE.MeshBasicMaterial({ visible:false }));
  padProxy.position.copy(pn).multiplyScalar(R + 0.3);
  padProxy.userData.pad = true;
  worldGroup.add(padProxy);

  yaw = ws.totalRot % (Math.PI * 2);
  syncPadVisual();
  refreshHud(); refreshPadUI(); refreshWorldBtn();
  refreshLockVisuals();
}

function drawLockLabel(P, cost, afford){
  var label = cost + "|" + (afford ? "y" : "n");
  if (P.lockLabel === label) return;
  P.lockLabel = label;
  var c = P.lockCanvas, x = c.getContext("2d");
  x.clearRect(0, 0, c.width, c.height);
  x.fillStyle = afford ? "#fff6d8" : "#b9b2a4";
  x.strokeStyle = "#14100a"; x.lineWidth = 8;
  x.beginPath();
  if (x.roundRect) x.roundRect(14, 14, c.width - 28, c.height - 28, 26); else x.rect(14, 14, c.width - 28, c.height - 28);
  x.fill(); x.stroke();
  x.fillStyle = "#14100a";
  x.font = "800 46px 'Baloo 2', sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText("🔒 " + cost + " ✿", c.width/2, c.height/2 + 3);
  P.lockTex.needsUpdate = true;
  P.lockSprite.material.color.set(afford ? 0xffffff : 0x9a9a9a);
}
function refreshLockVisuals(){
  var cost = unlockCostFor(S.cur), afford = S.petals >= cost;
  var ws = curW();
  for (var i = 0; i < patches.length; i++){
    var P = patches[i], p = ws.patches[i];
    P.lockGroup.visible = !!p.locked;
    if (p.locked) drawLockLabel(P, cost, afford);
  }
}

/* ---------------- FX particles (2D overlay) ---------------- */
var fx = document.getElementById("fx"), fctx = fx.getContext("2d");
function fxResize(){ fx.width = window.innerWidth; fx.height = window.innerHeight; }
fxResize();
var parts = [];
function burst(worldPos, colors, n, spread){
  var v = worldPos.clone().project(camera);
  var x = (v.x*0.5 + 0.5) * window.innerWidth;
  var y = (-v.y*0.5 + 0.5) * window.innerHeight;
  for (var i = 0; i < (n||14); i++){
    var a = Math.random()*Math.PI*2, sp = 40 + Math.random()*(spread||130);
    parts.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
      life:0.7 + Math.random()*0.4, t:0, size:4 + Math.random()*5,
      color:colors[i % colors.length] });
  }
}
function stepFx(dt){
  fctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(function(p){ return p.t < p.life; });
  parts.forEach(function(p){
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt;
    var k = 1 - p.t/p.life;
    fctx.globalAlpha = Math.max(k, 0);
    fctx.fillStyle = p.color;
    fctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  fctx.globalAlpha = 1;
}

function doDie(i){

function onLockedTap(i){
  var cost = unlockCostFor(S.cur);
  if (!S.flags.teachLocked){
    S.flags.teachLocked = true; save();
    enqueue({ tour:{ patch:i }, title:"Locked soil",
      text:"This dirt pile is locked. Tap a locked pile to unlock it with Star Petals — this one costs " + cost + " ✿. More soil, or save for the rocket pad? Your call, keeper.",
      buttons:[{ label:"Got it" }] });
    return;
  }
  if (S.petals >= cost){
    S.petals -= cost;
    curW().patches[i].locked = false;
    sfx.chime(); sfx.pop();
    burst(patchWorldPos(i), ["#fff6d8","#ffd93d","#a8e6cf"], 22, 160);
    refreshHud(); refreshPadUI(); refreshLockVisuals(); save();

    /* not affordable: shake the patch + jiggle the petal pill */

    petalPill.classList.remove("jiggle"); void petalPill.offsetWidth; petalPill.classList.add("jiggle");
    sfx.thud();

    var old = hintEl.textContent;
    hintEl.textContent = "Locked soil costs " + cost + " ✿ — you have " + S.petals + " ✿. Harvest more blooms!";
    setTimeout(function(){ hintEl.textContent = old; }, 2600);
  }
}
function onPatchTap(i){
  if (!S.started || modalOpen) return;
  var p = curW().patches[i];
  if (p.locked) onLockedTap(i);
  else if (p.state === "empty") doPlant(i);
  else if (p.state === "bloomed") doHarvest(i);
  else doWater(i);
}

function openTravel(){
  if (!anyPad()) return;
  /* REQUIRED FIX — first flight must work: departing FROM a world that
     has a pad, every other world is flyable, including padless worlds
     (that is how new worlds are first reached). Departing from a
     padless world, only worlds that already have a pad are flyable,
     so you can always fly back to a pad world. */
  var canDepart = !!curW().pad;
  var rows = "";
  WORLDS.forEach(function(w, i){
    var ws = S.worlds[i];
    var status = ws.pad ? "🚀 Pad ready" : "○ No pad yet — fly there to build one";
    var sub = w.plantName + "s · " + w.patches.length + " patches · " + status;
    var canFly = i !== S.cur && (ws.pad || canDepart);
    rows += '<div class="wrow"><div><div class="wname">' + w.name + '</div><div class="wsub">' + sub + '</div></div>' +
      (i === S.cur ? '<button class="btn alt" disabled>Here</button>' :
       canFly ? '<button class="btn" data-go="' + i + '">Fly ✈</button>' :
       '<button class="btn alt" disabled>Locked</button>') + '</div>';
  });
  enqueue({ center:true, title:"Where to, keeper?",
    text: canDepart
      ? "Star Petals: ✿ " + S.petals + " — a pad costs " + PAD_COST + " ✿. Your pad here can reach any world, even one with no pad yet."
      : "Star Petals: ✿ " + S.petals + " — a pad costs " + PAD_COST + " ✿. No pad here yet, so you can fly back to a world that has one.",
    rows: rows,
    buttons:[{ label:"Stay here", alt:true }] });
}

/* ---------------- Away simulation (time passes everywhere) ---------------- */
function patchBrightAt(def, idx, yawNow){
  var pd = def.patches[idx];
  var n = latLonNormal(pd.lat, pd.lon);
  /* rotate normal around Y by yawNow */
  var c = Math.cos(yawNow), s = Math.sin(yawNow);
  var x = n.x * c + n.z * s, z = -n.x * s + n.z * c;
  return (x * SUN_DIR.x + n.y * SUN_DIR.y + z * SUN_DIR.z) > 0;
}
function awaySim(wi, elapsedS){
  var def = WORLDS[wi], ws = S.worlds[wi], T = def.tune;
  var cap = Math.min(Math.max(elapsedS, 0), AWAY_CAP_S);
  var grown = 0, died = 0;
  if (cap <= 0) return { grown:0, died:0, simulated:0 };
  var speed = (Math.PI * 2) / def.daySecs;
  var steps = Math.ceil(cap / 0.5);
  for (var s = 0; s < steps; s++){
    var dt = 0.5;
    ws.totalRot += speed * dt;
    var yawNow = ws.totalRot % (Math.PI * 2);
    for (var i = 0; i < ws.patches.length; i++){
      var p = ws.patches[i];
      if (p.state !== "growing" || p.locked) continue;
      var bright = patchBrightAt(def, i, yawNow);
      if (p.water > 0){
        p.water -= (bright ? T.dryBright : T.dryDark) * dt;
        if (p.water < 0) p.water = 0;
      }
      if (p.water > T.thirstyAt){
        p.dryTime = 0;
        p.growth += (bright ? T.growBright : T.growDark) * dt;
        if (p.growth >= 100){ p.growth = 100; p.state = "bloomed"; grown++; }
      } else {
        p.dryTime = (p.dryTime || 0) + dt;
        if (p.dryTime > DRY_GRACE_S && p.growth > 0)
          p.growth = Math.max(0, p.growth - REGRESS_PER_S * dt);
        if (p.water <= 0){
          p.wilt += (bright ? T.wiltBright : T.wiltDark) * dt;
          if (p.wilt >= 100){
            p.state = "empty"; p.water = 0; p.growth = 0; p.wilt = 0; p.dryTime = 0; died++;
          }
        }
      }
    }
  }
  ws.day = 1 + Math.floor(ws.totalRot / (Math.PI * 2));
  ws.sum5 = ws.day; /* away days pass quietly — no stale summary pops */
  return { grown:grown, died:died, simulated:cap };
}
function playFlight(destName){
  var fl = document.getElementById("flight");
  var lbl = document.getElementById("flightLabel");
  if (!fl) return;
  if (lbl) lbl.textContent = "Flying to " + destName + "…";
  fl.classList.remove("show"); void fl.offsetWidth;
  fl.classList.add("show");
  setTimeout(function(){ fl.classList.remove("show"); }, 900);
}
function switchWorld(to){
  if (to === S.cur || to < 0 || to >= WORLDS.length) return;
  curW().lastSeen = Date.now();
  save();
  var from = S.cur;
  S.cur = to;
  sfx.whoosh();
  playFlight(WORLDS[to].name);
  buildWorld(to);
  var ws = curW();
  var away = null;
  if (ws.lastSeen){
    var elapsed = (Date.now() - ws.lastSeen) / 1000;
    if (elapsed > 5) away = awaySim(to, elapsed);
  }
  ws.lastSeen = Date.now();
  save();
  if (away && (away.grown > 0 || away.died > 0)){
    var bits = [];
    if (away.grown > 0) bits.push(away.grown + (away.grown === 1 ? " bloom opened" : " blooms opened"));
    if (away.died > 0) bits.push(away.died + (away.died === 1 ? " plant wilted away" : " plants wilted away"));
    enqueue({ center:true, title:"While you were away…",
      text:"On " + curDef().name + ": " + bits.join(", ") + ". The garden keeps growing without you — for better or worse.",
      buttons:[{ label:"Keep gardening" }] });
  }
  if (!S.flags.plantTaught[curDef().id]){
    S.flags.plantTaught[curDef().id] = true; save();
    enqueue({ center:true, title:"Welcome to " + curDef().name,
      text:"New soil, new rules. " + curDef().blurb,
      buttons:[{ label:"Plant something" }] });
  }
}

/* ---------------- Input: drag to spin, tap to act ---------------- */
var yaw = 0, pitch = 0, dragging = false, downX = 0, downY = 0, downT = 0, lastX = 0, lastY = 0;
var ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
var cvs = renderer.domElement;
cvs.addEventListener("pointerdown", function(e){
  audio();
  dragging = true; downX = lastX = e.clientX; downY = lastY = e.clientY; downT = performance.now();
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener("pointermove", function(e){
  if (!dragging) return;
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  var dyaw = dx * 0.0075;
  yaw += dyaw;
  pitch += dy * 0.004;
  pitch = Math.max(-0.55, Math.min(0.55, pitch));
  curW().totalRot += Math.abs(dyaw);
});
cvs.addEventListener("pointerup", function(e){
  dragging = false;
  var moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  var dt = performance.now() - downT;
  if (moved < 8 && dt < 300){
    ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
    ptr.y = -(e.clientY / window.innerHeight) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    var targets = proxies.slice();
    if (padGroup && padGroup.visible) targets.push(padProxy);
    var hits = ray.intersectObjects(targets);
    if (hits.length){
      var ud = hits[0].object.userData;
      if (ud.pad){
        if (curW().pad) openTravel();
        else if (S.petals >= PAD_COST - 5) padBtn.click();
      } else {
        onPatchTap(ud.patch);
      }
    }
  }
});
cvs.addEventListener("pointercancel", function(){ dragging = false; });

var abandonBtn = document.getElementById("abandonBtn");

/* ---------------- Onboarding & story queue ---------------- */
function startStory(){
  enqueue({ center:true, title:"The Last Little Planet",

    buttons:[{ label:"Next" }] });

      S.started = true; S.flags.story = true; save();
      refreshPadUI();
      startTour();

function startTour(){
  if (S.flags.tour) return;
  S.flags.tour = true; save();

function welcomeBack(){

function daySummary(day){
  var ws = curW();
  enqueue({ center:true, title:"Day " + day + " complete",
    stats:'<div class="stat"><span>Star Petals</span><span>✿ ' + S.petals + '</span></div>' +
          '<div class="stat"><span>Plants alive here</span><span>' + aliveCount() + " / " + curW().patches.filter(function(p){ return !p.locked; }).length + " soil piles</span></div>",
    buttons:[{ label:"CONTINUE" }] });
}

/* ---------------- Simulation (current world only) ---------------- */
function simStep(dt){
  if (!S.started || modalOpen) return;
  var ws = curW(), T = curDef().tune;
  for (var i = 0; i < ws.patches.length; i++){
    var p = ws.patches[i];
    if (p.state !== "growing" || p.locked) continue;
    var bright = isBright(i);
    if (p.water > 0){
      p.water -= (bright ? T.dryBright : T.dryDark) * dt;
      if (p.water < 0) p.water = 0;
    }
    if (p.water > T.thirstyAt){
      /* watered: growth flows (slowly — patience is the game) */
      p.dryTime = 0;
      p.growth += (bright ? T.growBright : T.growDark) * dt;
      if (p.growth >= 100){
        p.growth = 100; p.state = "bloomed";
        sfx.chime();
        burst(patchWorldPos(i), ["#ffd93d","#fff3a0","#ffb3c1"], 20, 150);
        if (!S.flags.teachHarvest){
          S.flags.teachHarvest = true;
          var bi = i;
          enqueue({ tour:{ patch:bi }, title:"A bloom!",
            text:"Tap the shining " + curDef().plantName + " to harvest it.",
            buttons:[{ label:"Got it" }] });
        }
        save();
      }
    } else {
      /* thirsty: growth STOPS. Past the grace period it drains. */
      p.dryTime = (p.dryTime || 0) + dt;
      if (p.dryTime > DRY_GRACE_S){
        if (p.growth > 0) p.growth = Math.max(0, p.growth - REGRESS_PER_S * dt);
        if (!S.flags.teachDry){
          S.flags.teachDry = true;
          var di = i;
          enqueue({ tour:{ patch:di }, title:"Drying out!",
            text:"Left thirsty too long, a flower stops growing — and after " + DRY_GRACE_S + " seconds dry, its growth ring turns brown and starts draining back. Water it and growth returns. Wilting is separate: only a plant at zero water for long can die.",
            buttons:[{ label:"Water it!" }] });
        }
      }
      if (p.water <= 0){
        p.wilt += (bright ? T.wiltBright : T.wiltDark) * dt;
        if (p.wilt >= 100){ doDie(i); continue; }
      }
    }
    if (p.water < T.thirstyAt && !S.flags.teachThirst){
      S.flags.teachThirst = true;
      var ti = i;
      enqueue({ tour:{ patch:ti }, title:"Thirsty!",
        text:"The blue droplet means it needs water — and a thirsty flower stops growing until you water it. Tap the plant to water it.",
        buttons:[{ label:"Got it" }] });
    }
  }
  /* day rollover (per world) */
  var nd = 1 + Math.floor(ws.totalRot / (Math.PI * 2));
  if (nd !== ws.day){
    ws.day = nd; refreshHud(); save();
    if (S.cur === 0 && nd === 3 && !S.flags.ch3){
      S.flags.ch3 = true;
      enqueue({ center:true, title:"Day 3",
        text:"Somewhere below the soil, old roots stir — the planet remembers being a garden.",
        buttons:[{ label:"Continue" }] });
    }
    if (S.cur === 0 && nd === 7 && !S.flags.ch7){
      S.flags.ch7 = true;
      enqueue({ center:true, title:"Day 7",
        text:"A week of blooms. If any keeper is watching from the dark between stars, they are watching you.",
        buttons:[{ label:"Continue" }] });
    }
    if ((nd - 1) % 5 === 0 && ws.sum5 !== nd){
      ws.sum5 = nd;
      daySummary(nd - 1);
    }
  }
}

/* ---------------- Visual sync ---------------- */
function stageVisual(P, p, T){
  var vis = P.plant;
  if (p.state === "empty"){ vis.group.visible = false; P.drop.visible = false; return; }
  vis.group.visible = true;
  var g = p.growth;
  var s = g < 25 ? 0.30 : g < 55 ? 0.58 : g < 100 ? 0.82 : 1.0;
  if (p.state === "bloomed") s = 1.0 + Math.sin(performance.now()*0.005) * 0.05;
  vis.group.scale.set(s, s, s);
  vis.bud.visible = g >= 55 && p.state !== "bloomed";
  vis.flower.visible = p.state === "bloomed";
  var wk = p.wilt / 100;
  vis.group.rotation.x = wk * 0.55;
  vis.group.rotation.z = wk * 0.3;
  vis.stemMat.color.copy(vis.stemBase).lerp(BROWN, wk);
  P.drop.visible = p.state === "growing" && p.water < T.thirstyAt;
  if (P.drop.visible) P.drop.position.z = 1.02 + Math.sin(performance.now()*0.006 + P.grp.id) * 0.07;
}
function syncVisuals(t){
  refreshLockVisuals();
  var ws = curW(), T = curDef().tune;
  for (var i = 0; i < patches.length; i++){
    var P = patches[i], p = ws.patches[i];
    if (p.locked){
      P.soilMat.color.copy(SOIL_LOCKED);
      P.soil.scale.set(1, 1, 1);
      P.ring.visible = false;
      var shaking = P.shakeUntil && t < P.shakeUntil;
      P.lockGroup.position.x = shaking ? Math.sin(t * 0.09) * 0.035 : 0;
      if (!shaking) P.lockGroup.position.x = 0;
    } else if (p.state === "empty"){
      P.soilMat.color.copy(SOIL_EMPTY);
      var pu = 1 + Math.sin(t*0.003 + i*1.3) * 0.05;
      P.soil.scale.set(pu, pu, 1);
    } else {
      P.soil.scale.set(1, 1, 1);
      P.soilMat.color.copy(SOIL_DRY).lerp(SOIL_WET, p.water/100);
    }
    if (!p.locked){
      /* ring turns dry brown while growth is draining */
      var regressing = p.state === "growing" && (p.dryTime || 0) > DRY_GRACE_S;
      P.ringMat.color.set(regressing ? 0xa85f14 : 0xffe066);
      var arc = p.state === "empty" ? 0 : Math.max(p.growth, 0.5) / 100 * Math.PI * 2;
      if (Math.abs(arc - P.lastArc) > 0.02){
        P.lastArc = arc;
        P.ring.geometry.dispose();
        P.ring.geometry = new THREE.RingGeometry(0.44, 0.50, 32, 1, Math.PI/2, Math.max(arc, 0.001));
        P.ring.visible = p.state !== "empty";
      }
    }
    stageVisual(P, p, T);
    if (p.locked){ P.plant.group.visible = false; P.drop.visible = false; }
  }
}

/* ---------------- Spotlight tracking ---------------- */
var _sv = new THREE.Vector3();
function placeSpot(){
  if (!activeTour) return;
  var pt, size;
  if (activeTour.kind === "planet"){
    pt = new THREE.Vector3(0, 0, 0).project(camera); size = Math.min(window.innerWidth, window.innerHeight) * 0.72;
  } else if (activeTour.kind === "sun"){
    pt = sunGroup.position.clone().project(camera); size = 130;
  } else if (activeTour.kind === "pad"){
    pt = padWorldPos().project(camera); size = 130;
  } else {
    pt = patches[activeTour.patch || 0].grp.getWorldPosition(_sv.set(0,0,0)).clone().project(camera);
    size = 110;
  }
  var x = (pt.x*0.5 + 0.5) * window.innerWidth;
  var y = (-pt.y*0.5 + 0.5) * window.innerHeight;
  spotEl.style.left = (x - size/2) + "px";
  spotEl.style.top = (y - size/2) + "px";
  spotEl.style.width = size + "px";
  spotEl.style.height = size + "px";
}

/* ---------------- Main loop ---------------- */
var clock = new THREE.Clock();
var saveTimer = 0;
function loop(){
  requestAnimationFrame(loop);
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = performance.now();
  if (S.started && !dragging && !modalOpen){
    var speed = (Math.PI * 2) / curDef().daySecs;
    yaw += speed * dt;
    curW().totalRot += speed * dt;
  }
  yawGroup.rotation.y = yaw;
  pitchGroup.rotation.x = pitch;
  simStep(dt);
  syncVisuals(t);
  placeSpot();
  stepFx(dt);
  saveTimer += dt;
  if (saveTimer > 2.5){ saveTimer = 0; if (S.started) save(); }
  renderer.render(scene, camera);
}

window.addEventListener("resize", function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  fxResize();
});
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ curW().lastSeen = Date.now(); save(); }
});

/* ---------------- Test hooks (probe only; harmless in play) ---------------- */
window.__og = {
  S:S, WORLDS:WORLDS, PAD_COST:PAD_COST, AWAY_CAP_S:AWAY_CAP_S,
  DRY_GRACE_S:DRY_GRACE_S, REGRESS_PER_S:REGRESS_PER_S, UNLOCK_COSTS:UNLOCK_COSTS,
  unlockCost:function(wi){ return unlockCostFor(wi === undefined ? S.cur : wi); },
  tapPatch:function(i){ onPatchTap(i); },
  patchInfo:function(i){ var p = curW().patches[i]; return { state:p.state, water:p.water, growth:p.growth, wilt:p.wilt, dryTime:p.dryTime, locked:!!p.locked }; },
  setPatch:function(i, props){ var p = curW().patches[i]; for (var k in props) p[k] = props[k]; save(); },
  skipIntro:function(){ queue.length = 0; if (modalOpen) closeCard(); S.started = true; S.flags.story = true; S.flags.tour = true; save(); },
  addPetals:function(n){ S.petals += n; refreshHud(); refreshPadUI(); save(); },
  plantAll:function(){ var ws = curW(), T = curDef().tune; ws.patches.forEach(function(p){ if (p.state === "empty" && !p.locked){ p.state = "growing"; p.water = T.startWater; p.growth = 0; p.wilt = 0; p.dryTime = 0; } }); save(); },
  growAll:function(){ curW().patches.forEach(function(p){ if (p.state === "growing"){ p.growth = 99; p.water = 100; } }); },
  harvestAll:function(){ var n = 0; curW().patches.forEach(function(p, i){ if (p.state === "bloomed"){ doHarvest(i); n++; } }); return n; },
  ff:function(sec){ var steps = Math.round(sec / 0.05); for (var k = 0; k < steps; k++) simStep(0.05); },
  buildPad:function(){ return buildPad(); },
  travelTo:function(i){ switchWorld(i); },
  away:function(wi, secs){ return awaySim(wi, secs); },
  openTravel:function(){ openTravel(); },
  cardText:function(){ return cardEl.textContent; },
  modalOpen:function(){ return modalOpen; },
  queueLen:function(){ return queue.length; },
  closeCard:function(){ closeCard(); }
};

/* ---------------- Boot ---------------- */
buildWorld(S.cur);
if (resumed && S.flags.story){
  S.started = true;
  /* simulate time away from the world we left, then welcome back */
  var ws0 = curW();
  if (ws0.lastSeen){
    var el = (Date.now() - ws0.lastSeen) / 1000;
    if (el > 5){
      var r0 = awaySim(S.cur, el);
      if (r0.grown > 0 || r0.died > 0){
        var b0 = [];
        if (r0.grown > 0) b0.push(r0.grown + (r0.grown === 1 ? " bloom opened" : " blooms opened"));
        if (r0.died > 0) b0.push(r0.died + (r0.died === 1 ? " plant wilted away" : " plants wilted away"));
        enqueue({ center:true, title:"While you were away…",
          text:"On " + curDef().name + ": " + b0.join(", ") + ".",
          buttons:[{ label:"Keep gardening" }] });
      }
    }
  }
  ws0.lastSeen = Date.now();
  save();
  welcomeBack();
} else {
  startStory();
}
refreshPadUI();
loop();
