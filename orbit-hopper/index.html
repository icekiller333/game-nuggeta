<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Hopper: The Last Spark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --space:#120f2e; --space-deep:#07061a; --panel:rgba(22,18,56,.92); --ink:#f3eefe; --haze:#a49dd6;
  --spark:#ffcf70; --echo:#9fe8ff; --danger:#ff6b8b; --line:rgba(164,157,214,.35);
  --ui:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --tale:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --space:#120f2e; --space-deep:#07061a; --ink:#f3eefe; --haze:#a49dd6; } }
:root[data-theme="dark"]{ --space:#120f2e; --space-deep:#07061a; --ink:#f3eefe; --haze:#a49dd6; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;background:var(--space-deep);color:var(--ink);font-family:var(--ui);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 70px 0;display:flex;flex-direction:column;align-items:center;transition:opacity .8s}
#hud.gone{opacity:0}
#score{font-size:48px;font-weight:700;line-height:1;transition:transform .12s;text-shadow:0 2px 18px rgba(255,207,112,.25)}
#score.bump{transform:scale(1.22)}
#streak{font-size:15px;font-weight:600;color:var(--spark);min-height:19px;margin-top:2px;opacity:0;transition:opacity .2s}
#streak.on{opacity:1}
#streak.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
#sectorLine{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--haze);margin-top:4px;min-height:18px}
#sectorLine[hidden]{display:none}
#prog{width:84px;height:5px;border-radius:3px;background:rgba(164,157,214,.2);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--spark);border-radius:3px;transition:width .35s}
#secEchoes{color:var(--echo);letter-spacing:2px;font-size:13px}
#heat{margin-top:6px;height:7px;border-radius:4px;background:rgba(164,157,214,.2);overflow:hidden;transition:width .4s}
#heat i{display:block;height:100%;width:100%;transform-origin:left;border-radius:4px;background:var(--spark)}
#heat.low i{background:var(--danger)}
#heat.low{animation:heatblink .5s linear infinite}
@keyframes heatblink{50%{opacity:.45}}
#best{font-size:15px;color:var(--haze);margin-top:4px;min-height:18px}
#hud.quiet #score,#hud.quiet #streak,#hud.quiet #sectorLine,#hud.quiet #best,#hud.quiet #heat{visibility:hidden}
#tip{margin-top:12px;display:flex;align-items:center;gap:12px;max-width:min(92vw,400px);
  background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 16px 10px 12px;
  transition:opacity .25s, transform .25s}
#tip.hidden{opacity:0;transform:translateY(-8px)}
#tip.noicon{padding-left:16px}
#tip canvas{width:40px;height:40px;flex:none}
#tip.noicon canvas{display:none}
#tip strong{display:block;font-size:17px;font-weight:700;color:var(--spark)}
#tip strong:empty{display:none}
#tip span{font-size:16px;line-height:1.35}

.corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;display:flex;gap:8px;z-index:5}
.corner button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);
  background:rgba(18,15,46,.65);color:var(--ink);font:600 20px/1 var(--ui);cursor:pointer}
button:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
#help{position:relative}
#badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--spark);color:#2a1c00;
  font:700 12px/20px var(--ui);padding:0 5px}
#badge[hidden]{display:none}

/* Title / game over */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;
  padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);transition:opacity .3s;z-index:4}
#overlay.low{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 5vh)}
.panel{background:linear-gradient(180deg,rgba(28,23,70,.94),rgba(10,8,30,.96));border:1.5px solid var(--line);border-radius:24px;box-shadow:0 12px 48px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
#overlay .panel{width:min(100%,420px);padding:24px 22px 18px}
#overlay h2{font-size:32px;font-weight:700;margin:0 0 6px}
#overlay h2:empty{display:none}
#overlay .how{font-family:var(--tale);font-style:italic;font-size:19px;line-height:1.5;color:var(--ink);margin:0 auto 18px;max-width:30ch}
#overlay .btns{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 14px}
.pill{pointer-events:auto;min-width:230px;min-height:48px;padding:0 22px;border-radius:24px;border:2px solid var(--line);
  background:rgba(18,15,46,.72);color:var(--ink);font:600 18px var(--ui);cursor:pointer;transition:transform .12s}
.pill:active{transform:scale(.96)}
.pill.primary{background:var(--spark);border-color:var(--spark);color:#2a1c00;box-shadow:0 0 28px rgba(255,207,112,.35)}
#overlay .cta{font-size:15px;color:var(--haze);margin:0}

/* Story cards */
#story{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px 22px;background:rgba(4,3,14,.35);z-index:4}
#story[hidden]{display:none}
.scard{width:100%;max-width:470px;padding:24px 24px 18px;background:linear-gradient(180deg,rgba(28,23,70,.94),rgba(10,8,30,.96));
  border:1.5px solid var(--line);border-radius:24px;box-shadow:0 12px 48px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#sLabel{font-size:15px;font-weight:600;color:var(--spark);margin-bottom:8px;min-height:18px}
.scard.echo #sLabel{color:var(--echo)}
#sText{font-family:var(--tale);font-style:italic;font-size:23px;line-height:1.48;margin:0;text-wrap:pretty}
#sText .ghost{opacity:0}
#sNext{margin-top:14px;font-size:14px;color:var(--haze);transition:opacity .3s;opacity:0}

/* Sector banner */
#banner{position:fixed;left:0;right:0;top:calc(50% - 70px);display:flex;justify-content:center;padding:0 20px;pointer-events:none;opacity:0;z-index:3}
#banner .bp{text-align:center;padding:16px 32px 18px;background:linear-gradient(180deg,rgba(28,23,70,.92),rgba(10,8,30,.94));
  border:1.5px solid var(--line);border-radius:22px;box-shadow:0 12px 48px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
#banner small{display:block;font-size:15px;letter-spacing:.12em;color:var(--haze)}
#banner b{display:block;font-family:var(--tale);font-style:italic;font-weight:600;font-size:clamp(34px,9vw,52px);line-height:1.1;margin-top:4px;
  text-shadow:0 0 30px rgba(255,207,112,.35)}
#banner.show{animation:banner 3s ease-in-out forwards}
@keyframes banner{0%{opacity:0;transform:translateY(10px);letter-spacing:.02em}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* Journal */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(7,6,26,.66);z-index:6}
.modal[hidden]{display:none}
.modal .card{background:var(--space);border:2px solid var(--line);border-radius:24px;
  width:min(100%,440px);max-height:calc(100% - 20px);overflow-y:auto;padding:18px 20px 16px}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,255,255,.04);border-radius:14px;padding:4px}
.tab{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;color:var(--haze);font:600 16px var(--ui);cursor:pointer}
.tab.on{background:rgba(255,207,112,.16);color:var(--ink)}
.modal h3{margin:0 0 4px;font-size:24px}
.modal .lead{margin:0 0 10px;color:var(--haze);font-size:15px;line-height:1.4}
.progress{height:8px;border-radius:4px;background:rgba(164,157,214,.18);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;width:0;background:var(--spark);border-radius:4px;transition:width .3s}
#echoBar{background:var(--echo)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.entry{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px 10px;border-radius:16px;
  border:2px solid rgba(164,157,214,.2);background:rgba(255,255,255,.03);color:var(--ink);font:600 15px var(--ui);cursor:pointer}
.entry canvas{width:56px;height:56px;margin-bottom:2px}
.entry.locked{color:var(--haze);border-style:dashed}
.entry small{font-weight:400;font-size:13px;color:var(--haze)}
.entry .new{position:absolute;top:6px;right:8px;font-size:12px;color:#2a1c00;background:var(--spark);border-radius:8px;padding:1px 6px}
#detail[hidden],#gridView[hidden],#echoView[hidden],#backBtn[hidden]{display:none}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.dhead canvas{width:76px;height:76px;flex:none}
.dhead h3{margin:0}
.dhead p{margin:2px 0 0;color:var(--haze);font-size:15px}
.lore{font-family:var(--tale);font-style:italic;font-size:17px;line-height:1.5;margin:0 0 8px}
.plays{font-size:15px;line-height:1.45;color:var(--haze);margin:0 0 14px}
.plays b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:15px;margin:0 0 14px}
.pips{display:flex;gap:4px}
.pips i{flex:1;max-width:26px;height:10px;border-radius:5px;background:rgba(164,157,214,.18)}
.pips i.on{background:var(--c,var(--spark))}
.stats .v{color:var(--haze);font-size:14px;text-align:right;min-width:46px}
.mine{display:flex;gap:10px}
.mine div{flex:1;border-radius:14px;background:rgba(255,255,255,.05);padding:10px 12px}
.mine b{display:block;font-size:22px;font-weight:700}
.mine span{font-size:13px;color:var(--haze)}
#echoList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#echoList li{border-radius:14px;background:rgba(159,232,255,.06);border:2px solid rgba(159,232,255,.18);padding:10px 14px}
#echoList li.locked{background:transparent;border-style:dashed;border-color:rgba(164,157,214,.22)}
#echoList .eh{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;color:var(--echo)}
#echoList li.locked .eh{color:var(--haze)}
#echoList .eh small{font-weight:400;color:var(--haze)}
#echoList p{margin:4px 0 0;font-family:var(--tale);font-style:italic;font-size:16px;line-height:1.45}
#echoList li.locked p{font-family:var(--ui);font-style:normal;font-size:14px;color:var(--haze)}
.modal .row{display:flex;gap:10px;margin-top:14px}
.modal .row button{flex:1;min-height:44px;border-radius:14px;border:2px solid var(--line);background:transparent;
  color:var(--ink);font:600 16px var(--ui);cursor:pointer}
.modal .row button.primary{background:var(--spark);border-color:var(--spark);color:#2a1c00}

/* Ending */
#end{background:radial-gradient(circle at 50% 30%,rgba(255,190,90,.18),rgba(7,6,26,.55) 70%)}
#end .card{text-align:center;padding:26px 22px 18px;animation:rise .8s cubic-bezier(.2,.8,.2,1)}
#end h3{font-family:var(--tale);font-style:italic;font-weight:600;font-size:34px;margin:0 0 6px}
#end .lead{font-size:16px}
.estats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 8px}
.estats div{border-radius:14px;background:rgba(255,255,255,.05);padding:10px 8px}
.estats div.wide{grid-column:1 / -1}
.estats b{display:block;font-size:24px;font-weight:700}
.estats span{font-size:13px;color:var(--haze)}
.credits{font-size:13px;color:var(--haze);margin:12px 0 0}

@media (max-width:420px){ #sText{font-size:20px} #overlay .how{font-size:17px} }
@media (prefers-reduced-motion: reduce){ #heat.low{animation:none} #score,#tip{transition:none} .scard,#end .card{animation:none} #banner.show{animation-duration:3s} }
</style>
</head>
<body>
<canvas id="c" aria-label="Orbit Hopper game"></canvas>
<div id="hud" class="quiet">
  <div id="score">0</div>
  <div id="streak"></div>
  <div id="sectorLine"><span id="secName"></span><div id="prog"><i></i></div><span id="secEchoes" aria-label="Echoes in this sector"></span></div>
  <div id="heat" role="meter" aria-label="Heat" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  <div id="best"></div>
  <div id="tip" class="hidden" role="status"><canvas id="tipIcon" width="80" height="80"></canvas><div><strong id="tipTitle"></strong><span id="tipText"></span></div></div>
</div>
<div class="corner">
  <button id="help" aria-label="Journal">🪐<span id="badge" hidden></span></button>
  <button id="mute" aria-label="Mute sound">🔊</button>
</div>
<div id="banner" aria-live="polite"><div class="bp"><small id="bNum"></small><b id="bName"></b></div></div>
<div id="overlay">
  <div class="panel">
    <h2 id="ovTitle"></h2>
    <p class="how" id="ovText"></p>
    <div class="btns" id="ovBtns"></div>
    <p class="cta" id="ovCta"></p>
  </div>
</div>
<div id="story" hidden>
  <div class="scard" id="scard" role="dialog" aria-live="polite" aria-labelledby="sLabel">
    <div id="sLabel"></div>
    <p id="sText"></p>
    <div id="sNext">Tap to continue</div>
  </div>
</div>
<div id="guide" class="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-label="Journal">
    <div class="tabs" role="tablist">
      <button id="tabP" class="tab on" role="tab" aria-selected="true">Planets</button>
      <button id="tabE" class="tab" role="tab" aria-selected="false">Echoes</button>
    </div>
    <div id="gridView">
      <p class="lead" id="colCount"></p>
      <div class="progress"><i id="colBar"></i></div>
      <div id="grid"></div>
    </div>
    <div id="echoView" hidden>
      <p class="lead" id="echoCount"></p>
      <div class="progress"><i id="echoBar"></i></div>
      <ol id="echoList"></ol>
    </div>
    <div id="detail" hidden><div id="detailBody"></div></div>
    <div class="row"><button id="backBtn" hidden>All planets</button><button id="replayTut">Replay tutorial</button><button id="closeGuide" class="primary">Close</button></div>
  </div>
</div>
<div id="end" class="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <h3 id="endTitle">The star is lit</h3>
    <p class="lead" id="endLead"></p>
    <div class="estats" id="endStats"></div>
    <div class="row"><button id="endAgain">Begin again</button><button id="endEndless" class="primary">Play endless</button></div>
    <p class="credits">Orbit Hopper: The Last Spark. Thanks for carrying the light.</p>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d', { alpha: false });
const heatEl = $('heat'), hudEl = $('hud'), scoreEl = $('score'), streakEl = $('streak'), bestEl = $('best');
const secLine = $('sectorLine'), secName = $('secName'), progBar = $('prog').firstElementChild, secEchoes = $('secEchoes');
const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), ovBtns = $('ovBtns'), ovCta = $('ovCta');
const tipEl = $('tip'), tipTitle = $('tipTitle'), tipText = $('tipText'), tipIcon = $('tipIcon');
const muteBtn = $('mute'), helpBtn = $('help'), guide = $('guide'), endEl = $('end');
const storyEl = $('story'), scardEl = $('scard'), sLabel = $('sLabel'), sText = $('sText'), sNext = $('sNext');
const bannerEl = $('banner');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const WORLD_W = 420, CAM_FRAC = 0.62;
let W, H, dpr, scale, safeB = 0;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
// colour strings are cached by value (they used to be rebuilt as template strings for every particle every frame);
// fade is done with globalAlpha, which gives the same result as an alpha channel in the string
const hslCache = new Map();
function hslc(h, sat, l){
  const k = (h * 1000 + sat) * 1000 + l; let v = hslCache.get(k);
  if (!v) { if (hslCache.size > 512) hslCache.clear(); hslCache.set(k, v = `hsl(${h},${sat}%,${l}%)`); }
  return v;
}
const gcOf = p => p.gc || (p.gc = {});          // per-planet cache for gradients and colour strings
const DASH_RING = [5, 9], DASH_RING3 = [6, 9];
// filter an array in place (keeps order) so the per-frame cleanup doesn't allocate a new array every frame
function prune(a, keep){ let j = 0; for (let i = 0; i < a.length; i++) { const v = a[i]; if (keep(v)) a[j++] = v; } a.length = j; }
function mulberry(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let q = Math.imul(seed ^ seed >>> 15, 1 | seed); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} };

// ================= world design =================
const SECTORS = [
  { name: 'The Shallows',      len: 29, gates: [15], add: { fast: 7, slow: 17, oval: 23 }, move: 0,   rocks: 0,   echoAt: [8, 19, 26],   bg: ['#221c55', '#07061a'], neb: [250, 205, 290], hues: [205, 220, 240, 195], root: 110 },
  { name: 'Amber Drift',       len: 19, gates: [15], add: {},                              move: .22, rocks: 0,   echoAt: [4, 9, 13],  bg: ['#3d1d33', '#0c0510'], neb: [28, 345, 15],    hues: [22, 34, 352, 42],    root: 98 },
  { name: 'The Hollow Giants', len: 7,  add: { giant: 1, tiny: 3 }, move: 0,   rocks: 0,   echoAt: [2, 4, 6],  bg: ['#2c1149', '#08031a'], neb: [275, 300, 320], hues: [262, 286, 302, 250], root: 87.31 },
  { name: 'Mirror Reach',      len: 7,  add: { flip: 2 },          move: .6,  rocks: .5,  echoAt: [2, 4, 6],  bg: ['#0c3442', '#020c14'], neb: [185, 200, 165], hues: [180, 196, 168, 210], root: 123.47 },
  { name: 'The Last Dark',     len: 8,  add: {},                   move: .8,  rocks: .6,  echoAt: [2, 5, 7],  bg: ['#1f0810', '#020103'], neb: [350, 5, 330],    hues: [350, 10, 332, 0],    root: 73.42 },
];
const GATE_G = []; { let g = 0; for (const S of SECTORS) { g += S.len + 1; GATE_G.push(g); } }
const TOTAL_G = GATE_G[GATE_G.length - 1];
// 2D run: relays at planets 15, 30 and 45, black hole at planet 50. Checkpoint index = save.cp.
const HOLE_G = GATE_G[1];
const RELAY_SPEC = [null, { s: 0, li: 15, g: 15, mid: true }, { s: 0, li: 30, g: 30 }, { s: 1, li: 15, g: 45, mid: true }];
const RELAY_2D = { 15: 1, 30: 2, 45: 3 };
const CP_SECTOR = [0, 0, 1, 1, 2, 3, 4];   // which sector you resume in, per checkpoint
const CP_DEEP = 4;                           // checkpoint reached by coming out of the black hole
const cpOfRelay = n => n <= 3 ? n : n + 1;
const relayOf = p => p.type !== 'gate' ? 0 : p.g < HOLE_G ? (RELAY_2D[p.g] || 0) : p.s === 2 ? 4 : 5;
const ECHO_COUNT = SECTORS.length * 3;

const TYPES = {
  normal: { name: 'Planet',  hue: 225, sat: 35, speed: 1,    decay: 1,    desc: 'A steady, regular orbit.', catalog: 1 },
  fast:   { name: 'Spinner', hue: 42,  sat: 90, speed: 1.55, decay: 1,    desc: 'Whips you around fast and flings you out faster.', unlock: 4, catalog: 1 },
  slow:   { name: 'Drifter', hue: 172, sat: 70, speed: 0.6,  decay: 0.75, desc: 'Slow, lazy orbit. Easy to aim, slow to escape.', unlock: 7, catalog: 1 },
  giant:  { name: 'Giant',   hue: 268, sat: 75, speed: 1,    decay: 0.6,  desc: 'Huge pull and a wide orbit that shrinks slowly.', unlock: 10, catalog: 1 },
  tiny:   { name: 'Pebble',  hue: 330, sat: 85, speed: 1.15, decay: 1.5,  desc: 'Tiny pull and a tight orbit that shrinks fast.', unlock: 13, catalog: 1 },

    for (let k = 0; k < segs; k++) {
      const on = k < lit, x = mx + (k - (segs - 1) / 2) * 16, h = 6 + Math.abs(k - (segs - 1) / 2) * -0.8 + 10;
      ctx.fillStyle = track.locked ? 'rgba(255,215,130,1)' : on ? `rgba(255,207,112,${0.55 + 0.45 * track.flashT})` : 'rgba(164,157,214,0.22)';
      ctx.fillRect(x - 5, my - h / 2, 10, h);
    }
    ctx.font = '600 14px Fredoka, "Trebuchet MS", sans-serif';
    ctx.fillStyle = track.locked ? '#ffe7a8' : 'rgba(243,238,254,0.7)';
    ctx.fillText(track.locked ? 'Locked. Launch now' : track.near ? 'Lining up…' : 'Tracker', mx, my + 26);
  }
}
const rockScratch = { x: 0, y: 0, rot: 0, r: 0, verts: null }, shardScratch = { x: 0, y: 0, bob: 0 };
let segCol = '', segLow = false;
function drawItem3(it){
  const sp = it.sp;
  switch (it.k) {
    case 0: sc0(sp, 0.9); drawHole(hole3); ctx.restore(); break;
    case 1: drawP3(it.a, sp); break;
    case 2: { const r = it.a; rockScratch.rot = r.rot; rockScratch.r = r.r; rockScratch.verts = r.verts; sc0(sp, 1); drawRock(rockScratch); ctx.restore(); break; }
    case 3: shardScratch.bob = it.a.bob; sc0(sp, 1); drawShard(shardScratch); ctx.restore(); break;
    case 4: { const i = it.i;
      ctx.fillStyle = hslc(qHue[i], 90, 72); ctx.globalAlpha = Math.min(1, qLife[i] / qMax[i]);
      ctx.beginPath(); ctx.arc(sp.x, sp.y, Math.max(0.8, qSize[i] * sp.s), 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; break; }
    case 5: { const r = it.a, f = 1 - r.life / r.max, rad = (r.r0 + (r.r1 - r.r0) * ease(f)) * sp.s;
      ctx.strokeStyle = hslc(r.hue, 95, 75); ctx.globalAlpha = Math.max(0, (1 - f) * 0.8); ctx.lineWidth = Math.max(1, (r.w * (1 - f) + 0.5) * sp.s * 0.5);
      ctx.beginPath(); ctx.arc(sp.x, sp.y, rad, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; break; }
    case 6: { const h = it.a, rad = 14 * sp.s;
      glowDisc(sp.x, sp.y, rad, GLOW_HOMER);
      flare(ctx, sp.x, sp.y, 7 * sp.s, realT * 2 + h.a, 'rgba(255,255,255,0.85)'); break; }
    case 7: { const f = it.a;
      ctx.strokeStyle = segCol; ctx.globalAlpha = f * (segLow ? 0.5 + 0.45 * Math.sin(t * 22) : 0.65); ctx.lineWidth = Math.max(1, 3.6 * f * sp.s);
      ctx.beginPath(); ctx.moveTo(sp.x, sp.y); ctx.lineTo(it.b.x, it.b.y); ctx.stroke(); ctx.globalAlpha = 1; break; }
    case 8: { const hot = streak >= 8, R = (20 + Math.min(streak, 12) * 0.8) * sp.s * (0.55 + 0.45 * heatFrac());
      glowDisc(sp.x, sp.y, R, GLOW_SPARK[hot ? 1 : 0]);
      flare(ctx, sp.x, sp.y, 11 * sp.s, realT * 2, hot ? 'rgba(220,250,255,0.75)' : 'rgba(255,240,200,0.7)');
      ctx.fillStyle = '#fff8e6'; ctx.beginPath(); ctx.arc(sp.x, sp.y, Math.max(3, 5.5 * sp.s), 0, 6.283); ctx.fill(); break; }
  }
}
function draw3(){
  FOVF = Math.min(W, H) * 0.72 * (1 + zoomKick);
  shX = shake > 0 ? rand(-1, 1) * shake * 18 : 0; shY = shake > 0 ? rand(-1, 1) * shake * 18 : 0;
  sp3N = 0; itemN = 0; drawList.length = 0;
  drawBg3(beatEnv());
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (hole3) { const sp = pj(hole3.pos); if (sp.vis) add3(sp.z, 0, null, sp); }
  for (const q of planets3) { const sp = pj(q.pos); if (sp.vis) add3(sp.z, 1, q, sp); }
  for (const r of rocks3) { const sp = pj(r.pos); if (sp.vis) add3(sp.z, 2, r, sp); }
  for (const sh of shards3) { const sp = pj(sh.pos); if (sp.vis) add3(sp.z, 3, sh, sp); }
  const q0 = qUsed < QN ? 0 : qHead;
  for (let k = 0; k < qUsed; k++) {
    let i = q0 + k; if (i >= QN) i -= QN;
    if (qLife[i] <= 0) continue;
    const sp = pjxyz(qX[i], qY[i], qZ[i]); if (sp.vis) add3(sp.z, 4, null, sp, null, i);
  }
  for (const r of rings3) { const sp = pj(r.pos); if (sp.vis) add3(sp.z, 5, r, sp); }
  for (const h of homers3) {
    if (h.t < 0 || !src3) continue;
    const k = ease(h.t / 2.4), c = Math.cos(h.a) * h.R, sn = Math.sin(h.a) * h.R;
    const ox = src3.pos[0] + h.u[0] * c + h.w[0] * sn, oy = src3.pos[1] + h.u[1] * c + h.w[1] * sn, oz = src3.pos[2] + h.u[2] * c + h.w[2] * sn;
    const sp = pjxyz(h.start[0] + (ox - h.start[0]) * k, h.start[1] + (oy - h.start[1]) * k, h.start[2] + (oz - h.start[2]) * k);
    if (sp.vis) add3(sp.z, 6, h, sp);
  }
  const n = trail3.length;
  const low = P3.mode === 'orbit' && state === 'play' && TYPES[P3.planet.type].decay > 0 && P3.R - P3.planet.r < 15;
  segLow = low; segCol = low ? 'rgb(255,107,139)' : streak >= 8 ? 'rgb(170,235,255)' : 'rgb(255,207,112)';
  let prev = n > 0 ? pj(trail3[0]) : null;
  for (let k = 1; k < n; k++) {
    const b = pj(trail3[k]);
    if (prev && prev.vis && b.vis) add3((prev.z + b.z) / 2, 7, k / n, prev, b);
    prev = b;
  }
  if (P3.mode === 'orbit' || P3.mode === 'fly') { const sp = pj(P3.pos); if (sp.vis) add3(sp.z, 8, null, sp); }
  drawList.sort(byDepth);
  ctx.lineCap = 'round';
  for (let i = 0; i < drawList.length; i++) drawItem3(drawList[i]);
  drawTrackerHUD();
  drawPopups();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (flash > 0.01) { ctx.fillStyle = `rgba(${flashColor},${Math.min(1, flash)})`; ctx.fillRect(0, 0, W, H); }
}

// ================= main loop =================
let last = 0, alive = true, raf = 0;
function loop(now){
  if (!alive) return;
  raf = requestAnimationFrame(loop);
  const real = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
  last = now; realT += real;

  // timers
  for (const tm of timers) tm.t -= real;
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].t <= 0) { const fn = timers[i].fn; timers.splice(i, 1); fn(); }

  // typewriter on story cards
  if (storyOpen && shown < fullText.length) {
    typeAcc += real * 46;
    const add = Math.floor(typeAcc);
    if (add > 0) { typeAcc -= add; shown = Math.min(fullText.length, shown + add); renderCard(); if (shown % 3 === 0) sfx.tick(); }
  }

  // pulse audio
  if (AU.ac && !save.muted && (state === 'play' || state === 'title') && !guideOpen && !endOpen) {
    const bi = Math.floor(realT / beatPeriod());
    if (bi !== lastBeat) {
      lastBeat = bi;
      const pr = progressFrac();
      if (mode === 'story' && curS === SECTORS.length - 1) sfx.thump(0.05 + 0.09 * pr);
      else sfx.ping(0.014 + 0.03 * pr);
      musicBeat(bi);
    }
  }

  if (guideOpen || endOpen) {
    if (canvasStale) { canvasStale = false; if (dim === 3) draw3(); else draw(); }
    return;
  }
  canvasStale = false;

  shake = Math.max(0, shake - real * 1.4);
  flash = Math.max(0, flash - real * 1.5);
  zoomKick *= Math.pow(0.001, real);
  if (slowmo > 0) slowmo = Math.max(0, slowmo - real);
  if (hitstop > 0) { hitstop -= real; if (dim === 3) draw3(); else draw(); return; }

  const dt = real * (slowmo > 0 ? 0.35 : 1);
  if (dim === 3) { update3(dt, real); draw3(); }
  else { update(dt, real); draw(); }
  drawHeatHUD();
}
function onHide(){ if (document.hidden) { last = 0; lockTone(false); } }
document.addEventListener('visibilitychange', onHide, { signal: lifeAC.signal });
// tearing down the page releases everything: the frame loop, audio, timers, observers and every listener
function cleanup(){
  if (!alive) return; alive = false;
  cancelAnimationFrame(raf); lifeAC.abort(); timers.length = 0; lockTone(false);
  if (AU.ac) { AU.ac.close().catch(() => {}); AU.ac = null; AU.drone = null; }
  nebulae = []; baseGrads = [];
}
window.addEventListener('pagehide', cleanup, { once: true });

// boot
updateBadge();
goTitle();
raf = requestAnimationFrame(loop);
})();
</script>
