<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Daily Roguelike — The Last Wind (2026-11-15)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#241640}
  body{font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#241640;position:relative}
  /* ---------- top bar ---------- */
  #topbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#2e1b52;border-bottom:3px solid #14101f}
  #hourLab{font-weight:900;font-size:15px;color:#ffd23f;white-space:nowrap}
  #pips{flex:1;display:flex;gap:3px;justify-content:center}
  .pip{width:11px;height:11px;border:2px solid #ffd23f;background:transparent;border-radius:50%}
  .pip.on{background:#ffd23f;box-shadow:0 0 6px #ffd23f}
  #springs{font-size:15px;letter-spacing:1px;white-space:nowrap;color:#2de1c2}
  #springs .dead{opacity:.25;filter:grayscale(1)}
  .iconBtn{flex:0 0 34px;height:34px;border:3px solid #14101f;background:#ff5da2;color:#14101f;font-size:17px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #14101f;border-radius:0}
  .iconBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #14101f}
  #lawsBtn{flex:0 0 auto;height:34px;padding:0 8px;border:3px solid #14101f;background:#2de1c2;color:#14101f;font-size:13px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #14101f;border-radius:0}
  #lawsBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #14101f}
  /* ---------- candle ---------- */
  #candleWrap{height:30px;flex:0 0 30px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#1d1038}
  #candleWrap .lab{font-size:12px;font-weight:900;color:#ffb020;letter-spacing:1px}
  #candleBar{flex:1;height:12px;border:2px solid #14101f;background:#3a2566;overflow:hidden}
  #candleFill{height:100%;width:100%;background:#ffb020}
  #candleTime{font-size:12px;font-weight:900;color:#ffb020;min-width:38px;text-align:right}
  /* ---------- scene ---------- */
  #scene{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a2566 0%,#241640 70%)}
  #clockFace{width:min(46vw,190px);height:min(46vw,190px);flex:0 0 auto}
  #pendulum{position:absolute;left:50%;top:52%;width:6px;height:120px;transform-origin:50% 0;margin-left:-3px}
  #pendRod{position:absolute;left:0;top:0;width:6px;height:104px;background:#ffd23f;border:2px solid #14101f}
  #pendBob{position:absolute;left:-19px;top:100px;width:44px;height:44px;border-radius:50%;background:#ff5da2;border:3px solid #14101f;box-shadow:0 0 14px #ff5da2}
  #flash{position:absolute;inset:0;background:#ffd23f;opacity:0;pointer-events:none}
  #flash.red{background:#ff4d4d}
  /* ---------- meter ---------- */
  #meterWrap{flex:0 0 78px;padding:6px 12px 4px;background:#2e1b52;border-top:3px solid #14101f}
  #meterTop{display:flex;justify-content:space-between;align-items:baseline}
  #meterTop .lab{font-size:13px;font-weight:900;color:#fff;letter-spacing:1px}
  #comboLab{font-size:13px;font-weight:900;color:#2de1c2}
  #meter{position:relative;height:30px;margin-top:4px;border:3px solid #14101f;background:#3a2566;overflow:hidden}
  #band{position:absolute;top:0;bottom:0;background:#37d67a;border-left:2px solid #14101f;border-right:2px solid #14101f}
  #redzone{position:absolute;top:0;bottom:0;right:0;width:8%;background:#ff4d4d;opacity:.85}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:#2de1c2}
  #meterHint{font-size:11px;color:#c9b8f5;margin-top:3px;text-align:center}
  /* ---------- wind button ---------- */
  #windWrap{flex:0 0 84px;padding:8px 12px 12px;background:#241640}
  #windBtn{width:100%;height:100%;border:4px solid #14101f;background:#ffd23f;color:#14101f;font-size:24px;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 0 #14101f;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:0;font-family:inherit}
  #windBtn.holding{background:#ff8a3d;box-shadow:0 2px 0 #14101f;transform:translateY(4px)}
  /* ---------- laws strip ---------- */
  #laws{flex:0 0 40px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#1d1038;overflow:hidden;border-top:3px solid #14101f}
  #laws .lab{font-size:11px;font-weight:900;color:#c9b8f5;letter-spacing:1px;flex:0 0 auto}
  #lawChips{flex:1;display:flex;gap:6px;overflow:hidden}
  .chip{flex:0 0 auto;font-size:11px;font-weight:900;color:#14101f;background:#ff9de2;padding:3px 7px;border:2px solid #14101f;white-space:nowrap}
  .chip:first-child{background:#ffd23f}
  #noLaws{font-size:11px;color:#c9b8f5}
  /* ---------- overlay / single message ---------- */
  #overlay{position:absolute;inset:0;background:rgba(20,10,40,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  #overlay.show{display:flex}
  #card{width:100%;max-width:340px;background:#ffd23f;color:#14101f;border:4px solid #14101f;box-shadow:8px 8px 0 #14101f;padding:18px 16px;text-align:center}
  #card.pink{background:#ff9de2}
  #card.teal{background:#2de1c2}
  #card.dark{background:#2e1b52;color:#fff;border-color:#14101f}
  #cardTitle{font-size:24px;font-weight:900;letter-spacing:1px;margin-bottom:8px}
  #cardBody{font-size:16px;line-height:1.45;font-weight:700}
  #cardBtn{margin-top:14px;min-width:150px;height:46px;border:3px solid #14101f;background:#14101f;color:#ffd23f;font-size:17px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.35);font-family:inherit}
  #cardBtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
  #cardStats{margin-top:10px;font-size:14px;font-weight:900;line-height:1.6}
  /* spotlight ring for the how-to tour */
  #spot{position:absolute;border:4px solid #2de1c2;box-shadow:0 0 0 4000px rgba(20,10,40,.82),0 0 18px #2de1c2;z-index:15;display:none;pointer-events:none;border-radius:0}
  /* floating feedback text */
  #floats{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:10}
  .floatTxt{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:26px;font-weight:900;color:#ffd23f;text-shadow:3px 3px 0 #14101f;animation:rise 1.1s ease-out forwards;white-space:nowrap}
  .floatTxt.bad{color:#ff4d4d}
  .floatTxt.weak{color:#c9b8f5;font-size:20px}
  @keyframes rise{0%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-70px}}
  .confetti{position:absolute;width:10px;height:10px;top:-12px;z-index:30;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (max-width:430px){
    #topbar{gap:5px;padding:0 6px}
    #hourLab{font-size:13px}
    #pips{gap:2px}
    .pip{width:9px;height:9px}
    #springs{font-size:13px;letter-spacing:0}
    #lawsBtn{padding:0 6px;font-size:12px}
  }
  #app.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,2px)}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="hourLab">HOUR 1/6</span>
    <div id="pips" aria-label="chimes"></div>
    <span id="springs" aria-label="springs"></span>
    <button id="lawsBtn" type="button">LAWS</button>
    <button id="soundBtn" class="iconBtn" type="button" aria-label="sound">🔊</button>
  </div>
  <div id="candleWrap">
    <span class="lab">🕯 CANDLE</span>
    <div id="candleBar"><div id="candleFill"></div></div>
    <span id="candleTime">3:20</span>
  </div>
  <div id="scene">
    <svg id="clockFace" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="94" fill="#2e1b52" stroke="#ffd23f" stroke-width="6"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#3a2566" stroke-width="2"/>
      <g stroke="#ffd23f" stroke-width="4" stroke-linecap="round">
        <line x1="100" y1="12" x2="100" y2="26"/><line x1="100" y1="174" x2="100" y2="188"/>
        <line x1="12" y1="100" x2="26" y2="100"/><line x1="174" y1="100" x2="188" y2="100"/>
        <line x1="38" y1="38" x2="48" y2="48"/><line x1="152" y1="152" x2="162" y2="162"/>
        <line x1="162" y1="38" x2="152" y2="48"/><line x1="48" y1="152" x2="38" y2="162"/>
      </g>
      <g stroke="#c9b8f5" stroke-width="2" stroke-linecap="round">
        <line x1="100" y1="16" x2="100" y2="24" transform="rotate(30 100 100)"/>
        <line x1="100" y1="16" x2="100" y2="24" transform="rotate(60 100 100)"/>
        <line x1="100" y1="16" x2="100" y2="24" transform="rotate(120 100 100)"/>
        <line x1="100" y1="16" x2="100" y2="24" transform="rotate(150 100 100)"/>
        <line x1="100" y1="16" x2="100" y2="24" transform="rotate(210 100 100)"/>
        <line x1="100" y1="16" x2="100" y2="24" transform="rotate(240 100 100)"/>
        <line x1="100" y1="16" x2="100" y2="24" transform="rotate(300 100 100)"/>
        <line x1="100" y1="16" x2="100" y2="24" transform="rotate(330 100 100)"/>
      </g>
      <line x1="100" y1="100" x2="100" y2="38" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <line x1="100" y1="100" x2="146" y2="100" stroke="#ff5da2" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="8" fill="#ffd23f" stroke="#14101f" stroke-width="3"/>
    </svg>
    <div id="pendulum"><div id="pendRod"></div><div id="pendBob"></div></div>
    <div id="flash"></div>
  </div>
  <div id="meterWrap">
    <div id="meterTop"><span class="lab">WIND</span><span id="comboLab"></span></div>
    <div id="meter"><div id="band"></div><div id="redzone"></div><div id="fill"></div></div>
    <div id="meterHint">green = chime &nbsp;·&nbsp; low = weak &nbsp;·&nbsp; high = SNAP</div>
  </div>
  <div id="windWrap"><button id="windBtn" type="button">HOLD TO WIND</button></div>
  <div id="laws"><span class="lab">LAWS</span><div id="lawChips"><span id="noLaws">none yet</span></div></div>
  <div id="spot"></div>
  <div id="floats"></div>
  <div id="overlay"><div id="card">
    <div id="cardTitle"></div>
    <div id="cardBody"></div>
    <div id="cardStats"></div>
    <button id="cardBtn" type="button"></button>
  </div></div>
</div>
<script>
(function(){
'use strict';
var CANDLE_MAX = 200, CHIMES_GOAL = 12, SPRINGS_MAX = 3;
var STORY = [
  {t:'THE LAST WIND', b:'The town clock stopped at dusk. Master Horace is gone. If it never strikes midnight, tomorrow never comes.', btn:'NEXT'},
  {t:'THE LAST WIND', b:'You are his last apprentice. The candle on his bench is all the light you have left.', btn:'START'}
];
var LAWS = {
  2:{name:'FASTER PENDULUM', apply:function(){ S.pendPeriod = 1.7; }},
  3:{name:'NARROW BAND', apply:function(){ S.bandW = 20; }},
  4:{name:'DOUBLE SWING', apply:function(){ S.doubleSwing = true; }},
  5:{name:'QUICK FILL', apply:function(){ S.fillTime = 1.2; }},
  6:{name:'GUTTERING CANDLE', apply:function(){ S.bandW = 15; S.gutter = true; }}
};
var S = null;
function freshState(){
  return { phase:'story', storyIdx:0, hour:1, chimes:0, hourChimes:0, combo:0, bestCombo:0,
    springs:SPRINGS_MAX, candle:CANDLE_MAX, fill:0, holding:false, pendPhase:0, pendPeriod:2.4,
    bandW:30, fillTime:1.8, doubleSwing:false, gutter:false, flip:false, prevSin:0,
    laws:[], endKind:null, muted:false, speedMul:1,
    stats:{winds:0, chimes:0, snaps:0, weaks:0, bonus:0} };
}
S = freshState();

var $ = function(id){ return document.getElementById(id); };
var overlayEl=$('overlay'), cardEl=$('card'), cardTitle=$('cardTitle'), cardBody=$('cardBody'),
    cardStats=$('cardStats'), cardBtn=$('cardBtn'), spotEl=$('spot');

function showOverlay(kind, title, body, btn, cls){
  overlayEl.dataset.kind = kind;
  cardTitle.textContent = title;
  cardBody.innerHTML = body;
  cardStats.innerHTML = '';
  cardBtn.textContent = btn;
  cardEl.className = cls || '';
  spotEl.style.display = 'none';
  overlayEl.classList.add('show');
}
function hideOverlay(){ overlayEl.classList.remove('show'); overlayEl.dataset.kind=''; }
function overlays(){
  if(!overlayEl.classList.contains('show')) return [];
  return [{id: overlayEl.dataset.kind || 'card', txt: (cardTitle.textContent+' '+cardBody.textContent).trim()}];
}
function showStory(idx){
  S.phase='story'; S.storyIdx=idx;
  var s=STORY[idx];
  showOverlay('story', s.t, s.b, s.btn, idx===0?'':'pink');
}
function showHowto(){
  S.phase='howto';
  showOverlay('howto', 'HOW TO WIND',
    'Hold WIND, release inside the green band to strike a chime — 12 chimes before the candle dies.',
    'BEGIN WINDING', 'teal');
  // spotlight the WIND button while the how-to is up
  var r=$('windBtn').getBoundingClientRect(), a=$('app').getBoundingClientRect();
  spotEl.style.display='block';
  spotEl.style.left=(r.left-a.left-6)+'px'; spotEl.style.top=(r.top-a.top-6)+'px';
  spotEl.style.width=(r.width+12)+'px'; spotEl.style.height=(r.height+12)+'px';
}
function showLaw(hour){
  var law=LAWS[hour];
  S.laws.unshift(law.name);
  renderLaws();
  showOverlay('law', 'NEW LAW: '+law.name,
    hour===2 ? 'The pendulum swings faster now. Time it again.' :
    hour===3 ? 'The green band narrows. Aim smaller.' :
    hour===4 ? 'The band jumps to the mirror side each swing. Watch it.' :
    hour===5 ? 'The spring fills faster. Release sooner.' :
    'The candle gutters — it burns faster now. Hurry.',
    'CONTINUE', 'pink');
}
function showEnd(){
  S.phase='end';
  var st=S.stats, mins=Math.max(0, Math.round(CANDLE_MAX - S.candle));
  var statsHtml = 'CHIMES '+S.chimes+' / 12<br>WINDS '+st.winds+' · SNAPS '+st.snaps+' · WEAK '+st.weaks+'<br>BEST COMBO ×'+S.bestCombo;
  if(S.endKind==='win'){
    showOverlay('end','MIDNIGHT STRIKES','The clock strikes twelve. Dawn is saved — tomorrow comes after all.','PLAY AGAIN','');
    cardStats.innerHTML = statsHtml;
    spawnConfetti();
    beep(880,0.5,'sine'); setTimeout(function(){beep(660,0.5,'sine');},180); setTimeout(function(){beep(990,0.7,'sine');},360);
  } else if(S.endKind==='springs'){
    showOverlay('end','THE SPRINGS ARE SPENT','The last spring snaps. The clock sits silent in the dark.','TRY AGAIN','dark');
    cardStats.innerHTML = statsHtml;
  } else {
    showOverlay('end','THE CANDLE DIES','The flame gutters out. The town clock never strikes midnight.','TRY AGAIN','dark');
    cardStats.innerHTML = statsHtml;
  }
}
function renderPips(){
  var pips=$('pips'); pips.innerHTML='';
  for(var i=0;i<CHIMES_GOAL;i++){
    var d=document.createElement('span');
    d.className='pip'+(i<S.chimes?' on':'');
    pips.appendChild(d);
  }
}
function renderSprings(){
  var el=$('springs'); el.innerHTML='';
  for(var i=0;i<SPRINGS_MAX;i++){
    var s=document.createElement('span');
    s.textContent='⚙'; if(i>=S.springs) s.className='dead';
    el.appendChild(s);
  }
}
function renderLaws(){
  var wrap=$('lawChips'); wrap.innerHTML='';
  if(!S.laws.length){ wrap.innerHTML='<span id="noLaws">none yet</span>'; return; }
  S.laws.forEach(function(name){
    var c=document.createElement('span'); c.className='chip'; c.textContent=name; wrap.appendChild(c);
  });
}
function renderTop(){
  $('hourLab').textContent='HOUR '+S.hour+'/6';
  $('comboLab').textContent = S.combo>=2 ? 'COMBO ×'+S.combo : '';
  renderPips(); renderSprings();
}
function floatTxt(txt, cls){
  var f=document.createElement('div');
  f.className='floatTxt'+(cls?' '+cls:''); f.textContent=txt;
  $('floats').appendChild(f);
  setTimeout(function(){ f.remove(); }, 1150);
}
function flash(red){
  var fl=$('flash'); fl.classList.toggle('red', !!red);
  fl.style.transition='none'; fl.style.opacity='0.55';
  requestAnimationFrame(function(){ fl.style.transition='opacity .45s'; fl.style.opacity='0'; });
}
function shake(){ var a=$('app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }
function spawnConfetti(){
  var colors=['#ffd23f','#2de1c2','#ff5da2','#ff8a3d','#7b5cff'];
  for(var i=0;i<60;i++){
    var c=document.createElement('div'); c.className='confetti';
    c.style.left=(Math.random()*100)+'%'; c.style.background=colors[i%5];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    c.style.animationDelay=(Math.random()*0.5)+'s';
    $('app').appendChild(c);
    (function(el){ setTimeout(function(){ el.remove(); }, 3600); })(c);
  }
}
/* ---------- audio (never gates input) ---------- */
var AC=null;
function beep(freq, dur, type){
  if(S.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.18, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function snapSound(){
  if(S.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.setValueAtTime(220, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(60, AC.currentTime+0.18);
    g.gain.setValueAtTime(0.22, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+0.2);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.2);
  }catch(e){}
}
/* ---------- core resolution: all synchronous in handlers ---------- */
function bandRange(){
  var center = 50 + 26*Math.sin(S.pendPhase + (S.doubleSwing && S.flip ? Math.PI : 0));
  var lo = Math.max(2, center - S.bandW/2), hi = Math.min(98, center + S.bandW/2);
  return {lo:lo, hi:hi, center:center};
}
function resolveRelease(){
  if(S.phase!=='play') return;
  S.holding=false; $('windBtn').classList.remove('holding');
  var f=S.fill, r=bandRange();
  S.stats.winds++;
  S.fill=0;
  if(f>=r.lo && f<=r.hi){
    S.combo++; if(S.combo>S.bestCombo) S.bestCombo=S.combo;
    S.chimes++; S.hourChimes++; S.stats.chimes++;
    var bonus=false;
    if(S.combo%3===0){ S.chimes++; S.hourChimes++; S.stats.bonus++; bonus=true; }
    floatTxt(bonus?'+2 CHIMES!':'+1 CHIME');
    flash(false); beep(880,0.4,'sine');
    renderTop();
    if(S.chimes>=CHIMES_GOAL){ endRun('win'); return; }
    if(S.hourChimes>=2){
      S.hourChimes=0;
      if(S.hour<6){ S.hour++; LAWS[S.hour].apply(); renderTop(); showLaw(S.hour); }
    }
  } else if(f<r.lo){
    S.combo=0; S.stats.weaks++;
    floatTxt('WEAK','weak'); beep(180,0.15,'sine'); renderTop();
  } else {
    doSnap();
  }
}
function doSnap(){
  S.combo=0; S.springs--; S.stats.snaps++;
  S.candle=Math.max(0, S.candle-5);
  floatTxt('SNAP!','bad'); flash(true); shake(); snapSound();
  renderTop();
  if(S.springs<=0){ endRun('springs'); }
  else if(S.candle<=0){ endRun('candle'); }
}
function endRun(kind){
  S.endKind=kind; S.holding=false; $('windBtn').classList.remove('holding');
  showEnd();
}
function startHold(){
  if(S.phase!=='play' || S.holding) return;
  if(overlayEl.classList.contains('show')) return;
  S.holding=true; $('windBtn').classList.add('holding');
}
function retry(){
  var muted=S.muted;
  S=freshState(); S.muted=muted;
  $('soundBtn').textContent = muted?'🔇':'🔊';
  renderTop(); renderLaws();
  $('fill').style.width='0%';
  showStory(0);
}
/* ---------- input ---------- */
var windBtn=$('windBtn');
windBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startHold(); });
window.addEventListener('pointerup', function(){ if(S.holding) resolveRelease(); });
windBtn.addEventListener('pointercancel', function(){ if(S.holding) resolveRelease(); });
window.addEventListener('keydown', function(e){
  if(e.code==='Space' && !e.repeat){ e.preventDefault(); startHold(); }
});
window.addEventListener('keyup', function(e){
  if(e.code==='Space'){ e.preventDefault(); if(S.holding) resolveRelease(); }
});
cardBtn.addEventListener('click', function(){
  var kind=overlayEl.dataset.kind;
  if(kind==='story'){
    if(S.storyIdx===0){ showStory(1); }
    else { showHowto(); }
  } else if(kind==='howto'){
    hideOverlay(); S.phase='play';
  } else if(kind==='law'){
    hideOverlay(); S.phase='play';
  } else if(kind==='end'){
    retry();
  } else if(kind==='laws'){
    hideOverlay(); S.phase='play';
  }
});
$('soundBtn').addEventListener('click', function(){
  S.muted=!S.muted; this.textContent=S.muted?'🔇':'🔊';
});
$('lawsBtn').addEventListener('click', function(){
  if(S.phase!=='play') return;
  if(overlayEl.classList.contains('show')) return;
  var body = S.laws.length
    ? S.laws.map(function(n,i){ return (i+1)+'. '+n; }).join('<br>')
    : 'No laws yet. Each hour adds one — newest first.';
  body += '<br><br>Hold WIND, release in the green band for a chime. Low is weak, high snaps a spring. 3 green in a row banks a bonus chime.';
  showOverlay('laws','CLOCKMAKER LAWS', body, 'CLOSE', 'dark');
});
/* ---------- main loop ---------- */
var lastT=null;
function loop(t){
  requestAnimationFrame(loop);
  if(lastT===null){ lastT=t; return; }
  var dt=Math.min(0.1,(t-lastT)/1000)*S.speedMul; lastT=t;
  if(S.phase==='play' && !overlayEl.classList.contains('show')){
    // pendulum swing + band flip tracking
    var sinNow=Math.sin(S.pendPhase);
    if(S.prevSin<=0 && sinNow>0) S.flip=!S.flip;
    if(S.prevSin>=0 && sinNow<0) S.flip=!S.flip;
    S.prevSin=sinNow;
    S.pendPhase += dt*2*Math.PI/S.pendPeriod;
    // candle drain
    S.candle -= dt*(S.gutter?1.5:1);
    if(S.candle<=0){ S.candle=0; endRun('candle'); }
    // fill while holding
    if(S.holding){
      S.fill += dt*100/S.fillTime;
      if(S.fill>=100){ S.fill=100; doSnap(); S.fill=0; S.holding=false; $('windBtn').classList.remove('holding'); }
    }
    // paint
    var ang=26*Math.sin(S.pendPhase);
    $('pendulum').style.transform='rotate('+ang.toFixed(2)+'deg)';
    var r=bandRange();
    $('band').style.left=r.lo+'%'; $('band').style.width=(r.hi-r.lo)+'%';
    $('fill').style.width=S.fill+'%';
    $('candleFill').style.width=(100*S.candle/CANDLE_MAX)+'%';
    var secs=Math.max(0,Math.ceil(S.candle));
    $('candleTime').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  }
}
requestAnimationFrame(loop);
/* ---------- boot ---------- */
renderTop(); renderLaws();
showStory(0);
/* ---------- debug hook for verification (inert in normal play) ---------- */
window.__lw = {
  S:S,
  state:function(){ return {phase:S.phase, hour:S.hour, chimes:S.chimes, hourChimes:S.hourChimes,
    combo:S.combo, springs:S.springs, candle:+S.candle.toFixed(1), fill:+S.fill.toFixed(1),
    bandLow:+bandRange().lo.toFixed(1), bandHigh:+bandRange().hi.toFixed(1),
    holding:S.holding, laws:S.laws.slice(), endKind:S.endKind, pendPeriod:S.pendPeriod,
    bandW:S.bandW, fillTime:S.fillTime, gutter:S.gutter, doubleSwing:S.doubleSwing}; },
  overlays:overlays,
  setChimes:function(n){ S.chimes=n; renderTop(); },
  setHourChimes:function(n){ S.hourChimes=n; },
  setSprings:function(n){ S.springs=n; renderSprings(); },
  setCandle:function(s){ S.candle=s; },
  debugSet:function(o){ if(o.speedMul!==undefined) S.speedMul=o.speedMul; if(o.candle!==undefined) S.candle=o.candle;
    if(o.pendPeriod!==undefined) S.pendPeriod=o.pendPeriod; if(o.fillTime!==undefined) S.fillTime=o.fillTime;
    if(o.bandW!==undefined) S.bandW=o.bandW; }
};
})();
</script>
