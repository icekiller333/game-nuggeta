<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Peel the Moon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --ink:#10101c;
        --sky:#171734;
        --sky2:#101024;
        --paper:#fff8ea;
        --moon:#f2edd8;
        --coral:#ff6b6b;
        --teal:#2ec4b6;
        --gold:#ffd166;
        --pink:#ff8fa3;
        --purple:#9b5de5;
        --lav:#cfc6ff;
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0;
        background:var(--sky2);
        color:var(--paper);
        font-family:"IBM Plex Mono", ui-monospace, monospace;
        overflow-x:hidden;
        user-select:none;
        -webkit-user-select:none;
        touch-action:manipulation;
      }
      #stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
      #noiseCv{ position:fixed; inset:0; z-index:80; pointer-events:none; opacity:0; width:100%; height:100%; image-rendering:pixelated; }
      #tvOff{ position:fixed; inset:0; z-index:90; pointer-events:none; background:#000; opacity:0; }
      #speech{
        position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
        z-index:85; width:min(88vw,430px); text-align:center; pointer-events:none;
        font-family:"Archivo Black", sans-serif; color:var(--paper);
        font-size:clamp(22px,6vw,34px); line-height:1.25;
        text-shadow:3px 3px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink);
        opacity:0;
      }
      #hint{
        display:none; background:var(--gold); color:var(--ink);
        border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
        font-size:13px; font-weight:700; line-height:1.4; padding:7px 10px; text-align:center;
      }
      #hint.show{ display:block; animation:hintpulse .5s steps(2) infinite alternate; }
      @keyframes hintpulse{ from{ transform:rotate(-.6deg); } to{ transform:rotate(.6deg); } }
      #app{
        position:relative; z-index:1;
        max-width:480px; margin:0 auto;
        padding:10px 12px 22px;
        display:flex; flex-direction:column; gap:10px;
        min-height:100dvh;
      }

      /* ---------- HUD ---------- */
      #hud{ display:flex; gap:8px; align-items:stretch; }
      .chip{
        background:var(--paper); color:var(--ink);
        border:3px solid var(--ink);
        box-shadow:4px 4px 0 var(--ink);
        padding:5px 9px;
        font-weight:700; font-size:13px; line-height:1.15;
      }
      .chip small{ display:block; font-size:9px; letter-spacing:.14em; opacity:.8; font-weight:700; }
      .chip b{ font-family:"Archivo Black", sans-serif; font-size:17px; letter-spacing:.02em; }
      #chipNight{ background:var(--lav); }
      #chipScore{ flex:1; background:var(--gold); text-align:right; }
      #comboWrap{
        height:14px; border:3px solid var(--ink); background:var(--paper);
        box-shadow:4px 4px 0 var(--ink); position:relative; overflow:hidden;
      }
      #comboBar{ height:100%; width:0%; background:repeating-linear-gradient(45deg, var(--coral) 0 10px, var(--pink) 10px 20px); transition:width .08s linear; }
      #comboTxt{
        position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--ink);
      }

      /* ---------- Moon stage ---------- */
      #stage{
        position:relative;
        width:min(94vw, 440px);
        margin:2px auto 0;
        aspect-ratio:1/1;
      }
      #stage.shake{ animation:shake .32s steps(6); }
      #stage.jiggle{ animation:jig 1.1s steps(3) infinite; }
      #stage.jiggleHard{ animation:jig2 .55s steps(2) infinite; }
      @keyframes jig{ 0%{ transform:translate(0,0) rotate(0deg); } 33%{ transform:translate(2px,-1px) rotate(.5deg); } 66%{ transform:translate(-2px,1px) rotate(-.5deg); } 100%{ transform:translate(0,0); } }
      @keyframes jig2{ 0%{ transform:translate(0,0) rotate(0deg) scale(1); } 25%{ transform:translate(-5px,3px) rotate(-1.4deg) scale(1.012); } 50%{ transform:translate(5px,-3px) rotate(1.4deg); } 75%{ transform:translate(-3px,-4px) rotate(.8deg) scale(.99); } 100%{ transform:translate(0,0); } }
      #stage.glitching #moonsvg{ animation:glitchfx .38s steps(2) infinite; }
      @keyframes glitchfx{ 0%{ transform:translate(0,0); filter:none; } 25%{ transform:translate(-4px,1px) skewX(2deg); filter:hue-rotate(40deg) saturate(1.6); } 50%{ transform:translate(4px,-2px); filter:invert(.12) hue-rotate(-50deg); } 75%{ transform:translate(-2px,2px) skewX(-3deg); filter:saturate(2.2); } 100%{ transform:translate(0,0); filter:none; } }
      #stage.rotting{ transition:transform 2.6s ease-in, filter 2.6s ease-in; transform:translateY(46px) scaleY(.45) scaleX(1.12); filter:sepia(.9) hue-rotate(55deg) saturate(.55) brightness(.72); }
      #stage.approach{ transition:transform 3.4s cubic-bezier(.6,0,.9,.4); transform:scale(2.6) translateY(6%); z-index:70; }
      @media (prefers-reduced-motion: reduce){
        #stage.jiggle, #stage.jiggleHard, #stage.glitching #moonsvg{ animation:none; }
      }
      @keyframes shake{
        0%{ transform:translate(0,0); } 20%{ transform:translate(-7px,3px); }
        40%{ transform:translate(6px,-4px); } 60%{ transform:translate(-5px,-3px); }
        80%{ transform:translate(4px,2px); } 100%{ transform:translate(0,0); }
      }
      #moonsvg{ width:100%; height:100%; display:block; overflow:visible; }
      .growth{ cursor:pointer; }
      .phantomArt{ filter:drop-shadow(0 0 7px rgba(207,198,255,.95)); }
      .growth:focus{ outline:none; filter:drop-shadow(0 0 4px var(--gold)) drop-shadow(0 0 4px var(--gold)); }
      .growth .wob{ transform-box:fill-box; transform-origin:center; animation:wob 0.9s ease-in-out infinite alternate; }
      @keyframes wob{ from{ transform:scale(1); } to{ transform:scale(1.13); } }
      .growth.split .lobeL{ transform:translate(-6px,2px) rotate(-16deg); }
      .growth.split .lobeR{ transform:translate(6px,2px) rotate(16deg); }
      .growth .lobeL,.growth .lobeR{ transition:transform .12s steps(3); transform-box:fill-box; transform-origin:center; }
      .growth .art.hit{ animation:hitpop .14s steps(2); }
      @keyframes hitpop{ 0%{ transform:scale(1); } 50%{ transform:scale(.82); } 100%{ transform:scale(1); } }
      .flake{
        position:fixed; z-index:40; pointer-events:none;
        width:44px; height:44px; margin:-22px 0 0 -22px;
      }
      .bit{
        position:fixed; z-index:41; pointer-events:none;
        width:9px; height:9px; border:2px solid var(--ink);
      }

      /* ---------- Under-stage bar ---------- */
      #underbar{ display:flex; gap:8px; align-items:stretch; }
      #leftChip{ background:var(--teal); flex:1; }
      #shellChip{ background:var(--paper); display:flex; align-items:center; gap:5px; }
      .shellIcon{ width:20px; height:20px; }
      .shellIcon.broken{ opacity:.5; filter:grayscale(1); }
      .iconBtn{
        background:var(--paper); color:var(--ink);
        border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
        width:42px; font-size:19px; font-weight:700; cursor:pointer;
        display:flex; align-items:center; justify-content:center;
        font-family:inherit; padding:0;
      }
      .iconBtn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }

      /* ---------- Rules ---------- */
      #rules{
        background:var(--sky); border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
        padding:8px 11px;
      }
      #rules h3{
        margin:0 0 5px; font-family:"Archivo Black", sans-serif; font-size:12px;
        letter-spacing:.16em; color:var(--gold);
      }
      #rules ul{ margin:0; padding:0; list-style:none; }
      #rules li{
        font-size:12.5px; line-height:1.45; padding:2px 0 2px 16px; position:relative;
      }
      #rules li::before{ content:"▸"; position:absolute; left:0; color:var(--coral); font-weight:700; }
      #rules li.new{ color:var(--gold); font-weight:700; }

      /* ---------- Overlay cards ---------- */
      #veil{
        position:fixed; inset:0; z-index:60;
        background:rgba(10,10,26,.72);
        display:none; align-items:center; justify-content:center;
        padding:18px;
      }
      #veil.show{ display:flex; }
      .card{
        background:var(--paper); color:var(--ink);
        border:4px solid var(--ink); box-shadow:8px 8px 0 var(--ink);
        max-width:400px; width:100%;
        padding:22px 20px 18px;
        animation:cardin .22s steps(4);
      }
      @keyframes cardin{ from{ transform:translateY(14px) rotate(-1deg); opacity:0; } to{ transform:none; opacity:1; } }
      .card h1{
        font-family:"Archivo Black", sans-serif; font-size:34px; line-height:.98;
        margin:0 0 10px; letter-spacing:.01em;
      }
      .card h2{
        font-family:"Archivo Black", sans-serif; font-size:23px; line-height:1.05; margin:0 0 10px;
      }
      .card p{ font-size:14.5px; line-height:1.55; margin:0 0 10px; }
      .card p:last-of-type{ margin-bottom:14px; }
      .card .what{ background:var(--lav); border:3px solid var(--ink); padding:9px 11px; font-size:13.5px; line-height:1.5; margin-bottom:14px; }
      .card .what b{ font-family:"Archivo Black", sans-serif; font-size:11px; letter-spacing:.12em; display:block; margin-bottom:3px; }
      .bigbtn{
        display:block; width:100%;
        background:var(--coral); color:var(--ink);
        border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
        font-family:"Archivo Black", sans-serif; font-size:17px; letter-spacing:.04em;
        padding:13px 10px; cursor:pointer; text-align:center;
      }
      .bigbtn:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--ink); }
      .bigbtn.alt{ background:var(--teal); margin-top:10px; }
      .bigbtn.ghost{ background:var(--paper); margin-top:10px; }
      .statRow{ display:flex; justify-content:space-between; border-top:2px dashed var(--ink); padding:6px 0; font-size:14px; font-weight:700; }
      .statRow:first-of-type{ border-top:none; }
      #flash{
        position:fixed; inset:0; z-index:55; pointer-events:none;
        background:var(--paper); opacity:0;
      }
      #toast{
        position:fixed; left:50%; top:14%; transform:translateX(-50%) rotate(-2deg);
        z-index:50; pointer-events:none;
        background:var(--gold); color:var(--ink);
        border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
        font-family:"Archivo Black", sans-serif; font-size:19px;
        padding:8px 16px; opacity:0; white-space:nowrap;
      }
      #toast.pop{ animation:toastpop 0.9s steps(8) forwards; }
      @keyframes toastpop{ 0%{ opacity:0; transform:translateX(-50%) scale(.6) rotate(-6deg); } 18%{ opacity:1; transform:translateX(-50%) scale(1.08) rotate(-2deg); } 30%{ transform:translateX(-50%) scale(1) rotate(-2deg); } 78%{ opacity:1; } 100%{ opacity:0; transform:translateX(-50%) translateY(-16px) rotate(-2deg); } }
      @media (prefers-reduced-motion: reduce){
        .growth .wob{ animation:none; }
        #stage.shake{ animation:none; }
      }
    </style>
  </head>
  <body>
    <canvas id="stars"></canvas>

    <div id="app">
      <div id="hud">
        <div class="chip" id="chipNight"><small>NIGHT</small><b id="hudNight">–</b></div>
        <div class="chip" id="chipTries"><small>TRIES</small><b id="hudTries">8</b></div>
        <div class="chip"><small>SHELL</small><b id="hudCracks">●●●</b></div>
        <div class="chip" id="chipScore"><small>SCORE</small><b id="hudScore">0</b></div>
      </div>
      <div id="comboWrap"><div id="comboBar"></div><div id="comboTxt">COMBO</div></div>

      <div id="stage">
        <svg id="moonsvg" viewBox="0 0 400 400" aria-label="The moon thing">
          <defs>
            <radialGradient id="moongrad" cx="38%" cy="34%" r="80%">
              <stop offset="0%" stop-color="#faf6e3"/>
              <stop offset="70%" stop-color="#f2edd8"/>
              <stop offset="100%" stop-color="#ddd5b8"/>
            </radialGradient>
            <radialGradient id="halo" cx="50%" cy="50%" r="50%">
              <stop offset="62%" stop-color="#cfc6ff" stop-opacity="0"/>
              <stop offset="86%" stop-color="#cfc6ff" stop-opacity="0.20"/>
              <stop offset="100%" stop-color="#cfc6ff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g id="rotor">
            <circle cx="200" cy="200" r="197" fill="url(#halo)"/>
            <circle id="skin" cx="200" cy="200" r="166" fill="url(#moongrad)" stroke="#10101c" stroke-width="6"/>
            <ellipse cx="148" cy="302" rx="54" ry="30" fill="#e9e2c6" opacity="0.55"/>
            <ellipse cx="274" cy="172" rx="42" ry="24" fill="#e9e2c6" opacity="0.45"/>
            <ellipse cx="196" cy="96" rx="34" ry="16" fill="#e9e2c6" opacity="0.4"/>
            <g id="craters" fill="#e2dcC2" stroke="#10101c" stroke-width="3" opacity="0.85">
              <circle cx="128" cy="140" r="17"/>
              <circle cx="282" cy="118" r="12"/>
              <circle cx="300" cy="262" r="20"/>
              <circle cx="112" cy="268" r="11"/>
              <circle cx="238" cy="318" r="13"/>
              <circle cx="121" cy="147" r="10" fill="#d8d0ae" stroke="none"/>
              <circle cx="293" cy="269" r="12" fill="#d8d0ae" stroke="none"/>
              <circle cx="277" cy="113" r="7" fill="#d8d0ae" stroke="none"/>
              <circle cx="233" cy="323" r="8" fill="#d8d0ae" stroke="none"/>
            </g>
            <!-- face revealed layer by layer -->
            <g id="face" stroke="#10101c" fill="none" stroke-linecap="round">
              <g id="face1" opacity="0">
                <path d="M118 196 Q146 178 174 196" stroke-width="6"/>
                <path d="M226 196 Q254 178 282 196" stroke-width="6"/>
              </g>
              <g id="face2" opacity="0">
                <path d="M168 268 Q200 284 232 268" stroke-width="6"/>
                <path d="M112 168 Q146 154 180 166" stroke-width="4"/>
                <path d="M220 166 Q254 154 288 168" stroke-width="4"/>
              </g>
              <g id="face3" opacity="0">
                <circle cx="192" cy="238" r="3.5" fill="#10101c"/>
                <circle cx="208" cy="238" r="3.5" fill="#10101c"/>
                <path d="M118 208 Q146 218 174 208" stroke-width="4"/>
                <path d="M226 208 Q254 218 282 208" stroke-width="4"/>
                <circle cx="96" cy="238" r="10" stroke-width="4"/>
                <circle cx="304" cy="238" r="10" stroke-width="4"/>
              </g>
              <g id="face4" opacity="0">
                <path d="M124 182 l-8 -9 M146 176 l-3 -11 M168 182 l3 -11" stroke-width="4"/>
                <path d="M232 182 l-3 -11 M254 176 l3 -11 M276 182 l8 -9" stroke-width="4"/>
                <path d="M182 274 Q200 280 218 274" stroke-width="4"/>
                <circle cx="118" cy="246" r="11" fill="#ff8fa3" stroke="none" opacity="0.75"/>
                <circle cx="282" cy="246" r="11" fill="#ff8fa3" stroke="none" opacity="0.75"/>
              </g>
              <g id="face5" opacity="0">
                <path d="M186 126 Q200 117 214 126" stroke-width="4"/>
                <path d="M82 258 q7 7 14 1 M304 259 q7 6 14 -1" stroke-width="4"/>
                <path d="M190 290 Q200 295 210 290" stroke-width="4"/>
                <circle cx="160" cy="146" r="2.6" fill="#10101c" stroke="none"/>
                <circle cx="240" cy="146" r="2.6" fill="#10101c" stroke="none"/>
                <circle cx="200" cy="158" r="2.6" fill="#10101c" stroke="none"/>
              </g>
              <g id="faceOpen" opacity="0">
                <ellipse cx="146" cy="192" rx="27" ry="30" fill="#fff8ea" stroke-width="6"/>
                <ellipse cx="254" cy="192" rx="27" ry="30" fill="#fff8ea" stroke-width="6"/>
                <g id="pupils" fill="#10101c" stroke="none">
                  <circle id="pupilL" cx="146" cy="196" r="11"/>
                  <circle id="pupilR" cx="254" cy="196" r="11"/>
                </g>
                <circle cx="150" cy="190" r="3.5" fill="#fff8ea" stroke="none"/>
                <circle cx="258" cy="190" r="3.5" fill="#fff8ea" stroke="none"/>
                <ellipse cx="200" cy="272" rx="13" ry="17" fill="#10101c" stroke="none"/>
              </g>
            </g>
            <g id="cracks"></g>
            <g id="growthLayer"></g>
          </g>
        </svg>
      </div>

      <div id="hint" role="status"></div>

      <div id="underbar">
        <div class="chip" id="leftChip"><small>LEFT TO PEEL · TIME</small><b id="hudLeft">0</b></div>
        <div class="chip" id="shellChip"><small>SHELL</small>
          <span id="shellIcons"></span>
        </div>
        <button class="iconBtn" id="btnHelp" aria-label="How to play">?</button>
        <button class="iconBtn" id="btnRestart" aria-label="Restart night">↻</button>
      </div>

      <div id="rules">
        <h3>RULES — NEWEST FIRST</h3>
        <ul id="rulesList"></ul>
      </div>
    </div>

    <div id="flash"></div>
    <div id="toast"></div>
    <canvas id="noiseCv" width="160" height="90" aria-hidden="true"></canvas>
    <div id="speech" aria-live="polite"></div>
    <div id="tvOff"></div>

    <div id="veil"><div class="card" id="cardBox"></div></div>

    <script>
      "use strict";
      var SVGNS = "http://www.w3.org/2000/svg";

      /* ================= AUDIO (tiny synth blips) ================= */
      var AC = null;
      function ac(){
        if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; } }
        if(AC && AC.state === "suspended"){ AC.resume(); }
        return AC;
      }
      function tone(f0, f1, dur, type, vol){
        var c = ac(); if(!c) return;
        var o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
        o.type = type || "square";
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
        g.gain.setValueAtTime(vol || 0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + dur + 0.02);
      }
      function sfx(name){
        if(name === "peel"){ tone(500 + Math.random()*120, 980, 0.12, "square", 0.10); }
        else if(name === "pop"){ tone(300, 620, 0.09, "triangle", 0.14); }
        else if(name === "crack"){ tone(160, 55, 0.22, "sawtooth", 0.16); }
        else if(name === "clear"){ tone(523, 523, 0.1, "square", 0.1); setTimeout(function(){ tone(659, 659, 0.1, "square", 0.1); }, 95); setTimeout(function(){ tone(784, 990, 0.16, "square", 0.11); }, 190); }
        else if(name === "wake"){ tone(392, 392, 0.14, "triangle", 0.12); setTimeout(function(){ tone(523, 523, 0.14, "triangle", 0.12); }, 130); setTimeout(function(){ tone(659, 659, 0.14, "triangle", 0.12); }, 260); setTimeout(function(){ tone(784, 1180, 0.3, "triangle", 0.13); }, 390); }
      }

      /* ================= BACKGROUND — empty sky that fills with eggs ================= */
      var BG = { level: 1 }; // 1 blank · 2 something watches · 3 first eggs · 4 filled with eggs · 5 egg rain · 6 rain + static
      (function stars(){
        var cv = document.getElementById("stars"), ctx = cv.getContext("2d"), dots = [], i;
        function size(){ cv.width = innerWidth; cv.height = innerHeight; }
        size(); addEventListener("resize", size);
        var cols = ["#fff8ea", "#ffd166", "#ff8fa3", "#cfc6ff", "#2ec4b6"];
        for(i = 0; i < 90; i++){ dots.push({ x: Math.random(), y: Math.random(), r: Math.random()*2 + 0.6, c: cols[i % cols.length], p: Math.random()*6.28 }); }
        // seeded scattered eggs for the "filled" stages
        var stillEggs = [];
        var seed = 12345;
        function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
        for(i = 0; i < 42; i++){ stillEggs.push({ x: rnd(), y: rnd(), s: 9 + rnd() * 22, rot: (rnd() - .5) * .7, eye: rnd() > .62, a: .16 + rnd() * .3 }); }
        var rain = [];
        for(i = 0; i < 30; i++){ rain.push({ x: Math.random(), y: Math.random(), sp: .12 + Math.random() * .22, s: 8 + Math.random() * 16, rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * .6 }); }
        function egg(x, y, s, rot, alpha, eye, t){
          ctx.save();
          ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.ellipse(0, 0, s * .78, s, 0, 0, 6.29);
          ctx.fillStyle = "#e9e2c6"; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = "#10101c"; ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-s * .5, -s * .28); ctx.lineTo(-s * .18, -s * .1); ctx.lineTo(-s * .42, s * .08);
          ctx.strokeStyle = "rgba(16,16,28,.55)"; ctx.lineWidth = 1.4; ctx.stroke();
          if(eye){
            var blink = Math.sin(t / 1400 + x) > -.92 ? 1 : .12;
            ctx.fillStyle = "#10101c";
            ctx.beginPath(); ctx.ellipse(-s * .22, -s * .05, s * .09, s * .13 * blink, 0, 0, 6.29); ctx.fill();
            ctx.beginPath(); ctx.ellipse(s * .22, -s * .05, s * .09, s * .13 * blink, 0, 0, 6.29); ctx.fill();
          }
          ctx.restore();
        }
        (function draw(t){
          ctx.clearRect(0, 0, cv.width, cv.height);
          var W = cv.width, H = cv.height, lv = BG.level;
          for(var j = 0; j < dots.length; j++){
            var d = dots[j];
            ctx.globalAlpha = lv >= 4 ? 0.14 : 0.35 + 0.3 * Math.sin(t/900 + d.p);
            ctx.fillStyle = d.c;
            ctx.fillRect(d.x * W, d.y * H, d.r, d.r);
          }
          ctx.globalAlpha = 1;
          if(lv >= 2){

      /* ================= NIGHT SETUP ================= */
      function plan(n){

        if(n === 1) add("barnacle", 8);
        else if(n === 2){ add("barnacle", 7); add("root", 3); }
        else if(n === 3){ add("barnacle", 7); add("root", 2); add("mite", 3); }
        else if(n === 4){ add("barnacle", 7); add("root", 3); add("mite", 2); add("mimic", 3); }
        else if(n === 5){ add("barnacle", 7); add("root", 3); add("mite", 2); add("gold", 2); add("mimic", 3); }
        else { add("barnacle", 6); add("root", 3); add("mite", 3); add("gold", 2); add("mimic", 4); add("phantom", 3); }

          art.innerHTML = OFFART[looks[Math.floor(Math.random() * looks.length)]];
        } else {
          art.innerHTML = ART[type];
        }
        g.appendChild(art);
        var rec = { el: g, art: art, type: type, hits: (type === "root") ? 2 : 1, lx: x, ly: y, dead: false, solid: true };

          e.stopPropagation();
          e.preventDefault();
          onGrowth(rec);

      /* ================= PEELING ================= */
      function onGrowth(rec){
        if(S.mode !== "play" || rec.dead) return;
        if(rec.type === "phantom" && !rec.solid) return; // not really here right now
        ac();
        if(rec.type === "mimic"){ crackAt(rec); return; }
        rec.hits--;
        rec.art.classList.remove("hit");
        void rec.art.getBBox();
        rec.art.classList.add("hit");
        if(rec.hits > 0){
          rec.el.classList.add("split");
          sfx("pop");
          return;
        }

        rec.dead = true;
        hideHint();
        S.totalPeels++;
        S.combo = Math.min(S.combo + 1, 99);
        S.comboT = 2600;
        var mult = Math.min(1 + Math.floor((S.combo - 1) / 3), 8);
        var pts = BASE[rec.type] * mult;
        S.score += pts;
        sfx("peel");
        flingFlake(rec);
        burst(rec);
        rec.el.remove();
        growths = growths.filter(function(g){ return g !== rec; });
        mites = mites.filter(function(m){ return m.rec !== rec; });
        phantoms = phantoms.filter(function(p){ return p.rec !== rec; });
        S.left--;
        if(S.combo > 0 && S.combo % 6 === 0) toast("COMBO x" + mult + "!");
        updateHUD();
        if(S.left <= 0) nightClear();
      }

      function flingFlake(rec){
        var r = rec.el.getBoundingClientRect();
        var stageR = $("stage").getBoundingClientRect();
        var cx = stageR.left + stageR.width / 2, cy = stageR.top + stageR.height / 2;
        var gx = r.left + r.width / 2, gy = r.top + r.height / 2;
        var dx = gx - cx, dy = gy - cy;
        var len = Math.max(20, Math.sqrt(dx*dx + dy*dy));
        dx /= len; dy /= len;
        var d = document.createElement("div");
        d.className = "flake";
        d.style.left = gx + "px"; d.style.top = gy + "px";
        d.innerHTML = '<svg viewBox="-26 -26 52 52" width="44" height="44">' + ART[rec.type] + "</svg>";
        document.body.appendChild(d);
        var dist = 150 + Math.random() * 120;
        d.animate([
          { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1 },
          { transform: "translate(" + (dx*dist) + "px," + (dy*dist - 40) + "px) rotate(" + (Math.random()*260 - 130) + "deg) scale(.7)", opacity: 0 }
        ], { duration: 480, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = function(){ d.remove(); };
      }
      function burst(rec){
        var r = rec.el.getBoundingClientRect();
        var gx = r.left + r.width / 2, gy = r.top + r.height / 2;
        var cols = ["#ff6b6b", "#ffd166", "#2ec4b6", "#ff8fa3", "#cfc6ff"];
        for(var i = 0; i < 6; i++){
          var b = document.createElement("div");
          b.className = "bit";
          b.style.left = gx + "px"; b.style.top = gy + "px";
          b.style.background = cols[i % cols.length];
          document.body.appendChild(b);
          var a = Math.random() * 6.28, dist = 34 + Math.random() * 46;
          (function(el, dx, dy){
            el.animate([
              { transform: "translate(-50%,-50%) rotate(0deg)", opacity: 1 },
              { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) rotate(200deg)", opacity: 0 }
            ], { duration: 420, easing: "ease-out" }).onfinish = function(){ el.remove(); };
          })(b, Math.cos(a) * dist, Math.sin(a) * dist);
        }
      }

      /* ================= SKIN / CRACKS ================= */
      function svgPoint(evt){
        var pt = $("moonsvg").createSVGPoint();
        pt.x = evt.clientX; pt.y = evt.clientY;
        var m = growthLayer.getScreenCTM();
        return pt.matrixTransform(m.inverse());
      }
      $("skin").addEventListener("pointerdown", function(e){
        if(S.mode !== "play") return;
        var p = svgPoint(e);
        crackAt({ lx: p.x, ly: p.y });
      });
      function crackAt(at){
        ac(); sfx("crack");
        S.cracks++;
        S.combo = 0; S.comboT = 0;
        var stage = $("stage");
        stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
        // draw a jagged crack in moon-local coords
        var x = at.lx, y = at.ly, pts = [x + "," + y];
        var ang = Math.random() * 6.28;
        for(var i = 0; i < 3; i++){
          ang += (Math.random() - 0.5) * 1.4;
          var step = 13 + Math.random() * 10;
          x += Math.cos(ang) * step; y += Math.sin(ang) * step;
          pts.push(x.toFixed(1) + "," + y.toFixed(1));
        }
        var pl = document.createElementNS(SVGNS, "polyline");
        pl.setAttribute("points", pts.join(" "));
        pl.setAttribute("fill", "none");
        pl.setAttribute("stroke", "#10101c");
        pl.setAttribute("stroke-width", "3.5");
        pl.setAttribute("stroke-linecap", "round");
        cracksLayer.appendChild(pl);
        toast(S.cracks >= 3 ? "THE SHELL SPLINTERS!" : "CRACK! " + (3 - S.cracks) + " LEFT");
        updateHUD();
        if(S.cracks >= 3){
          S.mode = "clear";
          hideHint();
          setTimeout(function(){ loseTry("cracks"); }, 650);
        }
      }

      /* ================= TRIES / ENDINGS ================= */
      function loseTry(why){
        S.tries--;
        updateHUD();
        if(S.tries <= 0){ loseEnding(); return; }
        showCard(
          "<h2>A TRY ROTS AWAY</h2>" +
          "<p>" + (why === "time"
            ? "Too slow. The growths root back in and the layer knits shut while you watch."
            : why === "restart"
            ? "You step back, and the layer knits itself shut behind you."
            : "Three cracks. The layer knits itself shut and the growths root back in, annoyed.") + "</p>" +
          '<div class="statRow"><span>TRIES LEFT</span><span>' + S.tries + " / 8</span></div>" +
          "<p>Lose them all and it gives up on hatching — it rots where it fell.</p>"
        );
        cardBox.appendChild(btn("RE-PEEL NIGHT " + S.night, function(){ hideCard(); beginNight(); }));
      }

      function resetRun(){
        hideCard();
        S.score = 0; S.night = 1; S.tries = 8; S.totalPeels = 0;
        S.awake = false; S.endless = false; S.angle = 0;
        BG.level = 1; noiseOn = 0;
        var st = $("stage");
        st.classList.remove("rotting", "approach", "jiggle", "jiggleHard", "glitching");
        updateHUD();
      }

      function loseEnding(){
        S.mode = "over";
        hideHint();
        noiseOn = 0;
        BG.level = 1;
        var st = $("stage");
        st.classList.remove("jiggle", "jiggleHard", "glitching");
        void st.offsetWidth;
        st.classList.add("rotting");
        sfx("crack");
        setTimeout(function(){ tone(220, 38, 1.6, "sawtooth", 0.14); }, 350);
        setTimeout(function(){
          showCard(
            "<h2>IT ROTS</h2>" +
            "<p>Eight tries, gone. The ticking slows, thickens, stops. Over a week the shell sags, slumps, and melts into the field — a smell like a swamp dreaming.</p>" +
            "<p>Whatever was inside never opens its eyes. The world is saved. It doesn't feel like winning.</p>" +
            '<div class="statRow"><span>FINAL SCORE</span><span>' + S.score + '</span></div>' +
            '<div class="statRow"><span>NIGHT REACHED</span><span>' + Math.min(S.night, 6) + " / 6</span></div>" +
            '<div class="statRow"><span>TOTAL PEELS</span><span>' + S.totalPeels + "</span></div>"
          );
          cardBox.appendChild(btn("START OVER", function(){ resetRun(); startScreen(); }));
        }, 2400);
      }

      /* ================= NIGHT CLEAR / FINALE ================= */
      function nightClear(){
        S.mode = "clear";
        sfx("clear");
        var secs = Math.round((performance.now() - S.nightStart) / 1000);
        var cleanBonus = S.cracks === 0 ? 50 : 0;
        var timeBonus = Math.max(0, 90 - secs);
        S.score += cleanBonus + timeBonus;
        flash();
        if(!S.endless && S.night === 6){ finale(secs); return; }
        showCard(
          "<h2>LAYER OFF</h2>" +
          "<p>" + (CLEAR_TEXT[S.night] || CLEAR_TEXT[1]) + "</p>" +
          '<div class="statRow"><span>TIME</span><span>' + secs + 's</span></div>' +
          '<div class="statRow"><span>CLEAN LAYER BONUS</span><span>' + (cleanBonus ? "+50" : "—") + '</span></div>' +
          '<div class="statRow"><span>SPEED BONUS</span><span>+' + timeBonus + '</span></div>' +
          '<div class="statRow"><span>SCORE</span><span>' + S.score + '</span></div>'
        );
        cardBox.appendChild(btn("NEXT NIGHT", function(){
          hideCard();
          S.night++;
          introNight();
        }));
        updateHUD();
      }

      function finale(secs){
        S.awake = true;
        S.mode = "finale";
        sfx("wake");
        hideHint();
        // stop the roll, open the eyes
        var stopper = setInterval(function(){
          S.rotSpeed *= 0.82;
          if(S.rotSpeed < 0.05){ S.rotSpeed = 0; clearInterval(stopper); }
        }, 60);
        setTimeout(function(){
          $("face1").setAttribute("opacity", 0);
          $("face2").setAttribute("opacity", 0);
          $("face3").setAttribute("opacity", 0);
          $("face4").setAttribute("opacity", 0);
          $("face5").setAttribute("opacity", 0);
          $("faceOpen").setAttribute("opacity", 1);
          $("craters").setAttribute("opacity", 0.25);
          flash();
        }, 700);
        // it rises toward the screen
        setTimeout(function(){
          var st = $("stage");
          st.classList.remove("jiggle", "jiggleHard");
          void st.offsetWidth;
          st.classList.add("jiggleHard");
          st.classList.add("approach");
          tone(90, 240, 3.2, "sine", 0.10);
        }, 1300);
        var speech = $("speech");
        var lines = [
          "It was never a moon. It was an egg — and you hatched it.",
          "I love you.",
          "I love you. I love you. I love you.",
          "I can't wait to see what the world looks like from inside your own eyes."
        ];
        lines.forEach(function(line, i){
          setTimeout(function(){
            speech.textContent = line;
            speech.animate([{ opacity: 0, transform: "translate(-50%,-50%) scale(.92)" }, { opacity: 1, transform: "translate(-50%,-50%) scale(1)" }], { duration: 320, fill: "forwards" });
            if(i > 0) tone(180 + i * 60, 150 + i * 50, 0.3, "triangle", 0.08);
          }, 2100 + i * 2100);
        });
        // static takes the whole screen, then the TV cuts out
        setTimeout(function(){
          speech.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
          noiseOn = 1;
          staticBurst();
        }, 10800);
        setTimeout(function(){
          var off = $("tvOff");
          off.animate([
            { opacity: 0, transform: "scaleY(1)" },
            { opacity: 1, transform: "scaleY(1)", offset: .55 },
            { opacity: 1, transform: "scaleY(.004)" },
            { opacity: 1, transform: "scaleY(.004) scaleX(.6)", offset: .8 },
            { opacity: 1, transform: "scale(1)" }
          ], { duration: 650, fill: "forwards", easing: "ease-in" });
          tone(1200, 60, .4, "square", .06);
        }, 12200);
        // black screen… then the game restarts itself
        setTimeout(function(){
          noiseOn = 0;
          $("tvOff").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, delay: 1400, fill: "forwards" });
          resetRun();
          startScreen();
        }, 13000);
      }

      function flash(){
        var f = $("flash");
        f.animate([{ opacity: 0 }, { opacity: 0.85 }, { opacity: 0 }], { duration: 380, easing: "ease-out" });
      }
      var toastTimer = null;
      function toast(msg){
        var t = $("toast");
        t.textContent = msg;
        t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ t.classList.remove("pop"); }, 950);
      }

      /* ================= HUD ================= */
      function updateHUD(){
        $("hudNight").textContent = S.endless ? S.night + " ∞" : Math.min(S.night, 6) + " / 6";
        $("hudTries").textContent = S.tries;
        $("chipTries").style.background = S.tries <= 2 ? "var(--coral)" : "var(--paper)";
        $("hudScore").textContent = S.score;
        var secsLeft = S.mode === "play" ? Math.max(0, Math.ceil((NIGHT_LIMIT - (performance.now() - S.nightStart)) / 1000)) : null;
        $("hudLeft").textContent = secsLeft === null ? S.left : S.left + " · " + secsLeft + "s";
        $("hudCracks").textContent = "●●●".slice(0, 3 - S.cracks) + "○○○".slice(0, S.cracks);
        var sh = "";
        for(var i = 0; i < 3; i++){
          sh += '<svg class="shellIcon' + (i < S.cracks ? " broken" : "") + '" viewBox="0 0 24 24"><path d="M12 3 Q21 8 20 15 Q19 21 12 21 Q5 21 4 15 Q3 8 12 3Z" fill="#f2edd8" stroke="#10101c" stroke-width="2.6"/>' +
                (i < S.cracks ? '<path d="M8 6 L13 11 L10 15 L15 19" stroke="#10101c" stroke-width="1.8" fill="none"/>' : "") + "</svg>";
        }
        $("shellIcons").innerHTML = sh;
      }

      /* ================= MAIN LOOP ================= */
      var lastT = performance.now();
      var lastSecShown = -1;
      function loop(t){
        var dt = Math.min(50, t - lastT); lastT = t;
        // night clock: run out of time and the night — and a try — is gone
        if(S.mode === "play"){
          var remain = NIGHT_LIMIT - (t - S.nightStart);
          var sec = Math.max(0, Math.ceil(remain / 1000));
          if(sec !== lastSecShown){ lastSecShown = sec; updateHUD(); }
          if(remain <= 0){
            S.mode = "clear";
            hideHint();
            sfx("crack");
            toast("TOO SLOW!");
            setTimeout(function(){ loseTry("time"); }, 500);
          }
        }
        if(S.mode === "play" || S.mode === "clear" || S.mode === "finale"){
          S.angle = (S.angle + S.rotSpeed * S.rotDir * dt / 1000) % 360;
          rotor.setAttribute("transform", "rotate(" + S.angle.toFixed(2) + " 200 200)");
          // mites scuttle around their anchor
          for(var i = 0; i < mites.length; i++){
            var m = mites[i];
            if(m.rec.dead) continue;
            var ph = t / 1000 * m.sp + m.ph;
            var x = m.ax + Math.cos(ph) * m.rad;
            var y = m.ay + Math.sin(ph * 1.3) * m.rad;
            m.el.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")");
          }
          // phantoms fade in and out on a cycle and drift around their anchor
          for(var j = 0; j < phantoms.length; j++){
            var p = phantoms[j];
            if(p.rec.dead) continue;
            var c = (t / 1000 + p.ph) % 4.4;
            var op;
            if(c < 1.9) op = 1;
            else if(c < 2.4) op = 1 - (c - 1.9) / 0.5;
            else if(c < 3.3) op = 0;
            else if(c < 3.8) op = (c - 3.3) / 0.5;
            else op = 1;
            p.rec.solid = op > 0.5;
            p.el.style.opacity = op.toFixed(2);
            p.el.style.pointerEvents = op > 0.15 ? "auto" : "none";
            var pxx = p.ax + Math.cos(t / 2700 + p.ph * 2.1) * 20;
            var pyy = p.ay + Math.sin(t / 3300 + p.ph * 1.3) * 16;
            p.el.setAttribute("transform", "translate(" + pxx.toFixed(1) + " " + pyy.toFixed(1) + ")");
          }
          // pupils track the player's pointer once awake
          if(S.awake){
            var px = (lastPointer.x / innerWidth - 0.5) * 14;
            var py = (lastPointer.y / innerHeight - 0.5) * 10;
            // un-rotate roughly so pupils feel screen-true
            $("pupilL").setAttribute("cx", 146 + px); $("pupilL").setAttribute("cy", 196 + py);
            $("pupilR").setAttribute("cx", 254 + px); $("pupilR").setAttribute("cy", 196 + py);
          }
        }
        // combo decay
        if(S.comboT > 0){
          S.comboT -= dt;
          if(S.comboT <= 0){ S.combo = 0; }
        }
        var pct = S.combo > 0 ? Math.max(0, S.comboT / 2600 * 100) : 0;
        $("comboBar").style.width = pct + "%";
        var mult = Math.min(1 + Math.floor(Math.max(0, S.combo - 1) / 3), 8);
        $("comboTxt").textContent = S.combo > 0 ? "COMBO x" + mult + " — " + S.combo + " PEELS" : "COMBO";
        requestAnimationFrame(loop);
      }
      var lastPointer = { x: innerWidth / 2, y: innerHeight / 2 };
      addEventListener("pointermove", function(e){ lastPointer.x = e.clientX; lastPointer.y = e.clientY; });
      requestAnimationFrame(loop);

      /* ================= BUTTONS ================= */
      $("btnHelp").addEventListener("click", function(){
        if(S.mode === "play") return; // don't interrupt a live night
        var wasMode = S.mode;
        showCard(
          "<h2>HOW TO PEEL</h2>" +
          '<div class="what"><b>HOW TO PLAY</b>' +
          "Tap growths to peel them; never tap smooth skin or the ✕-marked fakes. 3 cracks — or running out of time — costs one of your 8 tries.</div>" +
          "<p>Fast peels build your combo multiplier. Clean layers (no cracks) earn +50.</p>"
        );
        cardBox.appendChild(btn("BACK", function(){ hideCard(); if(wasMode === "start") startScreen(); }));
      });
      $("btnRestart").addEventListener("click", function(){
        if(S.mode !== "play") return;
        S.mode = "clear";
        hideHint();
        loseTry("restart");
      });

      renderRules(null);
      updateHUD();
      startScreen();
    </script>
  </body>
</html>
