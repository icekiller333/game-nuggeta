<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shroom Siege: Defend the Corn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1424;
  --cream:#fff8ec;
  --pink:#ffb3c7;
  --rose:#ff8fb1;
  --mint:#a8f0cf;
  --leaf:#9fe08a;
  --lav:#cdb9ff;
  --sky:#a6d8ff;
  --butter:#ffe48a;
  --peach:#ffcaa8;
  --panel:#fff8ec;
  --panel-text:#1d1424;
  --panel-sub:#5b4a66;
  --page:#cfe9ff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#2b2238; --panel-text:#fff4fb; --panel-sub:#dccbe8; --page:#2a2a44; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#2b2238; --panel-text:#fff4fb; --panel-sub:#dccbe8; --page:#2a2a44; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--page);font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;color:var(--panel-text);user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:crosshair}
.display{font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;letter-spacing:.01em;font-weight:400}
.outlined{color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;color:var(--ink)}
#hud.hidden{display:none}
.chip{background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
#top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#waveBox{display:flex;align-items:center;gap:14px;padding:4px 8px 4px 16px;background:var(--lav)}
#waveLbl{font-size:22px}
#timer{font-size:30px;min-width:84px;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 8px;line-height:1.15}
#timer.hurry{background:var(--rose);animation:throb .5s ease-in-out infinite alternate}
#cornWrap{width:min(380px,62vw)}
.barLabel{display:flex;justify-content:space-between;font-size:18px;margin:0 4px 4px}
.bar{height:22px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 4px 0 var(--ink);position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;display:block;border-right:3px solid var(--ink);transition:width .25s}
#cornFill{background:repeating-linear-gradient(90deg,#ffe58a 0 10px,#ffd65a 10px 20px)}
#hpFill{background:linear-gradient(#ffc2d4,#ff8fb1)}
#scoreBox{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;padding:8px 16px;background:var(--mint);min-width:150px}
#scoreBox .num{font-size:28px;display:block;line-height:1}
#scoreBox .sub{font-weight:900;font-size:14px}
#radarWrap{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:178px;height:178px;border-radius:50%;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);overflow:hidden;background:#e9fbe4}
#radar{width:100%;height:100%;display:block}
#hpBox{position:absolute;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(300px,42vw);padding:8px 12px 12px;background:var(--pink)}
#hpBox .row,#ammoBox .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#hpNum{font-size:34px;line-height:1}
.lbl{font-weight:900;font-size:15px}
#hpBox.low{animation:throb .45s ease-in-out infinite alternate}
#ammoBox{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:8px 16px 10px;background:var(--butter);min-width:200px;text-align:right}
#mag{font-size:44px;line-height:1}
#reserve{font-size:24px}
#reloadTxt{font-weight:900;font-size:14px;min-height:18px}
#ammoBox.empty #mag{color:#ff5c8a}
#cross{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%)}
#hitmark{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:opacity .12s,transform .12s}
#hitmark.on{opacity:1;transform:translate(-50%,-50%) scale(1);transition:none}
#hitmark.head path{stroke:#ff5c8a}
#alert{position:absolute;top:calc(118px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 16px;background:var(--rose);font-weight:900;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap}
#alert.on{opacity:1;animation:wobble .5s ease-in-out infinite alternate}
#banner{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .3s}
#banner.on{opacity:1}
#banner .big{font-size:clamp(48px,9vw,96px);line-height:1}
#banner .small{font-size:clamp(20px,3vw,30px);margin-top:6px}
#hint{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;background:#fff;font-weight:900;font-size:16px;opacity:0;transition:opacity .25s;white-space:nowrap}
#hint.on{opacity:1}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,120,160,0) 45%,rgba(255,70,120,.6) 100%);opacity:0}
#floaters{position:absolute;inset:0;overflow:hidden}
.floater{position:absolute;left:0;top:0;font-family:'Lilita One',system-ui,sans-serif;font-size:24px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap;will-change:transform}
.floater.ammo{color:var(--butter)}
.floater.hp{color:var(--pink)}
.floater.pts{color:var(--mint)}
.floater.warn{color:var(--rose);font-size:20px}
@keyframes throb{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes wobble{from{transform:translateX(-50%) rotate(-1.5deg)}to{transform:translateX(-50%) rotate(1.5deg)}}

/* ---------- Overlays ---------- */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(170,205,255,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#overlay.hidden{display:none}
.panel{background:var(--panel);color:var(--panel-text);border:4px solid var(--ink);border-radius:28px;box-shadow:0 9px 0 var(--ink);padding:26px 30px 28px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;text-align:center}
.title{font-size:clamp(48px,10vw,82px);line-height:.95;color:var(--leaf);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;transform:rotate(-2deg);margin:2px 0 4px;text-shadow:0 6px 0 var(--ink)}
.title span{color:var(--butter)}
.subtitle{font-size:26px;color:var(--pink);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;margin-bottom:12px}
.panel p{font-size:17px;line-height:1.45;margin:8px auto 14px;max-width:52ch;color:var(--panel-sub);font-weight:800}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tip{border:3px solid var(--ink);border-radius:18px;padding:10px 8px;font-weight:900;font-size:14px;line-height:1.3;color:var(--ink)}
.tip b{display:block;font-size:30px;line-height:1.1;margin-bottom:4px}
.tip:nth-child(1){background:var(--peach);transform:rotate(-1.5deg)}
.tip:nth-child(2){background:var(--pink);transform:rotate(1deg)}
.tip:nth-child(3){background:var(--butter);transform:rotate(-.5deg)}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:6px 0 18px;font-weight:800;font-size:14px;color:var(--panel-sub)}
kbd{font-family:'Lilita One',system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-bottom-width:4px;border-radius:8px;padding:1px 7px;margin-right:4px}
.btn{font-family:'Lilita One',system-ui,sans-serif;font-size:26px;padding:10px 34px;border:4px solid var(--ink);border-radius:18px;background:var(--leaf);color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible{outline:4px dashed var(--rose);outline-offset:4px}
.btn.alt{background:var(--lav);font-size:20px;padding:8px 22px}
.btnRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.note{font-size:13px;font-weight:800;color:var(--panel-sub);margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 18px}
.stat{border:3px solid var(--ink);border-radius:16px;padding:8px;background:#fff;color:var(--ink)}
.stat .v{font-family:'Lilita One',system-ui,sans-serif;font-size:32px;line-height:1.1}
.stat .k{font-weight:900;font-size:13px;color:#5b4a66}
.stat.hero{grid-column:1 / -1;background:var(--butter)}
.stat.hero .v{font-size:44px}
.panelHead{font-size:clamp(40px,8vw,60px);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;color:var(--butter);text-shadow:0 5px 0 var(--ink);line-height:1;margin:4px 0 8px}
.panelHead.sad{color:var(--rose)}
@media (max-width:620px){
  .tips{grid-template-columns:1fr}
  #radarWrap{width:120px;height:120px}
  #scoreBox{min-width:0;padding:6px 10px}
  #scoreBox .num{font-size:20px}
  #alert{top:calc(108px + env(safe-area-inset-top,0px));font-size:14px}
}
@media (prefers-reduced-motion: reduce){
  #timer.hurry,#hpBox.low,#alert.on{animation:none}
}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 24px 20vh;background:linear-gradient(#88c9ff,#c9e6ff 55%,#fbe6f1);color:#1d1424;text-align:center;transition:opacity .5s ease,visibility .5s}
#loader.done{opacity:0;visibility:hidden}
#loader .studio{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;color:#3d2f4d;margin-bottom:8px}
#loadBarWrap{position:relative;width:min(440px,82vw);margin-top:46px}
#loadBar{height:28px}
#loadBar>i{transition:width .3s ease-out}
#loadFill{width:0;background:repeating-linear-gradient(90deg,#ffe58a 0 10px,#ffd65a 10px 20px)}
#loadShroom{position:absolute;left:0;bottom:100%;margin-bottom:-5px;transform:translateX(-50%);transition:left .3s ease-out;line-height:0}
#loadShroom svg{animation:march .3s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes march{from{rotate:-8deg}to{rotate:8deg;translate:0 -3px}}
#loadTip{font-weight:900;font-size:17px;min-height:24px;margin-top:8px;color:#3d2f4d}
#loadTip.err{color:#b0124a}
#loader .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:18vh}

/* ---------- Menus ---------- */
.menuCol{display:flex;flex-direction:column;gap:12px;width:min(320px,100%);margin:16px auto 4px}
.menuCol .btn{width:100%}
.menuCol .btn.alt{font-size:22px;padding:9px 22px}
.btn small{display:block;font-family:'Nunito',ui-rounded,system-ui,sans-serif;font-weight:900;font-size:14px;line-height:1.25;opacity:.75}
.btn.ghost{background:#fff;font-size:20px;padding:8px 16px}
.menuRow{display:flex;gap:12px}
.menuRow .btn{flex:1}
.title.intro{animation:titleDrop .8s .4s cubic-bezier(.3,1.5,.5,1) both}
@keyframes titleDrop{from{translate:0 -70px;rotate:-10deg;opacity:0}to{translate:0 0;rotate:0deg;opacity:1}}
.panel.wide{width:min(820px,100%);text-align:left}
.panel.wide .panelHead,.panel.wide .btnRow{text-align:center}
.panel.wide p{margin:6px 0 10px;max-width:68ch}
.panel h3{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:24px;margin:20px 0 8px;color:var(--panel-text)}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;font-weight:800;font-size:15px;color:var(--panel-sub)}
.ctrl div{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ctrl kbd{margin:0 0 0 4px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meter{border:3px solid var(--ink);border-radius:18px;padding:10px 12px;color:var(--ink)}
.meter h4{margin:0 0 4px;font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:21px}
.panel .meter p,.panel .foe p{margin:2px 0 0;font-size:14px;line-height:1.35;color:#3d2f4d;max-width:none}
.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.foe{display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:8px 12px}
.foe svg{flex:none}
.foe b{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:20px}
.foe .pts{font-weight:900;font-size:13px;color:#5b4a66;margin-left:6px}
.panel .btnRow{margin-top:18px}
.credits .roll>*{animation:crIn .55s cubic-bezier(.3,1.5,.5,1) both}
.credits .roll>*:nth-child(2){animation-delay:.3s}
.credits .roll>*:nth-child(3){animation-delay:.6s}
.credits .roll>*:nth-child(4){animation-delay:1s}
.credits .roll>*:nth-child(5){animation-delay:1.5s}
@keyframes crIn{from{translate:0 34px;opacity:0}to{translate:0 0;opacity:1}}
.cr{margin:0 0 14px}
.cr .role{font-weight:900;font-size:14px;color:var(--panel-sub)}
.cr .who{font-family:'Lilita One',system-ui,sans-serif;font-size:34px;line-height:1.05;color:var(--panel-text)}
.cr.studio{margin-top:24px}
.cr.studio svg{display:block;margin:8px auto 2px}
.cr.studio .who{font-size:42px;color:var(--lav);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.panel p.crJoke{font-size:14px;margin-top:18px}

/* ---------- Stamina ---------- */
#stamRow{margin-top:8px}
#stamNum{font-size:22px;line-height:1}
.bar.thin{height:16px}
#stamFill{background:linear-gradient(#d4fff0,#7fe0c4)}
#stamRow.empty .lbl,#stamRow.empty #stamNum{color:#b0124a}
.floater.stam{color:var(--mint)}
.nudge{animation:nudge .4s}
@keyframes nudge{0%,100%{translate:0}20%{translate:-6px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:4px 0}}

/* ---------- Tutorial ---------- */
.tut-off{display:none!important}
.pop{animation:popIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
#coach{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(480px,calc(100vw - 32px));padding:10px 14px 12px;display:none;color:var(--ink)}
#hud.tut #coach{display:block}
#hud.tut #hint{bottom:auto;top:calc(50% + 48px)}
#coach .head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#coach .ava{width:42px;height:42px;flex:none}
#coach .name{font-size:19px;line-height:1}
#coach .role{font-weight:800;font-size:12px;color:#5b4a66}
#coach .chap{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-weight:900;font-size:13px}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:#fff;transition:background .2s}
.pips i.done{background:var(--leaf)}
.pips i.cur{background:var(--butter);scale:1.3}
#coachMsg{font-weight:800;font-size:17px;line-height:1.4}
#coachMsg .ghost{color:transparent}
#coachObj{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin-top:8px;padding:7px 10px 9px;background:#fff;border:3px solid var(--ink);border-radius:12px;font-weight:900;font-size:15px}
#coachObj.hidden{display:none}
#coachObj .box{flex:none;width:22px;height:22px;border-radius:7px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center}
#coachObj.done .box{background:var(--leaf);animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
#coachObj.done .box::after{content:'';width:5px;height:10px;border:solid var(--ink);border-width:0 3px 3px 0;rotate:45deg;margin-top:-3px}
#objKeys{margin-left:auto;white-space:nowrap;font-size:13px}
#objKeys kbd{margin-right:2px}
#objFill{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--leaf);transition:width .15s}
@media (max-width:1000px){
  #coach{bottom:auto;top:calc(112px + env(safe-area-inset-top,0px))}
  #hud.tut #hint{top:auto;bottom:calc(130px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:620px){.meters,.guide,.ctrl{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){
  #loadShroom svg,.title.intro,.credits .roll>*,.pop,.nudge,#coachObj.done .box{animation:none}
}

/* ---------- Touch controls ---------- */
body.touch{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#touchUI{display:none;position:absolute;inset:0;pointer-events:none}
body.touch #touchUI{display:block}
#lookZone{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:calc(92px + env(safe-area-inset-left,0px));top:calc(100% - 92px - env(safe-area-inset-bottom,0px));width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:rgba(255,248,236,.35);border:4px solid rgba(29,20,36,.55);pointer-events:none;opacity:.65;transition:opacity .2s}
#stick.active{opacity:1;transition:none}
#stickKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:var(--cream);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#stickKnob.sprint{background:var(--mint)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;display:grid;place-items:center;align-content:center;width:62px;height:62px;border-radius:50%;border:4px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:0 5px 0 var(--ink);font-family:'Lilita One',system-ui,sans-serif;font-size:12px;line-height:1.05;padding:0;user-select:none;-webkit-user-select:none}
.tbtn svg{width:24px;height:24px;display:block}
.tbtn .em{font-size:21px;line-height:1}
.tbtn.on{translate:0 4px;box-shadow:0 1px 0 var(--ink)}
.tbtn .fist,.tbtn .gun{display:grid;place-items:center;gap:1px}
#tFire{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:92px;height:92px;background:var(--rose);font-size:15px}
#tFire svg{width:36px;height:36px}
#tFire .em{font-size:32px}
#tJump{right:calc(128px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--sky)}
#tPunch{right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(94px + env(safe-area-inset-bottom,0px));background:var(--peach)}
#tReload{right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--butter)}
#tPause{top:calc(14px + env(safe-area-inset-top,0px));right:calc(122px + env(safe-area-inset-right,0px));width:44px;height:44px;box-shadow:0 3px 0 var(--ink)}
#tPause svg{width:18px;height:18px}
#tPunch,#tReload,#tFire .gun{display:none}
#touchUI.armed #tPunch{display:grid}
#touchUI.armed:not(.inf) #tReload{display:grid}
#touchUI.armed #tFire .fist{display:none}
#touchUI.armed #tFire .gun{display:grid}
.tbtn.hl,#stick.hl{animation:hlPulse 1s ease-in-out infinite}
@keyframes hlPulse{0%,100%{outline:0 solid rgba(255,228,138,.95)}50%{outline:9px solid rgba(255,228,138,.95)}}
/* phone HUD layout: keep the lower corners free for thumbs */
body.touch #scoreBox{padding:5px 10px;min-width:0}
body.touch #scoreBox .num{font-size:20px}
body.touch #scoreBox .sub{font-size:12px}
body.touch #radarWrap{width:96px;height:96px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
body.touch #hpBox{top:calc(76px + env(safe-area-inset-top,0px));bottom:auto;width:172px;padding:6px 10px 8px}
body.touch #hpNum{font-size:22px}
body.touch #hpBox .bar{height:14px}
body.touch #hpBox .bar.thin{height:12px}
body.touch #stamNum{font-size:17px}
body.touch #hpBox .lbl{font-size:12px}

};
if(typeof THREE==='undefined'){LOAD.fail('The 3D engine didn’t load. Check your internet connection, then refresh the page.');return;}
await LOAD.to(0.12,'Warming up the tractor…');
const V3=THREE.Vector3, TAU=Math.PI*2, UP=new V3(0,1,0);
const rand=(a,b)=>a+Math.random()*(b-a);

const Store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},

/* =================== AUDIO =================== */
const SFX=(()=>{
  let ctx=null, master=null, nbuf=null, muted=false;
  function init(){
    if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    master=ctx.createGain(); master.gain.value=0.42; master.connect(ctx.destination);
    nbuf=ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  function tone(type,f1,f2,dur,vol,delay=0){
    if(!ctx||muted||vol<0.003) return;
    const t=ctx.currentTime+delay, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

  }
  function noise(dur,vol,freq,ftype='lowpass',delay=0,q=1){
    if(!ctx||muted||vol<0.003) return;
    const t=ctx.currentTime+delay, s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();

    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

  }
  return {
    init, toggle(){muted=!muted;return muted;},
    shoot(){tone('square',900,180,0.09,0.11);tone('triangle',420,90,0.12,0.17);noise(0.06,0.16,3500,'highpass');},
    empty(){tone('square',1400,1300,0.03,0.07);tone('square',1400,1300,0.03,0.07,0.07);},
    reload(){tone('square',600,500,0.04,0.07);tone('square',820,700,0.04,0.07,0.4);tone('square',1000,1300,0.06,0.08,0.95);},
    punch(){noise(0.12,0.45,700);tone('sine',170,60,0.15,0.4);},
    whiff(){noise(0.1,0.12,1800,'bandpass');},
    gobble(v=1){for(let i=0;i<7;i++) tone('square',560+Math.random()*140,330,0.055,0.055*v,i*0.06);},
    squawk(v=1){tone('sawtooth',900,1500,0.12,0.08*v);tone('square',1250,700,0.12,0.06*v,0.11);},
    pop(v=1){tone('sine',300,1300,0.13,0.26*v);noise(0.08,0.14*v,2500,'bandpass');},
    hit(head){tone('triangle',head?1500:1000,head?2100:700,0.06,0.12);},
    hurt(){tone('sawtooth',230,90,0.25,0.2);noise(0.15,0.2,500);},
    chomp(){noise(0.07,0.32,1200,'bandpass');noise(0.07,0.32,900,'bandpass',0.12);tone('sine',300,200,0.05,0.1,0.06);},
    pickup(){tone('triangle',880,880,0.06,0.09);tone('triangle',1320,1320,0.08,0.09,0.06);},
    crunch(v=1){noise(0.2,0.3*v,1600,'bandpass',0,2);tone('triangle',500,120,0.15,0.08*v);},
    nibble(v=1){noise(0.05,0.12*v,2200,'bandpass',0,3);},
    spit(v=1){tone('sine',520,150,0.16,0.16*v);noise(0.1,0.1*v,1000);},
    splat(v=1){noise(0.2,0.22*v,600);tone('sine',200,80,0.15,0.1*v);},
    wave(){[523,659,784,1046].forEach((f,i)=>tone('triangle',f,f,0.2,0.15,i*0.11));},
    warn(){tone('square',760,760,0.1,0.06);tone('square',540,540,0.12,0.06,0.14);},
    over(){[523,440,349,262].forEach((f,i)=>tone('triangle',f,f*0.97,0.3,0.15,i*0.22));},
    rumble(v=1){noise(0.35,0.12*v,300);},
    blip(n=0){tone('square',380+(n%4)*45,0,0.04,0.03);},
    tick(){tone('square',1800,1700,0.02,0.035);},
    ding(){tone('triangle',880,880,0.08,0.12);tone('triangle',1320,1320,0.14,0.12,0.08);tone('sine',1760,1760,0.2,0.06,0.16);},
    sprout(v=1){tone('sine',260,700,0.12,0.12*v);noise(0.06,0.06*v,1800,'bandpass');},

    else if(mode==='spit'){const a=this.spitT;lean=a<0.3?-0.35*(a/0.3):lerp(-0.35,0.35,Math.min(1,(a-0.3)/0.1));armA=armB=-0.6;}

vm.fists=[-1,1].map(side=>{const g=buildFist(side);const base=new V3(side*0.34,-0.4,-0.52);g.position.copy(base);vm.rig.add(g);return {g,base,side,t:0};});

const _o=new V3(), _d=new V3(), _hit=new V3(), _mz=new V3();
function raySphere(o,d,cx,cy,cz,r){

      const ox=o.x-ob.x,oz=o.z-ob.z,a=d.x*d.x+d.z*d.z; if(a<1e-6) continue;

const keys={};

addEventListener('keydown',e=>{

    if(!overlay.classList.contains('hidden')){
      if(e.code==='ArrowDown'||e.code==='ArrowUp'){
        const bs=[...overlay.querySelectorAll('.btn')];
        if(bs.length){e.preventDefault();let i=bs.indexOf(document.activeElement);i=e.code==='ArrowDown'?(i+1)%bs.length:(i<=0?bs.length-1:i-1);bs[i].focus();SFX.tick();}

  if(e.code==='KeyM'){const m=SFX.toggle();showHint(m?'🔇 Sound off':'🔊 Sound on',1.5);}

addEventListener('blur',()=>{for(const k in keys)keys[k]=false;player.firing=false;});

  const sens=0.0022;
  player.yaw-=mx*sens; player.pitch=clamp(player.pitch-my*sens,-1.45,1.45);
  vm.swayX=clamp(vm.swayX-mx*0.00025,-0.04,0.04); vm.swayY=clamp(vm.swayY+my*0.00025,-0.04,0.04);

function requestPlay(){
  SFX.init();
  if(TS.on){resetTouch();try{const de=document.documentElement;if(de.requestFullscreen&&!document.fullscreenElement){const r=de.requestFullscreen({navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{});}}catch(e){}}
  if(fallback){setPlay();return;}
  pendingPlay=true;
  try{const r=canvas.requestPointerLock();if(r&&typeof r.catch==='function')r.catch(onLockErr);}catch(err){onLockErr();}

}
function onLockErr(){

document.addEventListener('pointerlockchange',()=>{

  let tot=0; for(const k in wts) tot+=wts[k]; let r=Math.random()*tot;

function spawnTick(dt){
  S.spawnT-=dt;

const Tut={
  begin(){resetWorld();this.start();},
  start(){
    S.tut={i:0,t:0,q:[],marker:null,fastStam:0,floorMsg:0,full:'',shown:0,typing:false,lastN:-1,done:false,doneT:0,readT:0,objLast:''};
    hideCorn(); for(const tk of turkeys) tk.setActive(false);
    Object.assign(player,{hasGun:false,infAmmo:false,mag:0,reserve:0,stamina:100});
    S.wave=1; S.waveTime=30;
    hudAll(false); $('hud').classList.add('tut');
    this.enter();
  },
  enter(){
    const T=S.tut, st=STEPS[T.i];
    T.t=0; T.done=false; T.doneT=0; T.readT=0; T.objLast='';
    if(st.enter) st.enter(T);
    const text=typeof st.say==='function'?st.say(T):st.say;
    T.full=text; T.shown=reduceMotion?text.length:0; T.typing=!reduceMotion; T.lastN=-1; this.render();
    T.autoDur=st.auto?Math.max(st.auto,text.length/55+1.6):0;
    CO.obj.classList.toggle('hidden',!!(st.auto||st.wait)); CO.obj.classList.remove('done');
    CO.objKeys.innerHTML=(typeof st.keys==='function'?st.keys(T):st.keys)||'';
    for(const el of document.querySelectorAll('#touchUI .hl')) el.classList.remove('hl');
    if(TUT_HL[T.i]) $(TUT_HL[T.i]).classList.add('hl'); CO.fill.style.width='0%';
    if(st.obj){const s=typeof st.obj==='function'?st.obj(T):st.obj;T.objLast=s;CO.objTxt.textContent=s;}
    CO.chap.textContent=CHAPTERS[st.ch];
    [...CO.pips.children].forEach((p,i)=>{p.className=i<st.ch?'done':(i===st.ch?'cur':'');});
    nudge(CO.el);
  },
  render(){const T=S.tut,n=Math.floor(T.shown);if(n===T.lastN)return;T.lastN=n;CO.typed.textContent=T.full.slice(0,n);CO.ghost.textContent=T.full.slice(n);},
  later(sec,fn){if(S.tut)S.tut.q.push({t:sec,fn});},
  update(dt,t){
    const T=S.tut; if(!T) return;
    const st=STEPS[T.i];
    T.t+=dt;
    for(let i=T.q.length-1;i>=0;i--){const q=T.q[i];q.t-=dt;if(q.t<=0){T.q.splice(i,1);q.fn();}}
    if(T.typing){
      const prev=Math.floor(T.shown); T.shown=Math.min(T.full.length,T.shown+dt*55); const n=Math.floor(T.shown);
      if(n>prev&&n%3===0&&T.full[n-1]!==' ') SFX.blip(n);
      this.render(); if(n>=T.full.length) T.typing=false;
    } else T.readT+=dt;
    CO.el.classList.toggle('quiet',isTouch()&&!st.auto&&!st.wait&&!T.done&&T.readT>3.5);
    if(scarecrowG) scarecrowG.rotation.z=T.typing?Math.sin(t*22)*0.035:scarecrowG.rotation.z*Math.exp(-dt*8);
    if(beacon.g.visible){beacon.ring.scale.setScalar(1+Math.sin(t*5)*0.15);beacon.arrow.position.y=3.2+Math.sin(t*3.2)*0.35;beacon.arrow.rotation.y+=dt*2.5;beacon.col.material.opacity=0.2+Math.sin(t*3)*0.07;}
    if(gunPick.visible){const h=gunPick.userData.holder;h.rotation.y+=dt*1.8;h.position.y=1.35+Math.sin(t*2.6)*0.12;}
    if(st.tick) st.tick(T,dt);
    if(!T.done){
      const p=st.auto?T.t/T.autoDur:clamp(st.check(T,dt),0,1);
      if(st.obj){const s=typeof st.obj==='function'?st.obj(T):st.obj;if(s!==T.objLast){T.objLast=s;CO.objTxt.textContent=s;}}
      CO.fill.style.width=(st.bar?Math.round(p*100):0)+'%';
      if(p>=1){T.done=true;T.doneT=0;if(!st.auto&&!st.wait){CO.obj.classList.add('done');SFX.ding();}}
    } else {
      T.doneT+=dt;
      const hold=st.hold!=null?st.hold:(st.auto||st.wait?0:0.8);
      if(T.doneT>=hold&&!T.typing&&T.readT>=(st.auto?0:0.9)) this.next();
    }
  },
  next(){
    const T=S.tut, st=STEPS[T.i];
    if(st.leave) st.leave(T);
    T.i++;
    if(T.i>=STEPS.length){this.finish();return;}
    this.enter();
  },
  finish(){
    const stats={kills:S.kills,score:S.score,pct:Math.round(cropHealth()*100)};
    Store.set(TUT_KEY,true);
    this.cleanup();
    S.mode='tutdone'; player.firing=false; $('hud').classList.add('hidden');
    if(document.pointerLockElement) document.exitPointerLock();
    screenTutDone(stats);
  },
  cleanup(){CO.el.classList.remove('quiet');for(const el of document.querySelectorAll('#touchUI .hl')) el.classList.remove('hl');hideBeacon();gunPick.visible=false;if(scarecrowG)scarecrowG.rotation.z=0;S.tut=null;$('hud').classList.remove('tut');hudAll(true);}
};

  if(keys.KeyD||keys.ArrowRight)mx+=1; if(keys.KeyA||keys.ArrowLeft)mx-=1;
  let tmag=0, tSprint=false;
  if(TS.on&&TS.stickId!==null){const m=Math.hypot(TS.x,TS.y);if(m>0.12){tmag=m;mx+=TS.x;mz-=TS.y;tSprint=m>0.92&&-TS.y>0.55;}}
  const sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
  let wx=-sy*mz+cy*mx, wz=-cy*mz-sy*mx; const wl=Math.hypot(wx,wz); if(wl>0){wx/=wl;wz/=wl;}
  const sprinting=(wantSprint||tSprint)&&mz>0&&player.stamina>0;
  if(TS.on) knob.classList.toggle('sprint',sprinting);
  let speed=sprinting?10.5:6.8;
  if(tmag&&!sprinting) speed*=clamp((tmag-0.12)/0.6,0.4,1);
  const acc=player.onGround?12:3;
  player.vel.x=lerp(player.vel.x,wx*speed,1-Math.exp(-acc*dt));
  player.vel.z=lerp(player.vel.z,wz*speed,1-Math.exp(-acc*dt));
  if(keys.Space&&player.onGround){player.vel.y=7.6;player.onGround=false;player.jumps++;SFX.hop();}
  player.vel.y-=24*dt;
  player.pos.addScaledVector(player.vel,dt);
  if(player.pos.y<=0){if(!player.onGround&&player.vel.y<-8)player.shake=Math.min(1,player.shake+0.15);player.pos.y=0;player.vel.y=0;player.onGround=true;}
  collide(player.pos,0.45,player.pos.y);
  const hs=Math.hypot(player.vel.x,player.vel.z);
  // stamina: sprinting drains it, only pork chops bring it back
  if(sprinting&&hs>4){
    const was=player.stamina;
    player.stamina=Math.max(0,player.stamina-dt*14*(S.tut&&S.tut.fastStam?2.4:1));
    if(was>0&&player.stamina<=0){
      SFX.pant(); player.shake=Math.min(1,player.shake+0.2); player.stamNag=4; nudge(H.stamRow,'nudge');
      if(!S.tut) showHint('⚡ Out of stamina! Eat a pork chop to sprint again',3.5);
    }
  }
  player.stamNag-=dt;
  if((wantSprint||tSprint)&&mz>0&&player.stamina<=0&&player.stamNag<=0){
    player.stamNag=4; SFX.pant(); nudge(H.stamRow,'nudge');
    if(!S.tut) showHint('⚡ Too pooped to sprint. Find a pork chop 🍖',3);
  }
  if(player.onGround&&hs>0.5) player.bob+=dt*hs*1.6;
  player.fireCd-=dt; player.punchCd-=dt; player.hurtT=Math.max(0,player.hurtT-dt); player.shake=Math.max(0,player.shake-dt*2.2);
  if(player.reloadT>0){player.reloadT-=dt;if(player.reloadT<=0){const n=Math.min(MAG-player.mag,player.reserve);player.mag+=n;player.reserve-=n;}}
  if(player.firing){if(player.hasGun) shoot(); else punch();}
  // camera
  const bobY=player.onGround&&hs>0.5?Math.abs(Math.sin(player.bob))*0.07:0;
  const sh=player.shake*player.shake*0.12;
  camera.position.set(player.pos.x+rand(-sh,sh),player.pos.y+1.65+bobY+rand(-sh,sh),player.pos.z+rand(-sh,sh));
  camera.rotation.set(player.pitch,player.yaw,player.onGround&&hs>0.5?Math.sin(player.bob)*0.006:0);
  const fovT=sprinting&&hs>4?81:74;
  if(Math.abs(camera.fov-fovT)>0.05){camera.fov=lerp(camera.fov,fovT,1-Math.exp(-dt*7));camera.updateProjectionMatrix();}
}

/* =================== MAIN LOOP =================== */
const clock=new THREE.Clock();
let menuAng=0.4;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  S.time+=dt; const t=S.time;
  clouds.rotation.y+=dt*0.004;
  if(S.mode==='play'){
    updatePlayer(dt);
    if(S.tut) Tut.update(dt,t);
    else { S.waveTime-=dt; spawnTick(dt); }
    for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(!e.dead)e.update(dt,t);if(e.dead)enemies.splice(i,1);}
    updateSpores(dt);
    S.alertT-=dt; S.cornDmg*=Math.exp(-dt*1.5); if(S.cornDmg>40) S.alertT=Math.max(S.alertT,0.5);
    if(!S.tut&&S.mode==='play'){
      if(S.waveTime<30&&!S.finalWarned){S.finalWarned=true;banner('Final rush!','30 seconds left. Hold the line!',2.4);SFX.warn();}
      if(S.waveTime<=0) endWave();
    }
    vm.rig.visible=true;
  } else if(S.mode==='menu'){
    menuAng+=dt*0.06;
    camera.position.set(Math.sin(menuAng)*30,11,Math.cos(menuAng)*30);
    camera.lookAt(0,1.5,0);
    vm.rig.visible=false;
  }
  if(S.mode!=='paused'&&S.mode!=='summary'){
    for(const tk of turkeys) if(tk.active) tk.update(dt,t);
    updatePickups(dt,t);
    updateParts(dt,t); updateRings(dt); updateTracers(dt);
  }
  updateCorn(t,S.mode==='paused'?0:dt);
  updateViewmodel(dt,t);
  updateFloaters(S.mode==='paused'?0:dt);
  if(S.mode==='play'||S.mode==='paused'){updateHUD(dt);drawRadar(t);}
  sky.position.copy(camera.position);
  renderer.render(scene,camera);
}
function onResize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); sizeRadar();
}
addEventListener('resize',onResize);

/* =================== BOOT =================== */
await LOAD.to(0.68,'Fluffing turkey feathers…');
for(let i=0;i<6;i++) turkeys.push(new Turkey());
sizeRadar();
await LOAD.to(0.8,'Teaching mushrooms to walk…');
// warm up shaders so the first spawn doesn't hitch
{
  const warm=[]; for(const k of Object.keys(TYPES)){const e=new Shroom(k,0,0);e.g.position.set(0,-60,0);warm.push(e);}
  const a=ammoTpl.clone(), c=chopTpl.clone(), s=sporeTpl.clone(); [a,c,s].forEach(o=>{o.position.set(0,-60,0);scene.add(o);});
  emit(0,-60,0,0xffffff,1); ring(0,-60,0,0xffffff); tracer(new V3(0,-60,0),new V3(0,-61,0));
  beacon.g.visible=true; gunPick.visible=true;
  vm.rig.visible=true; camera.position.set(0,5,30); camera.lookAt(0,0,0);
  renderer.compile(scene,camera); renderer.render(scene,camera);
  warm.forEach(e=>e.remove()); [a,c,s].forEach(o=>scene.remove(o));
  beacon.g.visible=false; gunPick.visible=false;
}
await LOAD.to(0.92,'Marinating pork chops…');
try{ if(document.fonts&&document.fonts.ready) await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]); }catch(e){}
await LOAD.to(1,'Waking up the scarecrow…');
await new Promise(r=>setTimeout(r,380));
menu();
frame();
LOAD.done();
})().catch(err=>{
  console.error(err);
  const t=document.getElementById('loadTip');
  if(t){t.textContent='Something went wrong while loading. Try refreshing the page.';t.classList.add('err');}
});
</script>
